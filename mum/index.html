function finishWorkout(){
 if(!db.active)return;
 const n=totalDone(db.active),total=db.active.items.reduce((a,it)=>a+it.rows.length,0);
 if(n===0){toast('Complete at least one set before finishing.');return;}
 if(n<total&&!confirm('Save this workout with '+n+' of '+total+' sets completed?'))return;
 const active=clone(db.active);
 const prior=db.sessions.find(s=>s.id===active.editingId);
 // Editing an old entry should not move that original workout to today.
 const completed={...active,id:active.editingId||active.id,end:prior?(prior.end||prior.start||Date.now()):Date.now(),changed:Date.now()};
 delete completed.editingId;
 const ix=db.sessions.findIndex(s=>s.id===completed.id);
 if(ix>=0)db.sessions[ix]=completed;else db.sessions.push(completed);
 db.active=null;finished=clone(completed);

}

}
function doneScreen(){const s=finished,w=s&&workout(s.dayId),n=totalDone(s);return header('Well done. Every session counts.')+'<main class="page"><section class="hero"><div class="hero-main"><span class="eyebrow" style="color:var(--green)">✓ WORKOUT SAVED</span><h2>Wonderful work, '+esc(db.name)+'!</h2><p>'+esc(w?w.name:'Your workout')+' · '+n+' completed sets.</p></div><div class="hero-bottom stack"><button class="btn primary" onclick="cardioDefaults(\''+(w?w.id:'legs')+'\')">Next: treadmill '+(w?w.cardio.low+'–'+w.cardio.high:'10–15')+' min →</button><button class="btn secondary" onclick="go(\'home\')">Back to Home</button>'+(undoFinished?'<button class="btn neutral" onclick="undoFinish()">↶ Undo Finish, edit my workout</button>':'')+'</div></section>'+saved()+'</main>';}
function cardioScreen(){const week=weekCardioModerate();let hint='After strength, aim for ';if(cardioFrom){const w=workout(cardioFrom);hint+=w.cardio.low+'–'+w.cardio.high+' minutes '+w.cardio.pace.toLowerCase()+'.';}else hint+='30–40 minutes moderate on any day that suits you, or log a brisk walk.';return header('A comfortable pace is enough.')+'<main class="page"><section class="hero"><div class="hero-main"><span class="eyebrow" style="color:var(--wine-soft)">WALKING & CARDIO</span><h2>One walk at a time</h2><p>'+esc(hint)+'</p></div></section><div class="card"><h2>'+ (cardioEditingId?'Correct your cardio entry':'Log your activity') +'</h2><label class="formfield">What did you do?</label><div class="segment three">'+['Treadmill','Brisk walk','Bike'].map(t=>'<button class="'+(cardioType===t?'selected':'')+'" onclick="cardioType=\''+t+'\';if(cardioType===\'Brisk walk\')cardioIntensity=\'moderate\';render()">'+t+'</button>').join('')+'</div><label class="formfield">How many minutes?</label><div class="minute-control"><button onclick="adjustMinutes(-5)" aria-label="Five minutes less">−</button><strong>'+cardioMins+' min</strong><button onclick="adjustMinutes(5)" aria-label="Five minutes more">+</button></div><label class="formfield">How hard was it?</label><div class="segment"><button class="'+(cardioIntensity==='easy'?'selected':'')+'" onclick="cardioIntensity=\'easy\';render()">Easy</button><button class="'+(cardioIntensity==='moderate'?'selected':'')+'" onclick="cardioIntensity=\'moderate\';render()">Moderate</button></div><p class="muted">Moderate means you can talk but not sing comfortably. Easy minutes are logged, but do not count towards the moderate-minutes total.</p><button class="btn primary" id="save-cardio" onclick="saveCardio()">✓ '+(cardioEditingId?'Save corrected entry':'Save '+cardioMins+' minutes')+'</button></div><div class="card"><h2>This week</h2><div class="big-number">'+week+' / 150</div><p class="muted">Moderate activity minutes logged so far, including brisk walks.</p><div class="meter"><span style="width:'+Math.min(100,Math.round(100*week/150))+'%"></span></div><p class="muted">Build towards 150 moderate minutes a week gradually. Walking to the shops or outdoors also counts if it is brisk. You only see activities you record here.</p></div></main>';}
function historyScreen(){const sessions=db.sessions.slice().sort((a,b)=>(b.end||0)-(a.end||0));const cardio=db.cardio.slice().sort((a,b)=>b.at-a.at);const total=weekCardioModerate();let strengthHTML=sessions.map(s=>'<div class="history-row"><strong>'+esc(workout(s.dayId)?.name||'Workout')+'</strong><p>'+esc(fmtFull(s.end||s.start))+' · '+totalDone(s)+' sets</p><details><summary>View completed sets</summary>'+s.items.map(it=>'<p><strong>'+esc(EX[it.id]?.name||it.id)+'</strong>'+it.rows.filter(r=>r.done).map(r=>(EX[it.id]?.unit?r.weight+' kg × ':'')+r.reps+' reps').join(' · ')+'</p>').join('')+'</details><div class="row-actions"><button onclick="editWorkout(\''+esc(s.id)+'\')">Edit workout</button><button onclick="deleteWorkout(\''+esc(s.id)+'\')">Remove</button></div></div>').join('');let cardHTML=cardio.slice(0,30).map(c=>'<div class="history-row"><strong>'+esc(c.type||'Cardio')+' · '+Number(c.mins||0)+' min</strong><p>'+esc(fmtFull(c.at))+' · '+esc(c.intensity||'Intensity not recorded')+'</p><div class="row-actions"><button onclick="editCardio(\''+esc(c.id||'')+'\')">Edit cardio</button><button onclick="deleteCardio(\''+esc(c.id||'')+'\')">Remove this entry</button></div></div>').join('');return header('Look how far you’ve come.')+'<main class="page"><div class="pair"><div class="card"><div class="big-number">'+sessions.filter(s=>isThisWeek(s.end||s.start)).length+'</div><p class="muted">Strength workouts this week</p></div><div class="card"><div class="big-number">'+total+'</div><p class="muted">Moderate minutes this week</p></div></div><div class="card"><h2>Your saved workouts</h2>'+(db.trashSessions.length?'<button class="btn secondary small" onclick="undoDelete()">↶ Restore last removed workout</button>':'')+(strengthHTML||'<p class="muted">No completed workouts yet. Your sets will appear here after Finish Workout.</p>')+'</div><div class="card"><h2>Cardio & brisk walks</h2>'+(db.trashCardio.length?'<button class="btn secondary small" onclick="undoDeleteCardio()">↶ Restore last removed cardio entry</button>':'')+(cardHTML||'<p class="muted">Your walks and treadmill sessions will appear here.</p>')+'</div></main>';}
function downloadBackup(){const blob=new Blob([JSON.stringify({...db,backupDate:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mums-gym-backup-'+dateKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Backup downloaded. Keep it somewhere safe.');}
async function restoreBackup(file){if(!file)return;try{const txt=await file.text();if(txt.length>5e6)throw Error('The file is too large.');const obj=JSON.parse(txt);if(!obj||typeof obj!=='object'||!Array.isArray(obj.sessions)||!Array.isArray(obj.cardio))throw Error('Not a Mum’s Gym backup.');if(!confirm('Replace the gym data currently saved on this device with this backup?'))return;db=normalize(obj);undoFinished=null;finished=null;persist();go('home');toast('✓ Backup restored.');}catch(err){toast('Could not restore the backup: '+err.message);}}
function settingsScreen(){return header('Made just for you.')+'<main class="page"><div class="card"><h2>Your name</h2><label class="formfield" for="mum-name">Name displayed in the app</label><input class="infield" id="mum-name" maxlength="35" value="'+esc(db.name)+'" oninput="changeName(this.value)"><p class="muted" style="margin-top:9px">Enter your name, or leave it as Mum.</p></div>'+'<div class="card"><h2>Flexible week</h2><p class="muted">No fixed gym days. Your next workout follows your previous workout. Plan individual dates if you like, or simply go when you can.</p><button class="btn secondary small" onclick="weekOffset=0;go(\'week\')">View or edit the week</button></div>'+'<div class="card"><h2>Your data stays on this device</h2>'+saved()+'<p class="muted">Workouts, weights, repetitions, schedule, and walks save automatically in this browser’s local storage. This app does <strong>not</strong> sync to the cloud or to another device. Clearing browser/site data, switching browsers, or moving the HTML file can affect access to saved data.</p><div class="stack"><button class="btn secondary" onclick="downloadBackup()">Download a backup</button><label class="btn neutral" style="cursor:pointer">Restore a backup <input class="sr-only" type="file" accept=".json,application/json" onchange="restoreBackup(this.files[0]);this.value=\'\'"></label></div><p class="muted" style="margin-top:13px">If you used an older Mum’s Gym file, make a backup in that older version, then restore it here if your data did not appear automatically.</p></div><div class="card"><h2>Safe, steady progress</h2><p class="muted">Start with manageable weights, breathe normally, leave a day between strength sessions when possible, and ask gym staff to check machine setup. Stop if you have pain, dizziness, or unusual breathlessness. The suggested increases are optional, not automatic.</p></div></main>';}
function nav(){const tabs=[['home','⌂','Home'],['week','▦','Week'],['history','◷','Progress'],['settings','⚙','Settings']];document.getElementById('nav').innerHTML=tabs.map(t=>'<button aria-label="'+t[2]+'" class="'+((page===t[0]||(page==='session'&&t[0]==='home'))?'active':'')+'" onclick="go(\''+t[0]+'\')"><span class="icon">'+t[1]+'</span>'+t[2]+'</button>').join('');}
function render(){const screens={home:homeScreen,week:weekScreen,session:sessionScreen,done:doneScreen,cardio:cardioScreen,history:historyScreen,settings:settingsScreen};document.getElementById('app').innerHTML=(screens[page]||homeScreen)();nav();}
render();</script>
</body>
</html>
