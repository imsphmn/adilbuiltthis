<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Maths Quest</title>
<style>
/* ============================================================================
   LITTLE MATHS QUEST — "TOYBOX"
   Design direction: the interface is made of the same material as the toys.
   Moulded plastic with real thickness, resting inside painted worlds — not
   glass panels floating above them. Every control has a visible bottom edge
   that compresses when pressed, so a three-year-old can see what is tappable
   before anyone explains it.
   ========================================================================== */

:root{
  /* --- ink & surfaces --- */
  --ink:#1B1642;
  --ink-soft:#5B5390;
  --cream:#FFF7E9;
  --cream-edge:#E2CFAC;
  --cream-2:#FFEFD6;

  /* --- fixed roles --- */
  --go:#46D986;        --go-edge:#1C8A4F;        --go-ink:#06331A;
  --sun:#FFC93C;       --sun-edge:#CE8F00;
  --soft-warn:#FFD98A;

  /* --- per-world accent (overridden on .screen[data-world]) --- */
  --accent:#FF6B35;
  --accent-edge:#B8380F;
  --accent-ink:#3A1204;

  /* --- form --- */
  --r-xl:38px; --r-lg:30px; --r-md:22px; --r-sm:14px;
  --lift:10px;                     /* thickness of the moulded edge */
  --drop:0 16px 30px rgba(9,14,40,.30);
  --drop-lg:0 26px 56px rgba(9,14,40,.40);

  --font-display:"Segoe UI Variable Display","Segoe UI Black","Segoe UI",Candara,"Trebuchet MS",system-ui,sans-serif;
  --font-ui:Candara,"Segoe UI",system-ui,"Trebuchet MS",sans-serif;
}

/* Each world re-skins the interface. Layout and icon language stay identical
   so the app is still learnable; only colour and material change — which is
   what tells a small child "I have travelled somewhere new". */
.screen[data-world="volcano"] {--accent:#FF6B35;--accent-edge:#AE330C;--accent-ink:#3A1204}
.screen[data-world="robot"]   {--accent:#2ECBEC;--accent-edge:#0B7690;--accent-ink:#04252E}
.screen[data-world="football"]{--accent:#45D477;--accent-edge:#17864A;--accent-ink:#052A16}
.screen[data-world="dojo"]    {--accent:#9B7BFF;--accent-edge:#5334C4;--accent-ink:#1D0F45}
.screen[data-world="truck"]   {--accent:#FFB020;--accent-edge:#B87200;--accent-ink:#3A2200}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:var(--font-ui);
  background:#141a3a;color:var(--ink);user-select:none;
}
button{font:inherit}
#app{position:fixed;inset:0}

.screen{
  position:absolute;inset:0;overflow:hidden;
  background-size:cover;background-position:center;
  display:flex;flex-direction:column;
}
/* Keeps painted art readable under white text without washing it out. */
.shade{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(6,10,30,.34), transparent 60%),
    linear-gradient(180deg, rgba(6,10,30,.20), rgba(6,10,30,.02) 45%, rgba(6,10,30,.42));
}

/* ---------------------------------------------------------------- SIGNATURE
   The chunky press. One idea, applied everywhere, so "tappable" is learned
   once and then recognised on every screen. */
.chunk{
  border:0;cursor:pointer;position:relative;
  background:var(--cream);
  border-radius:var(--r-lg);
  box-shadow:0 var(--lift) 0 var(--cream-edge), var(--drop);
  transition:transform .09s ease, box-shadow .09s ease, filter .15s ease;
}
.chunk:active,.chunk.is-press{
  transform:translateY(calc(var(--lift) - 3px));
  box-shadow:0 3px 0 var(--cream-edge), 0 8px 16px rgba(9,14,40,.30);
}
.chunk.go{background:var(--go);box-shadow:0 var(--lift) 0 var(--go-edge),var(--drop);color:var(--go-ink)}
.chunk.go:active{box-shadow:0 3px 0 var(--go-edge),0 8px 16px rgba(9,14,40,.3)}
.chunk.tint{background:var(--accent);box-shadow:0 var(--lift) 0 var(--accent-edge),var(--drop);color:#fff}
.chunk.tint:active{box-shadow:0 3px 0 var(--accent-edge),0 8px 16px rgba(9,14,40,.3)}
.chunk:focus-visible{outline:6px solid var(--sun);outline-offset:5px}

/* ------------------------------------------------------------- TYPOGRAPHY
   No webfonts are allowed (the app must run with no internet), so the
   personality is carried by treatment rather than an exotic face: a thick
   ink outline painted behind the fill, like a sticker on a toy box. */
.sticker{
  font-family:var(--font-display);
  font-weight:900;letter-spacing:-.5px;line-height:1;
  color:var(--cream);
  -webkit-text-stroke:9px var(--ink);
  paint-order:stroke fill;
  text-shadow:0 10px 0 rgba(15,12,40,.30), 0 22px 34px rgba(6,10,30,.45);
}
.sticker.sm{-webkit-text-stroke-width:6px}

/* ------------------------------------------------------------------- TOP */
.top{
  position:relative;z-index:4;
  height:clamp(122px,17vh,196px);
  display:grid;grid-template-columns:clamp(118px,14vw,208px) 1fr auto;
  align-items:start;gap:clamp(10px,1.6vw,22px);
  padding:clamp(10px,1.3vw,20px);
}
/* The guide is a participant standing in the world, not a corner sticker.
   It deliberately overhangs the top bar into the play area. */
.guide{
  width:100%;height:auto;object-fit:contain;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.38));
  transform-origin:50% 100%;
  animation:idlefloat 5s ease-in-out infinite;
}
@keyframes idlefloat{50%{transform:translateY(-7px)}}

.speech{
  align-self:center;justify-self:start;position:relative;
  max-width:min(70vw,1000px);
  background:linear-gradient(180deg,#fff,var(--cream));
  border-radius:clamp(22px,2.6vw,34px);
  border-bottom:8px solid var(--accent);
  padding:clamp(13px,1.6vw,24px) clamp(20px,2.2vw,34px);
  font-family:var(--font-display);
  font-weight:900;font-size:clamp(25px,3.3vw,50px);line-height:1.05;
  color:var(--ink);
  box-shadow:var(--drop);
  min-height:72px;display:flex;align-items:center;
}
/* tail pointing back to whoever is speaking */
.speech:before{
  content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  border:16px solid transparent;border-right-color:#fff;border-left:0;
  filter:drop-shadow(-4px 0 3px rgba(9,14,40,.12));
}

.top-controls{display:flex;gap:clamp(8px,1vw,14px)}
.iconbtn{
  width:clamp(66px,7.2vw,94px);height:clamp(66px,7.2vw,94px);
  border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(180deg,#fff,var(--cream));
  box-shadow:0 8px 0 var(--cream-edge), var(--drop);
  display:grid;place-items:center;
  transition:transform .09s ease, box-shadow .09s ease;
}
.iconbtn img{width:56%;height:56%;object-fit:contain}
.iconbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cream-edge),0 6px 12px rgba(9,14,40,.3)}
.iconbtn:focus-visible{outline:6px solid var(--sun);outline-offset:4px}

/* --------------------------------------------------------------- PROGRESS */
.progress{
  position:absolute;top:clamp(10px,1.1vw,18px);left:50%;transform:translateX(-50%);
  display:flex;gap:clamp(7px,.8vw,12px);z-index:6;
  background:rgba(12,18,44,.34);
  padding:9px 15px;border-radius:999px;
  backdrop-filter:blur(6px);
}
.pdot{
  width:clamp(14px,1.5vw,21px);height:clamp(14px,1.5vw,21px);border-radius:50%;
  background:rgba(255,255,255,.32);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);
}
.pdot.done{background:var(--sun);box-shadow:0 0 0 3px rgba(255,201,60,.24)}
.pdot.current{background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.26)}

/* ------------------------------------------------------------------- PLAY */
.play{
  position:relative;z-index:3;flex:1;min-height:0;
  padding:clamp(4px,.8vw,12px) clamp(14px,2.2vw,34px) clamp(84px,11vh,116px);
  display:flex;align-items:center;justify-content:center;
}
.task{
  width:min(1200px,100%);height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,2.4vh,30px);
}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(16px,2.4vw,38px);flex-wrap:wrap}

/* The tray reads as a physical shelf the pieces are resting on. */
.tray{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(14px,2vw,28px);flex-wrap:wrap;
  padding:clamp(14px,1.7vw,24px) clamp(18px,2vw,30px);
  border-radius:var(--r-lg);
  background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.14));
  border:3px solid rgba(255,255,255,.42);
  border-bottom:10px solid rgba(20,26,58,.30);
  backdrop-filter:blur(7px);
  min-height:112px;
  box-shadow:var(--drop);
}

.object{
  width:clamp(88px,9.4vw,140px);height:clamp(88px,9.4vw,140px);
  display:grid;place-items:center;cursor:pointer;position:relative;
  transition:transform .16s ease, filter .16s ease;
}
.object img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.34))}
.object:hover{transform:translateY(-6px) scale(1.05)}
.object:active{transform:translateY(-2px) scale(1.02)}
.object.used{opacity:.2;pointer-events:none;filter:grayscale(.6)}
.object.selected{
  transform:translateY(-8px) scale(1.08);
  filter:drop-shadow(0 0 0 var(--sun));
}
.object.selected:after{
  content:'';position:absolute;inset:-12px;border-radius:28px;
  border:7px solid var(--sun);background:rgba(255,201,60,.18);
  animation:selpulse 1.1s ease-in-out infinite;
}
@keyframes selpulse{50%{box-shadow:0 0 0 10px rgba(255,201,60,.16)}}

/* Answer tiles: the primary tap target on choice missions. */
.answer{
  width:clamp(146px,15.5vw,232px);height:clamp(116px,13.5vw,186px);
  border:0;border-radius:var(--r-lg);cursor:pointer;
  background:linear-gradient(180deg,#fff,var(--cream));
  box-shadow:0 var(--lift) 0 var(--cream-edge), var(--drop);
  display:grid;place-items:center;padding:12px;
  transition:transform .09s ease, box-shadow .09s ease;
}
.answer img{max-width:84%;max-height:84%;object-fit:contain}
.answer:hover{transform:translateY(-3px)}
.answer:active{transform:translateY(calc(var(--lift) - 3px));
  box-shadow:0 3px 0 var(--cream-edge),0 8px 16px rgba(9,14,40,.3)}
.answer:focus-visible{outline:6px solid var(--sun);outline-offset:5px}
.answer.wrong{animation:shake .34s}
.answer.correct{
  background:linear-gradient(180deg,#8bf0b4,var(--go));
  box-shadow:0 var(--lift) 0 var(--go-edge), 0 0 0 10px rgba(70,217,134,.28), var(--drop);
}
@keyframes shake{20%{transform:translateX(-11px)}60%{transform:translateX(11px)}}

.big-card{
  background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
  border:4px solid rgba(255,255,255,.5);
  border-bottom:11px solid rgba(20,26,58,.30);
  border-radius:var(--r-xl);
  padding:clamp(14px,2vw,28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-width:clamp(238px,28vw,400px);min-height:clamp(178px,26vh,300px);
  cursor:pointer;position:relative;backdrop-filter:blur(6px);
  box-shadow:var(--drop);
  transition:transform .12s ease;
}
.big-card:hover{transform:translateY(-4px)}
.big-card img.main{max-width:clamp(156px,20vw,300px);max-height:clamp(140px,23vh,250px);object-fit:contain;
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.34))}
.big-card.correct{
  border-color:var(--go);
  box-shadow:0 0 0 10px rgba(70,217,134,.26), var(--drop);
}
.group-items{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:340px}
.group-items img{width:clamp(76px,7.4vw,116px);height:clamp(76px,7.4vw,116px);object-fit:contain;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
/* When a group IS the question ("how many?"), it sits on its own shelf and
   stays on one line, so a child can touch each item once while counting. */
.task > .group-items{
  max-width:min(94%,1060px);flex-wrap:nowrap;
  gap:clamp(10px,1.6vw,26px);
  padding:clamp(16px,2vw,30px) clamp(20px,2.4vw,38px);
  border-radius:var(--r-xl);
  background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.11));
  border:3px solid rgba(255,255,255,.44);
  border-bottom:11px solid rgba(20,26,58,.30);
  backdrop-filter:blur(7px);
  box-shadow:var(--drop);
}
.task > .group-items img{
  width:clamp(84px,8.6vw,140px);height:clamp(84px,8.6vw,140px);
}

/* The destination. Reads as a marked-out place things belong. */
.dropzone{
  border:7px dashed rgba(255,255,255,.9);
  border-radius:var(--r-xl);
  background:radial-gradient(70% 70% at 50% 40%, rgba(255,255,255,.26), rgba(255,255,255,.10));
  display:flex;align-items:center;justify-content:center;gap:8px;position:relative;
  min-width:clamp(142px,17vw,246px);min-height:clamp(112px,19vh,190px);max-height:230px;
  transition:box-shadow .16s ease, border-color .16s ease, transform .16s ease;
}
.dropzone.hot{
  border-color:var(--sun);transform:scale(1.03);
  box-shadow:0 0 0 12px rgba(255,201,60,.22), inset 0 0 40px rgba(255,201,60,.24);
}
.dropzone img.prop{width:clamp(118px,17vw,234px);height:clamp(96px,19vh,192px);object-fit:contain;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.3))}
.slotrow{position:absolute;inset:auto 10px 12px;display:flex;justify-content:center;gap:9px}
.slot{
  width:clamp(48px,5.2vw,74px);height:clamp(48px,5.2vw,74px);
  border:5px dashed rgba(255,255,255,.92);border-radius:var(--r-md);
  background:rgba(10,20,46,.30);display:grid;place-items:center;
}
.slot img{max-width:88%;max-height:88%;object-fit:contain}

/* Where to touch first. Only ever one on screen. */
.cue{
  position:absolute;width:clamp(60px,6.4vw,96px);height:clamp(60px,6.4vw,96px);
  z-index:5;pointer-events:none;animation:cuebob 1.15s ease-in-out infinite;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));
}
.cue img{width:100%;height:100%;object-fit:contain}
@keyframes cuebob{50%{transform:translateY(-10px) scale(1.08)}}

/* ---------------------------------------------------------------- BOTTOM */
.bottom{
  position:absolute;z-index:5;left:0;right:0;bottom:0;
  height:clamp(88px,12vh,128px);
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(10px,1.3vw,20px) clamp(14px,1.8vw,26px);
  background:linear-gradient(180deg, transparent, rgba(8,12,34,.34));
}
.bottom .iconbtn{width:clamp(62px,6.4vw,86px);height:clamp(62px,6.4vw,86px)}
.feedback{
  font-family:var(--font-display);
  font-size:clamp(23px,2.6vw,40px);font-weight:900;
  color:#fff;text-shadow:0 3px 0 rgba(15,12,40,.4), 0 8px 18px rgba(0,0,0,.5);
  min-height:44px;text-align:center;flex:1;
}
.nextbtn{
  border:0;background:var(--go);color:var(--go-ink);
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(27px,3.1vw,44px);
  border-radius:var(--r-lg);padding:16px 40px;cursor:pointer;
  box-shadow:0 var(--lift) 0 var(--go-edge), var(--drop);
  transition:transform .09s ease, box-shadow .09s ease;
}
.nextbtn:active{transform:translateY(calc(var(--lift) - 3px));box-shadow:0 3px 0 var(--go-edge),0 8px 16px rgba(9,14,40,.3)}
.nextbtn:focus-visible{outline:6px solid var(--sun);outline-offset:5px}
.nextbtn.hidden{visibility:hidden}

/* --------------------------------------------------------------- SUCCESS */
.success{
  position:absolute;inset:0;z-index:20;
  background:radial-gradient(60% 60% at 50% 45%, rgba(9,12,35,.36), rgba(9,12,35,.66));
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  animation:fadein .25s ease;
}
@keyframes fadein{from{opacity:0}}
.success-card{
  background:linear-gradient(180deg,#fff,var(--cream));
  border-radius:44px;border-bottom:14px solid var(--cream-edge);
  padding:clamp(26px,4vw,54px);
  display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:var(--drop-lg);max-width:86%;
  animation:pop .34s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pop{from{transform:scale(.82);opacity:0}}
.success-card img{width:clamp(130px,18vw,244px)}
.success-card h2{
  font-family:var(--font-display);
  font-size:clamp(36px,5vw,72px);margin:0;color:var(--ink);
}
/* The celebration artwork already says "well done"; a row of dots beside it
   was decoration, so it is gone. */
.success-stars{display:none}
.success-actions{display:flex;gap:20px;align-items:center}
.success-actions button{
  border:0;border-radius:var(--r-lg);cursor:pointer;
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(24px,2.7vw,40px);
  padding:18px 34px;
  min-width:118px;min-height:96px;
  display:grid;place-items:center;
  transition:transform .09s ease, box-shadow .09s ease;
}
.success-actions .go-next{background:var(--go);color:var(--go-ink);
  box-shadow:0 var(--lift) 0 var(--go-edge), var(--drop)}
.success-actions .go-map{background:var(--cream-2);color:var(--ink);
  box-shadow:0 var(--lift) 0 var(--cream-edge), var(--drop)}
.success-actions .go-map img{width:clamp(42px,4.6vw,64px);height:auto}
.success-actions button:active{transform:translateY(7px)}

/* ----------------------------------------------------------------- START */
.start{justify-content:center;align-items:center;text-align:center}
/* .screen already establishes position:absolute (it must, to fill the
   viewport). A second position rule here would win the cascade tie and
   silently cancel that — which is exactly what caused the start screen
   to collapse to a few hundred pixels tall. No extra position needed:
   .start-hero below positions itself against .screen directly. */
.start-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.start-logo{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(52px,7.6vw,110px);line-height:.95;
  color:var(--cream);
  -webkit-text-stroke:11px var(--ink);paint-order:stroke fill;
  text-shadow:0 12px 0 rgba(15,12,40,.32), 0 26px 40px rgba(6,10,30,.5);
  margin-bottom:10px;
}
.start-sub{
  font-family:var(--font-ui);font-weight:800;
  font-size:clamp(21px,2.4vw,36px);color:#fff;
  text-shadow:0 3px 10px rgba(0,0,0,.55);margin-bottom:34px;
}
.playbtn{
  width:clamp(168px,19vw,264px);height:clamp(168px,19vw,264px);
  border-radius:50%;border:12px solid var(--cream);
  background:radial-gradient(70% 70% at 50% 34%, #7ef0ac, var(--go));
  box-shadow:0 18px 0 var(--go-edge), 0 30px 56px rgba(0,0,0,.42);
  font-size:clamp(70px,8.4vw,118px);color:var(--go-ink);cursor:pointer;
  display:grid;place-items:center;padding-left:10px;
  transition:transform .1s ease, box-shadow .1s ease;
  animation:breathe 2.6s ease-in-out infinite;
}
.playbtn:active{transform:translateY(13px);box-shadow:0 5px 0 var(--go-edge),0 12px 24px rgba(0,0,0,.4)}
.playbtn:focus-visible{outline:8px solid var(--sun);outline-offset:8px}
@keyframes breathe{50%{transform:scale(1.035)}}
/* Much bigger and anchored to the true floor of the scene — a character
   sharing the stage, not a sticker in the corner. Sized off the smaller of
   width/height (vmin) so it stays large and correct on tall, narrow windows
   too, not just wide desktop ones. */
.start-hero{
  position:absolute;right:clamp(4px,3vw,60px);bottom:0;
  width:clamp(280px,40vmin,620px);z-index:1;pointer-events:none;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.45));
  animation:idlefloat 5.5s ease-in-out infinite;
}

/* ------------------------------------------------------------------- HUB */
.hub{padding:clamp(96px,13vh,150px) 20px 26px;align-items:center}
/* The chooser must not look like one of the places you can choose. */
.screen.hub{background-color:#1b2450}
.screen.hub .shade{
  background:linear-gradient(180deg, rgba(10,16,44,.80), rgba(10,16,44,.62));
  backdrop-filter:blur(9px);
}
.hub-title{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(36px,5vw,74px);
  color:var(--cream);
  -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(15,12,40,.28), 0 20px 34px rgba(6,10,30,.45);
  margin-bottom:22px;
}
.world-grid{
  display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));
  gap:clamp(12px,1.7vw,24px);width:min(1340px,96%);
}
/* Each world card wears its own place and its own guide, so the five worlds
   are told apart by picture — never by reading the name. */
.world-card{
  border:0;border-radius:var(--r-xl);cursor:pointer;position:relative;overflow:hidden;
  padding:0;min-height:clamp(222px,34vh,356px);
  background:#26305c;
  box-shadow:0 var(--lift) 0 rgba(10,14,38,.55), var(--drop);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  transition:transform .12s ease, box-shadow .12s ease;
  animation:riseIn .42s cubic-bezier(.2,1.1,.4,1) backwards;
}
.world-card:nth-child(1){animation-delay:.02s}
.world-card:nth-child(2){animation-delay:.08s}
.world-card:nth-child(3){animation-delay:.14s}
.world-card:nth-child(4){animation-delay:.20s}
.world-card:nth-child(5){animation-delay:.26s}
@keyframes riseIn{from{opacity:0;transform:translateY(26px) scale(.96)}}
.world-card:hover{transform:translateY(-6px)}
.world-card:active{transform:translateY(7px);box-shadow:0 3px 0 rgba(10,14,38,.55),0 8px 16px rgba(9,14,40,.3)}
.world-card:focus-visible{outline:7px solid var(--sun);outline-offset:5px}
.w-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.w-bg:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(8,12,34,.06) 30%, rgba(8,12,34,.74))}
.w-char{
  position:relative;z-index:1;
  width:clamp(96px,10.4vw,168px);height:auto;object-fit:contain;
  margin-bottom:auto;margin-top:clamp(12px,2vh,26px);
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.5));
}
.world-card b{
  position:relative;z-index:1;
  font-family:var(--font-display);
  font-size:clamp(17px,1.75vw,27px);color:#fff;
  text-shadow:0 3px 8px rgba(0,0,0,.75);
  padding:0 10px;text-align:center;line-height:1.1;
}
.stars-count{
  position:relative;z-index:1;display:flex;gap:5px;
  padding:9px 0 clamp(13px,1.6vh,20px);
}
.stars-count i{
  width:clamp(14px,1.5vw,21px);height:clamp(14px,1.5vw,21px);border-radius:50%;
  background:rgba(255,255,255,.28);box-shadow:inset 0 2px 3px rgba(0,0,0,.3);
}
.stars-count i.on{background:var(--sun);box-shadow:0 3px 0 var(--sun-edge)}

/* ---------------------------------------------------------- WORLD SCREEN */
.world-screen{padding:clamp(100px,13vh,150px) 22px 28px;align-items:center}
.world-title{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(37px,5vw,74px);
  color:var(--cream);
  -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(15,12,40,.28), 0 20px 34px rgba(6,10,30,.45);
  margin-bottom:20px;
}
.mission-grid{
  display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));
  gap:clamp(14px,2.1vw,26px);width:min(1060px,94%);
}
/* Led by a big numeral the child is learning to recognise; the written name
   shrinks to a small caption for the adult in the room. */
.mission-btn{
  border:0;border-radius:var(--r-xl);cursor:pointer;position:relative;
  background:linear-gradient(180deg,#fff,var(--cream));
  box-shadow:0 var(--lift) 0 var(--cream-edge), var(--drop);
  min-height:clamp(154px,23vh,244px);
  padding:clamp(12px,1.6vw,20px) 12px clamp(10px,1.4vw,16px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .11s ease, box-shadow .11s ease;
  animation:riseIn .4s cubic-bezier(.2,1.1,.4,1) backwards;
}
.mission-btn:nth-child(1){animation-delay:.02s}
.mission-btn:nth-child(2){animation-delay:.07s}
.mission-btn:nth-child(3){animation-delay:.12s}
.mission-btn:nth-child(4){animation-delay:.17s}
.mission-btn:nth-child(5){animation-delay:.22s}
.mission-btn:nth-child(6){animation-delay:.27s}
.mission-btn:hover{transform:translateY(-5px)}
.mission-btn:active{transform:translateY(7px);box-shadow:0 3px 0 var(--cream-edge),0 8px 16px rgba(9,14,40,.3)}
.mission-btn:focus-visible{outline:7px solid var(--sun);outline-offset:5px}
.m-no{
  position:absolute;left:12px;top:12px;
  width:clamp(42px,4.4vw,60px);height:clamp(42px,4.4vw,60px);
  border-radius:50%;background:var(--accent);color:#fff;
  box-shadow:0 5px 0 var(--accent-edge);
  display:grid;place-items:center;
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(22px,2.3vw,32px);
}
.mission-btn img{
  width:clamp(86px,9vw,138px);height:clamp(86px,9vw,138px);object-fit:contain;
  filter:drop-shadow(0 9px 11px rgba(0,0,0,.26));
}
.mission-btn b{
  font-family:var(--font-ui);font-weight:800;
  font-size:clamp(13px,1.25vw,18px);
  letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-soft);text-align:center;line-height:1.15;
}
.mission-btn.locked{filter:grayscale(.85);opacity:.5;cursor:default}
.mission-btn.locked:after{
  content:'🔒';position:absolute;right:12px;top:10px;font-size:clamp(22px,2.3vw,32px)
}
.mission-btn.completed:after{
  content:'';position:absolute;right:12px;top:12px;
  width:48px;height:48px;border-radius:50%;
  background:var(--go);box-shadow:0 5px 0 var(--go-edge);
}
.mission-btn.completed:before{
  content:'';position:absolute;z-index:2;right:28px;top:26px;
  width:20px;height:10px;
  border-left:6px solid #fff;border-bottom:6px solid #fff;
  border-radius:2px;transform:rotate(-45deg);
}

/* ---------------------------------------------------------------- PARENT */
.parent-overlay{
  position:absolute;inset:0;z-index:30;background:rgba(4,8,26,.74);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
}
.parent-card{
  width:min(800px,92%);max-height:90%;overflow:auto;
  background:#fff;border-radius:32px;padding:30px;
  box-shadow:var(--drop-lg);font-family:var(--font-ui);
}
.parent-card h2{font-family:var(--font-display);font-size:38px;margin:0 0 16px;color:var(--ink)}
.parent-card button{
  border:0;border-radius:18px;padding:14px 20px;margin:8px;
  font-weight:800;font-size:21px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.14);
}
.parent-card button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.gate-choices{display:flex;gap:18px;justify-content:center}
.gate-choices button{width:112px;height:92px;font-size:42px;background:#E8ECFF}
.danger{background:#FFD9D9}
.primary{background:var(--go)}
.secondary{background:#E5E9F9}

/* ------------------------------------------------- MISSION-SPECIFIC PARTS */
/* Heights can only be compared fairly from one ground line, so the stacks
   share a baseline and each sits on its own plinth. The blocks keep their
   real proportions — stretching them to fill made them read as flat bars. */
.stack{
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(26px,4vw,64px);
  padding:0 clamp(18px,2.6vw,40px) 14px;
  border-bottom:11px solid rgba(255,255,255,.72);
  border-radius:0 0 6px 6px;
  box-shadow:0 12px 22px rgba(9,14,40,.28);
}
.block-stack{
  display:flex;flex-direction:column-reverse;align-items:center;gap:5px;
  cursor:pointer;padding:10px 12px 12px;border-radius:var(--r-md) var(--r-md) 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  transition:transform .12s ease, background .12s ease;
}
.block-stack:hover{transform:translateY(-5px);background:rgba(255,255,255,.24)}
.block-stack:focus-visible{outline:6px solid var(--sun);outline-offset:4px}
/* The block artwork is square (512x512). The old rule stretched it 1.79x
   wide, which is why the stacks read as flat bars. A square box shows the
   block at its true shape and the stack reads as stacked cubes. */
.block-stack img{
  width:clamp(56px,6.2vw,88px);
  height:clamp(56px,6.2vw,88px);
  object-fit:contain;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.32));
}
.cup-choice{cursor:pointer;background:rgba(255,255,255,.28);border-radius:var(--r-lg);padding:20px;
  border-bottom:9px solid rgba(20,26,58,.28);transition:transform .12s ease}
.cup-choice:hover{transform:translateY(-4px)}
.cup-choice img{width:clamp(116px,13.4vw,198px)}
.order-slots{display:flex;gap:20px}
.order-slot{
  width:clamp(168px,20vw,290px);height:clamp(136px,19.5vh,228px);
  border:7px dashed rgba(255,255,255,.92);border-radius:var(--r-xl);
  background:rgba(255,255,255,.15);display:grid;place-items:center;
}
.order-slot img{max-width:92%;max-height:92%;object-fit:contain}
.compose-square{
  position:relative;
  width:clamp(238px,28vw,400px);height:clamp(238px,28vw,400px);
  border:11px solid rgba(255,255,255,.96);border-radius:var(--r-lg);
  background:rgba(255,255,255,.15);overflow:hidden;
  box-shadow:var(--drop);
}
.compose-square:after{
  content:'';position:absolute;left:-18%;top:49%;width:136%;height:8px;
  background:rgba(255,255,255,.95);transform:rotate(45deg);transform-origin:center;
}
.compose-half{position:absolute;width:48%;height:48%;min-width:0;min-height:0;max-height:none;
  border-width:5px;z-index:2}
.compose-half.one{left:3%;top:3%}
.compose-half.two{right:3%;bottom:3%}
.sized-truck{height:clamp(104px,14vh,178px);display:flex;align-items:center;justify-content:center}
.sized-truck img{height:auto;object-fit:contain;max-height:100%;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.34))}

/* ------------------------------------------------------------ RESPONSIVE */
@media(max-width:1200px){
  .mission-grid{width:96%}
  .world-grid{width:98%}
}
@media(max-width:920px){
  .world-grid{grid-template-columns:repeat(3,1fr)}
  .mission-grid{grid-template-columns:repeat(3,1fr)}
  .top{grid-template-columns:clamp(92px,12vw,130px) 1fr auto;height:clamp(108px,15vh,150px)}
  .speech{font-size:clamp(21px,3.5vw,34px)}
  .big-card{min-width:196px}
  .play{padding-bottom:96px}
  .world-card{min-height:196px}
  .start-hero{width:clamp(160px,24vw,240px)}
}
@media(max-width:700px){
  .world-grid{grid-template-columns:repeat(2,1fr)}
  .mission-grid{grid-template-columns:repeat(2,1fr)}
  .top-controls .hint-hide{display:none}
  .top{height:104px;grid-template-columns:84px 1fr auto}
  .speech{max-width:66vw;font-size:clamp(19px,3.8vw,28px)}
  .task{gap:10px}
  .object{width:78px;height:78px}
  .answer{width:126px;height:98px}
  .big-card{min-width:172px;min-height:146px}
  .world-screen,.hub{padding-top:106px}
  .mission-btn{min-height:140px}
  .dropzone{min-height:110px}
  .bottom{height:82px}
  .start-hero{width:clamp(140px,30vmin,220px);right:4px}
  .sticker,.start-logo,.hub-title,.world-title{-webkit-text-stroke-width:6px}
}
@media(max-height:620px){
  .top{height:clamp(92px,13vh,120px)}
  .play{padding-bottom:80px}
  .bottom{height:78px}
}

/* Some children are sensitive to motion; some adults switch it off. */
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* The replay control lives at the bottom where small hands reach easily;
   the duplicate in the top bar only added noise. */
.top-controls .iconbtn:nth-child(2){display:none}

/* Hub cards are moulded in their own world's colour, so the five places are
   told apart by hue as well as by picture. */
.world-card[data-world="volcano"] {--accent:#FF6B35;--accent-edge:#AE330C}
.world-card[data-world="robot"]   {--accent:#2ECBEC;--accent-edge:#0B7690}
.world-card[data-world="football"]{--accent:#45D477;--accent-edge:#17864A}
.world-card[data-world="dojo"]    {--accent:#9B7BFF;--accent-edge:#5334C4}
.world-card[data-world="truck"]   {--accent:#FFB020;--accent-edge:#B87200}
.world-card{box-shadow:0 var(--lift) 0 var(--accent-edge), var(--drop)}
.world-card:active{box-shadow:0 3px 0 var(--accent-edge),0 8px 16px rgba(9,14,40,.3)}
.world-card b{border-top:0}
.world-card .stars-count i.on{background:var(--sun);box-shadow:0 3px 0 var(--sun-edge)}

/* ---------------------------------------------------- RUN-TIME DROP SIZES
   A ball scored into the goal, or a cube sorted into a bin, is added to the
   page as a plain image with no size rule, so it rendered at its natural
   512-1024px and ballooned across the screen. Anything that lands in a
   container is now given a sensible token size. */
.play img{max-width:100%;max-height:100%}
.dropzone > img:not(.prop),
.big-card > img:not(.main),
.slot > img,
.order-slot > img{
  width:clamp(54px,6.2vw,88px);
  height:clamp(54px,6.2vw,88px);
  object-fit:contain;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));
}
/* dropped tokens sit in a neat row rather than stacking over the artwork */
.dropzone{flex-wrap:wrap;gap:10px;padding:12px}
.big-card{flex-wrap:wrap}
.big-card > img:not(.main){margin:2px}

/* --------------------------------------------------------- ROLL AND MOVE
   The old version showed a fixed face before you tapped, so nothing was
   actually rolled and the result was never announced. The die now spins,
   lands on a number, says it, and the truck counts its way along the road. */
.dice-lane{display:flex;justify-content:center;align-items:center}
.dice-button{width:clamp(124px,13vw,184px);height:clamp(124px,13vw,184px);padding:14px}
.dice-button.ready{animation:breathe 1.5s ease-in-out infinite}
.dice-button.rolling img{animation:diceshake .11s linear infinite}
@keyframes diceshake{25%{transform:rotate(-15deg) scale(1.06)}75%{transform:rotate(15deg) scale(.95)}}
.dice-button.landed{
  box-shadow:0 var(--lift) 0 var(--go-edge), 0 0 0 11px rgba(70,217,134,.30), var(--drop);
}
.road-row{gap:clamp(8px,1.2vw,20px);flex-wrap:nowrap}
.road-step{
  min-width:clamp(84px,9vw,134px);min-height:clamp(84px,9vw,134px);
  position:relative;overflow:visible;
}
.road-num{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(30px,3.6vw,56px);color:#fff;
  text-shadow:0 3px 8px rgba(0,0,0,.55);
}
.road-step.here{border-color:var(--sun);box-shadow:0 0 0 9px rgba(255,201,60,.22)}
.road-step.landed{
  border-color:var(--go);background:rgba(70,217,134,.30);
  box-shadow:0 0 0 11px rgba(70,217,134,.26);
}
/* the truck keeps its own shape and rides on top of the numbered space */
.dropzone > img.road-truck{
  width:clamp(80px,9.2vw,128px);height:auto;
  position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));
}

let state=loadState();let currentMission=null;let currentWorld=null;let selectedDrag=null;let currentInstruction='';
let memoryState=null;function loadState(){try{return JSON.parse(localStorage.getItem('lmq100')||'null')||{completed:{},unlockAll:false,mute:false,lastWorld:'volcano'}}catch(e){try{return JSON.parse(memoryState)||{completed:{},unlockAll:false,mute:false,lastWorld:'volcano'}}catch(_){return{completed:{},unlockAll:false,mute:false,lastWorld:'volcano'}}}}
function saveState(){try{localStorage.setItem('lmq100',JSON.stringify(state))}catch(e){memoryState=JSON.stringify(state)}}
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(!vs.length)return null;return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]}catch(e){return null}}
function speak(t){currentInstruction=t;const sp=$('.speech');if(sp)sp.textContent=t;if(state.mute)return;if(!('speechSynthesis' in window))return;const utter=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.88;u.pitch=1.12;u.volume=1;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else{u.lang='en-GB'}speechSynthesis.speak(u);speechSynthesis.resume()}catch(e){}};if(speechSynthesis.getVoices().length){utter()}else{let fired=false;const go=()=>{if(fired)return;fired=true;utter()};try{speechSynthesis.addEventListener('voiceschanged',go,{once:true})}catch(e){}setTimeout(go,400)}}
window.addEventListener('pointerdown',()=>{try{speechSynthesis.resume()}catch(e){}});
function bgScreen(world,cls=''){const w=worlds[world];const s=el('div',`screen ${cls}`);s.style.backgroundImage=`url("${A.bg(w.bg)}")`;s.dataset.world=world;s.innerHTML='<div class="shade"></div>';return s}
function iconButton(name,handler,extra=''){const b=el('button',`iconbtn ${extra}`);b.innerHTML=`<img src="${A.cue(name)}">`;b.onclick=handler;return b}
function showStart(){currentMission=null;const s=bgScreen('volcano','start');const box=el('div','start-inner');box.style.zIndex=2;box.innerHTML='<div class="start-logo">Little Maths Quest</div><div class="start-sub">Five worlds. Big maths adventures.</div>';const hero=el('img','start-hero');hero.src=A.char('lava_ninja','celebrate');s.appendChild(hero);const b=el('button','playbtn','▶');b.onclick=showHub;box.appendChild(b);s.appendChild(box);$('#app').replaceChildren(s)}
function showHub(){currentMission=null;const s=bgScreen('football','hub');const gear=iconButton('hint_lightbulb',openParent);gear.style.position='absolute';gear.style.right='18px';gear.style.top='18px';gear.style.zIndex=5;s.appendChild(gear);const title=el('div','hub-title','Choose a world');s.appendChild(title);setTimeout(()=>{try{speak('Choose a world')}catch(e){}},200);const grid=el('div','world-grid');Object.entries(worlds).forEach(([key,w])=>{const b=el('button','world-card');const done=missions.filter(m=>m.world===key&&state.completed[m.id]).length;b.dataset.world=key;b.innerHTML=`<div class="w-bg" style="background-image:url('${A.bg(w.bg)}')"></div><img class="w-char" src="${key==='truck'?A.obj(w.icon):A.char(w.guide,'idle')}"><b>${w.name}</b><div class="stars-count">${Array.from({length:6},(_,i)=>'<i class="'+(i<done?'on':'')+'"></i>').join('')}</div>`;b.onclick=()=>showWorld(key);grid.appendChild(b)});s.appendChild(grid);$('#app').replaceChildren(s)}
function missionUnlocked(m){if(state.unlockAll)return true;const list=missions.filter(x=>x.world===m.world);const i=list.indexOf(m);return i===0||state.completed[list[i-1].id]}
function showWorld(world){currentWorld=world;state.lastWorld=world;saveState();const s=bgScreen(world,'world-screen');const home=iconButton('home_symbol',showHub);home.style.position='absolute';home.style.left='18px';home.style.top='18px';home.style.zIndex=5;s.appendChild(home);const title=el('div','world-title',worlds[world].name);s.appendChild(title);setTimeout(()=>{try{speak(worlds[world].name)}catch(e){}},200);const grid=el('div','mission-grid');missions.filter(m=>m.world===world).forEach((m,i)=>{const b=el('button','mission-btn');const unlocked=missionUnlocked(m);if(!unlocked)b.classList.add('locked');if(state.completed[m.id])b.classList.add('completed');b.innerHTML=`<span class="m-no">${i+1}</span><img src="${missionIcon(m)}"><b>${m.name}</b>`;if(unlocked)b.onclick=()=>openMission(m.id);grid.appendChild(b)});s.appendChild(grid);$('#app').replaceChildren(s)}

function hintMission(){if(!currentMission)return;const first=$('.object:not(.used),.answer,.dice-button,.dropzone,.tap-target');if(first)first.classList.add('selected');const hints={count:'Count each big object, then touch the number.',give:'Touch one crystal at a time. The empty circles show how many.',compare:'Look at both groups. Touch the group asked for.',addone:'Drag the loose crystal into the bowl.',takeone:'Touch one crystal to move it away.',fillslots:'Drag each cube into an empty circle.',missing:'Count the empty spaces.',maketotal:'Fill every empty space.',shapematch:'Match each shape to the same-shaped hole.',sortcolors:'Put red with red and blue with blue.',sum:'Count both groups together.',pattern:'Say the pattern: ball, boot, ball, boot.',numbermissing:'Count in order: one, two, three, four, five.',kick:'Touch each football.',matchgroup:'Find the group with the same amount as the number.',singledrag:'Drag the yellow triangle into the triangle hole.',sortshapes:'Put circles together and triangles together.',odd:'Two are circles. One is not.',compose:'Drag both triangles into the two empty spaces.',position:'Drag the ball to the glowing place.',dicemove:'Touch the big dice.',compareasset:'Look from the same starting line.',tallest:'Which stack reaches highest?',capacity:'Which cup is fullest?',order:'Put the smallest truck first, then medium, then largest.'};speak(hints[currentMission.type]||'Look carefully and try.')}

 else if(m.type==='compose'){const square=el('div','compose-square');const zones=[];for(let i=0;i<2;i++){const z=el('div',`dropzone hot compose-half ${i===0?'one':'two'}`);z.dataset.accept='triangle';zones.push(z);square.appendChild(z)}const tray=el('div','tray');let done=0;for(let i=0;i<2;i++){const o=el('div','object drag-item');o.dataset.kind='triangle';o.appendChild(img('dojo_triangle_yellow.png'));tray.appendChild(o);setupDrag(o,zones,(zone)=>{zone.replaceChildren(img('dojo_triangle_yellow.png'));o.classList.add('used');zone.dataset.filled='1';done++;if(done===2)complete()})}t.append(square,tray);}
 else if(m.type==='position'){const stage=el('div','big-card');stage.style.width='min(620px,80vw)';stage.style.height='min(390px,48vh)';stage.style.position='relative';const prop=img(d.prop,'main');prop.style.maxWidth=d.relation==='under'?'72%':'48%';stage.appendChild(prop);const z=el('div','dropzone hot');z.dataset.accept='ball';z.style.position='absolute';if(d.relation==='inside'){z.style.width='34%';z.style.height='32%';z.style.left='33%';z.style.top='38%'}else{z.style.width='42%';z.style.height='22%';z.style.left='29%';z.style.bottom='4%'}stage.appendChild(z);const ball=el('div','object drag-item');ball.dataset.kind='ball';ball.appendChild(img('football.png'));t.append(stage,ball);setupDrag(ball,[z],()=>{z.appendChild(img('football.png'));ball.classList.add('used');complete()});}
 else if(m.type==='dicemove'){const roll=1+Math.floor(Math.random()*4);const lane=el('div','dice-lane');const die=el('button','answer dice-button ready');const face=img('dice_1.png');die.appendChild(face);lane.appendChild(die);const road=el('div','row road-row');const steps=[];for(let i=1;i<=5;i++){const s=el('div','dropzone road-step');s.innerHTML='<div class="road-num">'+i+'</div>';road.appendChild(s);steps.push(s)}const truck=img('monster_truck_red_cropped.png');truck.className='road-truck';steps[0].appendChild(truck);steps[0].classList.add('here');let pos=0;function drive(){const step=()=>{if(pos>=roll){steps[pos].classList.add('landed');speak('You landed on '+(pos+1)+'.');setTimeout(complete,900);return}steps[pos].classList.remove('here');pos++;steps[pos].appendChild(truck);steps[pos].classList.add('here');speak(String(pos+1));setTimeout(step,760)};step()}die.onclick=()=>{if(die.disabled)return;die.disabled=true;die.classList.remove('ready');die.classList.add('rolling');let n=0;const spin=setInterval(()=>{face.src=A.obj('dice_'+(1+Math.floor(Math.random()*6))+'.png');if(++n>=8){clearInterval(spin);face.src=A.obj('dice_'+roll+'.png');die.classList.remove('rolling');die.classList.add('landed');speak('You rolled '+roll+'. Move '+roll+'.');setTimeout(drive,1200)}},110)};t.append(lane,road);}
 else if(m.type==='compareasset'){const row=el('div','row');[d.a,d.b].forEach((x,i)=>{const b=el('button','big-card tap-target');b.dataset.correct=i===d.answer?'true':'false';b.appendChild(img(x,'main'));b.onclick=()=>i===d.answer?complete():wrong(b);row.appendChild(b)});t.append(row);}
 else if(m.type==='tallest'){const row=el('div','stack');d.stacks.forEach((n,i)=>{const b=el('button','block-stack tap-target');b.dataset.correct=i===d.answer?'true':'false';for(let j=0;j<n;j++)b.appendChild(img('measuring_block.png'));b.onclick=()=>i===d.answer?complete():wrong(b);row.appendChild(b)});t.append(row);}
 else if(m.type==='capacity'){const row=el('div','row');d.cups.forEach((x,i)=>{const b=el('button','cup-choice tap-target');b.dataset.correct=i===d.answer?'true':'false';b.appendChild(img(x));b.onclick=()=>i===d.answer?complete():wrong(b);row.appendChild(b)});t.append(row);}
 else if(m.type==='order'){const slots=el('div','order-slots'),tray=el('div','tray');const zones=[];for(let i=0;i<3;i++){const z=el('div','order-slot dropzone');z.dataset.accept=String(i);zones.push(z);slots.appendChild(z)}const widths=['150px','220px','300px'],heights=['80px','115px','150px'];[0,1,2].forEach(i=>{const o=el('div','drag-item sized-truck');o.dataset.kind=String(i);o.style.width=widths[i];o.style.height=heights[i];o.style.cursor='grab';const im=img('monster_truck_red_cropped.png');im.style.height='100%';im.style.width='auto';o.appendChild(im);tray.appendChild(o);setupDrag(o,zones,(zone)=>{const clone=img('monster_truck_red_cropped.png');clone.style.height=heights[i];clone.style.width='auto';zone.appendChild(clone);o.classList.add('used');zone.dataset.filled='1';if(zones.every(z=>z.dataset.filled==='1'))complete()})});t.append(slots,tray);}
}
let DRAG_STATE=null;
window.addEventListener('pointermove',e=>{const d=DRAG_STATE;if(!d)return;e.preventDefault();d.dx=e.clientX-d.sx;d.dy=e.clientY-d.sy;d.item.style.transform=`translate(${d.dx}px,${d.dy}px) scale(1.04)`;d.item.style.zIndex='50'} ,{passive:false});
window.addEventListener('pointerup',e=>{const d=DRAG_STATE;if(!d)return;const z=d.zones.find(q=>{const r=q.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});d.item.style.transform='';d.item.style.zIndex='';DRAG_STATE=null;if(z)d.attempt(z)});
function setupDrag(item,zones,onGood){item.onclick=()=>{if(item.classList.contains('used'))return;document.querySelectorAll('.drag-item.selected').forEach(x=>x.classList.remove('selected'));item.classList.add('selected');selectedDrag=item;zones.forEach(z=>z.classList.add('hot'))};zones.forEach(z=>{z.addEventListener('click',()=>{if(selectedDrag===item&&!item.classList.contains('used'))attempt(z)})});item.onpointerdown=e=>{if(item.classList.contains('used'))return;e.preventDefault();DRAG_STATE={item,zones,onGood,sx:e.clientX,sy:e.clientY,dx:0,dy:0,attempt};item.style.zIndex='50'};function attempt(z){if(item.classList.contains('used'))return;if(z.dataset.accept===item.dataset.kind&&!z.dataset.filled){onGood(z);item.classList.remove('selected');zones.forEach(q=>q.classList.remove('hot'));selectedDrag=null}else wrong(z,'That does not go there.')}}
function openParent(){const ov=el('div','parent-overlay');const card=el('div','parent-card');card.innerHTML='<h2>Grown-up check</h2><p style="font-size:24px">What is 3 + 2?</p>';const choices=el('div','gate-choices');[4,5,6].forEach(n=>{const b=el('button','',String(n));b.onclick=()=>{if(n===5)showParentPanel(card);else b.classList.add('wrong')};choices.appendChild(b)});card.appendChild(choices);const close=el('button','secondary','Close');close.onclick=()=>ov.remove();card.appendChild(close);ov.appendChild(card);$('.screen').appendChild(ov)}
function showParentPanel(card){card.innerHTML='<h2>Parent controls</h2>';const p=el('p');p.style.fontSize='22px';p.textContent=`Completed ${Object.keys(state.completed).length} of ${missions.length} missions.`;card.appendChild(p);const unlock=el('button','primary',state.unlockAll?'Lock normal progression':'Unlock all missions');unlock.onclick=()=>{state.unlockAll=!state.unlockAll;saveState();showHub()};const mute=el('button','secondary',state.mute?'Turn voice on':'Turn voice off');mute.onclick=()=>{state.mute=!state.mute;saveState();showHub()};const reset=el('button','danger','Reset progress');reset.onclick=()=>{if(confirm('Reset all progress?')){state={completed:{},unlockAll:false,mute:false,lastWorld:'volcano'};saveState();showHub()}};const close=el('button','secondary','Close');close.onclick=()=>showHub();card.append(unlock,mute,reset,close)}
window.LMQ_TEST={open:id=>openMission(id),missions:()=>missions.map(m=>m.id),state:()=>state,reset:()=>{localStorage.clear();state=loadState();showStart()}};
showStart();
</script></body></html>
