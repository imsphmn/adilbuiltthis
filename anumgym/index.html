x rgba(122,28,61,.08);cursor:pointer}.label{font-size:10px;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin-bottom:6px}.card h2{font:700 22px/1.15 var(--serif);color:var(--wine);margin-bottom:8px}.meta{color:var(--muted);font-size:13px}.woHead{position:sticky;top:0;z-index:3;background:rgba(255,248,242,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,162,75,.24);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}.woTop{display:flex;gap:12px;align-items:center;padding-bottom:10px}.back{min-width:44px;min-height:38px;color:var(--muted);font-size:18px}.woInfo{flex:1;min-width:0}.step{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.exname{color:var(--wine);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:3px;background:rgba(200,162,75,.15)}.fill{height:100%;background:linear-gradient(90deg,var(--wine),var(--gold))}.woBody{padding:20px 16px 120px}.numrow{display:flex;gap:14px;align-items:center;margin-bottom:16px}.num{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--wine);border:2px solid var(--gold);color:var(--gold);font:700 22px var(--serif);flex:none}.warm{background:#f9ede4;color:var(--wine);border-color:rgba(200,162,75,.42);font-size:16px}.rep{flex:1;background:var(--wine);border:1.5px solid var(--gold);border-radius:14px;padding:10px;text-align:center}.rep b{display:block;color:var(--cream);font:700 22px/1 var(--serif)}.rep span{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em}.woBody h1{font:700 29px/1.12 var(--serif);color:var(--wine);margin-bottom:16px}.tt{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;margin-bottom:20px;border-radius:999px;background:#000;color:#fff;font-weight:800}.hr{border-top:1.5px solid var(--gold);margin-bottom:18px}.smallHead{font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--wine);margin-bottom:14px}.steps{display:grid;gap:10px;margin-bottom:22px;list-style:none}.steps li{display:flex;gap:12px}.steps em{font-style:normal;color:var(--gold);font:700 16px var(--serif);min-width:26px}.panel{border-radius:14px;padding:15px 16px;margin-bottom:12px}.think{background:var(--soft);border:1px solid var(--pink)}.feel{background:#fff;border:1px solid var(--gold)}.avoid{background:#fbeaea;border:1px solid var(--bad)}.pLabel{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}.think .pLabel{color:var(--pink)}.feel .pLabel{color:var(--gold)}.avoid .pLabel{color:var(--bad)}.moves{border:1.5px solid var(--gold);border-radius:18px;background:#fff;padding:18px;box-shadow:0 2px 10px rgba(122,28,61,.08);margin-bottom:18px}.move{display:grid;grid-template-columns:32px 1fr auto;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed rgba(200,162,75,.35)}.move:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.move b{font:700 24px var(--serif);color:var(--gold)}.move h3{font:700 18px var(--serif);color:var(--wine);margin-bottom:4px}.move p{font-size:13px;color:var(--muted)}.move strong{color:var(--wine);white-space:nowrap}.stretch{border:1.5px solid var(--gold);border-radius:18px;background:#fff;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(122,28,61,.08)}.stretchTop{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.stretch h3{font:700 20px var(--serif);color:var(--wine)}.stretch b{color:var(--gold)}.stretch p{color:var(--muted);font-size:14px}.doneWrap{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--cream) 75%,rgba(255,248,242,0));z-index:4}.doneHero{background:var(--wine);color:var(--cream);text-align:center;padding:70px 24px 48px}.doneHero h1{font:700 36px/1.08 var(--serif);color:var(--gold);margin-bottom:12px}.protein{padding:30px 16px}.target{padding:28px;border-radius:20px;text-align:center;background:linear-gradient(135deg,var(--wine),#9b3158);color:#fff;box-shadow:var(--shadow);margin-bottom:22px}.target b{display:block;font:700 70px/1 var(--serif);color:var(--gold)}.homeBtn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 22px;border-radius:999px;background:#f9ede4;border:1px solid rgba(122,28,61,.2);color:var(--wine);font-weight:800}.center{text-align:center}.toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:10;padding:13px 16px;border-radius:14px;background:var(--wine2);color:#fff;text-align:center;font-weight:700;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateY(0)}@media(min-width:700px){.week{padding:16px 24px;gap:18px}.week>span{font-size:13px}.dot{min-width:34px;font-size:13px}.pip{width:30px;height:30px}.nextTop{padding:36px}.day{font-size:64px}.next h1{font-size:30px}.nextAct{padding:24px 36px 32px}.brand{font-size:52px}}

const W=[{label:'WORKOUT 1',title:'Simplified Workout 1',focus:'Glutes, legs, waist and a simple stretch finish',desc:'2 warm-up · 4 exercises · finish',duration:'~30-35 min',ex:[{n:'W1',warm:1,name:'Bodyweight Glute Bridge',reps:'1 x 15',sub:'warm-up · glutes on',q:'bodyweight glute bridge form',steps:['Lie on your back with feet flat, hip-width apart.','Press through your heels and lift your hips into a gentle bridge.','Pause briefly at the top and lightly squeeze the glutes.','Lower slowly and reset between reps.'],think:'Wake the glutes up gently before the main work.',feel:'A warm, light squeeze through the glutes, not the lower back.',avoid:'Arching the lower back · Pushing through toes · Rushing the reps'},{n:'W2',warm:1,name:'Deep Squat Hold',reps:'30 sec',sub:'warm-up · hip opener',q:'deep squat hold form',steps:['Sit low into a comfortable squat with feet flat if possible.','Let your hips open gently and keep your shoulders relaxed.','Breathe slowly and hold balance without forcing depth.','Stand smoothly when the hold is done.'],think:'Sit low, breathe, and open the hips.',feel:'A gentle opening through the hips and inner thighs.',avoid:'Heels lifting aggressively · Holding the breath · Forcing painful depth'},{n:'1',name:'Single Leg Hip Thrust',reps:'3 x 12-20',sub:'each leg · 60 sec rest',q:'single leg hip thrust home workout',steps:['Upper back rests on the sofa, with the working foot planted.','Lift the other leg and keep the hips level.','Drive up through the planted heel and pause at the top.','Lower slowly with control before the next rep.','Finish all reps on one side before switching.'],think:'Heel down. Hips level. Squeeze the working glute.',feel:'A strong glute squeeze on the working side, with a little hamstring.',avoid:'Twisting the hips · Arching the lower back · Pushing through toes · Rushing'},{n:'2',name:'B Stance Kettlebell RDL',reps:'3 x 12-20',sub:'each leg · 60 sec rest',q:'B stance kettlebell RDL form',steps:['One foot goes forward and the other sits slightly behind like a kickstand.','Keep most of the weight on the front leg with soft knees.','Send the hips back while the kettlebell stays close to the front leg.','Stand tall by squeezing the glutes forward.','Switch sides after all reps are complete.'],think:'Hips back. Kettlebell close. Stretch the back of the front leg.',feel:'Hamstring stretch on the front leg and glute work as you stand.',avoid:'Squatting the movement · Rounding the back · Kettlebell drifting forward'},{n:'3',name:'Bulgarian Split Squat',reps:'2 x 10-15',sub:'each leg · 60 sec rest',q:'bulgarian split squat form',steps:['Rest the back foot on the sofa or a chair.','Take a long stance and lean slightly forward.','Lower slowly, keeping the front foot grounded.','Push through the front heel and mid-foot to stand.','Complete one side before switching.'],think:'Long stance. Slow down. Push through the front leg.',feel:'The front-leg glute and thigh working with control.',avoid:'Too short a stance · Knee collapsing inward · Bouncing out of the bottom'},{n:'4',name:'Reverse Crunch',reps:'2 x 10-15',sub:'30 sec rest',q:'reverse crunch form',steps:['Lie on your back with knees bent and feet light.','Curl the pelvis up slightly, lifting the hips a small amount off the floor.','Exhale as the hips lift.','Lower slowly, leading with the pelvis rather than swinging the legs.'],think:'Curl the pelvis. Do not swing the legs.',feel:'Lower abs working through a slow, controlled contraction.',avoid:'Swinging the legs · Using momentum · Pulling on the neck'},{n:'F',type:'flex',name:'Finish',reps:'~3 min',sub:'gentle and slow',st:[['A','Frog Stretch','60 sec','On all fours, take the knees wide and let the hips relax back or down gently. Breathe slowly.','Sharp hip pain or forcing the knees too wide'],['B','Hamstring Stretch','45 sec each side','Stretch one leg at a time. Keep the knee soft and hinge forward until you feel the back of the leg.','Rounding hard through the back or bouncing']]}]},{label:'WORKOUT 2',title:'Simplified Workout Day 2',focus:'Glutes, squats, lunges and hip-opening finish',desc:'2 warm-up · 4 exercises · finish',duration:'~30-35 min',ex:[{n:'W1',warm:1,name:'Frog Rock Backs',reps:'1 x 10',sub:'warm-up · hip opener',q:'frog rock backs stretch',steps:['Start on all fours with knees wide and toes turned slightly out.','Gently rock the hips back toward your heels.','Return to the start with control.','Breathe slowly throughout.'],think:'Move gently and breathe into the hips.',feel:'A soft opening through the hips and inner thighs.',avoid:'Sharp hip pinch · Forcing the knees too wide · Holding the breath'},{n:'W2',warm:1,name:'Bodyweight Squat',reps:'1 x 12',sub:'warm-up · pattern rehearsal',q:'bodyweight squat form',steps:['Stand with feet around shoulder-width and toes slightly turned out.','Sit down slowly and with control.','Keep knees tracking in line with the toes.','Stand smoothly and lightly squeeze at the top.'],think:'Slow and controlled. Knees follow toes.',feel:'Legs, glutes, and hips waking up.',avoid:'Knees caving inward · Heels lifting · Rushing the reps'},{n:'1',name:'Single Leg Glute Bridge',reps:'3 x 15-25',sub:'each leg · 60 sec rest',q:'single leg glute bridge form',steps:['Lie on your back and plant one foot.','Lift the other leg and keep the hips level.','Push through the planted heel and lift the hips smoothly.','Pause at the top, then lower with control.','Finish one side before switching.'],think:'One glute at a time. Push through the heel.',feel:'The working-side glute, with a little hamstring.',avoid:'Twisting the hips · Arching the lower back · Pushing through toes · Rushing'},{n:'2',name:'1.5 Rep Goblet Squat',reps:'3 x 12-20',sub:'60 sec rest',q:'1.5 rep goblet squat form',steps:['Hold the kettlebell at the chest with feet slightly wider than hips.','Sit down between the hips with knees following the toes.','Come halfway up, then go back down to the bottom.','Stand all the way up. That counts as one rep.'],think:'Control the bottom. Full foot on the floor. Stay smooth.',feel:'Glutes, thighs, and hips working through controlled range.',avoid:'Bouncing · Knees collapsing inward · Heels lifting · Rounding the lower back'},{n:'3',name:'Long Stride Reverse Lunge',reps:'2 x 10-15',sub:'each leg · 60 sec rest',q:'long stride reverse lunge form',steps:['Hold the kettlebell at the chest or in a suitcase hold.','Step back into a long stride with a slight forward lean.','Keep the front foot flat and lower slowly.','Push through the front heel and mid-foot to rise.','Alternate or complete one side at a time.'],think:'Long step. Front glute. Control the lowering.',feel:'The front-leg glute and some thigh with good balance.',avoid:'Too short a step · Knee collapsing inward · Pushing through toes · Slamming the back knee'},{n:'4',type:'stamina',name:'Squat Stamina Block',reps:'2 ROUNDS',sub:'30 sec hold · 15 pulses · 15 squats',moves:[['A','Deep Squat Hold','30 sec','Sit low into your deepest comfortable squat and hold. Stay still and breathe slowly.'],['B','Squat Pulses','15 reps','Stay low. Rise an inch and drop an inch with small, smooth pulses.'],['C','Bodyweight Squats','15 reps','Stand all the way up, then sit all the way down. Keep reps smooth and knees over toes.']],think:'Stay relaxed but strong. Breathe steadily. Do 2 rounds.',avoid:'Knees collapsing inward · Holding the breath · Forcing painful depth'},{n:'F',type:'flex',name:'Finish',reps:'~2 min',sub:'gentle and slow',st:[['A','Happy Baby Stretch','60 sec','Lie on your back, hold the outer feet, and let the hips sink open. Breathe slowly.','Pulling aggressively or holding the breath'],['B','Frog Stretch','60 sec','On all fours, knees wide. Let the hips relax toward the floor and keep it gentle.','Sharp hip pain or forcing the knees too wide']]}]}];
const KEY='anumGym.sessions.v1';let S={w:0,e:0},DB=load();function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||def()}catch(e){return def()}}function def(){return{activeSession:null,completedSessions:[],lastCompletedWorkout:null}}function save(){localStorage.setItem(KEY,JSON.stringify(DB))}function greet(){let h=new Date().getHours();return h<5?'Up early':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Still going strong'}function active(){return DB.activeSession&&!DB.activeSession.finished?DB.activeSession:null}function nextI(){return DB.lastCompletedWorkout==null?0:(DB.lastCompletedWorkout+1)%W.length}function fmt(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}function mount(h){app.innerHTML=h;scrollTo(0,0)}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}function streak(){let t=new Date,d=t.getDay(),off=d===0?-6:1-d,m=new Date(t);m.setHours(0,0,0,0);m.setDate(t.getDate()+off);return ['M','T','W','T','F','S','S'].map((l,i)=>{let a=m.getTime()+i*864e5,b=a+864e5-1,on=DB.completedSessions.some(s=>(s.endTime||s.startTime)>=a&&(s.endTime||s.startTime)<=b),today=d===0?i===6:i===d-1;return `<div class="dot ${on?'on':''} ${today?'today':''}"><div class="pip"></div><span>${l}</span></div>`}).join('')}function home(){let a=active(),i=a?a.workoutIndex:nextI(),w=W[i],last=DB.completedSessions.filter(s=>s.workoutIndex===i).sort((a,b)=>(b.endTime||b.startTime)-(a.endTime||a.startTime))[0];let cards=W.map((x,j)=>`<div class="card" onclick="start(${j})"><div class="label">${x.label}</div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.desc)} · ${esc(x.duration)}</div></div>`).join('');mount(`<section class="hero"><div class="brand">Diwale le Jayenge</div><div class="sub">Starring just Anum</div><div class="spark">*</div><div class="greet">${greet()}, Anum</div></section><main class="wrap"><div class="week"><span>This week</span><div class="dots">${streak()}</div></div>${a?`<div class="resume"><div class="kicker">Workout in progress</div><div class="title">${W[a.workoutIndex].label} · ${esc(W[a.workoutIndex].title)}</div><div class="actions"><button class="btn primary" onclick="resume()">Resume Workout</button><button class="btn ghost" onclick="discard()">Discard session</button></div></div>`:''}<section class="next"><div class="nextTop"><div class="kicker">Next Workout</div><div class="day">Day ${String(i+1).padStart(2,'0')}</div><h1>${esc(w.title)}</h1><p class="focus">${esc(w.focus)}</p><div class="chips"><span>${w.ex.length} steps</span><span>${w.duration}</span><span>${last?'Last: '+fmt(last.endTime||last.startTime):'First time'}</span></div></div><div class="nextAct"><button class="btn primary" onclick="${a?'resume()':'start('+i+')'}">${a?'Resume Workout':'Start Workout'}</button><div class="quick"><button class="btn ghost" onclick="quickComplete(${i})">Mark workout complete</button></div></div></section><details class="chooser"><summary>Choose a different workout</summary><div class="cards">${cards}</div></details></main>`)}function start(i){let a=active();if(a&&a.workoutIndex!==i&&!confirm('Discard the current workout and start this one?'))return;if(!a||a.workoutIndex!==i){DB.activeSession={id:'sess_'+Date.now(),workoutIndex:i,exerciseIndex:0,startTime:Date.now(),finished:false};save()}S.w=i;S.e=DB.activeSession.exerciseIndex||0;workout()}function resume(){let a=active();if(!a)return home();S.w=a.workoutIndex;S.e=a.exerciseIndex||0;workout()}function discard(){if(confirm('Discard this session?')){DB.activeSession=null;save();home()}}function quickComplete(i){let w=W[i];if(!confirm('Mark '+w.title+' complete for today?'))return;DB.completedSessions.push({id:'quick_'+Date.now(),workoutIndex:i,title:w.title,startTime:Date.now(),endTime:Date.now(),finished:true,quick:true});DB.lastCompletedWorkout=i;if(active()&&DB.activeSession.workoutIndex===i)DB.activeSession=null;save();home();toast('Workout marked complete')}function complete(){let a=active();if(a){a.finished=true;a.endTime=Date.now();a.title=W[a.workoutIndex].title;DB.completedSessions.push(a);DB.lastCompletedWorkout=a.workoutIndex;DB.activeSession=null;save()}}function exHtml(x){if(x.type==='stamina')return `<div class="numrow"><div class="num">${x.n}</div><div class="rep"><b>${x.reps}</b><span>${x.sub}</span></div></div><h1>${esc(x.name)}</h1><div class="hr"></div><div class="moves">${x.moves.map(m=>`<div class="move"><b>${m[0]}</b><div><h3>${esc(m[1])}</h3><p>${esc(m[3])}</p></div><strong>${esc(m[2])}</strong></div>`).join('')}</div><div class="panel think"><div class="pLabel">What to think</div><p>${esc(x.think)}</p></div><div class="panel avoid"><div class="pLabel">Avoid</div><p>${esc(x.avoid)}</p></div>`;if(x.type==='flex')return `<div class="numrow"><div class="num">${x.n}</div><div class="rep"><b>${x.reps}</b><span>${x.sub}</span></div></div><h1>${esc(x.name)}</h1><div class="hr"></div>${x.st.map(s=>`<div class="stretch"><div class="stretchTop"><h3>${s[0]} · ${esc(s[1])}</h3><b>${esc(s[2])}</b></div><p>${esc(s[3])}</p><p><b>Avoid:</b> ${esc(s[4])}</p></div>`).join('')}`;return `<div class="numrow"><div class="num ${x.warm?'warm':''}">${x.n}</div><div class="rep"><b>${x.reps}</b><span>${x.sub}</span></div></div><h1>${esc(x.name)}</h1><a class="tt" target="_blank" rel="noopener" href="https://www.tiktok.com/search?q=${encodeURIComponent(x.q)}">Watch form guide</a><div class="hr"></div><div class="smallHead">How to do it</div><ol class="steps">${x.steps.map((s,i)=>`<li><em>${i+1}.</em><span>${esc(s)}</span></li>`).join('')}</ol><div class="panel think"><div class="pLabel">What to think</div><p>${esc(x.think)}</p></div><div class="panel feel"><div class="pLabel">What you should feel</div><p>${esc(x.feel)}</p></div><div class="panel avoid"><div class="pLabel">Avoid</div><p>${esc(x.avoid)}</p></div>`}function workout(){let w=W[S.w],x=w.ex[S.e],pct=(S.e+1)/w.ex.length*100,last=S.e===w.ex.length-1;mount(`<header class="woHead"><div class="woTop"><button class="back" onclick="home()">Back</button><div class="woInfo"><div class="step">${w.label} · ${S.e+1} of ${w.ex.length}</div><div class="exname">${esc(x.name)}</div></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></header><main class="woBody">${exHtml(x)}</main><div class="doneWrap"><button class="btn primary" onclick="next()">${last?'Finish Workout':'Done - Next Exercise'}</button></div>`)}function next(){let w=W[S.w];if(S.e<w.ex.length-1){S.e++;let a=active();if(a){a.exerciseIndex=S.e;save()}workout()}else{complete();done()}}function done(){mount(`<section class="doneHero"><h1>Diwale le Jayenge!</h1><p>ANUM - You just crushed it.</p></section><main class="protein"><div class="target"><b>104g</b><span>protein today</span></div><p class="center">Protein helps repair and rebuild the muscles you just trained.</p><p class="center" style="margin-top:24px"><button class="homeBtn" onclick="home()">Back to workouts</button></p></main>`)}document.addEventListener('DOMContentLoaded',home);
</script>
</body>
</html>
