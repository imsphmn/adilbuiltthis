}



// ============================================================
// APP — navigation and all action handlers
// ============================================================
var db;
var App = (function() {

  /* ── screen nav ── */
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    var el = document.getElementById('scr-' + name);
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(function(b) { b.classList.toggle('nav-tab--on', b.dataset.screen === name); });
    // Render on demand
    if (name === 'today')   { el.innerHTML = renderToday(db); }
    if (name === 'home')    { el.innerHTML = renderHome(db); }
    if (name === 'volume')  { el.innerHTML = renderVolume(db); }
    if (name === 'history') { el.innerHTML = renderHistory(db); }
    // Program is pre-rendered; only refresh on first visit
    if (name === 'program' && !el.dataset.rendered) {
      el.innerHTML = renderProgram();
      el.dataset.rendered = '1';
    }
    window._currentScreen = name;
  }

  /* ── today ── */
  function setNextDay(n) {
    db._nextDayOverride = parseInt(n, 10);
    dbSave(db);
    showScreen('today');
  }

  function useRecommendation() {
    delete db._nextDayOverride;
    dbSave(db);
    showScreen('today');
  }

  function startWorkout(dayN) {
    if (db.activeSession && !db.activeSession.finished) {
      if (!confirm('A workout is already in progress. Discard it and start a new one?')) return;
    }
    var sess = createSession(dayN);
    sess.sets = initWorkoutSets(dayN, db, sess);
    sess.exNotes = {};
    delete db._nextDayOverride;
    db.activeSession = sess;
    dbSave(db);
    openWorkoutOverlay();
  }

  function resumeWorkout() {
    if (!db.activeSession) return;
    openWorkoutOverlay();
  }

  function discardSession() {
    if (!confirm('Discard the current workout session? This cannot be undone.')) return;
    SessionClock.stop();
    db.activeSession = null;
    dbSave(db);
    showScreen('today');
  }

  function openWorkoutOverlay() {
    renderWorkout(db);
    document.getElementById('workout-overlay').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.add('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeWorkout() {
    SessionClock.stop();
    if (db.activeSession && !db.activeSession.finished) {
      var completedAny = db.activeSession.sets.some(function(s){ return s.completed; });
      if (completedAny) {
        if (!confirm('Leave workout? Your logged sets are saved. You can resume later.')) return;
      }
    }
    document.getElementById('workout-overlay').classList.add('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.body.style.overflow = '';
    showScreen('today');
  }

  function applyRushedMode() {
    if (!db.activeSession || db.activeSession.rushedModeApplied) return;
    if (!confirm('Rushed Mode will reduce lower-priority sets for today but keep the key exercises. Continue?')) return;
    applyRushedModeToSession(db.activeSession);
    dbSave(db);
    renderWorkout(db);
  }

  /* ── set mutations (live workout) ── */
  function getSet(setId) {
    if (!db.activeSession) return null;
    return db.activeSession.sets.find(function(s){ return s.id === setId; }) || null;
  }

  function setWeight(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.weight = Math.max(0, val); dbSave(db);
    // update displayed input without re-render
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp');
    if (inp && document.activeElement !== inp) inp.value = s.weight;
  }
  function adjWeight(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.weight = Math.max(0, Math.round((s.weight + delta) * 10) / 10);
    dbSave(db);
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp[type="number"]');
    if (inp) {
      var row = document.getElementById('sr-' + setId);
      if (row) { var allInps = row.querySelectorAll('.sri-inp'); if (allInps[0]) allInps[0].value = s.weight; }
    }
    // simpler: just update all inputs in the row
    var row = document.getElementById('sr-' + setId);
    if (row) { var wi = row.querySelectorAll('.sri-inp')[0]; if (wi) wi.value = s.weight; }
  }
  function setReps(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.reps = Math.max(0, parseInt(val,10)||0); dbSave(db);
  }
  function adjReps(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.reps = Math.max(0, s.reps + delta); dbSave(db);
    var row = document.getElementById('sr-' + setId);
    if (row) { var ri = row.querySelectorAll('.sri-inp')[1]; if (ri) ri.value = s.reps; }
  }
  function setRir(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.rir = parseInt(val,10)||0; dbSave(db);
    rerenderSetRow(setId);
  }
  function saveExNote(exId, val) {
    if (!db.activeSession) return;
    if (!db.activeSession.exNotes) db.activeSession.exNotes = {};
    db.activeSession.exNotes[exId] = val;
    dbSave(db);
  }

  function completeSet(setId) {
    var s = getSet(setId); if (!s) return;
    if (s.reps <= 0) { alert('Enter reps before logging.'); return; }
    s.completed = true; s.rir = null; s.timestamp = Date.now();
    dbSave(db);
    try { navigator.vibrate(80); } catch(e){}
    rerenderSetRow(setId);
    var ex = getExerciseDef(s.exId, db.activeSession);
    if (ex && s.setType !== 'warmup') Timer.start(ex.rest);
    var exId = s.exId, sess = db.activeSession, exerciseIds = getSessionExerciseIds(sess);
    setTimeout(function() {
      var prescSets = sess.sets.filter(function(ss){
        return ss.exId===exId&&(ss.setType==='working'||ss.setType==='drop')&&!ss.isAdded;
      });
      var allPrescDone = prescSets.length>0&&prescSets.every(function(ss){return ss.completed||ss.skipped;});
      if (allPrescDone) {
        var thisCard = document.getElementById('exc-'+exId);
        if (thisCard) thisCard.outerHTML = renderExCard(exId, sess, db, 'done');
        var exIdx = exerciseIds.indexOf(exId), nextExId = null;
        for (var _i=exIdx+1;_i<exerciseIds.length;_i++) {
          var _nws=sess.sets.filter(function(ss){return ss.exId===exerciseIds[_i]&&(ss.setType==='working'||ss.setType==='drop');});
          if(_nws.length===0||!_nws.every(function(ss){return ss.completed||ss.skipped;})){nextExId=exerciseIds[_i];break;}
        }
        if (nextExId) {
          sess.currentExId = nextExId; dbSave(db);
          var nc = document.getElementById('exc-'+nextExId);
          if (nc) nc.outerHTML = renderExCard(nextExId, sess, db, 'current');
          setTimeout(function(){ var el=document.getElementById('exc-'+nextExId); if(el) scrollExIntoView(el, false); },100);
        }
        var exDone=0;
        exerciseIds.forEach(function(eid){
          var sets=sess.sets.filter(function(s){return s.exId===eid&&(s.setType==='working'||s.setType==='drop')&&!s.skipped;});
          if(sets.length>0&&sets.every(function(s){return s.completed||s.skipped;})) exDone++;
        });
        var hp=document.querySelector('.wo-hprog'); if(hp) hp.textContent=exDone+' / '+exerciseIds.length+' exercises';
      } else {
        var na=document.querySelector('#exc-'+exId+' .set-row--active');
        if(na) scrollExIntoView(na, true);
        updateExCardDoneState(exId);
      }
    }, 150);
  }

  function undoSet(setId) {
    var s = getSet(setId); if (!s) return;
    s.completed = false; s.timestamp = null;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }
  function editSet(setId) { undoSet(setId); }

  function skipSet(setId) {
    var s = getSet(setId); if (!s) return;
    s.skipped = true; s.completed = false;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }
  function undoSkip(setId) {
    var s = getSet(setId); if (!s) return;
    s.skipped = false;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }


  function markFirstSetWarmup(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var ex = getExerciseDef(exId, sess);
    if (!ex) return;
    var all = sess.sets.filter(function(s){ return s.exId === exId; });
    if (all.some(function(s){ return s.setType === 'warmup'; })) return;
    var working = all.filter(function(s){ return s.setType === 'working'; }).sort(function(a,b){ return (a.setNum||0)-(b.setNum||0); });
    if (!working.length) return;
    var firstNum = working[0].setNum;
    var firstGroup = working.filter(function(s){ return s.setNum === firstNum; });
    firstGroup.forEach(function(s){ s.setType = 'warmup'; s.setNum = 0; s.isWarmupMarked = true; });

    function addReplacement(side) {
      var remaining = sess.sets.filter(function(s){ return s.exId===exId && s.setType==='working' && s.side===(side||null); })
        .sort(function(a,b){ return (a.setNum||0)-(b.setNum||0); });
      remaining.forEach(function(s,idx){ s.setNum = idx+1; });
      var ref = remaining[remaining.length-1] || firstGroup.find(function(s){ return s.side===(side||null); }) || firstGroup[0];
      while (remaining.length < ex.sDef) {
        var ns = createSet(exId, remaining.length+1, 'working', side||null);
        ns.weight = ref ? ref.weight : 0;
        ns.reps = ref ? ref.reps : ex.rMin;
        ns.suggestedWeight = ref ? ref.weight : null;
        ns.suggestedReps = ref ? ref.reps : null;
        ns.isWarmupReplacement = true;
        var dropIdx = sess.sets.findIndex(function(s){ return s.exId===exId && s.setType==='drop'; });
        if (dropIdx >= 0) sess.sets.splice(dropIdx,0,ns); else sess.sets.push(ns);
        remaining.push(ns);
      }
    }
    if (ex.uni) { addReplacement('L'); addReplacement('R'); }
    else addReplacement(null);
    dbSave(db); rerenderExSets(exId);
  }

  function addWorkingSet(exId) {
    if (!db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var exWS = db.activeSession.sets.filter(function(s){ return s.exId===exId&&s.setType==='working'; });
    var nextNum = exWS.length ? Math.max.apply(null,exWS.map(function(s){return s.setNum||1;}))+1 : (ex.sDef+1);
    function mkAdded(side) {
      var ref = exWS.filter(function(s){return s.side===(side||null);});
      ref = ref[ref.length-1] || exWS[exWS.length-1];
      var ns = createSet(exId, nextNum, 'working', side||null);
      ns.weight = ref ? ref.weight : 0; ns.reps = ref ? ref.reps : ex.rMin;
      ns.rir = null; ns.suggestedWeight = ns.weight; ns.suggestedReps = ns.reps; ns.isAdded = true;
      return ns;
    }
    var toAdd = ex.uni ? [mkAdded('L'), mkAdded('R')] : [mkAdded(null)];
    var dropIdx = db.activeSession.sets.findIndex(function(s){return s.exId===exId&&s.setType==='drop';});
    toAdd.forEach(function(ns){ if(dropIdx>=0) db.activeSession.sets.splice(dropIdx++,0,ns); else db.activeSession.sets.push(ns); });
    dbSave(db); rerenderExSets(exId);
  }

  function addWarmupSet(exId) {
    if (!db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var ws = createSet(exId, 0, 'warmup', null);
    ws.weight = 0; ws.reps = ex.rMin; ws.rir = null; ws.isAdded = true;
    var firstIdx = db.activeSession.sets.findIndex(function(s){ return s.exId===exId; });
    if (firstIdx >= 0) db.activeSession.sets.splice(firstIdx, 0, ws);
    else db.activeSession.sets.push(ws);
    dbSave(db); rerenderExSets(exId);
  }

  function addCustomExerciseToDay(dayN) {
    var customId = newCustomExerciseId();
    try {
      var ex = makeCustomExerciseDef({
        id:customId,
        name:document.getElementById('dayCustomName').value,
        target:document.getElementById('dayCustomTarget').value,
        muscleId:document.getElementById('dayCustomMuscle').value,
        sets:document.getElementById('dayCustomSets').value,
        rest:document.getElementById('dayCustomRest').value,
        rMin:document.getElementById('dayCustomMin').value,
        rMax:document.getElementById('dayCustomMax').value,
        uni:document.getElementById('dayCustomUni').checked
      });
      db.settings.customExercises[customId] = ex;
      var ids = getDayExerciseIds(db, dayN);
      ids.push(customId);
      saveDayExerciseIds(db, dayN, ids);
      openDayEditor(dayN);
    } catch(err) {
      alert(err.message || 'Could not create exercise.');
    }
  }

  function openSubstitution(exId) {
    if (!db.activeSession || !SUBSTITUTIONS[exId]) return;
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = '<div>'+renderSubstitutionModal(exId, db.activeSession)+'</div>';
    modal.classList.remove('hidden');
  }

  function applySubstitution(originalId, substituteId) {
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var originalSets = sess.sets.filter(function(set) { return set.exId === originalId; });
    if (originalSets.some(function(set) { return set.completed; })) {
      alert('Change the exercise before logging sets.');
      return;
    }
    var orderIndex = sess.exerciseOrder.indexOf(originalId);
    if (orderIndex < 0 || sess.exerciseOrder.indexOf(substituteId) !== -1) return;
    var substitute = getExerciseDef(substituteId, sess);
    sess.sets = sess.sets.filter(function(set) { return set.exId !== originalId; });
    var replacementSets = createExerciseSetsForSession(substituteId, substitute, db);
    replacementSets.forEach(function(set) { set.substitutedFor = originalId; });
    sess.sets = sess.sets.concat(replacementSets);
    sess.exerciseOrder[orderIndex] = substituteId;
    sess.exercisePrescriptions = sess.exercisePrescriptions || {};
    sess.exercisePrescriptions[substituteId] = substitute;
    delete sess.exercisePrescriptions[originalId];
    sess.substitutions = sess.substitutions || {};
    sess.substitutions[substituteId] = originalId;
    if (sess.exNotes && sess.exNotes[originalId]) sess.exNotes[substituteId] = sess.exNotes[originalId];
    sess.currentExId = substituteId;
    dbSave(db);
    closeAddExercise();
    renderWorkout(db);
  }

  function addExerciseToActiveSession(exId, ex) {
    if (!db.activeSession || !ex) return;
    var sess = db.activeSession;
    normaliseSessionExerciseOrder(sess);
    if (sess.exerciseOrder.indexOf(exId) !== -1) {
      alert('That exercise is already in this workout.');
      return;
    }
    sess.exerciseOrder.push(exId);
    sess.exercisePrescriptions = sess.exercisePrescriptions || {};
    sess.exercisePrescriptions[exId] = ex;
    sess.sets = sess.sets.concat(createExerciseSetsForSession(exId, ex, db));
    sess.currentExId = exId;
    dbSave(db);
    closeAddExercise();
    renderWorkout(db);
    setTimeout(function() {
      var card = document.getElementById('exc-' + exId);
      if (card) scrollExIntoView(card, false);
    }, 100);
  }

  function addExistingExercise() {
    if (!db.activeSession) return;
    var sel = document.getElementById('addExistingExercise');
    var exId = sel ? sel.value : '';
    var ex = getExerciseDef(exId, db.activeSession, db);
    if (!ex) return;
    addExerciseToActiveSession(exId, ex);
  }

  function addCustomExercise() {
    if (!db.activeSession) return;
    var customId = newCustomExerciseId();
    try {
      var ex = makeCustomExerciseDef({
        id: customId,
        name: document.getElementById('customExName').value,
        target: document.getElementById('customExTarget').value,
        muscleId: document.getElementById('customExMuscle').value,
        sets: document.getElementById('customExSets').value,
        rest: document.getElementById('customExRest').value,
        rMin: document.getElementById('customExRMin').value,
        rMax: document.getElementById('customExRMax').value,
        uni: document.getElementById('customExUni').checked
      });
      if (!db.activeSession.customExercises) db.activeSession.customExercises = {};
      db.activeSession.customExercises[customId] = ex;
      addExerciseToActiveSession(customId, ex);
    } catch(err) {
      alert(err.message || 'Could not add exercise.');
    }
  }

  /* ── re-render helpers ── */
  function rerenderSetRow(setId) {
    var s = getSet(setId);
    if (!s) return;
    var ex = getExerciseDef(s.exId, db.activeSession);
    if (!ex) return;
    var lastSess = getLastExSession(db, s.exId);
    var prevSet = lastSess ? (lastSess.sets.find(function(ps){
      return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
    })||null) : null;
    var rowEl = document.getElementById('sr-' + setId);
    if (rowEl) rowEl.outerHTML = renderSetRow(s, prevSet, ex);
  }

  function rerenderExSets(exId) {
    var container = document.getElementById('sets-' + exId);
    if (!container || !db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var exSets = db.activeSession.sets.filter(function(s){ return s.exId===exId; });
    var lastSess = getLastExSession(db, exId);
    container.innerHTML = exSets.map(function(s) {
      var prevSet = lastSess ? (lastSess.sets.find(function(ps){
        return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
      })||null) : null;
      return renderSetRow(s, prevSet, ex);
    }).join('');
  }

  function updateExCardDoneState(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession, exerciseIds = getSessionExerciseIds(sess);
    var workingSets = sess.sets.filter(function(s){ return s.exId===exId&&(s.setType==='working'||s.setType==='drop'); });
    var allDone = workingSets.length>0&&workingSets.every(function(s){ return s.completed||s.skipped; });
    var card = document.getElementById('exc-'+exId);
    if (card && allDone) card.outerHTML = renderExCard(exId, sess, db, 'done');
    var exDone=0;
    exerciseIds.forEach(function(eid){
      var sets=sess.sets.filter(function(s){return s.exId===eid&&(s.setType==='working'||s.setType==='drop')&&!s.skipped;});
      if(sets.length>0&&sets.every(function(s){return s.completed||s.skipped;})) exDone++;
    });
    var hp=document.querySelector('.wo-hprog'); if(hp) hp.textContent=exDone+' / '+exerciseIds.length+' exercises';
  }

  /* ── finish workout ── */
  function finishWorkout() {
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var incompleteSets = sess.sets.filter(function(s){
      var ex = getExerciseDef(s.exId, sess);
      return s.setType==='working' && !s.completed && !s.skipped && !(ex && ex.optional);
    }).length;
    if (incompleteSets > 0) {
      if (!confirm(incompleteSets + ' planned set(s) are not yet logged. Finish anyway?')) return;
    }
    applySessionTimerCap(sess);
    sess.endTime = Date.now();
    sess.durationMs = getSessionElapsedMs(sess, sess.endTime);
    SessionClock.stop();
    sess.finished = true;
    // Detect PRs
    db.completedSessions.push(sess);  // add first so detectPRs can compare
    sess.prs = detectPRs(db, sess);
    db.lastCompletedDay = sess.dayN;
    delete db._nextDayOverride;
    db.activeSession = null;
    dbSave(db);
    // Show summary
    showSummary(sess);
  }

  function showSummary(sess) {
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = renderSummary(sess, db);
    modal.classList.remove('hidden');
  }

  function closeSummary() {
    var modal = document.getElementById('modal-overlay');
    modal.classList.add('hidden');
    document.getElementById('workout-overlay').classList.add('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.body.style.overflow = '';
    showScreen('today');
  }


  /* ── home routine ── */
  function toggleHomeItem(itemId) {
    var log = getHomeLog(db, localDateKey(), true);
    log.items[itemId] = !log.items[itemId];
    log.completed = HOME_ROUTINE.every(function(item){ return !!log.items[item.id]; });
    log.completedAt = log.completed ? Date.now() : null;
    dbSave(db); showScreen('home');
  }
  function completeHomeRoutine() {
    var log = getHomeLog(db, localDateKey(), true);
    HOME_ROUTINE.forEach(function(item){ log.items[item.id] = true; });
    log.completed = true; log.completedAt = Date.now();
    dbSave(db); showScreen('home');
  }
  function resetHomeRoutine() {
    var log = getHomeLog(db, localDateKey(), true);
    log.items = {}; log.completed = false; log.completedAt = null;
    dbSave(db); showScreen('home');
  }

  /* ── volume ── */
  function volNavWeek(dir) {
    if (!db._volumeWeekOffset) db._volumeWeekOffset = 0;
    db._volumeWeekOffset = Math.min(0, db._volumeWeekOffset + dir);
    dbSave(db);
    showScreen('volume');
  }

  function showMuscleDetail(mId) {
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = renderMuscleDetail(mId, db);
    modal.classList.remove('hidden');
  }
  function closeMuscleDetail() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  /* ── history ── */
  function toggleHistItem(sessId) {
    var det = document.getElementById('hd-' + sessId);
    var chev = document.querySelector('#hi-' + sessId + ' .hi-chev');
    if (!det) return;
    det.classList.toggle('hidden');
    if (chev) chev.textContent = det.classList.contains('hidden') ? '›' : '‹';
  }
  function deleteSession(sessId) {
    if (!confirm('Delete this workout session? This cannot be undone.')) return;
    db.completedSessions = db.completedSessions.filter(function(s){ return s.id !== sessId; });
    dbSave(db);
    showScreen('history');
  }

  /* ── export / import ── */
  function doExport() { exportBackup(db); }
  function doImport() { document.getElementById('importFile').click(); }
  function handleImport(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        db = importBackup(e.target.result, db);
        dbSave(db);
        alert('Backup restored.');
        location.reload();
      } catch(err) { alert('Import failed: ' + err.message); }
    };
    reader.readAsText(file);
  }

  /* ── clear data ── */
  function clearWorkoutData() {
    if (!confirm('Clear ALL workout history? This cannot be undone.')) return;
    db.completedSessions = [];
    db.activeSession = null;
    db.lastCompletedDay = null;
    dbSave(db);
    showScreen('today');
  }
  function clearActiveSession() {
    if (!confirm('Clear the current active session only?')) return;
    db.activeSession = null;
    dbSave(db);
    showScreen('today');
  }

  function expandExCard(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession, oldId = sess.currentExId;
    if (oldId && oldId !== exId) {
      var oc = document.getElementById('exc-'+oldId);
      if (oc) {
        var ows=sess.sets.filter(function(s){return s.exId===oldId&&(s.setType==='working'||s.setType==='drop');});
        oc.outerHTML = renderExCard(oldId, sess, db, ows.length>0&&ows.every(function(s){return s.completed||s.skipped;}) ? 'done' : 'future');
      }
    }
    sess.currentExId = exId; dbSave(db);
    var card = document.getElementById('exc-'+exId);
    if (card) card.outerHTML = renderExCard(exId, sess, db, 'current');
    setTimeout(function(){ var nc=document.getElementById('exc-'+exId); if(nc) scrollExIntoView(nc, false); },100);
  }

  function deleteSet(setId) {
    if (!db.activeSession) return;
    var s = getSet(setId); if (!s||!s.isAdded) return;
    if (!confirm('Remove this set?')) return;
    var exId = s.exId;
    db.activeSession.sets = db.activeSession.sets.filter(function(ss){ return ss.id!==setId; });
    dbSave(db); rerenderExSets(exId);
  }

  return {
    showScreen: showScreen,
    setNextDay: setNextDay,
    useRecommendation: useRecommendation,
    startWorkout: startWorkout,
    resumeWorkout: resumeWorkout,
    discardSession: discardSession,
    closeWorkout: closeWorkout,
    applyRushedMode: applyRushedMode,
    finishWorkout: finishWorkout,
    closeSummary: closeSummary,
    completeSet: completeSet,
    undoSet: undoSet,
    editSet: editSet,
    skipSet: skipSet,
    undoSkip: undoSkip,
    adjWeight: adjWeight,
    setWeight: setWeight,
    adjReps: adjReps,
    setReps: setReps,
    setRir: setRir,
    markFirstSetWarmup: markFirstSetWarmup,
    addWorkingSet: addWorkingSet,
    addWarmupSet: addWarmupSet,
    openAddExercise: openAddExercise,
    closeAddExercise: closeAddExercise,
    openDayEditor: openDayEditor,
    closeDayEditor: closeDayEditor,
    changeDayExercise: changeDayExercise,
    removeDayExercise: removeDayExercise,
    addDayExercise: addDayExercise,
    addCustomExerciseToDay: addCustomExerciseToDay,
    openSubstitution: openSubstitution,
    applySubstitution: applySubstitution,
    addExistingExercise: addExistingExercise,
    addCustomExercise: addCustomExercise,
    saveExNote: saveExNote,
    expandExCard: expandExCard,
    deleteSet: deleteSet,
    volNavWeek: volNavWeek,
    showMuscleDetail: showMuscleDetail,
    closeMuscleDetail: closeMuscleDetail,
    toggleHistItem: toggleHistItem,
    deleteSession: deleteSession,
    doExport: doExport,
    doImport: doImport,
    handleImport: handleImport,
    clearWorkoutData: clearWorkoutData,
    clearActiveSession: clearActiveSession,
    toggleHomeItem: toggleHomeItem,
    completeHomeRoutine: completeHomeRoutine,
    resetHomeRoutine: resetHomeRoutine,
  };
})();

// ============================================================
// INIT
// ============================================================
function initApp() {
  db = dbLoad();

  // Close modal overlay on backdrop click
  var modal = document.getElementById('modal-overlay');
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.classList.add('hidden');
    });
  }

  // Bottom nav
  document.querySelectorAll('.nav-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      App.showScreen(btn.dataset.screen);
    });
  });

  // Import file input
  var imp = document.getElementById('importFile');
  if (imp) imp.addEventListener('change', function(e) { App.handleImport(e.target.files[0]); });

  // Restore timer if running
  Timer.restore();

  // Show today by default
  App.showScreen('today');
}

document.addEventListener('DOMContentLoaded', initApp);

</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
