<style>
/* ============================================================
   Adil Aesthetic App — Complete CSS
   ============================================================ */
:root {
  --bg:         oklch(0.100 0.015 255);
  --bg-soft:    oklch(0.135 0.016 255);
  --card:       oklch(0.158 0.018 255);
  --card-hi:    oklch(0.192 0.022 255);
  --line:       oklch(0.280 0.025 255);
  --line-soft:  oklch(0.220 0.020 255);
  --text:       oklch(0.960 0.004 220);
  --muted:      oklch(0.680 0.014 230);
  --faint:      oklch(0.500 0.012 225);
  --accent:     oklch(0.720 0.180 240);
  --accent-dk:  oklch(0.620 0.165 240);
  --accent-bg:  oklch(0.720 0.180 240 / 0.12);
  --accent-ln:  oklch(0.720 0.180 240 / 0.30);
  --steel:      oklch(0.740 0.055 235);
  --steel-bg:   oklch(0.740 0.055 235 / 0.10);
  --danger:     oklch(0.720 0.148 30);
  --danger-bg:  oklch(0.720 0.148 30 / 0.10);
  --danger-ln:  oklch(0.720 0.148 30 / 0.30);
  --ok:         oklch(0.778 0.132 148);
  --ok-bg:      oklch(0.778 0.132 148 / 0.10);
  --warn:       oklch(0.798 0.128 90);
  --warn-bg:    oklch(0.798 0.128 90 / 0.10);
  --radius:     16px;
  --radius-sm:  11px;
  --nav-h:      60px;
  --mono: ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
input,button,textarea,select { font-family:inherit; font-size:inherit; }
ul,ol { list-style:none; }
a { color:inherit; text-decoration:none; }
p { margin:0; }

/* ============================================================
   SCREENS
   ============================================================ */
#app { min-height:100vh; }
.screen { display:none; min-height:100vh; padding:16px 16px 24px; max-width:600px; margin:0 auto; }
.screen.active { display:block; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; align-items:stretch;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:oklch(0.112 0.016 255 / 0.94);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-top:1px solid var(--line-soft);
}
#bottom-nav.hidden { display:none; }
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--faint);
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  cursor:pointer; padding:8px 4px; min-height:44px; transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-tab svg { width:22px; height:22px; }
.nav-tab--on { color:var(--accent); }
.nav-tab--on svg path { stroke:var(--accent); }

/* ============================================================
   SHARED BUTTONS
   ============================================================ */
.btn-primary {
  display:block; width:100%; padding:14px; border-radius:var(--radius);
  background:var(--accent); color:oklch(0.98 0.004 220);
  font-weight:750; font-size:16px; border:none; cursor:pointer;
  min-height:50px; transition:.12s; -webkit-tap-highlight-color:transparent;
}
.btn-primary:active { opacity:.85; }
.btn-primary:disabled { opacity:.4; cursor:default; }
.btn-primary.btn-xl { font-size:18px; padding:17px; min-height:56px; }
.btn-primary.btn-lg { font-size:16px; padding:14px; }
.btn-ghost {
  display:inline-flex; align-items:center; justify-content:center;
  padding:9px 15px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  font-size:13.5px; font-weight:600; cursor:pointer; min-height:38px;
  transition:.12s; -webkit-tap-highlight-color:transparent;
}
.btn-ghost:active { background:var(--card-hi); }
.btn-ghost.btn-sm { padding:7px 13px; font-size:13px; min-height:34px; }
.btn-ghost.btn-xs { padding:5px 10px; font-size:12px; min-height:30px; }
.btn-ghost.btn-danger { border-color:var(--danger-ln); color:var(--danger); }
.btn-nav {
  background:none; border:none; color:var(--accent); font-size:15px;
  font-weight:600; padding:8px 12px; cursor:pointer; min-height:44px;
}
.btn-nav:disabled { color:var(--faint); cursor:default; }
.btn-finish {
  background:var(--accent-bg); border:1px solid var(--accent-ln);
  color:var(--accent); font-weight:700; font-size:14px;
  padding:9px 16px; border-radius:999px; cursor:pointer; min-height:40px;
  transition:.12s;
}
.btn-finish:active { background:var(--accent-bg); }
.btn-complete {
  display:block; width:100%; padding:15px; border-radius:var(--radius-sm);
  background:var(--accent); color:oklch(0.98 0.004 220);
  font-weight:750; font-size:17px; border:none; cursor:pointer;
  min-height:52px; margin-top:12px; transition:.12s;
  -webkit-tap-highlight-color:transparent;
}
.btn-complete:active { opacity:.85; }
.hidden { display:none !important; }

/* ============================================================
   TODAY SCREEN
   ============================================================ */
.today-wrap { padding-top:12px; }
.resume-banner {
  background:var(--accent-bg); border:1.5px solid var(--accent-ln);
  border-radius:var(--radius); padding:18px; margin-bottom:16px;
}
.rb-title { font-size:13px; font-family:var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px; }
.rb-sub { font-size:15px; color:var(--muted); margin-bottom:14px; }
.rb-actions { display:flex; flex-direction:column; gap:8px; }
.today-day-card {
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px; margin-bottom:14px;
}
.rec-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.rec-confidence { flex:none; padding:4px 8px; border:1px solid var(--accent-ln); border-radius:999px; background:var(--accent-bg); color:var(--accent); font-size:11px; font-weight:700; }
.rec-manual { color:var(--warn); border-color:oklch(0.80 0.13 90 / .3); background:var(--warn-bg); }
.rec-why-title { margin:18px 0 8px; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
.rec-reasons { display:grid; gap:8px; margin-bottom:20px; }
.rec-reason { position:relative; padding-left:14px; color:var(--muted); font-size:14px; line-height:1.4; }
.rec-reason::before { content:''; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
.rec-details { margin-bottom:14px; border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--card); overflow:hidden; }
.rec-details summary { list-style:none; cursor:pointer; padding:13px 15px; color:var(--muted); font-size:14px; font-weight:700; }
.rec-details summary::-webkit-details-marker { display:none; }
.rec-detail-body { padding:0 15px 14px; }
.rec-muscle-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:8px 0; border-top:1px solid var(--line-soft); }
.rec-muscle-name { font-size:13px; font-weight:700; }
.rec-muscle-meta { text-align:right; color:var(--muted); font-size:12px; }
.rec-note { margin-top:10px; color:var(--faint); font-size:12px; line-height:1.4; }
.rec-use { display:block; margin:10px auto 0; background:none; border:none; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }
.tdc-kicker { font-family:var(--mono); font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
.tdc-day { font-family:var(--mono); font-size:42px; font-weight:800;
  color:var(--accent); line-height:1; margin-bottom:8px; }
.tdc-title { font-size:22px; font-weight:750; letter-spacing:-.015em;
  line-height:1.1; margin-bottom:10px; text-wrap:balance; }
.tdc-muscles { font-size:14px; color:var(--muted); margin-bottom:14px; }
.tdc-meta { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.tdc-meta span { font-size:13.5px; color:var(--faint); font-family:var(--mono); }
.today-picker {
  border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden;
  background:var(--card);
}
.tp-sum {
  list-style:none; cursor:pointer; padding:14px 16px; font-size:14.5px;
  font-weight:600; color:var(--muted); user-select:none;
}
.tp-sum::-webkit-details-marker { display:none; }
.tp-body { padding:0 8px 8px; }
.day-pick-row {
  display:flex; align-items:center; gap:12px; padding:11px 10px;
  border-radius:10px; cursor:pointer; transition:.12s;
  border:1px solid transparent;
}
.day-pick-row:hover { background:var(--bg-soft); }
.day-pick-row.is-next { border-color:var(--accent-ln); background:var(--accent-bg); }
.day-pick-row input[type="radio"] { width:18px; height:18px; accent-color:var(--accent); flex:none; }
.dp-no { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); flex:none; width:44px; }
.dp-title { flex:1; font-size:14px; font-weight:550; }
.dp-dur { font-size:12px; color:var(--faint); font-family:var(--mono); }

/* ============================================================
   WORKOUT OVERLAY
   ============================================================ */
#workout-overlay {
  position:fixed; inset:0; z-index:100; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
}
#workout-overlay.hidden { display:none; }
.wo-header {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:oklch(0.100 0.015 255 / 0.96);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line-soft);
  flex:none;
}
.wo-back { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; min-width:36px; min-height:36px; padding:4px; }
.wo-hinfo { flex:1; min-width:0; }
.wo-htitle { font-size:13px; font-weight:650; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wo-hprog { font-size:12px; color:var(--muted); font-family:var(--mono); }
.wo-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 80px; }
.rushed-control { display:flex; justify-content:flex-end; padding:10px 0 0; }
.btn-rushed { border-color:var(--warn); color:var(--warn); background:var(--warn-bg); }
.rushed-banner { margin:10px 0 2px; padding:10px 12px; border:1px solid oklch(0.798 0.128 90 / .3); border-radius:var(--radius-sm); background:var(--warn-bg); color:var(--warn); font-size:13px; line-height:1.4; }
.rushed-tag { display:inline-flex; margin-top:7px; padding:3px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; }

/* prev bar */
.prev-bar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:8px 0 10px; border-bottom:1px solid var(--line-soft);
}
.prev-date { font-size:11.5px; color:var(--faint); font-family:var(--mono); flex:none; }
.prev-item { font-size:12px; color:var(--muted); font-family:var(--mono); background:var(--bg-soft); padding:2px 7px; border-radius:6px; }
.prev-bar--none { font-size:12.5px; color:var(--faint); font-style:italic; padding:8px 0 10px; border-bottom:1px solid var(--line-soft); }

/* exercise card */
.ex-card {
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--card); margin:12px 0; overflow:hidden;
  transition:border-color .2s;
}
.ex-card--done { border-color:var(--accent-ln); }
.exc-head { padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
.exc-meta { margin-bottom:8px; }
.exc-name { display:block; font-size:18px; font-weight:750; letter-spacing:-.01em; line-height:1.2; margin-bottom:3px; }
.exc-target { font-size:13px; color:var(--accent); font-weight:600; }
.exc-badges { display:flex; flex-wrap:wrap; gap:6px; }
.xb { font-size:12px; font-family:var(--mono); font-weight:600; color:var(--faint);
  background:var(--bg-soft); border:1px solid var(--line-soft); border-radius:6px; padding:3px 8px; }

/* set rows */
.set-rows { padding:0 14px; }
.set-row { margin:10px 0; padding:12px; background:var(--bg-soft); border-radius:var(--radius-sm); border:1px solid var(--line-soft); }
.set-row--done { background:var(--ok-bg); border-color:oklch(0.78 0.13 150 / 0.3); }
.set-row--skipped { background:var(--bg); border-color:var(--line-soft); opacity:.6; }
.set-row--active {}
.sr-label { font-size:13.5px; font-weight:700; font-family:var(--mono); color:var(--text); }
.sr-check { color:var(--ok); margin-left:4px; }
.sr-skip-badge { font-size:11px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:2px 7px; color:var(--faint); margin-left:8px; }
.sr-label-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.sr-prev { font-size:12.5px; color:var(--muted); font-family:var(--mono); margin-bottom:10px; }
.sr-prev--none { color:var(--faint); font-style:italic; }
.sr-done-label { font-size:13.5px; font-weight:700; font-family:var(--mono); margin-bottom:4px; }
.sr-done-vals { font-size:16px; font-weight:650; color:var(--text); margin-bottom:8px; }
.sr-rir { font-size:13px; color:var(--muted); }
.sr-done-actions { display:flex; gap:8px; }
.sr-skip-btn { color:var(--faint); }

/* set inputs */
.sr-inputs { display:flex; flex-direction:column; gap:12px; }
.sri-group { display:flex; flex-direction:column; gap:6px; }
.sri-label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; font-family:var(--mono); }
.sri-unit { font-size:10px; color:var(--faint); }
.sri-ctrl { display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.sri-adj {
  flex:none; width:54px; min-height:50px; background:var(--bg-soft);
  border:none; border-right:1px solid var(--line); color:var(--text);
  font-size:22px; font-weight:300; cursor:pointer; display:grid; place-items:center;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.sri-adj:last-child { border-right:none; border-left:1px solid var(--line); }
.sri-adj:active { background:var(--card-hi); }
.sri-inp {
  flex:1; min-height:50px; background:transparent; border:none;
  text-align:center; font-size:22px; font-weight:700; color:var(--text);
  outline:none; padding:0;
}
.sri-inp:focus { background:oklch(0.81 0.125 74 / 0.07); }

/* RIR row */
.rir-row { display:flex; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.rir-btn {
  flex:1; min-height:50px; background:var(--bg-soft); border:none;
  border-right:1px solid var(--line); color:var(--muted);
  font-size:16px; font-weight:700; cursor:pointer;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.rir-btn:last-child { border-right:none; }
.rir-btn--on { background:var(--accent-bg); color:var(--accent); }
.rir-btn:active { background:var(--card-hi); }

/* set add row */
.set-add-row { display:flex; gap:8px; padding:8px 14px 10px; }
.workout-add-ex { display:flex; justify-content:center; padding:18px 0 4px; }
.btn-add-ex { width:100%; max-width:260px; }

/* exercise note */
.ex-note-input {
  display:block; width:100%; background:transparent; border:none;
  border-top:1px solid var(--line-soft); padding:10px 14px; resize:none;
  color:var(--muted); font-size:14px; outline:none;
  min-height:40px;
}
.ex-note-input::placeholder { color:var(--faint); }

/* collapsibles in workout */
.ex-coll-row { border-top:1px solid var(--line-soft); padding:0 14px 2px; }
.ex-coll { border-bottom:1px solid var(--line-soft); }
.ex-coll:last-child { border-bottom:none; }
.ec-sum { list-style:none; padding:11px 0; font-size:13.5px; font-weight:650; color:var(--muted); cursor:pointer; }
.ec-sum::-webkit-details-marker { display:none; }
.ec-body { padding:0 0 12px; }
.coll-list { display:grid; gap:7px; }
.coll-list li { font-size:14px; color:var(--text); position:relative; padding-left:16px; }
.coll-list li::before { content:'·'; position:absolute; left:2px; color:var(--accent); font-weight:700; }
.coll-mist li::before { content:'⚠'; font-size:10px; top:2px; color:var(--danger); }
.coll-tnf, .coll-cbum { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:8px; }
.coll-tnf b, .coll-cbum b { color:var(--accent); margin-right:5px; }
.coll-cbum b { color:var(--steel); }
.coll-hard { margin-top:8px; padding:10px 12px; background:var(--danger-bg); border-left:3px solid var(--danger); border-radius:0 8px 8px 0; font-size:13.5px; font-weight:600; }
.stall-box { margin-top:10px; padding:10px 12px; background:var(--warn-bg); border:1px solid oklch(0.80 0.13 90 / 0.28); border-radius:var(--radius-sm); color:var(--muted); font-size:13px; line-height:1.4; }
.stall-box b { display:block; color:var(--warn); font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }

/* finish section */
.wo-finish-section { padding:24px 0 40px; text-align:center; }
.wo-stats { font-size:13px; color:var(--faint); font-family:var(--mono); margin-bottom:14px; }

/* ============================================================
   TIMER PILL
   ============================================================ */
#timer-pill {
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:10px 16px; min-height:50px;
  background:oklch(0.135 0.016 255 / 0.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
}
#timer-pill.hidden { display:none !important; }
.tp-label { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.tp-time { font-size:28px; font-weight:800; color:var(--text); letter-spacing:-.02em; min-width:70px; text-align:center; }
.tp-urgent { color:var(--accent); }
.tp-adj { background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:13px; font-weight:700; padding:6px 10px; min-height:36px; cursor:pointer; }
.tp-skip { background:none; border:none; color:var(--faint); font-size:13px; font-weight:650; cursor:pointer; padding:6px 8px; min-height:36px; }

/* ============================================================
   MODAL OVERLAY
   ============================================================ */
#modal-overlay {
  position:fixed; inset:0; z-index:150; display:flex; align-items:flex-end;
  background:oklch(0 0 0 / 0.6); backdrop-filter:blur(4px);
  padding:0 0 env(safe-area-inset-bottom,0px);
}
#modal-overlay.hidden { display:none !important; }
#modal-overlay > div {
  width:100%; max-height:90vh; overflow-y:auto;
  background:var(--bg-soft); border-radius:24px 24px 0 0;
  padding:20px 18px 32px;
}
.addex-wrap { display:grid; gap:16px; }
.addex-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.addex-title { font-size:20px; font-weight:750; letter-spacing:-.015em; }

/* summary */

/* ============================================================
   VOLUME SCREEN
   ============================================================ */

.vol-rows { display:grid; gap:10px; }
.vol-row { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 14px; cursor:pointer; transition:.12s; }

.vr-top { display:flex; align-items:baseline; gap:8px; margin-bottom:7px; }
.vr-name { flex:1; font-size:16px; font-weight:650; }
.vr-done { font-family:var(--mono); font-size:18px; font-weight:800; color:var(--accent); }
.vr-status { font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 9px; flex:none; }
.vs-none  { background:var(--bg-soft); color:var(--faint); }
.vs-low   { background:var(--danger-bg); color:var(--danger); }

.vd-dn  { color:var(--danger); }
.vd-flat { color:var(--faint); }
.vol-empty { padding:40px 0; text-align:center; color:var(--faint); font-size:15px; }

/* muscle detail */
.md-wrap { max-height:88vh; }
.md-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.md-title { font-size:22px; font-weight:750; }

.md-section { margin-top:8px; }

.md-ex-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:15px; }
.md-ex-name { color:var(--muted); }
.md-ex-v { font-family:var(--mono); font-weight:650; }
.md-none { color:var(--faint); font-size:14px; padding:8px 0; }

/* ============================================================
   HISTORY SCREEN
   ============================================================ */
.hist-wrap { display:grid; gap:8px; }
.hist-empty { padding:60px 16px; text-align:center; }
.he-icon { font-size:32px; color:var(--faint); margin-bottom:12px; }

.hi-detail { padding:14px 16px; border-top:1px solid var(--line-soft); }
.hi-actions { margin-top:12px; }
.sess-detail {}
.sd-prs { margin-bottom:10px; }
.sd-pr { font-size:13px; color:var(--accent); padding:4px 0; }
.sd-ex { margin-bottom:12px; }
.sd-ex-name { font-size:14px; font-weight:700; margin-bottom:6px; color:var(--text); }
.sd-set { display:flex; gap:10px; padding:4px 0; font-size:13.5px; border-bottom:1px solid var(--line-soft); }
.sd-sl { font-family:var(--mono); font-size:12px; color:var(--faint); flex:none; width:52px; }
.sd-sv { color:var(--muted); }

/* ============================================================
   PROGRAM SCREEN
   ============================================================ */
.prog-wrap { padding-bottom:40px; }
.prog-hero { padding:24px 0 18px; border-bottom:1px solid var(--line-soft); margin-bottom:16px; }
.prog-kicker { font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.prog-title { font-size:clamp(24px,6vw,34px); font-weight:800; letter-spacing:-.02em; line-height:1.05;
  background:linear-gradient(160deg, var(--text) 40%, var(--accent) 160%);
  -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px; }
.prog-sub { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.prog-goal { font-size:16px; color:var(--muted); line-height:1.5; }
.prog-section { border:1px solid var(--line-soft); border-radius:var(--radius-sm); background:var(--card); margin-bottom:10px; overflow:hidden; }
.ps-sum { list-style:none; cursor:pointer; padding:14px 15px; font-weight:700; font-size:15px; }
.ps-sum::-webkit-details-marker { display:none; }
.ps-body { padding:0 15px 14px; }
.prog-rules { display:grid; gap:9px; }
.prog-rules li { font-size:14.5px; color:var(--muted); padding-left:16px; position:relative; }
.prog-rules li::before { content:''; position:absolute; left:2px; top:8px; width:6px; height:6px; border-radius:2px; background:var(--accent); }
.prog-day { border:1px solid var(--line); border-radius:var(--radius); background:var(--card); margin-bottom:12px; overflow:hidden; }
.pd-sum { list-style:none; cursor:pointer; padding:16px; display:flex; align-items:center; gap:12px; }
.pd-sum::-webkit-details-marker { display:none; }
.pd-num { font-family:var(--mono); font-size:11px; font-weight:800; color:var(--accent); background:var(--accent-bg); border:1px solid var(--accent-ln); border-radius:6px; padding:4px 9px; flex:none; }
.pd-title { flex:1; font-size:15.5px; font-weight:700; }
.pd-chev { flex:none; width:9px; height:9px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint); transform:rotate(45deg); transition:.2s; }
.prog-day[open] .pd-chev { transform:rotate(-135deg); }
.pd-body { padding:0 14px 16px; border-top:1px solid var(--line-soft); }
.pd-goal { font-size:14px; color:var(--muted); margin:12px 0; }
.pd-edit-row { display:flex; justify-content:flex-end; margin:10px 0; }
.dayedit-list { display:grid; gap:8px; }
.dayedit-row { display:grid; grid-template-columns:28px minmax(0,1fr) 38px; align-items:center; gap:8px; }
.dayedit-no { color:var(--faint); font-family:var(--mono); font-size:12px; text-align:center; }
.dayedit-remove { min-width:38px; min-height:44px; border:1px solid var(--danger-ln); border-radius:var(--radius-sm); background:transparent; color:var(--danger); cursor:pointer; }
.dayedit-add { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
.app-version { color:var(--faint); font-family:var(--mono); font-size:11px; margin-top:10px; }
/* exercise card in program */
.prog-ex { border:1px solid var(--line-soft); border-radius:var(--radius-sm); margin:10px 0; padding:14px; background:var(--bg-soft); }
.pe-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.pe-no { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-bg); border:1px solid var(--accent-ln); border-radius:7px; padding:4px 8px; flex:none; }
.pe-name { font-size:17px; font-weight:700; }
.pe-badges { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
.pe-badge { display:flex; flex-direction:column; gap:2px; background:var(--card); border:1px solid var(--line-soft); border-radius:9px; padding:6px 10px; }
.pb-l { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); font-weight:700; }
.pb-v { font-size:13.5px; font-weight:650; }
.pe-badge--target { background:var(--accent-bg); border-color:var(--accent-ln); flex:1; }
.pe-badge--target .pb-l { color:var(--accent); }
.pe-badge--target .pb-v { color:var(--accent); }
.pe-callout { border-radius:10px; padding:11px 13px; border:1px solid var(--line-soft); margin-bottom:8px; }
.pe-callout b { display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-bottom:5px; }
.pe-callout ul { display:grid; gap:6px; }
.pe-callout li { font-size:14px; color:var(--text); padding-left:14px; position:relative; }
.pe-callout li::before { content:'·'; position:absolute; left:2px; color:var(--muted); }
.pe-drop { background:var(--accent-bg); border-color:var(--accent-ln); }
.pe-drop b { color:var(--accent); }
.pe-info { background:var(--steel-bg); border-color:oklch(0.74 0.055 235 / 0.3); }
.pe-info b { color:var(--steel); }
.pe-opt { background:var(--bg-soft); }
.pe-opt b { color:var(--muted); }
.pe-coll { border:1px solid var(--line-soft); border-radius:9px; overflow:hidden; margin-top:6px; }
.pec-sum { list-style:none; cursor:pointer; padding:11px 13px; font-size:14px; font-weight:650; color:var(--muted); display:flex; align-items:center; gap:8px; }
.pec-sum::-webkit-details-marker { display:none; }
.pcc { font-size:10px; background:var(--card); border:1px solid var(--line-soft); border-radius:999px; padding:2px 7px; color:var(--faint); font-family:var(--mono); }
.pec-body { padding:10px 13px 13px; }
.pe-list { display:grid; gap:8px; }
.pe-list li { font-size:14px; color:var(--text); padding-left:16px; position:relative; line-height:1.4; }
.pe-list li::before { content:''; position:absolute; left:2px; top:8px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.pe-mist li::before { background:var(--danger); }
.pe-tnf, .pe-cbum { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:10px; padding:10px 12px; border-radius:8px; }
.pe-tnf { background:var(--accent-bg); } .pe-tnf b { color:var(--accent); margin-right:5px; }
.pe-cbum { background:var(--steel-bg); } .pe-cbum b { color:var(--steel); margin-right:5px; }
.pe-hard { margin-top:10px; padding:11px 14px; background:var(--danger-bg); border-left:3px solid var(--danger); border-radius:0 10px 10px 0; font-size:14px; font-weight:600; display:flex; gap:10px; }
.pe-hard-l { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--danger); font-weight:800; flex:none; padding-top:2px; }
.prog-cl { margin-top:18px; border:1px solid var(--accent-ln); border-radius:var(--radius); background:var(--accent-bg); padding:14px; }
.pcl-title { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.prog-cl ul { display:grid; gap:7px; }
.prog-cl li { font-size:14px; color:var(--muted); padding-left:16px; position:relative; }
.prog-cl li::before { content:''; position:absolute; left:2px; top:9px; width:6px; height:6px; border-radius:2px; background:var(--accent-ln); }

@media(max-width:400px) {
  .sri-adj { width:46px; }
  .sri-inp { font-size:20px; }
}

/* ============================================================
   SETTINGS / DATA SECTION
   ============================================================ */
.settings-section {
  margin-top:24px; border-top:1px solid var(--line-soft); padding-top:18px;
  display:grid; gap:8px;
}
.settings-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); margin-bottom:4px; }
.settings-row { display:flex; gap:8px; flex-wrap:wrap; }


.screen-title { font-size:22px; font-weight:800; letter-spacing:-.015em; padding:14px 0 16px; color:var(--text); }
.hist-screen-wrap {}
.data-mgmt { border:1px solid var(--line-soft); border-radius:var(--radius-sm); overflow:hidden; margin-top:20px; background:var(--card); }
.dm-sum { list-style:none; cursor:pointer; padding:13px 15px; font-size:14px; font-weight:650; color:var(--muted); }
.dm-sum::-webkit-details-marker { display:none; }
.dm-body { padding:12px 14px 14px; border-top:1px solid var(--line-soft); }
.dm-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.dm-row:last-child { margin-bottom:0; }
.dm-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); margin-bottom:10px; }


/* ── v3 compact workout UI ── */
/* Collapsed exercise cards */
.exc-compact { display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.exc-compact--done { }
.exc-compact--future { }
.ex-card--future { opacity:.72; }
.ex-card--current { border-color:var(--accent-ln); }
.exc-compact-check { flex:none; width:26px; height:26px; border-radius:7px; background:var(--ok-bg); color:var(--ok); display:grid; place-items:center; font-size:14px; font-weight:800; }
.exc-compact-num { flex:none; font-family:var(--mono); font-size:12px; font-weight:800; color:var(--faint); width:26px; text-align:center; }
.exc-compact-info { flex:1; min-width:0; }
.exc-compact-name { display:block; font-size:15px; font-weight:650; }
.exc-compact-sub { display:block; font-size:12px; color:var(--muted); font-family:var(--mono); margin-top:1px; }
.exc-expand-hint { flex:none; font-size:12px; color:var(--faint); }

/* Compact active set row */
.set-row { margin:8px 0; border-radius:var(--radius-sm); border:1px solid var(--line-soft); overflow:hidden; }
.set-row--active { background:var(--bg-soft); padding:10px 12px; }
.sr-top { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
.sr-label { font-family:var(--mono); font-size:12.5px; font-weight:800; color:var(--text); flex:none; }
.sr-prev-line { font-size:12px; color:var(--muted); font-family:var(--mono); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-target-line { font-size:12px; color:var(--accent); font-family:var(--mono); font-weight:700; flex:none; }
.sr-skip-lnk { background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; padding:2px 4px; flex:none; min-height:28px; }
.sr-del { background:none; border:none; color:var(--danger); font-size:17px; cursor:pointer; padding:0 4px; flex:none; line-height:1; min-height:28px; }

/* Compact input row */
.sr-compact-row { display:flex; align-items:center; gap:6px; }
.sri-ctrl { display:flex; align-items:center; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.sri-w { flex:1.25; position:relative; }
.sri-r { flex:1; }
.sri-adj { flex:none; width:38px; min-height:50px; background:var(--bg-soft); border:none; border-right:1px solid var(--line); color:var(--text); font-size:20px; font-weight:300; cursor:pointer; display:grid; place-items:center; -webkit-tap-highlight-color:transparent; transition:.1s; }
.sri-adj:last-of-type { border-right:none; border-left:1px solid var(--line); }
.sri-adj:active { background:var(--card-hi); }
.sri-inp { flex:1; min-height:50px; min-width:0; background:transparent; border:none; text-align:center; font-size:18px; font-weight:700; color:var(--text); outline:none; padding:0 2px; }
.sri-kg { position:absolute; right:42px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--faint); font-family:var(--mono); pointer-events:none; }
.sr-tick { flex:none; width:56px; min-height:56px; background:var(--accent); border:none; border-radius:var(--radius-sm); color:oklch(0.98 0.004 220); font-size:26px; font-weight:800; cursor:pointer; display:grid; place-items:center; -webkit-tap-highlight-color:transparent; transition:.1s; }
.sr-tick:active { opacity:.82; }

/* Compact completed & skipped rows */
.set-row--done { background:var(--ok-bg); border-color:oklch(0.78 0.13 150/0.28); display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; }
.set-row--done .sr-done-label { font-family:var(--mono); font-size:12.5px; color:var(--muted); flex:none; min-width:52px; }
.set-row--done .sr-done-vals { flex:1; font-size:15px; font-weight:650; }
.set-row--done .sr-check { flex:none; color:var(--ok); font-size:16px; }
.set-row--skipped { display:flex; align-items:center; gap:10px; padding:9px 12px; opacity:.6; }
.set-row--skipped .sr-done-label { font-family:var(--mono); font-size:12px; color:var(--faint); flex:none; min-width:52px; }
.sr-skip-badge { font-size:11.5px; color:var(--faint); flex:1; }

@media(max-width:360px){
  .sri-adj { width:34px; }
  .sr-tick { width:50px; }

function applySessionTimerCap(session, now) {
  if (!session || !session.startTime) return false;
  var current = now || Date.now();
  var capAt = session.startTime + THREE_HOURS_MS;
  if (current >= capAt && !session.sessionTimerStoppedAt) {
    session.sessionTimerStoppedAt = capAt;
    session.timerStopReason = 'automatic_3_hour_cap';
    return true;
  }
  return false;
}
function getSessionElapsedMs(session, now) {
  if (!session || !session.startTime) return 0;
  applySessionTimerCap(session, now);

  var copy = Object.assign({}, EX[baseId], overrides || {});
  copy.id = id;
  copy.name = name;
  copy.cues = (overrides && overrides.cues) || EX[baseId].cues.slice();

  copy.muscles = Object.assign({}, (overrides && overrides.muscles) || EX[baseId].muscles);
  return copy;
}

}

  var canonical = getExerciseDef(exId, null, dbRef);
  var override = DAY_EXERCISE_PRESCRIPTIONS[dayN] && DAY_EXERCISE_PRESCRIPTIONS[dayN][exId];
  if (!override) return canonical;
  var prescribed = Object.assign({}, canonical, override);
  if (override.drop === false) {
    delete prescribed.dropMuscles;
    delete prescribed.special;
  }
  return prescribed;
}

function applyRushedModeToSession(session) {
  if (!session || session.rushedModeApplied) return 0;
  var limits = RUSHED_MODE_LIMITS[session.dayN] || {};
  var reduced = 0;
  session.rushedReductions = session.rushedReductions || {};

  Object.keys(limits).forEach(function(plannedId) {
    var actualId = session.exerciseOrder.indexOf(plannedId) !== -1 ? plannedId : null;
    if (!actualId && session.substitutions) {
      Object.keys(session.substitutions).some(function(candidateId) {
        if (session.substitutions[candidateId] === plannedId) { actualId = candidateId; return true; }
        return false;
      });
    }
    if (!actualId) return;
    var ex = getExerciseDef(actualId, session);
    var groups = ex.uni ? ['L','R'] : ['all'];
    groups.forEach(function(group) {
      var sets = session.sets.filter(function(set) {
        return set.exId === actualId && set.setType === 'working' && (group === 'all' || set.side === group);
      }).sort(function(a,b) { return (a.setNum||0)-(b.setNum||0); });
      var completedCount = sets.filter(function(set) { return set.completed; }).length;
      var keepRemaining = Math.max(0, limits[plannedId] - completedCount);
      var candidates = sets.filter(function(set) { return !set.completed && !set.skipped; });
      candidates.slice(keepRemaining).forEach(function(set) {
        set.skipped = true;
        set.rushedMode = true;
        set.skipReason = 'Rushed Mode';
        reduced++;
        session.rushedReductions[actualId] = (session.rushedReductions[actualId] || 0) + 1;
      });
    });
  });
  session.rushedModeApplied = true;
  return reduced;
}

var DB_KEY = 'adil_v2';

function dbLoad() {
  try {
    var raw = localStorage.getItem(DB_KEY);
    if (!raw) return dbDefault();
    var d = JSON.parse(raw);
    if (!d.schemaVersion || d.schemaVersion < 2) d = dbMigrateV1(d);
    d = migrateDb(d);
    localStorage.setItem(DB_KEY, JSON.stringify(d));
    return d;
  } catch(e) { return dbDefault(); }
}

function dbDefault() {
  return {
    schemaVersion: 2,
    settings: { muscleMappings: null, volumeTargets: null, dayExercises: {}, customExercises: {}, programVersion: PROGRAM_NAME },
    lastCompletedDay: null,
    activeSession: null,
    completedSessions: [],
    homeRoutineLogs: [],
    legacyData: null,
  };
}

function dbSave(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
}

function migrateDb(data) {
  var d = data || dbDefault();
  d.schemaVersion = 2;
  d.settings = d.settings || {};
  if (!d.settings.dayExercises) d.settings.dayExercises = {};
  if (!d.settings.customExercises) d.settings.customExercises = {};
  if (d.settings.programVersion !== PROGRAM_NAME) {
    d.settings.dayExercises = {};
    d.settings.programVersion = PROGRAM_NAME;
  }
  if (d.settings.muscleMappings === undefined) d.settings.muscleMappings = null;
  if (d.settings.volumeTargets === undefined) d.settings.volumeTargets = null;
  if (!Array.isArray(d.completedSessions)) d.completedSessions = [];
  if (!Array.isArray(d.homeRoutineLogs)) d.homeRoutineLogs = [];

  function migrateSession(session) {
    if (!session) return;
    if (!session.customExercises) session.customExercises = {};
    if (!session.exercisePrescriptions) session.exercisePrescriptions = {};
    if (!session.exNotes) session.exNotes = {};
    if (!session.rushedReductions) session.rushedReductions = {};
    if (session.rushedModeApplied === undefined) session.rushedModeApplied = false;
    if (!Array.isArray(session.sets)) session.sets = [];
    if (session.sessionTimerStoppedAt === undefined) session.sessionTimerStoppedAt = null;
    if (session.timerStopReason === undefined) session.timerStopReason = null;
    applySessionTimerCap(session);
    if (!Array.isArray(session.exerciseOrder) || !session.exerciseOrder.length) {
      session.exerciseOrder = [];
      session.sets.forEach(function(set) {
        if (session.exerciseOrder.indexOf(set.exId) === -1) session.exerciseOrder.push(set.exId);
      });
      if (!session.exerciseOrder.length && DAYS[session.dayN]) session.exerciseOrder = DAYS[session.dayN].exercises.slice();
    }
  }

  d.completedSessions.forEach(migrateSession);
  migrateSession(d.activeSession);
  d.migrations = d.migrations || {};
  if (!d.migrations.program240) { d.settings.dayExercises = {}; d.migrations.program240 = true; }
  if (!d.migrations.d2e1ToPullups) {
    function migrateD2e1(session) {
      if (!session) return;
      session.sets.forEach(function(set) {
        if (set.exId === 'd2e1') set.exId = 'pullups';
        if (set.substitutedFor === 'd2e1') set.substitutedFor = 'pullups';
      });
      session.exerciseOrder = session.exerciseOrder.map(function(exId) {
        return exId === 'd2e1' ? 'pullups' : exId;
      }).filter(function(exId, index, ids) { return ids.indexOf(exId) === index; });
      if (session.currentExId === 'd2e1') session.currentExId = 'pullups';
      if (session.exNotes.d2e1 && !session.exNotes.pullups) session.exNotes.pullups = session.exNotes.d2e1;
      delete session.exNotes.d2e1;
      if (session.exercisePrescriptions) delete session.exercisePrescriptions.d2e1;
    }
    d.completedSessions.forEach(migrateD2e1);
    migrateD2e1(d.activeSession);
    d.migrations.d2e1ToPullups = true;
  }
  return d;
}

function getDayExerciseIds(dbRef, dayN) {
  var saved = dbRef && dbRef.settings && dbRef.settings.dayExercises && dbRef.settings.dayExercises[dayN];
  return Array.isArray(saved) && saved.length ? saved.slice() : DAYS[dayN].exercises.slice();
}

function saveDayExerciseIds(dbRef, dayN, exerciseIds) {
  if (!dbRef.settings) dbRef.settings = {};
  if (!dbRef.settings.dayExercises) dbRef.settings.dayExercises = {};
  dbRef.settings.dayExercises[dayN] = exerciseIds.slice();
  dbSave(dbRef);
}

// ---- v1 migration ----
function dbMigrateV1(old) {
  var db = dbDefault();
  // Preserve old checkbox state and log tables as legacy
  if (old && (old.checks || old.logs)) {
    db.legacyData = { source: 'v1', checks: old.checks||{}, logs: old.logs||{}, importedAt: Date.now() };
  } else if (old) {
    // might be raw old adil_aesthetic_v1 checkbox format
    db.legacyData = { source: 'v1_checks', data: old, importedAt: Date.now() };
  }
  // Try to read old separate keys
  try {
    var oldChecks = localStorage.getItem('adil_aesthetic_v1');
    if (oldChecks) db.legacyData = db.legacyData || {};
    // preserve them under legacyData; don't delete old keys in case user wants them
  } catch(e) {}
  db.schemaVersion = 2;
  return db;
}

// ---- session helpers ----
function newSessionId() { return 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function newSetId()     { return 'set_'  + Date.now() + '_' + Math.random().toString(36).slice(2,5); }

function createSession(dayN) {
  var order = DAYS[dayN] ? getDayExerciseIds(db, dayN) : [];
  var prescriptions = {};
  order.forEach(function(exId) { prescriptions[exId] = getExerciseForDay(exId, dayN, db); });
  return {
    id: newSessionId(),
    dayN: dayN,
    startTime: Date.now(),
    endTime: null,
    durationMs: null,
    sessionTimerStoppedAt: null,
    timerStopReason: null,
    sets: [],
    exerciseOrder: order,
    exercisePrescriptions: prescriptions,
    customExercises: {},
    rushedModeApplied: false,
    rushedReductions: {},
    notes: '',
    finished: false,
  };
}

function createSet(exId, setNum, setType, side) {
  return {
    id: newSetId(),
    exId: exId,
    setNum: setNum,
    setType: setType || 'working', // 'working'|'warmup'|'drop'|'skip'
    side: side || null,            // null|'L'|'R'
    weight: 0,
    reps: 0,
    rir: null,
    completed: false,
    skipped: false,
    timestamp: null,
  };
}

function newCustomExerciseId() {
  return 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
}

function getExerciseDef(exId, session, dbRef) {
  if (session && session.exercisePrescriptions && session.exercisePrescriptions[exId]) return session.exercisePrescriptions[exId];
  if (EX[exId]) return EX[exId];
  if (session && session.customExercises && session.customExercises[exId]) return session.customExercises[exId];
  var data = dbRef || (typeof db !== 'undefined' ? db : null);
  if (data && data.settings && data.settings.customExercises && data.settings.customExercises[exId]) {
    return data.settings.customExercises[exId];
  }
  return {
    id:exId, name:'Unknown Exercise', rawId:exId, unknown:true,
    sMin:1, sMax:1, sDef:1, rMin:1, rMax:20, rirMin:0, rirMax:1, rest:90,
    target:'Unknown', uni:false, drop:false, muscles:{}, cues:[], mistakes:[],
    tnf:'This exercise came from older saved data.', cbum:'', hard:''
  };
}

function getSessionExerciseIds(session) {
  if (!session) return [];
  var day = DAYS[session.dayN];
  var ids = session.exerciseOrder ? session.exerciseOrder.slice() : (day ? getDayExerciseIds(db, session.dayN) : []);
  session.sets.forEach(function(s) {
    if (ids.indexOf(s.exId) === -1) ids.push(s.exId);
  });
  return ids;
}

function normaliseSessionExerciseOrder(session) {
  if (!session) return;
  if (!session.exerciseOrder) session.exerciseOrder = getSessionExerciseIds(session);
}

function exerciseOptionsForSession(session) {
  var used = {};
  getSessionExerciseIds(session).forEach(function(exId) { used[exId] = true; });
  return getSelectableExerciseIds(db).filter(function(exId) {
    return !used[exId];
  }).sort(function(a,b) {
    var ea = EX[a], eb = EX[b];
    if (ea.day !== eb.day) return ea.day - eb.day;
    if (ea.order !== eb.order) return ea.order - eb.order;
    return ea.name.localeCompare(eb.name);
  });
}

function createExerciseSetsForSession(exId, ex, db) {
  var sets = [];
  var lastSess = getLastExSession(db, exId);
  var prevSets = lastSess ? lastSess.sets : [];
  function prevFor(num, side) {
    for (var i = 0; i < prevSets.length; i++) {
      var ps = prevSets[i];
      if (ps.setNum === num && ps.side === (side||null) && ps.setType === 'working') return ps;
    }
    return null;
  }
  if (ex.uni) {
    for (var i = 1; i <= ex.sDef; i++) {
      ['L','R'].forEach(function(side) {
        var prev = prevFor(i, side);
        var s = createSet(exId, i, 'working', side);
        s.weight = prev ? prev.weight : 0;
        s.reps = prev ? prev.reps : ex.rMin;
        s.rir = null;
        s.suggestedWeight = prev ? prev.weight : null;
        s.suggestedReps = prev ? prev.reps : null;
        sets.push(s);
      });
    }
  } else {
    for (var j = 1; j <= ex.sDef; j++) {
      var prevSet = prevFor(j, null);
      var ns = createSet(exId, j, 'working', null);
      ns.weight = prevSet ? prevSet.weight : 0;
      ns.reps = prevSet ? prevSet.reps : ex.rMin;
      ns.rir = null;
      ns.suggestedWeight = prevSet ? prevSet.weight : null;
      ns.suggestedReps = prevSet ? prevSet.reps : null;
      sets.push(ns);
    }
    if (ex.drop) {
      var prevDrop = prevSets.find(function(s) { return s.setType === 'drop'; });
      var ds = createSet(exId, ex.sDef, 'drop', null);
      ds.weight = prevDrop ? prevDrop.weight : 0;
      ds.reps = prevDrop ? prevDrop.reps : ex.rMin;
      ds.rir = null;
      ds.suggestedWeight = prevDrop ? prevDrop.weight : null;
      ds.suggestedReps = prevDrop ? prevDrop.reps : null;
      sets.push(ds);
    }
  }
  return sets;
}

function makeCustomExerciseDef(form) {
  var name = (form.name || '').trim();
  if (!name) throw new Error('Add an exercise name.');
  var target = (form.target || '').trim() || 'Custom';
  var muscleId = form.muscleId || 'mid-back';
  var sets = Math.max(1, Math.min(10, parseInt(form.sets,10) || 3));
  var rMin = Math.max(1, Math.min(100, parseInt(form.rMin,10) || 8));
  var rMax = Math.max(rMin, Math.min(100, parseInt(form.rMax,10) || rMin));
  var rest = Math.max(15, Math.min(600, parseInt(form.rest,10) || 90));
  var muscles = {};
  muscles[muscleId] = 1;
  return {
    id: form.id,
    day: 0,
    order: 0,
    name: name,
    sMin: sets,
    sMax: sets,
    sDef: sets,
    rMin: rMin,
    rMax: rMax,
    rirMin: 0,
    rirMax: 1,
    rest: rest,
    target: target,
    uni: !!form.uni,
    drop: false,
    muscles: muscles,
    cues: ['Use the same setup every time.', 'Control the rep and keep the target muscle as the limiter.'],
    tnf: 'Custom exercise added during this workout.',
    cbum: 'Keep the rep clean and repeatable.',
    mistakes: ['Changing setup between sets.', 'Letting another muscle take over.', 'Adding load before the movement is stable.'],
    hard: 'Only count reps that match the intended target and range.'
  };
}

// ---- exercise history ----
// Returns array of completed sets for an exercise, most recent first
function getExHistory(db, exId) {
  var sets = [];
  var historyId = getHistoryExerciseId(exId);
  var sessions = db.completedSessions.slice().sort(function(a,b){ return b.startTime - a.startTime; });
  for (var i = 0; i < sessions.length; i++) {
    var sess = sessions[i];
    for (var j = 0; j < sess.sets.length; j++) {
      var s = sess.sets[j];
      if (getHistoryExerciseId(s.exId) === historyId && s.completed && !s.skipped && s.setType !== 'warmup') {
        sets.push({ set: s, sessionId: sess.id, sessionTime: sess.startTime, dayN: sess.dayN });
      }
    }
  }
  return sets;
}

// Returns the most recent complete working session for an exercise (non-warmup, completed sets only)
function getLastExSession(db, exId) {
  var historyId = getHistoryExerciseId(exId);
  var sessions = db.completedSessions.slice().sort(function(a,b){ return b.startTime - a.startTime; });
  for (var i = 0; i < sessions.length; i++) {
    var sess = sessions[i];
    var found = sess.sets.filter(function(s) {
      return getHistoryExerciseId(s.exId) === historyId && s.completed && !s.skipped && s.setType !== 'warmup';
    });
    if (found.length > 0) return { session: sess, sets: found };
  }
  return null;
}

// ---- volume calculation ----
// Returns { muscleId: totalSets } for a given array of sessions within a date range
function calcVolume(sessions, muscleMappings) {
  var vol = {};
  sessions.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType === 'warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex) return;
      var mmap = (muscleMappings && muscleMappings[s.exId]) ? muscleMappings[s.exId] : ex.muscles;
      var contribution = s.setType === 'drop' ? (ex.dropMuscles || {}) : mmap;
      // For unilateral: only count L side (or null side) once per pair to avoid doubling
      // We handle this by counting 0.5 per side for bilateral volume, but spec says L+R = 1 set
      var multiplier = 1;
      if (ex.uni && s.side !== null) { multiplier = 0.5; } // L + R = 1 set
      Object.keys(contribution).forEach(function(m) {
        vol[m] = (vol[m] || 0) + contribution[m] * multiplier;
      });
    });
  });
  return vol;
}

// Week helpers (Mon-Sun)
function weekStart(date) {
  var d = new Date(date || Date.now());
  var day = d.getDay();
  var diff = (day === 0) ? -6 : 1 - day; // Monday = 0 offset
  var mon = new Date(d);
  mon.setHours(0,0,0,0);
  mon.setDate(d.getDate() + diff);
  return mon.getTime();
}
function weekEnd(weekStartTs) { return weekStartTs + 7*24*60*60*1000 - 1; }

function sessionsInWeek(db, weekStartTs) {
  var ws = weekStartTs, we = weekEnd(weekStartTs);
  return db.completedSessions.filter(function(s) { return s.startTime >= ws && s.startTime <= we; });
}

// ---- PRs ----
// Returns array of PR descriptions for a completed session
function detectPRs(db, session) {
  var prs = [];
  var exIds = [];
  session.sets.forEach(function(s) { if (exIds.indexOf(s.exId) === -1) exIds.push(s.exId); });
  exIds.forEach(function(exId) {
    var ex = getExerciseDef(exId, session);
    if (!ex) return;
    var historySets = getExHistory(db, exId);
    // Remove sets from current session
    var prevSets = historySets.filter(function(h) { return h.sessionId !== session.id; });
    var curSets = session.sets.filter(function(s) { return s.exId === exId && s.completed && !s.skipped && s.setType !== 'warmup'; });
    if (curSets.length === 0 || prevSets.length === 0) return;
    curSets.forEach(function(cur) {
      // Best weight
      var prevBestWeight = Math.max.apply(null, prevSets.map(function(h) { return h.set.weight; }));
      if (cur.weight > prevBestWeight && cur.weight > 0) {
        prs.push({ exId: exId, type:'weight', msg: ex.name + ' — new weight record: ' + cur.weight + ' kg' });
        return;
      }
      // Most reps at same weight
      var sameWeight = prevSets.filter(function(h) { return h.set.weight === cur.weight; });
      if (sameWeight.length > 0) {
        var prevBestReps = Math.max.apply(null, sameWeight.map(function(h) { return h.set.reps; }));
        if (cur.reps > prevBestReps) {
          prs.push({ exId: exId, type:'reps', msg: ex.name + ' — ' + (cur.reps - prevBestReps) + ' more reps at ' + cur.weight + ' kg' });
        }
      }
    });
  });
  // Deduplicate by exId
  var seen = {};
  return prs.filter(function(pr) {
    if (seen[pr.exId + pr.type]) return false;
    seen[pr.exId + pr.type] = true;
    return true;
  });
}

// ---- stall detection ----
function getExerciseExposureSummaries(dbRef, exId, limit) {
  var out = [];
  var historyId = getHistoryExerciseId(exId);
  var sessions = dbRef.completedSessions.slice().sort(function(a,b){ return b.startTime-a.startTime; });
  for (var i = 0; i < sessions.length && out.length < limit; i++) {
    var sets = sessions[i].sets.filter(function(set) {
      return getHistoryExerciseId(set.exId) === historyId && set.completed && !set.skipped && set.setType !== 'warmup';
    });
    if (!sets.length) continue;
    var bestWeight = Math.max.apply(null, sets.map(function(set){ return set.weight || 0; }));
    var bestReps = sets.filter(function(set){ return (set.weight || 0) === bestWeight; })
      .reduce(function(max, set){ return Math.max(max, set.reps || 0); }, 0);
    out.push({ sessionId:sessions[i].id, startTime:sessions[i].startTime, bestWeight:bestWeight, bestReps:bestReps });
  }
  return out;
}

function exposureImproved(current, previous) {
  if (!current || !previous) return false;
  if (current.bestWeight > previous.bestWeight) return true;
  return current.bestWeight === previous.bestWeight && current.bestReps > previous.bestReps;
}

function getStallInfo(dbRef, exId) {
  var exposures = getExerciseExposureSummaries(dbRef, exId, 3);
  if (exposures.length < 3) return null;
  if (exposureImproved(exposures[0], exposures[1]) || exposureImproved(exposures[1], exposures[2])) return null;
  var load = exposures[0].bestWeight
    ? exposures[0].bestWeight+' kg × '+exposures[0].bestReps
    : exposures[0].bestReps+' reps';
  return {
    load:load,
    message:'No progress for 2 exposures. Hold the load and add one clean rep; if it stalls again, reduce 5 to 10 percent and rebuild.'
  };
}

// ---- next day in rotation ----
// BEST WORKOUT TODAY RECOMMENDATION ENGINE
var RECOMMENDATION_PRIORITY = {
  'side-delts':1.50, 'lats':1.50, 'upper-chest':1.40, 'rear-delts':1.25,
  'mid-back':1.20, 'abs':0.90, 'lower-traps':0.90, 'serratus':0.85,
  'triceps':0.75, 'biceps':0.65, 'brachialis':0.50, 'mid-chest':0.45,
  'glutes':0.40, 'hamstrings':0.35, 'quads':0.30, 'calves':0.25, 'front-delts':0.10
};

function getRollingSessions(dbRef, days, now) {
  var end = now || Date.now();
  var start = end - days * 24 * 60 * 60 * 1000;
  return dbRef.completedSessions.filter(function(session) {
    return session.startTime >= start && session.startTime <= end;
  });
}

function calculateRollingMuscleStimulus(dbRef, days, now) {
  return calcVolume(getRollingSessions(dbRef, days, now), dbRef.settings && dbRef.settings.muscleMappings);
}

function getMuscleLastTrainedTimes(dbRef) {
  var times = {};
  dbRef.completedSessions.forEach(function(session) {
    session.sets.forEach(function(set) {
      if (!set.completed || set.skipped || set.setType === 'warmup') return;
      var ex = getExerciseDef(set.exId, session, dbRef);
      Object.keys(ex.muscles || {}).forEach(function(muscleId) {
        var trainedAt = set.timestamp || session.endTime || session.startTime;
        times[muscleId] = Math.max(times[muscleId] || 0, trainedAt);
      });
    });
  });
  return times;
}

function getDayPlannedStimulus(dayN, dbRef) {
  var stimulus = {};
  getDayExerciseIds(dbRef || db, dayN).forEach(function(exId) {
    var ex = getExerciseForDay(exId, dayN, dbRef || db);
    if (ex.optional) return;
    Object.keys(ex.muscles || {}).forEach(function(muscleId) {
      stimulus[muscleId] = (stimulus[muscleId] || 0) + ex.sDef * ex.muscles[muscleId];
    });
    if (ex.drop && ex.dropMuscles) {
      Object.keys(ex.dropMuscles).forEach(function(muscleId) {
        stimulus[muscleId] = (stimulus[muscleId] || 0) + ex.dropMuscles[muscleId];
      });
    }
  });
  return stimulus;
}

function getLastCompletedTimeForDay(dbRef, dayN) {
  return dbRef.completedSessions.reduce(function(latest, session) {
    if (session.dayN !== dayN) return latest;
    return Math.max(latest, session.endTime || session.startTime || 0);
  }, 0);
}

function getRecommendationTarget(dbRef, muscleId) {
  var saved = dbRef.settings && dbRef.settings.volumeTargets && dbRef.settings.volumeTargets[muscleId];
  if (saved && typeof saved === 'object' && isFinite(Number(saved.min)) && isFinite(Number(saved.max))) {
    return { min:Number(saved.min), max:Number(saved.max) };
  }
  return { min:MUSCLES[muscleId].min, max:MUSCLES[muscleId].max };
}

function getNeedFactor(current, min, max) {
  if (min <= 0 && max <= 0) return 0;
  if (current < min) return 1 + Math.min(1, (min - current) / Math.max(min, 1));
  if (current <= max) {
    var range = Math.max(max - min, 1);
    return 0.35 + 0.65 * ((max - current) / range);
  }
  return -0.5;
}

function getRecoveryFactor(hoursSinceTraining) {
  if (hoursSinceTraining === Infinity) return 1.00;
  if (hoursSinceTraining < 24) return 0.15;
  if (hoursSinceTraining < 48) return 0.55;
  if (hoursSinceTraining < 72) return 0.85;
  return 1.00;
}

function scoreWorkoutDay(dbRef, dayN, now) {
  var currentTime = now || Date.now();
  var rolling = calculateRollingMuscleStimulus(dbRef, 7, currentTime);
  var lastTimes = getMuscleLastTrainedTimes(dbRef);
  var planned = getDayPlannedStimulus(dayN, dbRef);
  var score = 0;
  Object.keys(planned).forEach(function(muscleId) {
    if (!MUSCLES[muscleId]) return;
    var target = getRecommendationTarget(dbRef, muscleId);
    var hoursSince = lastTimes[muscleId] ? (currentTime - lastTimes[muscleId]) / 3600000 : Infinity;
    score += planned[muscleId] * (RECOMMENDATION_PRIORITY[muscleId] || 0.5) *
      getNeedFactor(rolling[muscleId] || 0, target.min, target.max) * getRecoveryFactor(hoursSince);
  });
  var lastDayTime = getLastCompletedTimeForDay(dbRef, dayN);
  var daysSince = lastDayTime ? (currentTime - lastDayTime) / 86400000 : Infinity;
  if (daysSince < 1) score -= 10;
  else if (daysSince < 2) score -= 5;
  else if (daysSince < 3) score -= 1.5;
  score += (daysSince === Infinity ? 7 : Math.min(daysSince, 7)) * 0.15;
  return { dayN:dayN, score:score, planned:planned, daysSince:daysSince };
}

function getLatestSessionMuscles(dbRef) {
  if (!dbRef.completedSessions.length) return [];
  var latest = dbRef.completedSessions.slice().sort(function(a,b) { return b.startTime-a.startTime; })[0];
  var volume = calcVolume([latest], dbRef.settings && dbRef.settings.muscleMappings);
  return Object.keys(volume).filter(function(id) { return volume[id] >= 0.5; })
    .sort(function(a,b) { return volume[b]-volume[a]; }).slice(0,2);
}

function buildRecommendationReasons(recommendation, dbRef) {
  if (!dbRef.completedSessions.length) {
    return ['Start with the foundation session. There is not enough workout history for a personalised recommendation yet.'];
  }
  var reasons = [];
  var deficits = recommendation.muscleDetails.filter(function(detail) { return detail.current < detail.min; })
    .sort(function(a,b) { return (b.min-b.current)-(a.min-a.current); });
  if (deficits.length) {
    var deficit = deficits[0];
    reasons.push(deficit.label+' is '+round1(deficit.min-deficit.current)+' sets below your rolling weekly minimum.');
  }
  var latestMuscles = getLatestSessionMuscles(dbRef);
  if (latestMuscles.length) {
    reasons.push('Your last session mainly trained '+latestMuscles.map(function(id){return MUSCLES[id].label.toLowerCase();}).join(' and ')+'.');
  }
  var recovered = recommendation.muscleDetails.filter(function(detail) { return detail.hoursSince >= 72; })
    .sort(function(a,b) { return (RECOMMENDATION_PRIORITY[b.muscleId]||0)-(RECOMMENDATION_PRIORITY[a.muscleId]||0); });
  if (recovered.length) reasons.push(recovered[0].label+' has had more than 72 hours of recovery.');
  if (reasons.length < 2 && recommendation.daysSince >= 3) reasons.push('Day '+recommendation.dayN+' has not been completed recently.');
  return reasons.slice(0,3);
}

function getBestWorkoutRecommendation(dbRef, now) {
  var currentTime = now || Date.now();
  if (!dbRef.completedSessions.length) {
    var first = scoreWorkoutDay(dbRef, 1, currentTime);
    first.confidence = 'Low';
    first.secondBestDayN = 2;
    first.allScores = {1:first.score,2:0,3:0,4:0};
    first.muscleDetails = buildRecommendationMuscleDetails(dbRef, first, currentTime);
    first.reasons = buildRecommendationReasons(first, dbRef);
    return first;
  }
  var scored = CORE_DAY_NUMBERS.map(function(dayN) { return scoreWorkoutDay(dbRef, dayN, currentTime); });
  scored.sort(function(a,b) {
    var maxAbs = Math.max(Math.abs(a.score), Math.abs(b.score), 1);
    if (Math.abs(a.score-b.score) / maxAbs <= 0.05) {
      if (a.daysSince !== b.daysSince) return b.daysSince-a.daysSince;
      return a.dayN-b.dayN;
    }
    return b.score-a.score;
  });
  var top = scored[0], second = scored[1];
  var denominator = Math.max(Math.abs(second.score), 1);
  var lead = (top.score-second.score) / denominator;
  top.confidence = dbRef.completedSessions.length <= 1 || lead < 0.10 ? 'Low' : lead <= 0.20 ? 'Medium' : 'High';
  top.secondBestDayN = second.dayN;
  top.allScores = {};
  scored.forEach(function(item) { top.allScores[item.dayN] = item.score; });
  top.muscleDetails = buildRecommendationMuscleDetails(dbRef, top, currentTime);
  var mainCovered = ['side-delts','lats','upper-chest','rear-delts','mid-back'].every(function(id) {
    var target = getRecommendationTarget(dbRef, id);
    return (calculateRollingMuscleStimulus(dbRef,7,currentTime)[id] || 0) >= target.min;
  });
  top.reasons = mainCovered
    ? ['Your main weekly targets are covered. This is the best recovered and least recent session.']
    : buildRecommendationReasons(top, dbRef);
  return top;
}

function buildRecommendationMuscleDetails(dbRef, recommendation, now) {
  var rolling = calculateRollingMuscleStimulus(dbRef, 7, now);
  var lastTimes = getMuscleLastTrainedTimes(dbRef);
  return Object.keys(recommendation.planned).filter(function(id) { return MUSCLES[id]; })
    .sort(function(a,b) {
      return (recommendation.planned[b]*(RECOMMENDATION_PRIORITY[b]||0))-(recommendation.planned[a]*(RECOMMENDATION_PRIORITY[a]||0));
    }).slice(0,5).map(function(id) {
      var target = getRecommendationTarget(dbRef, id);
      return {
        muscleId:id, label:MUSCLES[id].label, current:round1(rolling[id]||0), min:target.min, max:target.max,
        hoursSince:lastTimes[id] ? (now-lastTimes[id])/3600000 : Infinity
      };
    });
}

function nextDay(dbRef) {
  if (dbRef._nextDayOverride) return dbRef._nextDayOverride;
  return getBestWorkoutRecommendation(dbRef).dayN;
}

// ---- export / import ----
function exportBackup(db) {
  var out = { version: 2, exported: new Date().toISOString().slice(0,10), data: db };
  var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'adil-v2-' + out.exported + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function importBackup(jsonText, currentDb) {
  var parsed = JSON.parse(jsonText);
  if (parsed.version === 2 && parsed.data) {
    // v2 backup
    var d = parsed.data;
    d.schemaVersion = 2;
    return d;
  } else if (parsed.version === 1 || parsed.checks !== undefined || parsed.logs !== undefined) {
    // v1 backup: preserve as legacy
    currentDb.legacyData = { source: 'v1_import', checks: parsed.checks||{}, logs: parsed.logs||{}, importedAt: Date.now() };
    return currentDb;
  }
  throw new Error('Unrecognised backup format.');
}

// ---- format helpers ----
function fmtTime(ms) {
  var total = Math.floor((ms || 0) / 1000);
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var sec = total % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  return m + ':' + String(sec).padStart(2,'0');
}
function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function fmtShortDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

// ============================================================
// REST TIMER
// ============================================================
var Timer = (function() {
  var _running = false;
  var _start = 0;
  var _target = 90;
  var _elapsed = 0;
  var _interval = null;
  var _pill = null;

  function _save() {
    try {
      localStorage.setItem(TIMER_KEY, JSON.stringify({
        mode:'countup', running:_running, start:_start, target:_target
      }));
    } catch(e) {}
  }

  function formatSeconds(seconds) {
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function _render() {
    if (!_pill) _pill = document.getElementById('timer-pill');
    if (!_pill) return;
    _pill.classList.toggle('hidden', !_running);
    _pill.innerHTML =
      '<span class="tp-label">REST · target '+formatSeconds(_target)+'</span>' +
      '<span class="tp-time' + (_elapsed >= _target ? ' tp-urgent' : '') + '">' + formatSeconds(_elapsed) + '</span>' +
      '<button class="tp-skip" onclick="Timer.skip()">Done</button>';
  }

  function _tick() {
    if (!_running) return;
    _elapsed = Math.max(0, (Date.now() - _start) / 1000);
    _render();
  }

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && _running) _tick();
  });

  return {
    start: function(seconds) {
      if (_interval) clearInterval(_interval);
      _target = seconds || 90;
      _elapsed = 0;
      _start = Date.now();
      _running = true;
      _interval = setInterval(_tick, 500);
      _render(); _save();
    },
    restore: function() {
      try {
        var raw = localStorage.getItem(TIMER_KEY);
        if (!raw) return;
        var t = JSON.parse(raw);
        if (!t.running) return;
        _target = t.target || t.duration || 90;
        _start = t.start;
        _elapsed = Math.max(0, (Date.now() - _start) / 1000);
        _running = true;
        if (_interval) clearInterval(_interval);
        _interval = setInterval(_tick, 500);
        _render();
      } catch(e) {}
    },
    skip: function() {
      _running = false;
      _elapsed = 0;
      clearInterval(_interval); _interval = null;
      _save();
      _render();
    },
    isRunning: function() { return _running; },
  };
})();

  var interval = null;

    var el = document.getElementById('wo-session-clock');
    if (el) el.textContent = fmtTime(getSessionElapsedMs(db.activeSession));
    if (db.activeSession.sessionTimerStoppedAt && interval) { clearInterval(interval); interval = null; }

  return {
    start:function(){ if (interval) clearInterval(interval); tick(); interval = setInterval(tick,1000); },
    stop:function(){ if (interval) clearInterval(interval); interval = null; }
  };
})();

function isFirstWarmupCandidate(set, ex) {
  if (!db || !db.activeSession || !set || set.setType !== 'working') return false;
  var sets = db.activeSession.sets.filter(function(s){ return s.exId === set.exId; });
  if (sets.some(function(s){ return s.setType === 'warmup'; })) return false;
  var working = sets.filter(function(s){ return s.setType === 'working'; }).sort(function(a,b){ return (a.setNum||0)-(b.setNum||0); });
  if (!working.length) return false;
  var firstNum = working[0].setNum;
  return set.setNum === firstNum && (!ex.uni || set.side === 'L');
}

function fmtRestLabel(sec) {
  if (sec >= 60) return Math.floor(sec/60) + (sec%60 ? ':'+('0'+(sec%60)).slice(-2) : '') + ' min';
  return sec + 's';
}

function scrollExIntoView(el, center) {
  var body = document.getElementById('wo-body');
  if (!body || !el) return;
  var elTop = el.offsetTop;
  var target = center
    ? Math.max(0, elTop - (body.offsetHeight - el.offsetHeight) / 2)
    : Math.max(0, elTop - 70);
  body.scrollTo({ top: target, behavior: 'smooth' });
}

// ============================================================
// VOLUME SCREEN
// ============================================================
function renderVolume(db) {
  var ws = weekStart();
  var weekOffset = (db._volumeWeekOffset || 0);
  var viewWs = ws + weekOffset * 7*24*60*60*1000;
  var prevWs  = viewWs - 7*24*60*60*1000;

  var thisSess = sessionsInWeek(db, viewWs);
  var prevSess = sessionsInWeek(db, prevWs);
  var thisVol  = calcVolume(thisSess, null);
  var prevVol  = calcVolume(prevSess, null);

  // planned volume per muscle (from all exercises across 4 days, using sDef)
  var plannedMin = {}, plannedMax = {};
  [1,2,3,4].forEach(function(dayN) {
    getDayExerciseIds(db, dayN).forEach(function(exId) {
      var ex = getExerciseForDay(exId, dayN, db);
      Object.keys(ex.muscles || {}).forEach(function(m) {
        var contrib = ex.muscles[m];
        plannedMin[m] = (plannedMin[m]||0) + ex.sMin * contrib;
        plannedMax[m] = (plannedMax[m]||0) + ex.sMax * contrib;
      });
    });
  });

  var isThisWeek = weekOffset === 0;
  var isLastWeek = weekOffset === -1;
  var weekLabel = isThisWeek ? 'This week' : isLastWeek ? 'Last week' : fmtShortDate(viewWs) + ' – ' + fmtShortDate(weekEnd(viewWs));

  var muscleRows = Object.keys(MUSCLES).map(function(mId) {
    var mdef = MUSCLES[mId];
    var done  = round1(thisVol[mId] || 0);
    var prev  = round1(prevVol[mId] || 0);
    var tMin  = mdef.min, tMax = mdef.max;
    var pMin  = round1(plannedMin[mId] || 0);
    var pMax  = round1(plannedMax[mId] || 0);
    var pct   = tMax > 0 ? Math.min(100, done / tMax * 100) : 0;
    var status, statusCls;
    if      (done === 0)       { status='—';            statusCls='vs-none';  }
    else if (done < tMin)      { status='Below target'; statusCls='vs-low';   }
    else if (done <= tMax)     { status='On track';     statusCls='vs-ok';    }
    else if (done <= tMax*1.2) { status='Target reached'; statusCls='vs-hit'; }
    else                       { status='Above target'; statusCls='vs-over';  }

    var diff = done - prev;
    var diffTxt = diff > 0 ? '+' + round1(diff) : round1(diff);
    var diffCls = diff > 0 ? 'vd-up' : diff < 0 ? 'vd-dn' : 'vd-flat';

    return '<div class="vol-row" onclick="App.showMuscleDetail(\'' + mId + '\')">' +
      '<div class="vr-top">' +
        '<span class="vr-name">' + mdef.label + '</span>' +
        '<span class="vr-done">' + done + '</span>' +
        '<span class="vr-status ' + statusCls + '">' + status + '</span>' +
      '</div>' +
      '<div class="vr-bar"><div class="vr-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="vr-meta">' +
        '<span class="vr-target">Target ' + tMin + '–' + tMax + ' · Planned ~' + pMin + (pMin!==pMax?'–'+pMax:'') + '</span>' +
        '<span class="vr-prev ' + diffCls + '">vs last: ' + diffTxt + '</span>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="vol-wrap"><div class="screen-title">Volume</div>' +
    '<div class="vol-header">' +
      '<button class="btn-nav" onclick="App.volNavWeek(-1)">‹ Prev</button>' +
      '<span class="vol-wlabel">' + weekLabel + '</span>' +
      '<button class="btn-nav" onclick="App.volNavWeek(1)"' + (isThisWeek ? ' disabled' : '') + '>Next ›</button>' +
    '</div>' +
    '<div class="vol-sessions">' + thisSess.length + ' session' + (thisSess.length!==1?'s':'') + ' this week</div>' +
    '<div class="vol-rows">' + (muscleRows || '<div class="vol-empty">No data yet. Complete workouts to see volume.</div>') + '</div>' +
    '</div>';
}

// ---- Muscle detail modal ----
function renderMuscleDetail(mId, db) {
  var mdef = MUSCLES[mId];
  var ws = weekStart() + (db._volumeWeekOffset||0)*7*24*60*60*1000;
  // last 8 weeks
  var weeks = [];
  for (var i = 7; i >= 0; i--) {
    var wStart = ws - i*7*24*60*60*1000;
    var wSess  = sessionsInWeek(db, wStart);
    var wVol   = calcVolume(wSess, null);
    weeks.push({ wStart: wStart, vol: round1(wVol[mId]||0) });
  }

  // Contributing exercises (this week)
  var thisSess = sessionsInWeek(db, ws);
  var exContribs = {};
  thisSess.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType==='warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex || !ex.muscles[mId]) return;
      var mult = (ex.uni && s.side) ? 0.5 : 1;
      exContribs[s.exId] = (exContribs[s.exId]||0) + ex.muscles[mId]*mult;
    });
  });

  var maxVol = Math.max.apply(null, weeks.map(function(w){ return w.vol; }).concat([1]));
  var chartBars = weeks.map(function(w) {
    var h = maxVol > 0 ? Math.round(w.vol / maxVol * 60) : 0;
    var lbl = new Date(w.wStart).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return '<div class="chart-col"><div class="chart-bar" style="height:' + h + 'px"></div><div class="chart-lbl">' + lbl.replace(' ','<br>') + '</div><div class="chart-val">' + w.vol + '</div></div>';
  }).join('');

  var exRows = Object.keys(exContribs).map(function(exId) {
    var exName = null;
    thisSess.some(function(sess) {
      var ex = getExerciseDef(exId, sess);
      if (ex) { exName = ex.name; return true; }
      return false;
    });
    return '<div class="md-ex-row"><span class="md-ex-name">' + esc(exName || exId) + '</span><span class="md-ex-v">' + round1(exContribs[exId]) + ' sets</span></div>';
  }).join('') || '<div class="md-none">No exercises logged this week.</div>';

  var fourWkAvg = round1(weeks.slice(4).reduce(function(a,w){ return a+w.vol; },0)/4);

  return '<div class="md-wrap">' +
    '<div class="md-header">' +
      '<h2 class="md-title">' + mdef.label + '</h2>' +
      '<button class="md-close" onclick="App.closeMuscleDetail()">✕</button>' +
    '</div>' +
    '<div class="md-stats">' +
      '<div class="md-stat"><div class="mds-val">' + round1(calcVolume(thisSess,null)[mId]||0) + '</div><div class="mds-lbl">This week</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + fourWkAvg + '</div><div class="mds-lbl">4wk avg</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + mdef.min + '–' + mdef.max + '</div><div class="mds-lbl">Target</div></div>' +
    '</div>' +
    '<div class="md-chart"><div class="chart-bars">' + chartBars + '</div></div>' +
    '<div class="md-section"><div class="md-sec-title">Exercises this week</div>' + exRows + '</div>' +
    '</div>';
}

// HISTORY SCREEN
// ============================================================
function renderSessionDetail(sess) {
  var day = DAYS[sess.dayN];
  var byEx = {};
  sess.sets.forEach(function(s) { (byEx[s.exId]=byEx[s.exId]||[]).push(s); });
  var detailOrder = getSessionExerciseIds(sess);
  Object.keys(byEx).forEach(function(exId) {
    if (detailOrder.indexOf(exId) === -1) detailOrder.push(exId);
  });

  var exBlocks = detailOrder.map(function(exId) {
    var sets = byEx[exId] || [];
    if (!sets.length) return '';
    var ex = getExerciseDef(exId, sess);
    if (!ex) return '';
    var setLines = sets.map(function(s) {
      var label = s.setType==='warmup' ? 'WU' : s.setType==='drop' ? 'Drop' : 'S' + s.setNum + (s.side?' '+s.side:'');
      var status = s.skipped ? 'skipped' : s.completed ? s.weight+' kg × '+s.reps : '—';
      return '<div class="sd-set"><span class="sd-sl">' + label + '</span><span class="sd-sv">' + status + '</span></div>';
    }).join('');
    var historyMeta = ex.unknown ? '<div class="addex-muted">Saved ID: '+esc(ex.rawId)+'</div>' : '';
    var originalId = sess.substitutions && sess.substitutions[exId];
    if (originalId) historyMeta += '<div class="addex-muted">Substituted for '+esc(getExerciseDef(originalId, sess).name)+'</div>';
    return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div>' + historyMeta + setLines + '</div>';
  }).join('');

  var prs = (sess.prs||[]).map(function(pr){ return '<div class="sd-pr">✦ ' + esc(pr.msg) + '</div>'; }).join('');

  return '<div class="sess-detail">' +
    (sess.rushedModeApplied ? '<div class="rushed-banner">Rushed Mode applied</div>' : '') +
    (sess.timerStopReason === 'automatic_3_hour_cap' ? '<div class="timer-cap-banner">Timer auto-stopped at 3:00:00</div>' : '') +
    (prs?'<div class="sd-prs">'+prs+'</div>':'') + exBlocks + '</div>';
}

function localDateKey(ts) {
  var d = ts ? new Date(ts) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getHomeLog(dbRef, dateKey, create) {
  var key = dateKey || localDateKey();
  var log = (dbRef.homeRoutineLogs || []).find(function(item){ return item.date === key; });
  if (!log && create) {
    log = {date:key,items:{},completed:false,completedAt:null};
    dbRef.homeRoutineLogs.push(log);
  }
  return log;
}
function renderHome(dbRef) {
  var today = localDateKey();
  var log = getHomeLog(dbRef, today, false) || {items:{},completed:false};
  var done = HOME_ROUTINE.filter(function(item){ return !!log.items[item.id]; }).length;
  var last7 = (dbRef.homeRoutineLogs || []).filter(function(item){
    var age = Date.now() - new Date(item.date+'T12:00:00').getTime();
    return item.completed && age >= 0 && age < 7*86400000;
  }).length;
  var items = HOME_ROUTINE.map(function(item){
    var checked = !!log.items[item.id];
    return '<button class="home-item'+(checked?' is-done':'')+'" onclick="App.toggleHomeItem(\''+item.id+'\')">'+
      '<span class="home-check">'+(checked?'✓':'')+'</span><span class="home-item-main">'+
      '<span class="home-item-name">'+esc(item.name)+'</span><span class="home-item-dose">'+esc(item.dose)+'</span>'+
      '<span class="home-item-cue">'+esc(item.cue)+'</span></span></button>';
  }).join('');
  return '<div class="home-wrap"><div class="home-hero"><div class="home-kicker">Daily posture + performance</div>'+
    '<h1 class="home-title">Maximum 7-Minute Home Routine</h1><div class="home-sub">One controlled round: 90/90 breathing, high plank, wall slides, dead bug, glute bridge, hip-flexor stretch and adductor rock-backs. Finish feeling better positioned, not exhausted.</div></div>'+
    '<div class="home-progress"><span>Today</span><strong>'+done+' / '+HOME_ROUTINE.length+'</strong></div>'+
    '<div class="home-routine-list">'+items+'</div><div class="home-actions">'+
    '<button class="btn-primary btn-lg" onclick="App.completeHomeRoutine()">Mark all complete</button>'+
    '<button class="btn-ghost btn-sm" onclick="App.resetHomeRoutine()">Reset today</button></div>'+
    '<div class="home-streak">Completed on '+last7+' of the last 7 days.</div></div>';
}
