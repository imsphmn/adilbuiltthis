<style>
/* ============================================================
   Adil Aesthetic App — Complete CSS
   ============================================================ */
:root {
  --bg:         oklch(0.148 0.004 60);
  --bg-soft:    oklch(0.178 0.005 60);
  --card:       oklch(0.205 0.006 60);
  --card-hi:    oklch(0.238 0.008 60);
  --line:       oklch(0.30 0.008 60);
  --line-soft:  oklch(0.255 0.006 60);
  --text:       oklch(0.955 0.004 80);
  --muted:      oklch(0.70 0.008 75);
  --faint:      oklch(0.55 0.008 70);
  --accent:     oklch(0.81 0.125 74);
  --accent-dk:  oklch(0.70 0.12 70);
  --accent-bg:  oklch(0.81 0.125 74 / 0.10);
  --accent-ln:  oklch(0.81 0.125 74 / 0.32);
  --steel:      oklch(0.74 0.055 235);
  --steel-bg:   oklch(0.74 0.055 235 / 0.10);
  --danger:     oklch(0.72 0.15 32);
  --danger-bg:  oklch(0.72 0.15 32 / 0.11);
  --danger-ln:  oklch(0.72 0.15 32 / 0.34);
  --ok:         oklch(0.78 0.13 150);
  --ok-bg:      oklch(0.78 0.13 150 / 0.10);
  --warn:       oklch(0.80 0.13 90);
  --warn-bg:    oklch(0.80 0.13 90 / 0.10);
  --radius:     16px;
  --radius-sm:  11px;
  --nav-h:      60px;
  --mono: ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
input,button,textarea,select { font-family:inherit; font-size:inherit; }
ul,ol { list-style:none; }
a { color:inherit; text-decoration:none; }
p { margin:0; }

/* ============================================================
   SCREENS
   ============================================================ */
#app { min-height:100vh; }
.screen { display:none; min-height:100vh; padding:16px 16px 24px; max-width:600px; margin:0 auto; }
.screen.active { display:block; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; align-items:stretch;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:oklch(0.148 0.004 60 / 0.92);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-top:1px solid var(--line-soft);
}
#bottom-nav.hidden { display:none; }
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--faint);
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  cursor:pointer; padding:8px 4px; min-height:44px; transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-tab svg { width:22px; height:22px; }
.nav-tab--on { color:var(--accent); }
.nav-tab--on svg path { stroke:var(--accent); }

/* ============================================================
   SHARED BUTTONS
   ============================================================ */
.btn-primary {
  display:block; width:100%; padding:14px; border-radius:var(--radius);
  background:var(--accent); color:oklch(0.148 0.004 60);
  font-weight:750; font-size:16px; border:none; cursor:pointer;
  min-height:50px; transition:.12s; -webkit-tap-highlight-color:transparent;
}
.btn-primary:active { opacity:.85; }
.btn-primary:disabled { opacity:.4; cursor:default; }
.btn-primary.btn-xl { font-size:18px; padding:17px; min-height:56px; }
.btn-primary.btn-lg { font-size:16px; padding:14px; }
.btn-ghost {
  display:inline-flex; align-items:center; justify-content:center;
  padding:9px 15px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  font-size:13.5px; font-weight:600; cursor:pointer; min-height:38px;
  transition:.12s; -webkit-tap-highlight-color:transparent;
}
.btn-ghost:active { background:var(--card-hi); }
.btn-ghost.btn-sm { padding:7px 13px; font-size:13px; min-height:34px; }
.btn-ghost.btn-xs { padding:5px 10px; font-size:12px; min-height:30px; }
.btn-ghost.btn-danger { border-color:var(--danger-ln); color:var(--danger); }
.btn-nav {
  background:none; border:none; color:var(--accent); font-size:15px;
  font-weight:600; padding:8px 12px; cursor:pointer; min-height:44px;
}
.btn-nav:disabled { color:var(--faint); cursor:default; }
.btn-finish {
  background:var(--accent-bg); border:1px solid var(--accent-ln);
  color:var(--accent); font-weight:700; font-size:14px;
  padding:9px 16px; border-radius:999px; cursor:pointer; min-height:40px;
  transition:.12s;
}
.btn-finish:active { background:var(--accent-bg); }
.btn-complete {
  display:block; width:100%; padding:15px; border-radius:var(--radius-sm);
  background:var(--accent); color:oklch(0.12 0.004 60);
  font-weight:750; font-size:17px; border:none; cursor:pointer;
  min-height:52px; margin-top:12px; transition:.12s;
  -webkit-tap-highlight-color:transparent;
}
.btn-complete:active { opacity:.85; }
.hidden { display:none !important; }

/* ============================================================
   TODAY SCREEN
   ============================================================ */
.today-wrap { padding-top:12px; }
.resume-banner {
  background:var(--accent-bg); border:1.5px solid var(--accent-ln);
  border-radius:var(--radius); padding:18px; margin-bottom:16px;
}
.rb-title { font-size:13px; font-family:var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px; }
.rb-sub { font-size:15px; color:var(--muted); margin-bottom:14px; }
.rb-actions { display:flex; flex-direction:column; gap:8px; }
.today-day-card {
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px; margin-bottom:14px;
}
.tdc-kicker { font-family:var(--mono); font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
.tdc-day { font-family:var(--mono); font-size:42px; font-weight:800;
  color:var(--accent); line-height:1; margin-bottom:8px; }
.tdc-title { font-size:22px; font-weight:750; letter-spacing:-.015em;
  line-height:1.1; margin-bottom:10px; text-wrap:balance; }
.tdc-muscles { font-size:14px; color:var(--muted); margin-bottom:14px; }
.tdc-meta { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.tdc-meta span { font-size:13.5px; color:var(--faint); font-family:var(--mono); }
.today-picker {
  border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden;
  background:var(--card);
}
.tp-sum {
  list-style:none; cursor:pointer; padding:14px 16px; font-size:14.5px;
  font-weight:600; color:var(--muted); user-select:none;
}
.tp-sum::-webkit-details-marker { display:none; }
.tp-body { padding:0 8px 8px; }
.day-pick-row {
  display:flex; align-items:center; gap:12px; padding:11px 10px;
  border-radius:10px; cursor:pointer; transition:.12s;
  border:1px solid transparent;
}
.day-pick-row:hover { background:var(--bg-soft); }
.day-pick-row.is-next { border-color:var(--accent-ln); background:var(--accent-bg); }
.day-pick-row input[type="radio"] { width:18px; height:18px; accent-color:var(--accent); flex:none; }
.dp-no { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); flex:none; width:44px; }
.dp-title { flex:1; font-size:14px; font-weight:550; }
.dp-dur { font-size:12px; color:var(--faint); font-family:var(--mono); }

/* ============================================================
   WORKOUT OVERLAY
   ============================================================ */
#workout-overlay {
  position:fixed; inset:0; z-index:100; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
}
#workout-overlay.hidden { display:none; }
.wo-header {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:oklch(0.148 0.004 60 / 0.95);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line-soft);
  flex:none;
}
.wo-back { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; min-width:36px; min-height:36px; padding:4px; }
.wo-hinfo { flex:1; min-width:0; }
.wo-htitle { font-size:13px; font-weight:650; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wo-hprog { font-size:12px; color:var(--muted); font-family:var(--mono); }
.wo-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 80px; }

/* prev bar */
.prev-bar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:8px 0 10px; border-bottom:1px solid var(--line-soft);
}
.prev-date { font-size:11.5px; color:var(--faint); font-family:var(--mono); flex:none; }
.prev-item { font-size:12px; color:var(--muted); font-family:var(--mono); background:var(--bg-soft); padding:2px 7px; border-radius:6px; }
.prev-bar--none { font-size:12.5px; color:var(--faint); font-style:italic; padding:8px 0 10px; border-bottom:1px solid var(--line-soft); }

/* exercise card */
.ex-card {
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--card); margin:12px 0; overflow:hidden;
  transition:border-color .2s;
}
.ex-card--done { border-color:var(--accent-ln); }
.exc-head { padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
.exc-meta { margin-bottom:8px; }
.exc-name { display:block; font-size:18px; font-weight:750; letter-spacing:-.01em; line-height:1.2; margin-bottom:3px; }
.exc-target { font-size:13px; color:var(--accent); font-weight:600; }
.exc-badges { display:flex; flex-wrap:wrap; gap:6px; }
.xb { font-size:12px; font-family:var(--mono); font-weight:600; color:var(--faint);
  background:var(--bg-soft); border:1px solid var(--line-soft); border-radius:6px; padding:3px 8px; }

/* set rows */
.set-rows { padding:0 14px; }
.set-row { margin:10px 0; padding:12px; background:var(--bg-soft); border-radius:var(--radius-sm); border:1px solid var(--line-soft); }
.set-row--done { background:var(--ok-bg); border-color:oklch(0.78 0.13 150 / 0.3); }
.set-row--skipped { background:var(--bg); border-color:var(--line-soft); opacity:.6; }
.set-row--active {}
.sr-label { font-size:13.5px; font-weight:700; font-family:var(--mono); color:var(--text); }
.sr-check { color:var(--ok); margin-left:4px; }
.sr-skip-badge { font-size:11px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:2px 7px; color:var(--faint); margin-left:8px; }
.sr-label-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.sr-prev { font-size:12.5px; color:var(--muted); font-family:var(--mono); margin-bottom:10px; }
.sr-prev--none { color:var(--faint); font-style:italic; }
.sr-done-label { font-size:13.5px; font-weight:700; font-family:var(--mono); margin-bottom:4px; }
.sr-done-vals { font-size:16px; font-weight:650; color:var(--text); margin-bottom:8px; }
.sr-rir { font-size:13px; color:var(--muted); }
.sr-done-actions { display:flex; gap:8px; }
.sr-skip-btn { color:var(--faint); }

/* set inputs */
.sr-inputs { display:flex; flex-direction:column; gap:12px; }
.sri-group { display:flex; flex-direction:column; gap:6px; }
.sri-label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; font-family:var(--mono); }
.sri-unit { font-size:10px; color:var(--faint); }
.sri-ctrl { display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.sri-adj {
  flex:none; width:54px; min-height:50px; background:var(--bg-soft);
  border:none; border-right:1px solid var(--line); color:var(--text);
  font-size:22px; font-weight:300; cursor:pointer; display:grid; place-items:center;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.sri-adj:last-child { border-right:none; border-left:1px solid var(--line); }
.sri-adj:active { background:var(--card-hi); }
.sri-inp {
  flex:1; min-height:50px; background:transparent; border:none;
  text-align:center; font-size:22px; font-weight:700; color:var(--text);
  outline:none; padding:0;
}
.sri-inp:focus { background:oklch(0.81 0.125 74 / 0.07); }

/* RIR row */
.rir-row { display:flex; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.rir-btn {
  flex:1; min-height:50px; background:var(--bg-soft); border:none;
  border-right:1px solid var(--line); color:var(--muted);
  font-size:16px; font-weight:700; cursor:pointer;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.rir-btn:last-child { border-right:none; }
.rir-btn--on { background:var(--accent-bg); color:var(--accent); }
.rir-btn:active { background:var(--card-hi); }

/* set add row */
.set-add-row { display:flex; gap:8px; padding:8px 14px 10px; }
.workout-add-ex { display:flex; justify-content:center; padding:18px 0 4px; }
.btn-add-ex { width:100%; max-width:260px; }

/* exercise note */
.ex-note-input {
  display:block; width:100%; background:transparent; border:none;
  border-top:1px solid var(--line-soft); padding:10px 14px; resize:none;
  color:var(--muted); font-size:14px; outline:none;
  min-height:40px;
}
.ex-note-input::placeholder { color:var(--faint); }

/* collapsibles in workout */
.ex-coll-row { border-top:1px solid var(--line-soft); padding:0 14px 2px; }
.ex-coll { border-bottom:1px solid var(--line-soft); }
.ex-coll:last-child { border-bottom:none; }
.ec-sum { list-style:none; padding:11px 0; font-size:13.5px; font-weight:650; color:var(--muted); cursor:pointer; }
.ec-sum::-webkit-details-marker { display:none; }
.ec-body { padding:0 0 12px; }
.coll-list { display:grid; gap:7px; }
.coll-list li { font-size:14px; color:var(--text); position:relative; padding-left:16px; }
.coll-list li::before { content:'·'; position:absolute; left:2px; color:var(--accent); font-weight:700; }
.coll-mist li::before { content:'⚠'; font-size:10px; top:2px; color:var(--danger); }
.coll-tnf, .coll-cbum { font-size:14px; line-height:1.5; color:var(--muted); margin-bottom:8px; }
.coll-tnf b, .coll-cbum b { color:var(--accent); margin-right:5px; }
.coll-cbum b { color:var(--steel); }
.coll-hard { margin-top:8px; padding:10px 12px; background:var(--danger-bg); border-left:3px solid var(--danger); border-radius:0 8px 8px 0; font-size:13.5px; font-weight:600; }

/* finish section */
.wo-finish-section { padding:24px 0 40px; text-align:center; }
.wo-stats { font-size:13px; color:var(--faint); font-family:var(--mono); margin-bottom:14px; }

/* ============================================================
   TIMER PILL
   ============================================================ */
#timer-pill {
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:10px 16px; min-height:50px;
  background:oklch(0.18 0.006 60 / 0.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
}
#timer-pill.hidden { display:none !important; }
.tp-label { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.tp-time { font-size:28px; font-weight:800; color:var(--text); letter-spacing:-.02em; min-width:70px; text-align:center; }
.tp-urgent { color:var(--accent); }
.tp-adj { background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:13px; font-weight:700; padding:6px 10px; min-height:36px; cursor:pointer; }
.tp-skip { background:none; border:none; color:var(--faint); font-size:13px; font-weight:650; cursor:pointer; padding:6px 8px; min-height:36px; }

/* ============================================================
   MODAL OVERLAY
   ============================================================ */
#modal-overlay {
  position:fixed; inset:0; z-index:150; display:flex; align-items:flex-end;
  background:oklch(0 0 0 / 0.6); backdrop-filter:blur(4px);
  padding:0 0 env(safe-area-inset-bottom,0px);
}
#modal-overlay.hidden { display:none !important; }
#modal-overlay > div {
  width:100%; max-height:90vh; overflow-y:auto;
  background:var(--bg-soft); border-radius:24px 24px 0 0;
  padding:20px 18px 32px;
}
.addex-wrap { display:grid; gap:16px; }
.addex-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.addex-title { font-size:20px; font-weight:750; letter-spacing:-.015em; }
.addex-close { background:none; border:none; color:var(--muted); font-size:20px; min-width:40px; min-height:40px; cursor:pointer; }
.addex-section { display:grid; gap:10px; padding:14px; border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--card); }
.addex-label { display:block; font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; }
.addex-input, .addex-select {
  width:100%; min-height:44px; border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--bg); color:var(--text); padding:9px 11px; outline:none;
}
.addex-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.addex-check { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:14px; }
.addex-check input { width:18px; height:18px; accent-color:var(--accent); }
.addex-muted { font-size:13px; color:var(--faint); line-height:1.4; }

/* summary */
.sum-wrap {}
.sum-header { margin-bottom:18px; }
.sum-tag { font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
.sum-title { font-size:22px; font-weight:750; letter-spacing:-.015em; }
.sum-stats { display:flex; gap:0; margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.sum-stat { flex:1; padding:12px; text-align:center; border-right:1px solid var(--line); }
.sum-stat:last-child { border-right:none; }
.ss-val { font-size:20px; font-weight:750; font-family:var(--mono); color:var(--accent); }
.ss-lbl { font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.sum-prs { margin-bottom:14px; }
.sum-pr-item { font-size:14px; color:var(--accent); padding:6px 0; border-bottom:1px solid var(--line-soft); }
.sum-section { margin-top:16px; }
.sum-sec-title { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:10px; font-weight:700; }
.sum-vol-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:15px; }
.sum-vol-m { color:var(--muted); }
.sum-vol-v { font-weight:650; font-family:var(--mono); }
.sum-none { color:var(--faint); font-size:14px; }
.sum-done-btn { margin-top:22px; }

/* ============================================================
   VOLUME SCREEN
   ============================================================ */
.vol-wrap {}
.vol-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:4px 0; }
.vol-wlabel { font-size:14.5px; font-weight:700; }
.vol-sessions { font-size:12.5px; color:var(--faint); font-family:var(--mono); margin-bottom:16px; }

'use strict';
// ============================================================
// STORAGE — schema v2
// ============================================================
var DB_KEY = 'adil_v2';
var TIMER_KEY = 'adil_timer';

function dbLoad() {
  try {
    var raw = localStorage.getItem(DB_KEY);
    if (!raw) return dbDefault();
    var d = JSON.parse(raw);
    if (!d.schemaVersion || d.schemaVersion < 2) return dbMigrateV1(d);
    return d;
  } catch(e) { return dbDefault(); }
}

function dbDefault() {
  return {
    schemaVersion: 2,
    settings: { muscleMappings: null, volumeTargets: null },
    lastCompletedDay: null,
    activeSession: null,
    completedSessions: [],
    legacyData: null,
  };
}

function dbSave(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
}

// ---- v1 migration ----
function dbMigrateV1(old) {
  var db = dbDefault();
  // Preserve old checkbox state and log tables as legacy
  if (old && (old.checks || old.logs)) {
    db.legacyData = { source: 'v1', checks: old.checks||{}, logs: old.logs||{}, importedAt: Date.now() };
  } else if (old) {
    // might be raw old adil_aesthetic_v1 checkbox format
    db.legacyData = { source: 'v1_checks', data: old, importedAt: Date.now() };
  }
  // Try to read old separate keys
  try {
    var oldChecks = localStorage.getItem('adil_aesthetic_v1');
    if (oldChecks) db.legacyData = db.legacyData || {};
    // preserve them under legacyData; don't delete old keys in case user wants them
  } catch(e) {}
  db.schemaVersion = 2;
  return db;
}

// ---- session helpers ----
function newSessionId() { return 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function newSetId()     { return 'set_'  + Date.now() + '_' + Math.random().toString(36).slice(2,5); }

function createSession(dayN) {
  return {
    id: newSessionId(),
    dayN: dayN,
    startTime: Date.now(),
    endTime: null,
    durationMs: null,
    sets: [],
    exerciseOrder: DAYS[dayN] ? DAYS[dayN].exercises.slice() : [],
    customExercises: {},
    notes: '',
    finished: false,
  };
}

function createSet(exId, setNum, setType, side) {
  return {
    id: newSetId(),
    exId: exId,
    setNum: setNum,
    setType: setType || 'working', // 'working'|'warmup'|'drop'|'skip'
    side: side || null,            // null|'L'|'R'
    weight: 0,
    reps: 0,
    rir: null,
    completed: false,
    skipped: false,
    timestamp: null,
  };
}

function newCustomExerciseId() {
  return 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
}

function getExerciseDef(exId, session) {
  if (EX[exId]) return EX[exId];
  if (session && session.customExercises && session.customExercises[exId]) return session.customExercises[exId];
  return null;
}

function getSessionExerciseIds(session) {
  if (!session) return [];
  var day = DAYS[session.dayN];
  var ids = session.exerciseOrder ? session.exerciseOrder.slice() : (day ? day.exercises.slice() : []);
  session.sets.forEach(function(s) {
    if (ids.indexOf(s.exId) === -1) ids.push(s.exId);
  });
  return ids;
}

function normaliseSessionExerciseOrder(session) {
  if (!session) return;
  if (!session.exerciseOrder) session.exerciseOrder = getSessionExerciseIds(session);
}

function exerciseOptionsForSession(session) {
  var used = {};
  getSessionExerciseIds(session).forEach(function(exId) { used[exId] = true; });
  return Object.keys(EX).filter(function(exId) {
    return !used[exId];
  }).sort(function(a,b) {
    var ea = EX[a], eb = EX[b];
    if (ea.day !== eb.day) return ea.day - eb.day;
    if (ea.order !== eb.order) return ea.order - eb.order;
    return ea.name.localeCompare(eb.name);
  });
}

function createExerciseSetsForSession(exId, ex, db) {
  var sets = [];
  var lastSess = getLastExSession(db, exId);
  var prevSets = lastSess ? lastSess.sets : [];
  function prevFor(num, side) {
    for (var i = 0; i < prevSets.length; i++) {
      var ps = prevSets[i];
      if (ps.setNum === num && ps.side === (side||null) && ps.setType === 'working') return ps;
    }
    return null;
  }
  if (ex.uni) {
    for (var i = 1; i <= ex.sDef; i++) {
      ['L','R'].forEach(function(side) {
        var prev = prevFor(i, side);
        var s = createSet(exId, i, 'working', side);
        s.weight = prev ? prev.weight : 0;
        s.reps = prev ? prev.reps : ex.rMin;
        s.rir = null;
        s.suggestedWeight = prev ? prev.weight : null;
        s.suggestedReps = prev ? prev.reps : null;
        sets.push(s);
      });
    }
  } else {
    for (var j = 1; j <= ex.sDef; j++) {
      var prevSet = prevFor(j, null);
      var ns = createSet(exId, j, 'working', null);
      ns.weight = prevSet ? prevSet.weight : 0;
      ns.reps = prevSet ? prevSet.reps : ex.rMin;
      ns.rir = null;
      ns.suggestedWeight = prevSet ? prevSet.weight : null;
      ns.suggestedReps = prevSet ? prevSet.reps : null;
      sets.push(ns);
    }
    if (ex.drop) {
      var prevDrop = prevSets.find(function(s) { return s.setType === 'drop'; });
      var ds = createSet(exId, ex.sDef, 'drop', null);
      ds.weight = prevDrop ? prevDrop.weight : 0;
      ds.reps = prevDrop ? prevDrop.reps : ex.rMin;
      ds.rir = null;
      ds.suggestedWeight = prevDrop ? prevDrop.weight : null;
      ds.suggestedReps = prevDrop ? prevDrop.reps : null;
      sets.push(ds);
    }
  }
  return sets;
}

function makeCustomExerciseDef(form) {
  var name = (form.name || '').trim();
  if (!name) throw new Error('Add an exercise name.');
  var target = (form.target || '').trim() || 'Custom';
  var muscleId = form.muscleId || 'mid-back';
  var sets = Math.max(1, Math.min(10, parseInt(form.sets,10) || 3));
  var rMin = Math.max(1, Math.min(100, parseInt(form.rMin,10) || 8));
  var rMax = Math.max(rMin, Math.min(100, parseInt(form.rMax,10) || rMin));
  var rest = Math.max(15, Math.min(600, parseInt(form.rest,10) || 90));
  var muscles = {};
  muscles[muscleId] = 1;
  return {
    id: form.id,
    day: 0,
    order: 0,
    name: name,
    sMin: sets,
    sMax: sets,
    sDef: sets,
    rMin: rMin,
    rMax: rMax,
    rirMin: 0,
    rirMax: 1,
    rest: rest,
    target: target,
    uni: !!form.uni,
    drop: false,
    muscles: muscles,
    cues: ['Use the same setup every time.', 'Control the rep and keep the target muscle as the limiter.'],
    tnf: 'Custom exercise added during this workout.',
    cbum: 'Keep the rep clean and repeatable.',
    mistakes: ['Changing setup between sets.', 'Letting another muscle take over.', 'Adding load before the movement is stable.'],
    hard: 'Only count reps that match the intended target and range.'
  };
}

// ---- exercise history ----
// Returns array of completed sets for an exercise, most recent first
function getExHistory(db, exId) {
  var sets = [];
  var sessions = db.completedSessions.slice().sort(function(a,b){ return b.startTime - a.startTime; });
  for (var i = 0; i < sessions.length; i++) {
    var sess = sessions[i];
    for (var j = 0; j < sess.sets.length; j++) {
      var s = sess.sets[j];
      if (s.exId === exId && s.completed && !s.skipped && s.setType !== 'warmup') {
        sets.push({ set: s, sessionId: sess.id, sessionTime: sess.startTime, dayN: sess.dayN });
      }
    }
  }
  return sets;
}

// Returns the most recent complete working session for an exercise (non-warmup, completed sets only)
function getLastExSession(db, exId) {
  var sessions = db.completedSessions.slice().sort(function(a,b){ return b.startTime - a.startTime; });
  for (var i = 0; i < sessions.length; i++) {
    var sess = sessions[i];
    var found = sess.sets.filter(function(s) {
      return s.exId === exId && s.completed && !s.skipped && s.setType !== 'warmup';
    });
    if (found.length > 0) return { session: sess, sets: found };
  }
  return null;
}

// ---- volume calculation ----
// Returns { muscleId: totalSets } for a given array of sessions within a date range
function calcVolume(sessions, muscleMappings) {
  var vol = {};
  sessions.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType === 'warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex) return;
      var mmap = (muscleMappings && muscleMappings[s.exId]) ? muscleMappings[s.exId] : ex.muscles;
      var contribution = s.setType === 'drop' ? (ex.dropMuscles || {}) : mmap;
      // For unilateral: only count L side (or null side) once per pair to avoid doubling
      // We handle this by counting 0.5 per side for bilateral volume, but spec says L+R = 1 set
      var multiplier = 1;
      if (ex.uni && s.side !== null) { multiplier = 0.5; } // L + R = 1 set
      Object.keys(contribution).forEach(function(m) {
        vol[m] = (vol[m] || 0) + contribution[m] * multiplier;
      });
    });
  });
  return vol;
}

// Week helpers (Mon-Sun)
function weekStart(date) {
  var d = new Date(date || Date.now());
  var day = d.getDay();
  var diff = (day === 0) ? -6 : 1 - day; // Monday = 0 offset
  var mon = new Date(d);
  mon.setHours(0,0,0,0);
  mon.setDate(d.getDate() + diff);
  return mon.getTime();
}
function weekEnd(weekStartTs) { return weekStartTs + 7*24*60*60*1000 - 1; }

function sessionsInWeek(db, weekStartTs) {
  var ws = weekStartTs, we = weekEnd(weekStartTs);
  return db.completedSessions.filter(function(s) { return s.startTime >= ws && s.startTime <= we; });
}

// ---- PRs ----
// Returns array of PR descriptions for a completed session
function detectPRs(db, session) {
  var prs = [];
  var exIds = [];
  session.sets.forEach(function(s) { if (exIds.indexOf(s.exId) === -1) exIds.push(s.exId); });
  exIds.forEach(function(exId) {
    var ex = getExerciseDef(exId, session);
    if (!ex) return;
    var historySets = getExHistory(db, exId);
    // Remove sets from current session
    var prevSets = historySets.filter(function(h) { return h.sessionId !== session.id; });
    var curSets = session.sets.filter(function(s) { return s.exId === exId && s.completed && !s.skipped && s.setType !== 'warmup'; });
    if (curSets.length === 0 || prevSets.length === 0) return;
    curSets.forEach(function(cur) {
      // Best weight
      var prevBestWeight = Math.max.apply(null, prevSets.map(function(h) { return h.set.weight; }));
      if (cur.weight > prevBestWeight && cur.weight > 0) {
        prs.push({ exId: exId, type:'weight', msg: ex.name + ' — new weight record: ' + cur.weight + ' kg' });
        return;
      }
      // Most reps at same weight
      var sameWeight = prevSets.filter(function(h) { return h.set.weight === cur.weight; });
      if (sameWeight.length > 0) {
        var prevBestReps = Math.max.apply(null, sameWeight.map(function(h) { return h.set.reps; }));
        if (cur.reps > prevBestReps) {
          prs.push({ exId: exId, type:'reps', msg: ex.name + ' — ' + (cur.reps - prevBestReps) + ' more reps at ' + cur.weight + ' kg' });
        }
      }
    });
  });
  // Deduplicate by exId
  var seen = {};
  return prs.filter(function(pr) {
    if (seen[pr.exId + pr.type]) return false;
    seen[pr.exId + pr.type] = true;
    return true;
  });
}

// ---- next day in rotation ----
function nextDay(db) {
  if (db._nextDayOverride) return db._nextDayOverride;
  var last = db.lastCompletedDay;
  if (!last) return 1;
  return (last % 4) + 1;
}

// ---- export / import ----
function exportBackup(db) {
  var out = { version: 2, exported: new Date().toISOString().slice(0,10), data: db };
  var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'adil-v2-' + out.exported + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function importBackup(jsonText, currentDb) {
  var parsed = JSON.parse(jsonText);
  if (parsed.version === 2 && parsed.data) {
    // v2 backup
    var d = parsed.data;
    d.schemaVersion = 2;
    return d;
  } else if (parsed.version === 1 || parsed.checks !== undefined || parsed.logs !== undefined) {
    // v1 backup: preserve as legacy
    currentDb.legacyData = { source: 'v1_import', checks: parsed.checks||{}, logs: parsed.logs||{}, importedAt: Date.now() };
    return currentDb;
  }
  throw new Error('Unrecognised backup format.');
}

// ---- format helpers ----
function fmtTime(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function fmtShortDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}


'use strict';
// ============================================================
// REST TIMER
// ============================================================
var Timer = (function() {
  var _running = false;
  var _start = 0;
  var _duration = 90; // seconds
  var _remaining = 90;
  var _interval = null;
  var _pill = null;
  var _onDone = null;

  function _save() {
    try {
      localStorage.setItem(TIMER_KEY, JSON.stringify({
        running: _running, start: _start, duration: _duration, remaining: _remaining
      }));
    } catch(e) {}
  }

  function _beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.6);
    } catch(e) {}
    try { navigator.vibrate([200, 80, 200]); } catch(e) {}
  }

  function _render() {
    if (!_pill) _pill = document.getElementById('timer-pill');
    if (!_pill) return;
    var r = Math.max(0, _remaining);
    var m = Math.floor(r / 60);
    var s = Math.floor(r % 60);
    var display = m + ':' + (s < 10 ? '0' : '') + s;
    _pill.classList.toggle('hidden', !_running && _remaining >= _duration);
    _pill.innerHTML =
      '<span class="tp-label">REST</span>' +
      '<button class="tp-adj" data-adj="-15" onclick="Timer.adjust(-15)">−15</button>' +
      '<span class="tp-time' + (r <= 10 ? ' tp-urgent' : '') + '">' + display + '</span>' +
      '<button class="tp-adj" data-adj="+15" onclick="Timer.adjust(15)">+15</button>' +
      '<button class="tp-skip" onclick="Timer.skip()">Skip</button>';
    if (!_running) _pill.classList.remove('hidden');
  }

  function _tick() {
    if (!_running) return;
    var elapsed = (Date.now() - _start) / 1000;
    _remaining = Math.max(0, _duration - elapsed);
    _render();
    _save();
    if (_remaining <= 0) {
      _running = false;
      clearInterval(_interval);
      _interval = null;
      _beep();
      _save();
      _render();
      setTimeout(function() {
        if (_pill) _pill.classList.add('hidden');
      }, 4000);
      if (_onDone) _onDone();
    }
  }

  // Handle page visibility (screen lock, tab switch)
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && _running) {
      var elapsed = (Date.now() - _start) / 1000;
      _remaining = Math.max(0, _duration - elapsed);
      if (_remaining <= 0) { _tick(); }
      else { _render(); }
    }
  });

  return {
    start: function(seconds, onDone) {
      if (_interval) clearInterval(_interval);
      _duration = seconds || 90;
      _remaining = _duration;
      _start = Date.now();
      _running = true;
      _onDone = onDone || null;
      _interval = setInterval(_tick, 500);
      _render(); _save();
    },
    restore: function() {
      try {
        var raw = localStorage.getItem(TIMER_KEY);
        if (!raw) return;
        var t = JSON.parse(raw);
        if (!t.running) return;
        var elapsed = (Date.now() - t.start) / 1000;
        _duration = t.duration;
        _remaining = Math.max(0, t.duration - elapsed);
        _start = t.start;
        if (_remaining > 0) {
          _running = true;
          if (_interval) clearInterval(_interval);
          _interval = setInterval(_tick, 500);
        }
        _render();
      } catch(e) {}
    },
    adjust: function(delta) {
      _remaining = Math.max(0, _remaining + delta);
      _start = Date.now() - (_duration - _remaining) * 1000;
      _render(); _save();
    },
    skip: function() {
      _running = false;
      _remaining = 0;
      clearInterval(_interval); _interval = null;
      _save();
      if (_pill) setTimeout(function() { _pill.classList.add('hidden'); }, 400);
      _render();
    },
    isRunning: function() { return _running; },
  };
})();

  // find last session of this day
  var pastSame = db.completedSessions.filter(function(s){ return s.dayN === nDay; }).sort(function(a,b){ return b.startTime-a.startTime; });
  if (pastSame.length) lastDone = pastSame[0].startTime;

  var resumeBanner = active ? (
    '<div class="resume-banner">' +

      '<div class="tdc-meta">' +
        '<span>' + exCount + ' exercises</span>' +

// ============================================================
// WORKOUT INIT
// ============================================================
function initWorkoutSets(dayN, db) {
  var day = DAYS[dayN];
  var sets = [];
  day.exercises.forEach(function(exId) {
    var ex = EX[exId];
    sets = sets.concat(createExerciseSetsForSession(exId, ex, db));
  });
  return sets;
}

// ============================================================
// WORKOUT RENDERER
// ============================================================
function renderWorkout(db) {
  var sess = db.activeSession;
  if (!sess) return '';
  normaliseSessionExerciseOrder(sess);
  var day = DAYS[sess.dayN];
  var exerciseIds = getSessionExerciseIds(sess);

  // Count completed working sets
  var totalWorking = sess.sets.filter(function(s){ return s.setType==='working'||s.setType==='drop'; }).length;
  var doneWorking  = sess.sets.filter(function(s){ return (s.setType==='working'||s.setType==='drop') && s.completed; }).length;
  var exDone = 0;
  exerciseIds.forEach(function(exId) {
    var exSets = sess.sets.filter(function(s){ return s.exId===exId && (s.setType==='working'||s.setType==='drop') && !s.skipped; });
    var allDone = exSets.length>0 && exSets.every(function(s){ return s.completed||s.skipped; });
    if (allDone) exDone++;
  });

  if (!sess.currentExId) {
    var _fx=null;
    for(var _fi=0;_fi<exerciseIds.length;_fi++){
      var _fws=sess.sets.filter(function(s){return s.exId===exerciseIds[_fi]&&(s.setType==='working'||s.setType==='drop');});
      if(!_fws.every(function(s){return s.completed||s.skipped;})){_fx=exerciseIds[_fi];break;}
    }
    sess.currentExId=_fx||exerciseIds[0]; dbSave(db);
  }
  var ov = document.getElementById('workout-overlay');
  ov.innerHTML =
    '<div class="wo-header">' +
      '<button class="wo-back" onclick="App.closeWorkout()">✕</button>' +
      '<div class="wo-hinfo">' +
        '<div class="wo-htitle">Day ' + sess.dayN + ' · ' + day.title + '</div>' +
        '<div class="wo-hprog">' + exDone + ' / ' + exerciseIds.length + ' exercises</div>' +
      '</div>' +
      '<button class="btn-finish" onclick="App.finishWorkout()">Finish</button>' +
    '</div>' +
    '<div class="wo-body" id="wo-body">' +
      exerciseIds.map(function(exId) {
        var _ws=sess.sets.filter(function(s){return s.exId===exId&&(s.setType==='working'||s.setType==='drop');});
        var _dn=_ws.length>0&&_ws.every(function(s){return s.completed||s.skipped;});
        var _st=_dn?'done':(exId===sess.currentExId?'current':'future');
        return renderExCard(exId, sess, db, _st);
      }).join('') +
      '<div class="wo-finish-section">' +
        '<div class="workout-add-ex"><button class="btn-ghost btn-add-ex" onclick="App.openAddExercise()">+ Add exercise</button></div>' +
        '<div class="wo-stats">' + doneWorking + ' sets · ' + sess.sets.filter(function(s){return s.completed;}).reduce(function(a,s){return a+s.reps;},0) + ' total reps</div>' +
        '<button class="btn-primary btn-xl" onclick="App.finishWorkout()">Finish Workout</button>' +
      '</div>' +
    '</div>';
  ov.classList.remove('hidden');

  // Auto-scroll to first incomplete exercise
  setTimeout(function() {
    var first = ov.querySelector('.ex-card:not(.ex-card--done)');
    scrollExIntoView(first, false);
  }, 200);
}

function renderExCard(exId, sess, db, exState) {
  var ex = getExerciseDef(exId, sess);
  if (!ex) return '';
  var exerciseIds = getSessionExerciseIds(sess);
  var exOrder = exerciseIds.indexOf(exId) + 1;
  var exSets = sess.sets.filter(function(s){ return s.exId === exId; });
  var workingSets = exSets.filter(function(s){ return s.setType==='working'||s.setType==='drop'; });
  var allDone = workingSets.length>0 && workingSets.every(function(s){ return s.completed||s.skipped; });
  if (!exState) exState = allDone ? 'done' : 'current';

  if (exState === 'done') {
    var dSets = workingSets.filter(function(s){ return s.completed; });
    var bW = dSets.length ? Math.max.apply(null, dSets.map(function(s){ return s.weight; })) : 0;
    var bR = dSets.length ? dSets.filter(function(s){ return s.weight===bW; }).reduce(function(m,s){ return Math.max(m,s.reps); },0) : 0;
    var summ = dSets.length ? bW+' kg × '+bR : workingSets.length+' sets skipped';
    return '<div class="ex-card ex-card--done" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--done" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-check">✓</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' +
        '<span class="exc-compact-sub">'+dSets.length+' sets · '+esc(summ)+'</span></div>' +
        '<span class="exc-expand-hint">edit ›</span>' +
      '</div></div>';
  }

  if (exState === 'future') {
    return '<div class="ex-card ex-card--future" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--future" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-num">'+String(exOrder).padStart(2,'0')+'</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' +
        '<span class="exc-compact-sub">'+esc(ex.target)+' · '+ex.sDef+' sets · '+ex.rMin+'–'+ex.rMax+' reps</span></div>' +
        '<span class="exc-expand-hint">›</span>' +
      '</div></div>';
  }

  var lastSess = getLastExSession(db, exId);
  var setRows = exSets.map(function(s) {
    var prevSet = lastSess ? (lastSess.sets.find(function(ps){
      return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
    })||null) : null;
    return renderSetRow(s, prevSet, ex);
  }).join('');
  var collapsibles =
    '<div class="ex-coll-row">' +
    mkColl('cue-'+exId,'Cues','<ul class="coll-list">'+ex.cues.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>') +
    mkColl('note-'+exId,'Notes','<div class="coll-tnf"><b>TNF</b> '+esc(ex.tnf)+'</div><div class="coll-cbum"><b>CBum</b> '+esc(ex.cbum)+'</div>') +
    mkColl('err-'+exId,'Mistakes','<ul class="coll-list coll-mist">'+ex.mistakes.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul><div class="coll-hard">'+esc(ex.hard)+'</div>') +
    '</div>';
  var noteVal = (sess.exNotes && sess.exNotes[exId]) || '';
  return '<div class="ex-card ex-card--current" id="exc-'+exId+'">' +
    '<div class="exc-head">' +
      '<div class="exc-meta">' +
        '<span class="exc-name">'+esc(ex.name)+'</span>' +
        '<span class="exc-target">'+esc(ex.target)+'</span>' +
      '</div>' +
      '<div class="exc-badges">' +
        '<span class="xb">'+ex.sDef+(ex.sMin!==ex.sMax?'–'+ex.sMax:'')+' sets</span>' +
        '<span class="xb">'+ex.rMin+'–'+ex.rMax+' reps</span>' +
        '<span class="xb">'+fmtRestLabel(ex.rest)+'</span>' +
      '</div>' +
    '</div>' +
    '<div class="set-rows" id="sets-'+exId+'">'+setRows+'</div>' +
    '<div class="set-add-row">' +
      '<button class="btn-ghost btn-sm" onclick="App.addWorkingSet(\'' + exId + '\')">+ Set</button>' +
      '<button class="btn-ghost btn-sm" onclick="App.addWarmupSet(\'' + exId + '\')">+ Warmup</button>' +
    '</div>' +
    '<textarea class="ex-note-input" placeholder="Exercise note..." rows="1" oninput="App.saveExNote(\'' + exId + '\',this.value)">'+esc(noteVal)+'</textarea>' +
    collapsibles + '</div>';
}


function renderSetRow(s, prevSet, ex) {
  var label = s.setType==='warmup' ? 'WU' : s.setType==='drop' ? 'Drop' : 'Set '+s.setNum+(s.side?' '+s.side:'');
  var delBtn = s.isAdded ? '<button class="sr-del" onclick="App.deleteSet(\'' + s.id + '\')" title="Remove">×</button>' : '';
  if (s.completed) {
    return '<div class="set-row set-row--done" id="sr-'+s.id+'" onclick="App.editSet(\'' + s.id + '\')">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-done-vals">'+s.weight+' kg × '+s.reps+'</span>' +
      '<span class="sr-check">✓</span>'+delBtn+'</div>';
  }
  if (s.skipped) {
    return '<div class="set-row set-row--skipped" id="sr-'+s.id+'">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-skip-badge">Skipped</span>' +
      '<button class="btn-ghost btn-xs" onclick="App.undoSkip(\'' + s.id + '\')">Undo</button>'+delBtn+'</div>';
  }
  var w = s.weight || s.suggestedWeight || 0;
  var r = s.reps   || s.suggestedReps  || ex.rMin;
  var prevLine = prevSet ? ('Prev: '+prevSet.weight+' kg × '+prevSet.reps) : 'First time';
  var targetLine = prevSet ? (prevSet.reps >= ex.rMax ? 'Increase weight' : (prevSet.weight+' kg × '+(prevSet.reps+1))) : '';
  return '<div class="set-row set-row--active" id="sr-'+s.id+'">' +
    '<div class="sr-top">' +
      '<span class="sr-label">'+esc(label)+'</span>' +
      '<span class="sr-prev-line">'+esc(prevLine)+'</span>' +
      (targetLine ? '<span class="sr-target-line">→ '+esc(targetLine)+'</span>' : '') +
      '<button class="sr-skip-lnk" onclick="App.skipSet(\'' + s.id + '\')">Skip</button>'+delBtn+
    '</div>' +
    '<div class="sr-compact-row">' +
      '<div class="sri-ctrl sri-w">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',-2.5)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="decimal" step="0.5" min="0" value="'+w+'" ' +
          'onchange="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)" ' +
          'oninput="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',2.5)">+</button>' +
        '<span class="sri-kg">kg</span>' +
      '</div>' +
      '<div class="sri-ctrl sri-r">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',-1)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="numeric" step="1" min="0" value="'+r+'" ' +
          'onchange="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)" ' +
          'oninput="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',1)">+</button>' +
      '</div>' +
      '<button class="sr-tick" onclick="App.completeSet(\'' + s.id + '\')" aria-label="Complete">✓</button>' +
    '</div></div>';
}

function mkColl(id, label, body) {
  return '<details class="ex-coll"><summary class="ec-sum">' + label + '</summary><div class="ec-body">' + body + '</div></details>';
}

function fmtRestLabel(sec) {
  if (sec >= 60) return Math.floor(sec/60) + (sec%60 ? ':'+('0'+(sec%60)).slice(-2) : '') + ' min';
  return sec + 's';
}

function scrollExIntoView(el, center) {
  var body = document.getElementById('wo-body');
  if (!body || !el) return;
  var elTop = el.offsetTop;
  var target = center
    ? Math.max(0, elTop - (body.offsetHeight - el.offsetHeight) / 2)
    : Math.max(0, elTop - 70);
  body.scrollTo({ top: target, behavior: 'smooth' });
}

'use strict';
// ============================================================
// VOLUME SCREEN
// ============================================================
function renderVolume(db) {
  var ws = weekStart();
  var weekOffset = (db._volumeWeekOffset || 0);
  var viewWs = ws + weekOffset * 7*24*60*60*1000;
  var prevWs  = viewWs - 7*24*60*60*1000;

  var thisSess = sessionsInWeek(db, viewWs);
  var prevSess = sessionsInWeek(db, prevWs);
  var thisVol  = calcVolume(thisSess, null);
  var prevVol  = calcVolume(prevSess, null);

  // planned volume per muscle (from all exercises across 4 days, using sDef)
  var plannedMin = {}, plannedMax = {};
  Object.keys(EX).forEach(function(exId) {
    var ex = EX[exId];
    Object.keys(ex.muscles).forEach(function(m) {
      var contrib = ex.muscles[m];
      var minSets = ex.sMin * contrib;
      var maxSets = ex.sMax * contrib;
      plannedMin[m] = (plannedMin[m]||0) + minSets;
      plannedMax[m] = (plannedMax[m]||0) + maxSets;
    });
  });

  var isThisWeek = weekOffset === 0;
  var isLastWeek = weekOffset === -1;
  var weekLabel = isThisWeek ? 'This week' : isLastWeek ? 'Last week' : fmtShortDate(viewWs) + ' – ' + fmtShortDate(weekEnd(viewWs));

  var muscleRows = Object.keys(MUSCLES).map(function(mId) {
    var mdef = MUSCLES[mId];
    var done  = round1(thisVol[mId] || 0);
    var prev  = round1(prevVol[mId] || 0);
    var tMin  = mdef.min, tMax = mdef.max;
    var pMin  = round1(plannedMin[mId] || 0);
    var pMax  = round1(plannedMax[mId] || 0);
    var pct   = tMax > 0 ? Math.min(100, done / tMax * 100) : 0;
    var status, statusCls;
    if      (done === 0)       { status='—';            statusCls='vs-none';  }
    else if (done < tMin)      { status='Below target'; statusCls='vs-low';   }
    else if (done <= tMax)     { status='On track';     statusCls='vs-ok';    }
    else if (done <= tMax*1.2) { status='Target reached'; statusCls='vs-hit'; }
    else                       { status='Above target'; statusCls='vs-over';  }

    var diff = done - prev;
    var diffTxt = diff > 0 ? '+' + round1(diff) : round1(diff);
    var diffCls = diff > 0 ? 'vd-up' : diff < 0 ? 'vd-dn' : 'vd-flat';

    return '<div class="vol-row" onclick="App.showMuscleDetail(\'' + mId + '\')">' +
      '<div class="vr-top">' +
        '<span class="vr-name">' + mdef.label + '</span>' +
        '<span class="vr-done">' + done + '</span>' +
        '<span class="vr-status ' + statusCls + '">' + status + '</span>' +
      '</div>' +
      '<div class="vr-bar"><div class="vr-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="vr-meta">' +
        '<span class="vr-target">Target ' + tMin + '–' + tMax + ' · Planned ~' + pMin + (pMin!==pMax?'–'+pMax:'') + '</span>' +
        '<span class="vr-prev ' + diffCls + '">vs last: ' + diffTxt + '</span>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="vol-wrap"><div class="screen-title">Volume</div>' +
    '<div class="vol-header">' +
      '<button class="btn-nav" onclick="App.volNavWeek(-1)">‹ Prev</button>' +
      '<span class="vol-wlabel">' + weekLabel + '</span>' +
      '<button class="btn-nav" onclick="App.volNavWeek(1)"' + (isThisWeek ? ' disabled' : '') + '>Next ›</button>' +
    '</div>' +
    '<div class="vol-sessions">' + thisSess.length + ' session' + (thisSess.length!==1?'s':'') + ' this week</div>' +
    '<div class="vol-rows">' + (muscleRows || '<div class="vol-empty">No data yet. Complete workouts to see volume.</div>') + '</div>' +
    '</div>';
}

// ---- Muscle detail modal ----
function renderMuscleDetail(mId, db) {
  var mdef = MUSCLES[mId];
  var ws = weekStart() + (db._volumeWeekOffset||0)*7*24*60*60*1000;
  // last 8 weeks
  var weeks = [];
  for (var i = 7; i >= 0; i--) {
    var wStart = ws - i*7*24*60*60*1000;
    var wSess  = sessionsInWeek(db, wStart);
    var wVol   = calcVolume(wSess, null);
    weeks.push({ wStart: wStart, vol: round1(wVol[mId]||0) });
  }

  // Contributing exercises (this week)
  var thisSess = sessionsInWeek(db, ws);
  var exContribs = {};
  thisSess.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType==='warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex || !ex.muscles[mId]) return;
      var mult = (ex.uni && s.side) ? 0.5 : 1;
      exContribs[s.exId] = (exContribs[s.exId]||0) + ex.muscles[mId]*mult;
    });
  });

  var maxVol = Math.max.apply(null, weeks.map(function(w){ return w.vol; }).concat([1]));
  var chartBars = weeks.map(function(w) {
    var h = maxVol > 0 ? Math.round(w.vol / maxVol * 60) : 0;
    var lbl = new Date(w.wStart).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return '<div class="chart-col"><div class="chart-bar" style="height:' + h + 'px"></div><div class="chart-lbl">' + lbl.replace(' ','<br>') + '</div><div class="chart-val">' + w.vol + '</div></div>';
  }).join('');

  var exRows = Object.keys(exContribs).map(function(exId) {
    var exName = null;
    thisSess.some(function(sess) {
      var ex = getExerciseDef(exId, sess);
      if (ex) { exName = ex.name; return true; }
      return false;
    });
    return '<div class="md-ex-row"><span class="md-ex-name">' + esc(exName || exId) + '</span><span class="md-ex-v">' + round1(exContribs[exId]) + ' sets</span></div>';
  }).join('') || '<div class="md-none">No exercises logged this week.</div>';

  var fourWkAvg = round1(weeks.slice(4).reduce(function(a,w){ return a+w.vol; },0)/4);

  return '<div class="md-wrap">' +
    '<div class="md-header">' +
      '<h2 class="md-title">' + mdef.label + '</h2>' +
      '<button class="md-close" onclick="App.closeMuscleDetail()">✕</button>' +
    '</div>' +
    '<div class="md-stats">' +
      '<div class="md-stat"><div class="mds-val">' + round1(calcVolume(thisSess,null)[mId]||0) + '</div><div class="mds-lbl">This week</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + fourWkAvg + '</div><div class="mds-lbl">4wk avg</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + mdef.min + '–' + mdef.max + '</div><div class="mds-lbl">Target</div></div>' +
    '</div>' +

    var day = DAYS[sess.dayN];
    var dur = sess.durationMs ? fmtTime(sess.durationMs) : '—';
    var workingSets = sess.sets.filter(function(s){ return s.completed && s.setType!=='warmup'; }).length;
    var prs = (sess.prs||[]).length;

    return '<div class="hist-item" id="hi-'+sess.id+'">' +

        '</div>' +

      '</div>';
  }).join('');

  return '<div class="hist-wrap">' + rows + '</div>';

function renderSessionDetail(sess) {
  var day = DAYS[sess.dayN];
  var byEx = {};
  sess.sets.forEach(function(s) { (byEx[s.exId]=byEx[s.exId]||[]).push(s); });
  var detailOrder = getSessionExerciseIds(sess);
  Object.keys(byEx).forEach(function(exId) {
    if (detailOrder.indexOf(exId) === -1) detailOrder.push(exId);
  });

  var exBlocks = detailOrder.map(function(exId) {
    var sets = byEx[exId] || [];
    if (!sets.length) return '';
    var ex = getExerciseDef(exId, sess);
    if (!ex) return '';
    var setLines = sets.map(function(s) {
      var label = s.setType==='warmup' ? 'WU' : s.setType==='drop' ? 'Drop' : 'S' + s.setNum + (s.side?' '+s.side:'');
      var status = s.skipped ? 'skipped' : s.completed ? s.weight+' kg × '+s.reps : '—';
      return '<div class="sd-set"><span class="sd-sl">' + label + '</span><span class="sd-sv">' + status + '</span></div>';
    }).join('');
    return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div>' + setLines + '</div>';
  }).join('');

  var prs = (sess.prs||[]).map(function(pr){ return '<div class="sd-pr">✦ ' + esc(pr.msg) + '</div>'; }).join('');

  return '<div class="sess-detail">' + (prs?'<div class="sd-prs">'+prs+'</div>':'') + exBlocks + '</div>';
}

// ============================================================
// APP — navigation and all action handlers
// ============================================================
var db;
var App = (function() {

  /* ── screen nav ── */
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
    var el = document.getElementById('scr-' + name);
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(function(b) { b.classList.toggle('nav-tab--on', b.dataset.screen === name); });
    // Render on demand
    if (name === 'today')   { el.innerHTML = renderToday(db); }
    if (name === 'volume')  { el.innerHTML = renderVolume(db); }
    if (name === 'history') { el.innerHTML = renderHistory(db); }
    // Program is pre-rendered; only refresh on first visit
    if (name === 'program' && !el.dataset.rendered) {
      el.innerHTML = renderProgram();
      el.dataset.rendered = '1';
    }
    window._currentScreen = name;
  }

  /* ── today ── */
  function setNextDay(n) {
    // Just visual — actual rotation is based on lastCompletedDay
    // This lets user override for one session by calling startWorkout(n) directly
    db._nextDayOverride = parseInt(n, 10);
    dbSave(db);
    showScreen('today');
  }

  function startWorkout(dayN) {
    if (db.activeSession && !db.activeSession.finished) {
      if (!confirm('A workout is already in progress. Discard it and start a new one?')) return;
    }
    var sess = createSession(dayN);
    sess.sets = initWorkoutSets(dayN, db);
    sess.exNotes = {};
    db.activeSession = sess;
    dbSave(db);
    openWorkoutOverlay();
  }

  function resumeWorkout() {
    if (!db.activeSession) return;
    openWorkoutOverlay();
  }

  function discardSession() {
    if (!confirm('Discard the current workout session? This cannot be undone.')) return;
    db.activeSession = null;
    dbSave(db);
    showScreen('today');
  }

  function openWorkoutOverlay() {
    renderWorkout(db);
    document.getElementById('workout-overlay').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.add('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeWorkout() {
    if (db.activeSession && !db.activeSession.finished) {
      var completedAny = db.activeSession.sets.some(function(s){ return s.completed; });
      if (completedAny) {
        if (!confirm('Leave workout? Your logged sets are saved. You can resume later.')) return;
      }
    }
    document.getElementById('workout-overlay').classList.add('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.body.style.overflow = '';
    showScreen('today');
  }

  /* ── set mutations (live workout) ── */
  function getSet(setId) {
    if (!db.activeSession) return null;
    return db.activeSession.sets.find(function(s){ return s.id === setId; }) || null;
  }

  function setWeight(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.weight = Math.max(0, val); dbSave(db);
    // update displayed input without re-render
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp');
    if (inp && document.activeElement !== inp) inp.value = s.weight;
  }
  function adjWeight(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.weight = Math.max(0, Math.round((s.weight + delta) * 10) / 10);
    dbSave(db);
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp[type="number"]');
    if (inp) {
      var row = document.getElementById('sr-' + setId);
      if (row) { var allInps = row.querySelectorAll('.sri-inp'); if (allInps[0]) allInps[0].value = s.weight; }
    }
    // simpler: just update all inputs in the row
    var row = document.getElementById('sr-' + setId);
    if (row) { var wi = row.querySelectorAll('.sri-inp')[0]; if (wi) wi.value = s.weight; }
  }
  function setReps(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.reps = Math.max(0, parseInt(val,10)||0); dbSave(db);
  }
  function adjReps(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.reps = Math.max(0, s.reps + delta); dbSave(db);
    var row = document.getElementById('sr-' + setId);
    if (row) { var ri = row.querySelectorAll('.sri-inp')[1]; if (ri) ri.value = s.reps; }
  }
  function setRir(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.rir = parseInt(val,10)||0; dbSave(db);
    rerenderSetRow(setId);
  }
  function saveExNote(exId, val) {
    if (!db.activeSession) return;
    if (!db.activeSession.exNotes) db.activeSession.exNotes = {};
    db.activeSession.exNotes[exId] = val;
    dbSave(db);
  }

  function completeSet(setId) {
    var s = getSet(setId); if (!s) return;
    if (s.reps <= 0) { alert('Enter reps before logging.'); return; }
    s.completed = true; s.rir = null; s.timestamp = Date.now();
    dbSave(db);
    try { navigator.vibrate(80); } catch(e){}
    rerenderSetRow(setId);
    var ex = getExerciseDef(s.exId, db.activeSession);
    if (ex && s.setType !== 'warmup') Timer.start(ex.rest);
    var exId = s.exId, sess = db.activeSession, exerciseIds = getSessionExerciseIds(sess);
    setTimeout(function() {
      var prescSets = sess.sets.filter(function(ss){
        return ss.exId===exId&&(ss.setType==='working'||ss.setType==='drop')&&!ss.isAdded;
      });
      var allPrescDone = prescSets.length>0&&prescSets.every(function(ss){return ss.completed||ss.skipped;});
      if (allPrescDone) {
        var thisCard = document.getElementById('exc-'+exId);
        if (thisCard) thisCard.outerHTML = renderExCard(exId, sess, db, 'done');
        var exIdx = exerciseIds.indexOf(exId), nextExId = null;
        for (var _i=exIdx+1;_i<exerciseIds.length;_i++) {
          var _nws=sess.sets.filter(function(ss){return ss.exId===exerciseIds[_i]&&(ss.setType==='working'||ss.setType==='drop');});
          if(_nws.length===0||!_nws.every(function(ss){return ss.completed||ss.skipped;})){nextExId=exerciseIds[_i];break;}
        }
        if (nextExId) {
          sess.currentExId = nextExId; dbSave(db);
          var nc = document.getElementById('exc-'+nextExId);
          if (nc) nc.outerHTML = renderExCard(nextExId, sess, db, 'current');
          setTimeout(function(){ var el=document.getElementById('exc-'+nextExId); if(el) scrollExIntoView(el, false); },100);
        }
        var exDone=0;
        exerciseIds.forEach(function(eid){
          var sets=sess.sets.filter(function(s){return s.exId===eid&&(s.setType==='working'||s.setType==='drop')&&!s.skipped;});
          if(sets.length>0&&sets.every(function(s){return s.completed||s.skipped;})) exDone++;
        });
        var hp=document.querySelector('.wo-hprog'); if(hp) hp.textContent=exDone+' / '+exerciseIds.length+' exercises';
      } else {
        var na=document.querySelector('#exc-'+exId+' .set-row--active');
        if(na) scrollExIntoView(na, true);
        updateExCardDoneState(exId);
      }
    }, 150);
  }

  function undoSet(setId) {
    var s = getSet(setId); if (!s) return;
    s.completed = false; s.timestamp = null;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }
  function editSet(setId) { undoSet(setId); }

  function skipSet(setId) {
    var s = getSet(setId); if (!s) return;
    s.skipped = true; s.completed = false;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }
  function undoSkip(setId) {
    var s = getSet(setId); if (!s) return;
    s.skipped = false;
    dbSave(db);
    rerenderSetRow(setId);
    updateExCardDoneState(s.exId);
  }

  function addWorkingSet(exId) {
    if (!db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var exWS = db.activeSession.sets.filter(function(s){ return s.exId===exId&&s.setType==='working'; });
    var nextNum = exWS.length ? Math.max.apply(null,exWS.map(function(s){return s.setNum||1;}))+1 : (ex.sDef+1);
    function mkAdded(side) {
      var ref = exWS.filter(function(s){return s.side===(side||null);});
      ref = ref[ref.length-1] || exWS[exWS.length-1];
      var ns = createSet(exId, nextNum, 'working', side||null);
      ns.weight = ref ? ref.weight : 0; ns.reps = ref ? ref.reps : ex.rMin;
      ns.rir = null; ns.suggestedWeight = ns.weight; ns.suggestedReps = ns.reps; ns.isAdded = true;
      return ns;
    }
    var toAdd = ex.uni ? [mkAdded('L'), mkAdded('R')] : [mkAdded(null)];
    var dropIdx = db.activeSession.sets.findIndex(function(s){return s.exId===exId&&s.setType==='drop';});
    toAdd.forEach(function(ns){ if(dropIdx>=0) db.activeSession.sets.splice(dropIdx++,0,ns); else db.activeSession.sets.push(ns); });
    dbSave(db); rerenderExSets(exId);
  }

  function addWarmupSet(exId) {
    if (!db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var ws = createSet(exId, 0, 'warmup', null);
    ws.weight = 0; ws.reps = ex.rMin; ws.rir = null; ws.isAdded = true;
    var firstIdx = db.activeSession.sets.findIndex(function(s){ return s.exId===exId; });
    if (firstIdx >= 0) db.activeSession.sets.splice(firstIdx, 0, ws);
    else db.activeSession.sets.push(ws);
    dbSave(db); rerenderExSets(exId);
  }

  function openAddExercise() {
    if (!db.activeSession) return;
    normaliseSessionExerciseOrder(db.activeSession);
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = '<div>' + renderAddExerciseModal(db.activeSession) + '</div>';
    modal.classList.remove('hidden');
  }

  function closeAddExercise() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function addExerciseToActiveSession(exId, ex) {
    if (!db.activeSession || !ex) return;
    var sess = db.activeSession;
    normaliseSessionExerciseOrder(sess);
    if (sess.exerciseOrder.indexOf(exId) !== -1) {
      alert('That exercise is already in this workout.');
      return;
    }
    sess.exerciseOrder.push(exId);
    sess.sets = sess.sets.concat(createExerciseSetsForSession(exId, ex, db));
    sess.currentExId = exId;
    dbSave(db);
    closeAddExercise();
    renderWorkout(db);
    setTimeout(function() {
      var card = document.getElementById('exc-' + exId);
      if (card) scrollExIntoView(card, false);
    }, 100);
  }

  function addExistingExercise() {
    if (!db.activeSession) return;
    var sel = document.getElementById('addExistingExercise');
    var exId = sel ? sel.value : '';
    var ex = EX[exId];
    if (!ex) return;
    addExerciseToActiveSession(exId, ex);
  }

  function addCustomExercise() {
    if (!db.activeSession) return;
    var customId = newCustomExerciseId();
    try {
      var ex = makeCustomExerciseDef({
        id: customId,
        name: document.getElementById('customExName').value,
        target: document.getElementById('customExTarget').value,
        muscleId: document.getElementById('customExMuscle').value,
        sets: document.getElementById('customExSets').value,
        rest: document.getElementById('customExRest').value,
        rMin: document.getElementById('customExRMin').value,
        rMax: document.getElementById('customExRMax').value,
        uni: document.getElementById('customExUni').checked
      });
      if (!db.activeSession.customExercises) db.activeSession.customExercises = {};
      db.activeSession.customExercises[customId] = ex;
      addExerciseToActiveSession(customId, ex);
    } catch(err) {
      alert(err.message || 'Could not add exercise.');
    }
  }

  /* ── re-render helpers ── */
  function rerenderSetRow(setId) {
    var s = getSet(setId);
    if (!s) return;
    var ex = getExerciseDef(s.exId, db.activeSession);
    if (!ex) return;
    var lastSess = getLastExSession(db, s.exId);
    var prevSet = lastSess ? (lastSess.sets.find(function(ps){
      return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
    })||null) : null;
    var rowEl = document.getElementById('sr-' + setId);
    if (rowEl) rowEl.outerHTML = renderSetRow(s, prevSet, ex);
  }

  function rerenderExSets(exId) {
    var container = document.getElementById('sets-' + exId);
    if (!container || !db.activeSession) return;
    var ex = getExerciseDef(exId, db.activeSession);
    if (!ex) return;
    var exSets = db.activeSession.sets.filter(function(s){ return s.exId===exId; });
    var lastSess = getLastExSession(db, exId);
    container.innerHTML = exSets.map(function(s) {
      var prevSet = lastSess ? (lastSess.sets.find(function(ps){
        return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
      })||null) : null;
      return renderSetRow(s, prevSet, ex);
    }).join('');
  }

  function updateExCardDoneState(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession, exerciseIds = getSessionExerciseIds(sess);
    var workingSets = sess.sets.filter(function(s){ return s.exId===exId&&(s.setType==='working'||s.setType==='drop'); });
    var allDone = workingSets.length>0&&workingSets.every(function(s){ return s.completed||s.skipped; });
    var card = document.getElementById('exc-'+exId);
    if (card && allDone) card.outerHTML = renderExCard(exId, sess, db, 'done');
    var exDone=0;
    exerciseIds.forEach(function(eid){
      var sets=sess.sets.filter(function(s){return s.exId===eid&&(s.setType==='working'||s.setType==='drop')&&!s.skipped;});
      if(sets.length>0&&sets.every(function(s){return s.completed||s.skipped;})) exDone++;
    });
    var hp=document.querySelector('.wo-hprog'); if(hp) hp.textContent=exDone+' / '+exerciseIds.length+' exercises';
  }

  /* ── finish workout ── */
  function finishWorkout() {
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var incompleteSets = sess.sets.filter(function(s){
      return s.setType==='working' && !s.completed && !s.skipped;
    }).length;
    if (incompleteSets > 0) {
      if (!confirm(incompleteSets + ' planned set(s) are not yet logged. Finish anyway?')) return;
    }
    sess.endTime = Date.now();
    sess.durationMs = sess.endTime - sess.startTime;
    sess.finished = true;
    // Detect PRs
    db.completedSessions.push(sess);  // add first so detectPRs can compare
    sess.prs = detectPRs(db, sess);
    db.lastCompletedDay = sess.dayN;
    delete db._nextDayOverride;
    db.activeSession = null;
    dbSave(db);
    // Show summary
    showSummary(sess);
  }

  function showSummary(sess) {
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = renderSummary(sess, db);
    modal.classList.remove('hidden');
  }

  function closeSummary() {
    var modal = document.getElementById('modal-overlay');
    modal.classList.add('hidden');
    document.getElementById('workout-overlay').classList.add('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.body.style.overflow = '';
    showScreen('today');
  }

  /* ── volume ── */
  function volNavWeek(dir) {
    if (!db._volumeWeekOffset) db._volumeWeekOffset = 0;
    db._volumeWeekOffset = Math.min(0, db._volumeWeekOffset + dir);
    dbSave(db);
    showScreen('volume');
  }

  function showMuscleDetail(mId) {
    var modal = document.getElementById('modal-overlay');
    modal.innerHTML = renderMuscleDetail(mId, db);
    modal.classList.remove('hidden');
  }
  function closeMuscleDetail() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  /* ── history ── */
  function toggleHistItem(sessId) {
    var det = document.getElementById('hd-' + sessId);
    var chev = document.querySelector('#hi-' + sessId + ' .hi-chev');
    if (!det) return;
    det.classList.toggle('hidden');
    if (chev) chev.textContent = det.classList.contains('hidden') ? '›' : '‹';
  }
  function deleteSession(sessId) {
    if (!confirm('Delete this workout session? This cannot be undone.')) return;
    db.completedSessions = db.completedSessions.filter(function(s){ return s.id !== sessId; });
    dbSave(db);
    showScreen('history');
  }

  /* ── export / import ── */
  function doExport() { exportBackup(db); }
  function doImport() { document.getElementById('importFile').click(); }
  function handleImport(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        db = importBackup(e.target.result, db);
        dbSave(db);
        alert('Backup restored.');
        location.reload();
      } catch(err) { alert('Import failed: ' + err.message); }
    };
    reader.readAsText(file);
  }

  /* ── clear data ── */
  function clearWorkoutData() {
    if (!confirm('Clear ALL workout history? This cannot be undone.')) return;
    db.completedSessions = [];
    db.activeSession = null;
    db.lastCompletedDay = null;
    dbSave(db);
    showScreen('today');
  }
  function clearActiveSession() {
    if (!confirm('Clear the current active session only?')) return;
    db.activeSession = null;
    dbSave(db);
    showScreen('today');
  }

  function expandExCard(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession, oldId = sess.currentExId;
    if (oldId && oldId !== exId) {
      var oc = document.getElementById('exc-'+oldId);
      if (oc) {
        var ows=sess.sets.filter(function(s){return s.exId===oldId&&(s.setType==='working'||s.setType==='drop');});
        oc.outerHTML = renderExCard(oldId, sess, db, ows.length>0&&ows.every(function(s){return s.completed||s.skipped;}) ? 'done' : 'future');
      }
    }
    sess.currentExId = exId; dbSave(db);
    var card = document.getElementById('exc-'+exId);
    if (card) card.outerHTML = renderExCard(exId, sess, db, 'current');
    setTimeout(function(){ var nc=document.getElementById('exc-'+exId); if(nc) scrollExIntoView(nc, false); },100);
  }

  function deleteSet(setId) {
    if (!db.activeSession) return;
    var s = getSet(setId); if (!s||!s.isAdded) return;
    if (!confirm('Remove this set?')) return;
    var exId = s.exId;
    db.activeSession.sets = db.activeSession.sets.filter(function(ss){ return ss.id!==setId; });
    dbSave(db); rerenderExSets(exId);
  }

  return {
    showScreen: showScreen,
    setNextDay: setNextDay,
    startWorkout: startWorkout,
    resumeWorkout: resumeWorkout,
    discardSession: discardSession,
    closeWorkout: closeWorkout,
    finishWorkout: finishWorkout,
    closeSummary: closeSummary,
    completeSet: completeSet,
    undoSet: undoSet,
    editSet: editSet,
    skipSet: skipSet,
    undoSkip: undoSkip,
    adjWeight: adjWeight,
    setWeight: setWeight,
    adjReps: adjReps,
    setReps: setReps,
    setRir: setRir,
    addWorkingSet: addWorkingSet,
    addWarmupSet: addWarmupSet,
    openAddExercise: openAddExercise,
    closeAddExercise: closeAddExercise,
    addExistingExercise: addExistingExercise,
    addCustomExercise: addCustomExercise,
    saveExNote: saveExNote,
    expandExCard: expandExCard,
    deleteSet: deleteSet,
    volNavWeek: volNavWeek,
    showMuscleDetail: showMuscleDetail,
    closeMuscleDetail: closeMuscleDetail,
    toggleHistItem: toggleHistItem,
    deleteSession: deleteSession,
    doExport: doExport,
    doImport: doImport,
    handleImport: handleImport,
    clearWorkoutData: clearWorkoutData,
    clearActiveSession: clearActiveSession,
  };
})();

// ============================================================
// INIT
// ============================================================
function initApp() {
  db = dbLoad();

  // Close modal overlay on backdrop click
  var modal = document.getElementById('modal-overlay');
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.classList.add('hidden');
    });
  }

  // Bottom nav
  document.querySelectorAll('.nav-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      App.showScreen(btn.dataset.screen);
    });
  });

  // Import file input
  var imp = document.getElementById('importFile');
  if (imp) imp.addEventListener('change', function(e) { App.handleImport(e.target.files[0]); });

  // Restore timer if running
  Timer.restore();

  // Show today by default
  App.showScreen('today');
}

document.addEventListener('DOMContentLoaded', initApp);

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
