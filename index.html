function renderWorkout(db) {
  var sess = db.activeSession;
  if (!sess) return '';
  normaliseSessionExerciseOrder(sess);
  if (applySessionTimerCap(sess)) dbSave(db);
  var day = Object.assign({}, DAYS[sess.dayN], {title:getSessionDayTitle(sess)});
  var exerciseIds = getSessionExerciseIds(sess);

  // Count completed working sets
  var totalWorking = sess.sets.filter(function(s){ return s.setType==='working'&&isEffectiveWorkingSet(s, sess); }).length;
  var doneWorking  = sess.sets.filter(function(s){ return s.setType==='working'&&isEffectiveWorkingSet(s, sess) && s.completed; }).length;
  var exDone = 0;
  exerciseIds.forEach(function(exId) {
    if (isExerciseComplete(sess, exId)) exDone++;
  });

  if (!sess.currentExId) {
    var _fx=null;
    for(var _fi=0;_fi<exerciseIds.length;_fi++){
      var _fws=sess.sets.filter(function(s){return isRequiredSessionSet(s,sess)&&s.exId===exerciseIds[_fi];});
      if(!_fws.every(function(s){return s.completed||s.skipped;})){_fx=exerciseIds[_fi];break;}
    }
    sess.currentExId=_fx||exerciseIds[0]; dbSave(db);
  }
  var progress=getWorkoutProgress(sess),pct=progress.percent;
  var rushedControl = sess.rushedModeApplied ? '<div class="rushed-banner">'+esc(getRushedModeDescription(sess))+'</div>' : '';
  var rushedButton = sess.rushedModeApplied ? '' : '<button type="button" class="btn-ghost btn-sm btn-rushed" aria-label="Rushed mode" onclick="App.applyRushedMode()">'+icon('hourglass')+'Rushed</button>';
  var lateralMakeup=renderSundayLateralMakeupAction(sess);
  var ov = document.getElementById('workout-overlay');
  ov.innerHTML =
    '<div class="wo-body" id="wo-body">' +
    '<div class="wo-header">' +
      '<button class="wo-back" onclick="App.closeWorkout()" aria-label="Close workout">'+icon('close')+'</button>' +
      '<div class="wo-hinfo"><div class="wo-htitle">' + esc(getSessionLabel(sess)) + '</div></div>' +
      '<button class="btn-finish" onclick="App.finishWorkout()">Finish</button>' +
      '<div class="wo-session-meta"><span class="wo-hprog">' + exDone + ' of ' + exerciseIds.length + ' exercises</span><span class="wo-session-clock" id="wo-session-clock" role="timer" aria-label="Workout time">' + tnumHtml(fmtTime(getSessionElapsedMs(sess))) + '</span><span class="wo-theme-label" id="wo-theme-label" hidden></span></div>' +
      '<div class="wo-progress" role="progressbar" aria-label="Planned sets completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-valuetext="'+progress.done+' of '+progress.expected+' '+progress.label+' completed"><i id="wo-progress-fill" style="width:'+pct+'%"></i></div>' +
    '</div>' +
    '<div class="wo-content">' +
      '<div class="workout-tools"><button type="button" class="btn-ghost btn-sm" aria-label="Switch workout" onclick="App.chooseWorkout()">'+icon('swap')+'Switch</button><button type="button" class="btn-ghost btn-sm" aria-label="Start rest timer" onclick="App.startRest()">'+icon('timer')+'Rest</button>'+rushedButton+'</div>' + rushedControl + '<div id="eng-challenge">'+Engagement.renderChallenge(db,sess)+'</div>' +
      exerciseIds.map(function(exId) {
        var _dn=isExerciseComplete(sess, exId);
        var _st=_dn?'done':(exId===sess.currentExId?'current':'future');
        return renderExCard(exId, sess, db, _st);
      }).join('') +
      lateralMakeup+
      '<div class="wo-finish-section">' +
        '<div class="workout-add-ex"><button class="btn-ghost btn-add-ex" onclick="App.openAddExercise()">Add exercise</button></div>' +
        '<div class="wo-stats" id="wo-stats">' + workoutStatsHtml(sess) + '</div>' +
        '<button class="btn-primary btn-xl" onclick="App.finishWorkout()">Finish workout</button>' +
      '</div>' +
    '</div></div>';
  ov.classList.remove('hidden');
  if(typeof Cardio!=='undefined')Cardio.onNavigate('workout');
  document.body.classList.add('workout-view');
  applyMomentumTheme(db,true);
  SessionClock.start();Timer.refresh();
  syncStorageNotice();

  // Auto-scroll to first incomplete exercise
  setTimeout(function() {
    var first = ov.querySelector('.ex-card:not(.ex-card--done)');
    if(first&&first.id==='exc-'+exerciseIds[0]&&!sess.sets.some(function(r){return r.completed;})){var body=document.getElementById('wo-body');if(body)body.scrollTop=0;}else if(sess.engagementChallenge&&first&&first.id==='exc-'+sess.engagementChallenge.exerciseId&&!sess.sets.some(function(r){return r.exId===sess.engagementChallenge.exerciseId&&r.completed;})){var body=document.getElementById('wo-body');if(body)body.scrollTop=0;}else scrollExIntoView(first, false);
  }, 200);
}

function renderExCard(exId, sess, db, exState) {
  var ex = getExerciseDef(exId, sess);
  if (!ex) return '';
  var exerciseIds = getSessionExerciseIds(sess);
  var exOrder = exerciseIds.indexOf(exId) + 1;
  var substitutedForId = sess.substitutions && sess.substitutions[exId];
  var slotForExercise=(sess.programmeSnapshot&&sess.programmeSnapshot.slots||[]).find(function(slot){return slot.exerciseId===exId||substitutedForId===slot.exerciseId;});
  var substitutedFor = substitutedForId ? getExerciseDef(substitutedForId, sess) : null;
  var substitutionLabel = substitutedFor ? '<span class="sub-label">Substituted for '+esc(substitutedFor.name)+'</span>' : '';
  var unknownLabel = ex.unknown ? '<span class="sub-label">Saved ID: '+esc(ex.rawId)+'</span>' : '';
  var rushedLabel = sess.rushedReductions && slotForExercise&&sess.rushedReductions[slotForExercise.slotId]
    ? '<span class="rushed-tag">Reduced by Rushed Mode</span>' : '';
  var optionalLabel = ex.optional ? '<span class="optional-day-tag">OPTIONAL</span>' : '';
  var exSets = sess.sets.filter(function(s){ return s.exId === exId; });
  if (ex.nonHypertrophy) return renderNonHypertrophyCard(exId, sess, ex, exState);
  var workingSets = exSets.filter(function(s){ return isRequiredSessionSet(s, sess); });
  var allDone = workingSets.length>0 && workingSets.every(function(s){ return s.completed||s.skipped; });
  if (!exState) exState = allDone ? 'done' : 'current';

  if (exState === 'done') {
    var dSets = workingSets.filter(function(s){ return s.completed; });
    var summ = dSets.length ? dSets.map(formatSessionSetLine).join(', ') : workingSets.length+' sets skipped';
    return '<div class="ex-card ex-card--done" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--done" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-check">'+icon('check')+'</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' + substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
        '<span class="exc-compact-sub">'+esc(summ)+'</span></div>' +
        '<span class="exc-expand-hint">Edit</span>' +
      '</div><div class="ex-compact-perf">'+renderCompactExerciseRecords(db,exId,slotForExercise&&slotForExercise.slotId)+'</div></div>';
  }

  if (exState === 'future') {
    return '<div class="ex-card ex-card--future" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--future" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-num">'+exOrder+'</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' + substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
        '<span class="exc-compact-sub">'+ex.sDef+' sets of '+ex.rMin+'–'+ex.rMax+(ex.timed?' sec':' reps')+', '+esc(String(ex.target||'').toLowerCase())+'</span></div>' +
        icon('chevron','chev') +
      '</div><div class="ex-compact-perf">'+renderCompactExerciseRecords(db,exId,slotForExercise&&slotForExercise.slotId)+'</div></div>';
  }

  var slotIdForExercise=slotForExercise&&slotForExercise.slotId;
  var performanceBox=renderCompactExerciseRecords(db,exId,slotIdForExercise,slotForExercise);
  var setRows = exSets.map(function(s) {
    return renderSetRow(s,getPreviousPerformanceSet(db,exId,s),ex);
  }).join('');
  var collapsibles=renderCoachingTips(ex,sess,slotForExercise);
  var noteVal = (sess.exNotes && sess.exNotes[exId]) || '';
  return '<div class="ex-card ex-card--current" id="exc-'+exId+'">' +
    '<div class="exc-head">' +
      '<div class="exc-meta">' +
        '<span class="exc-order" aria-hidden="true">'+exOrder+'</span><span class="exc-name">'+esc(ex.name)+'</span>' +
        '<span class="exc-target">'+esc(ex.target)+'</span>' +
        substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
      '</div>' +
      '<div class="exc-badges">' +
        '<span class="xb"><b>'+ex.sDef+(ex.sMin!==ex.sMax?'–'+ex.sMax:'')+'</b> sets</span>' +
        '<span class="xb"><b>'+ex.rMin+'–'+ex.rMax+'</b>'+(ex.timed?' sec':' reps')+'</span>' +
        '<span class="xb"><b>'+esc(slotForExercise?fmtRestNice(slotForExercise.restMin,slotForExercise.restMax):fmtRestNice(ex.rest,ex.rest))+'</b> rest</span>' +
      '</div>' +
      '<div id="performance-'+exId+'">'+performanceBox+'</div>' +
    '</div>' +
    '<div class="set-rows" id="sets-'+exId+'">'+setRows+'</div>' +
    '<div class="set-add-row">' +
      '<button class="btn-ghost btn-sm" onclick="App.addWorkingSet(\'' + exId + '\')">Add set</button>' +
    '</div>' +
    (SUBSTITUTIONS[exId] ? '<div class="sub-action"><button class="btn-ghost btn-sm" onclick="App.openSubstitution(\''+exId+'\')">Substitute exercise</button></div>' : '') +
    '<textarea class="ex-note-input" placeholder="Add a note" rows="1" oninput="App.saveExNote(\'' + exId + '\',this.value)">'+esc(noteVal)+'</textarea>' +
    collapsibles + '</div>';
}



function isFirstWarmupCandidate(set, ex) {
  if (!db || !db.activeSession || !set || set.setType !== 'working'||ex&&ex.timed) return false;
  var sets = db.activeSession.sets.filter(function(s){ return s.exId === set.exId; });
  if (sets.some(function(s){ return s.isWarmupMarked; })) return false;
  var working = sets.filter(function(s){ return s.setType === 'working'&&!s.isAdded; }).sort(function(a,b){ return (a.setNum||0)-(b.setNum||0); });
  if (!working.length) return false;
  var firstNum = working[0].setNum;
  var firstRound=working.filter(function(item){return item.setNum===firstNum;});
  return set.setNum === firstNum && firstRound.every(function(item){return !setHasStarted(item);}) && (!ex.uni || set.side === 'L');
}

function renderSetRow(s, prevSet, ex) {
  if(ex.timed||s.measurementMode==='timed')return renderTimedSetRow(s,prevSet,ex);
  var label = s.setType==='warmup' ? 'Warm-up'+(s.side?' '+s.side:'') : s.setType==='drop' ? 'Drop'+(s.side?' '+s.side:'') : 'Set '+s.setNum+(s.side?' '+s.side:'');
  var units=s.units||'kg';
  var delBtn = s.isAdded ? '<button class="sr-del" onclick="App.deleteSet(\'' + s.id + '\')" title="Remove">×</button>' : '';
  if (s.completed) {
    return '<div class="set-row set-row--done" id="sr-'+s.id+'" onclick="App.editSet(\'' + s.id + '\')">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-done-vals">'+esc(formatSessionSetLine(s))+'</span>' +
      '<span class="sr-check">✓</span>'+delBtn+'</div>';
  }
  if (s.skipped) {
    return '<div class="set-row set-row--skipped" id="sr-'+s.id+'">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-skip-badge">'+(s.rushedMode ? 'Rushed Mode' : 'Skipped')+'</span>' +
      '<button class="btn-ghost btn-xs" onclick="App.undoSkip(\'' + s.id + '\')">Undo</button>'+delBtn+'</div>';
  }
  var w = s.weight !== undefined && s.weight !== null ? s.weight : s.suggestedWeight || 0;
  var r = s.reps !== undefined && s.reps !== null ? s.reps : s.suggestedReps !== undefined && s.suggestedReps !== null ? s.suggestedReps : ex.rMin;
  var prevLine = prevSet ? ('Last: '+formatPerformanceLine(prevSet)) : 'First time';
  var bodyweight=s.measurementMode==='bodyweight';
  var warmupBtn = isFirstWarmupCandidate(s, ex) ? '<button class="btn-ghost btn-xs warmup-toggle" onclick="App.markFirstSetWarmup(\''+s.exId+'\')">Warm-up</button>' : '';
  return '<div class="set-row set-row--active" id="sr-'+s.id+'">' +
    '<div class="sr-top">' +
      '<span class="sr-label">'+esc(label)+'</span>' +
      '<span class="sr-prev-line">'+esc(prevLine)+'</span>' +
      warmupBtn + '<button class="sr-skip-lnk" onclick="App.skipSet(\'' + s.id + '\')">Skip</button>'+delBtn+
    '</div>' +
    '<div class="sr-compact-row">' +
      '<div class="sri-ctrl sri-w">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',-2.5)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="decimal" step="0.5" min="0" value="'+(bodyweight?'':w)+'" '+(bodyweight?'placeholder="BW"':'')+' ' +
          'onchange="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)" ' +
          'oninput="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',2.5)">+</button>' +
        '<span class="sri-kg"'+(bodyweight?' title="Bodyweight; enter added kilograms only if used."':'')+'>'+(bodyweight?'BW':esc(units))+'</span>' +
      '</div>' +
      '<div class="sri-ctrl sri-r">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',-1)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="numeric" step="1" min="0" value="'+r+'" ' +
          'onchange="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)" ' +
          'oninput="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',1)">+</button>' +
      '</div>' +
      '<button class="sr-tick" onclick="App.completeSet(\'' + s.id + '\')" aria-label="Log set">'+icon('check')+'</button>' +
    '</div></div>';
}

function fmtRestLabel(sec) {
  if (sec >= 60) return Math.floor(sec/60) + (sec%60 ? ':'+('0'+(sec%60)).slice(-2) : '') + ' min';
  return sec + 's';
}
function fmtRestRange(min,max) { return fmtRestLabel(min)+(min===max?'':'–'+fmtRestLabel(max)); }

function scrollExIntoView(el, center) {
  var body = document.getElementById('wo-body');
  if (!body || !el) return;
  var elTop = el.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
  var target = center
    ? Math.max(0, elTop - (body.clientHeight - el.offsetHeight) / 2)

function renderVolume(db) {
  var ws = weekStart();
  var weekOffset = (db._volumeWeekOffset || 0);
  var viewWs = addLocalCalendarDays(ws,weekOffset*7);
  var prevWs  = addLocalCalendarDays(viewWs,-7);

  var thisSess = sessionsInWeek(db, viewWs);
  var prevSess = sessionsInWeek(db, prevWs);
  var thisVol  = calcVolume(thisSess, null), directVol=calcDirectVolume(thisSess,null);
  var prevVol  = calcVolume(prevSess, null);
  var isThisWeek = weekOffset === 0;
  var isLastWeek = weekOffset === -1;
  var programmeVolumeRows=ALL_DAY_NUMBERS.map(function(dayN){return '<div class="volume-program-row"><strong>'+esc(DAYS[dayN].title)+'</strong><span>'+esc(DAYS[dayN].directSummary)+'</span></div>';}).join('');

  var weekLabel = isThisWeek ? 'This week' : isLastWeek ? 'Last week' : fmtShortDate(viewWs) + ' – ' + fmtShortDate(weekEnd(viewWs));

  var muscleRows = Object.keys(MUSCLES).map(function(mId) {
    var mdef = MUSCLES[mId];
    var done  = round1(thisVol[mId] || 0);
    var prev  = round1(prevVol[mId] || 0);
    var adaptiveTarget = isThisWeek ? getRecommendationTarget(db, mId) : {min:mdef.min,max:mdef.max};
    var tMin  = adaptiveTarget.min, tMax = adaptiveTarget.max;
    var pct   = tMax > 0 ? Math.min(100, done / tMax * 100) : 0;
    var status, statusCls;
    if      (done === 0)       { status='No sets';      statusCls='vs-none';  }
    else if (done < tMin)      { status='Below target'; statusCls='vs-low';   }
    else if (done <= tMax)     { status='On track';     statusCls='vs-ok';    }
    else if (done <= tMax*1.2) { status='Target reached'; statusCls='vs-hit'; }
    else                       { status='Above target'; statusCls='vs-over';  }

    var diff = done - prev;
    var diffTxt = diff > 0 ? '+' + round1(diff) : round1(diff);
    var diffCls = diff > 0 ? 'vd-up' : diff < 0 ? 'vd-dn' : 'vd-flat';

    return '<div class="vol-row" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();App.showMuscleDetail(\'' + mId + '\');}" onclick="App.showMuscleDetail(\'' + mId + '\')">' +
      '<div class="vr-top">' +
        '<span class="vr-name">' + mdef.label + '</span>' +
        '<span class="vr-done">' + done + '</span>' +
        '<span class="vr-status ' + statusCls + '">' + status + '</span>' +
      '</div>' +
      '<div class="vr-bar"><div class="vr-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="vr-meta">' +
        '<span class="vr-target">Target ' + tMin + '–' + tMax + '</span>' +
        '<span class="vr-target">' + round1(directVol[mId]||0) + ' direct, about ' + round1(Math.max(0,done-(directVol[mId]||0))) + ' indirect</span>' +
        '<span class="vr-prev ' + diffCls + '">' + diffTxt + ' on last week</span>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="vol-wrap">' +
    '<div class="vol-header">' +
      '<button class="btn-nav" onclick="App.volNavWeek(-1)">‹ Prev</button>' +
      '<span class="vol-wlabel">' + weekLabel + '</span>' +
      '<button class="btn-nav" onclick="App.volNavWeek(1)"' + (isThisWeek ? ' disabled' : '') + '>Next ›</button>' +
    '</div>' +
    '<div class="vol-sessions">' + thisSess.length + ' workout' + (thisSess.length!==1?'s':'') + ' logged</div>' +
    '<details class="volume-program-summary"><summary>Direct sets per workout</summary><div>'+programmeVolumeRows+'</div></details>' +
    '<div class="rec-note">Completed direct working sets are shown separately from estimated indirect set-equivalents. Drops stay in the exercise record and are not converted into fractional working sets.</div>' +
    '<div class="vol-rows">' + (muscleRows || '<div class="vol-empty">No data yet. Complete workouts to see volume.</div>') + '</div>' +
    '</div>';
}

// ---- Muscle detail modal ----
function renderMuscleDetail(mId, db) {
  var mdef = MUSCLES[mId];
  var ws = addLocalCalendarDays(weekStart(),(db._volumeWeekOffset||0)*7);
  // last 8 weeks
  var weeks = [];
  for (var i = 7; i >= 0; i--) {
    var wStart = addLocalCalendarDays(ws,-i*7);
    var wSess  = sessionsInWeek(db, wStart);
    var wVol   = calcVolume(wSess, null);
    weeks.push({ wStart: wStart, vol: round1(wVol[mId]||0) });
  }

  // Contributing exercises (this week)
  var thisSess = sessionsInWeek(db, ws);
  var exContribs = {};
  thisSess.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType==='warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex || !ex.muscles[mId]) return;
      var mult = (ex.uni && s.side) ? 0.5 : 1;
      exContribs[s.exId] = (exContribs[s.exId]||0) + ex.muscles[mId]*mult;
    });
  });

  var maxVol = Math.max.apply(null, weeks.map(function(w){ return w.vol; }).concat([1]));
  var chartBars = weeks.map(function(w) {
    var h = maxVol > 0 ? Math.round(w.vol / maxVol * 60) : 0;
    var lbl = new Date(w.wStart).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return '<div class="chart-col"><div class="chart-bar" style="height:' + h + 'px"></div><div class="chart-lbl">' + lbl.replace(' ','<br>') + '</div><div class="chart-val">' + w.vol + '</div></div>';
  }).join('');

  var exRows = Object.keys(exContribs).map(function(exId) {
    var exName = null;
    thisSess.some(function(sess) {
      var ex = getExerciseDef(exId, sess);
      if (ex) { exName = ex.name; return true; }
      return false;
    });
    return '<div class="md-ex-row"><span class="md-ex-name">' + esc(exName || exId) + '</span><span class="md-ex-v">' + round1(exContribs[exId]) + ' sets</span></div>';
  }).join('') || '<div class="md-none">No exercises logged this week.</div>';

  var fourWkAvg = round1(weeks.slice(4).reduce(function(a,w){ return a+w.vol; },0)/4);

  return '<div class="md-wrap">' +
    '<div class="md-header">' +
      '<h2 class="md-title">' + mdef.label + '</h2>' +
      '<button class="md-close" onclick="App.closeMuscleDetail()">✕</button>' +
    '</div>' +
    '<div class="md-stats">' +
      '<div class="md-stat"><div class="mds-val">' + round1(calcVolume(thisSess,null)[mId]||0) + '</div><div class="mds-lbl">This week</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + fourWkAvg + '</div><div class="mds-lbl">4wk avg</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + mdef.min + '–' + mdef.max + '</div><div class="mds-lbl">Target</div></div>' +
    '</div>' +
    '<div class="md-chart"><div class="chart-bars">' + chartBars + '</div></div>' +
    '<div class="md-section"><div class="md-sec-title">Exercises this week</div>' + exRows + '</div>' +
    '</div>';
}

function renderSessionDetail(sess) {
  var day = DAYS[sess.dayN];
  var byEx = {};
  sess.sets.forEach(function(s) { (byEx[s.exId]=byEx[s.exId]||[]).push(s); });
  var detailOrder = getSessionExerciseIds(sess);
  Object.keys(byEx).forEach(function(exId) {
    if (detailOrder.indexOf(exId) === -1) detailOrder.push(exId);
  });

  var exBlocks = detailOrder.map(function(exId) {
    var sets = byEx[exId] || [];
    if (!sets.length) return '';
    var ex = getExerciseDef(exId, sess);
    if (!ex) return '';
    if (ex.nonHypertrophy) {
      var activity = sets.find(function(set){ return set.setType === 'activity'; }) || sets[0];
      var activityStatus = activity.completed ? 'Completed' : activity.skipped ? 'Skipped' : 'Not completed';
      var activityNote = sess.exNotes && sess.exNotes[exId] ? '<div class="addex-muted">Note: '+esc(sess.exNotes[exId])+'</div>' : '';
      return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div><div class="sd-set"><span class="sd-sl">Activity</span><span class="sd-sv">'+activityStatus+'</span></div>'+activityNote+'</div>';
    }
    var setLines = sets.map(function(s) {
      var label = s.setType==='warmup' ? 'WU' : s.setType==='drop' ? 'Drop' : 'S' + s.setNum + (s.side?' '+s.side:'');
      var status = s.skipped ? 'skipped ('+esc(s.skipReason||'manual')+')' : s.completed ? esc(formatSessionSetLine(s)) : setHasStarted(s)?'Draft '+esc(formatSessionSetLine(s)):'Not logged';
      return '<div class="sd-set"><span class="sd-sl">' + label + '</span><span class="sd-sv">' + status + '</span></div>';
    }).join('');
    var historyMeta = ex.unknown ? '<div class="addex-muted">Saved ID: '+esc(ex.rawId)+'</div>' : '';
    var originalId = sess.substitutions && sess.substitutions[exId];
    if (originalId) historyMeta += '<div class="addex-muted">Substituted for '+esc(getExerciseDef(originalId, sess).name)+'</div>';
    return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div>' + historyMeta + setLines + '</div>';
  }).join('');

  var prs = (sess.prs||[]).map(function(pr){ return '<div class="sd-pr">' + esc(prettyPrMsg(pr.msg)) + '</div>'; }).join('');

  return '<div class="sess-detail">' +
    (sess.rushedModeApplied ? '<div class="rushed-banner">'+esc(getRushedModeDescription(sess))+'<br>Actual work shown below; this is not completion of the unreduced prescription.</div>' : '') +
    (sess.timerStopReason === 'automatic_3_hour_cap' && sess.timerCapStatus==='capped' ? '<div class="timer-cap-banner">Timer auto-stopped at 3:00:00</div>' : sess.timerCapStatus==='uncertain'?'<div class="timer-cap-banner">Older timer-cap marker is uncertain.</div>':'') +
    (prs?'<div class="sd-prs">'+prs+'</div>':'') + Engagement.renderSessionAchievements(sess,db) + exBlocks + '</div>';
}

function localDateKey(ts) {
  var d = ts ? new Date(ts) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getHomeLog(dbRef, dateKey, create) {
  var key = dateKey || localDateKey();
  var log = (dbRef.homeRoutineLogs || []).find(function(item){ return item.date === key; });
  if (!log && create) {
    log = {date:key,items:{},completed:false,completedAt:null};
    dbRef.homeRoutineLogs.push(log);
  }
  return log;
}
function getHomeMobilityForDate(dateKey) {
  var parts=String(dateKey||localDateKey()).split('-').map(Number);
  var dayNumber=Math.floor(Date.UTC(parts[0],parts[1]-1,parts[2])/86400000);
  return dayNumber%2===0?'adductor':'thoracic';
}
function getHomeTimerElapsed(log,now) {
  if(!log||!log.guidedTimer)return 0;
  var state=log.guidedTimer,baseElapsed=Math.max(0,Number(state.elapsedMs)||0),elapsed=baseElapsed,startedAt=toTimestamp(state.startedAt),current=toTimestamp(now)||Date.now();
  if(state.running&&startedAt)elapsed+=Math.max(0,current-startedAt);
  var limit=HOME_TIMER_LIMIT_SECONDS*1000;
  if(elapsed>=limit){
    elapsed=limit;
    if(state.running){var capAt=startedAt+(limit-baseElapsed);state.running=false;state.startedAt=null;state.stoppedAt=capAt;state.cappedAt=capAt;state.elapsedMs=limit;state.actualDurationSeconds=HOME_TIMER_LIMIT_SECONDS;}
    else if(baseElapsed>limit){state.elapsedMs=limit;state.actualDurationSeconds=HOME_TIMER_LIMIT_SECONDS;}
  }
  return elapsed;
}
function getHomeTimerPhase(elapsedMs,dateKey) {
  var remaining=Math.min(HOME_TIMER_LIMIT_SECONDS,Math.floor(elapsedMs/1000)),mobility=getHomeMobilityForDate(dateKey);
  var names=['90/90 Breathing','Wall Slides with Reach','High Plank','Dead Bug with Full Exhale','Glute Bridge Endurance','Half-Kneeling Hip-Flexor Stretch',mobility==='adductor'?'Adductor Rock-Back':'Thoracic Extension'];
  var transitions=['Transition to wall slides','Transition to plank','Transition to dead bug','Transition to glute bridges','Transition to hip-flexor stretch','Transition to mobility'];
  for(var i=0;i<HOME_TIMER_PHASES.length;i++){
    if(remaining<HOME_TIMER_PHASES[i])return {name:names[i],remaining:HOME_TIMER_PHASES[i]-remaining,index:i};
    remaining-=HOME_TIMER_PHASES[i];
    if(i<HOME_TIMER_PHASES.length-1){if(remaining<5)return {name:transitions[i],remaining:5-remaining,index:i};remaining-=5;}
  }
  return {name:'Seven-minute timer complete',remaining:0,index:HOME_TIMER_PHASES.length};
}
function syncHomeTimer(dbRef,log,now) {
  if(!log||!log.guidedTimer)return 0;
  var before=!!log.guidedTimer.running,previous=Number(log.guidedTimer.elapsedMs)||0,elapsed=getHomeTimerElapsed(log,now);
  if((before&&!log.guidedTimer.running)||previous!==Number(log.guidedTimer.elapsedMs||0))dbSave(dbRef);
  return elapsed;
}
function homeTimerNote(elapsed,running){return elapsed>=HOME_TIMER_LIMIT_SECONDS*1000?'Timer complete. Tick off each move below.':running?'Keeps time even if you leave this screen.':'Pause any time. Elapsed time is saved.';}
function updateHomeTimerUi() {
  if(!db||window._currentScreen!=='home')return;
  var log=getHomeLog(db,localDateKey(),false),clock=document.getElementById('home-timer-clock');
  if(!clock)return;
  var elapsed=syncHomeTimer(db,log),state=log&&log.guidedTimer||{},phase=getHomeTimerPhase(elapsed,localDateKey());
  clock.innerHTML=tnumHtml(fmtTime(elapsed));
  var phaseEl=document.getElementById('home-timer-phase');if(phaseEl)phaseEl.textContent=phase.name;
  var progress=document.getElementById('home-timer-progress');if(progress)progress.value=elapsed/(HOME_TIMER_LIMIT_SECONDS*1000)*100;
  var action=document.getElementById('home-timer-action');if(action)action.textContent=state.running?'Pause':'Start';
  var note=document.getElementById('home-timer-note');if(note)note.textContent=homeTimerNote(elapsed,!!state.running);
}
function renderHome(dbRef) {

  }).join('');
  return '<div class="home-wrap"><h1 class="screen-title">Home routine</h1><p class="home-lede">Seven minutes, once a day: breathing, wall slides, plank, dead bug, glute bridge, hip-flexor stretch and today’s mobility move.</p>'+
    '<section class="home-board" aria-label="Today"><div class="home-done"><b>'+done+'<small>/'+HOME_ROUTINE.length+'</small></b><span>done today</span></div>'+
    '<div class="home-timer"><div class="home-timer-phase" id="home-timer-phase">'+esc(phase.name)+'</div><strong class="home-timer-clock" id="home-timer-clock" role="timer">'+tnumHtml(fmtTime(elapsed))+'</strong><progress id="home-timer-progress" max="100" value="'+(elapsed/(HOME_TIMER_LIMIT_SECONDS*1000)*100)+'" aria-label="Seven-minute timer"></progress><div class="home-timer-actions"><button id="home-timer-action" class="btn-primary btn-sm" onclick="App.toggleHomeTimer()">'+(timerState.running?'Pause':'Start')+'</button><button class="btn-ghost btn-sm" onclick="App.resetHomeTimer()">Reset</button></div></div>'+
    '<p id="home-timer-note" class="home-timer-note">'+esc(homeTimerNote(elapsed,!!timerState.running))+'</p></section>'+
    '<div class="home-routine-list">'+items+'</div><div class="home-actions">'+
    '<button class="btn-primary btn-lg" onclick="App.completeHomeRoutine()">Mark all done</button>'+
    '<button class="btn-ghost" onclick="App.resetHomeRoutine()">Reset today</button></div>'+
    '<p class="home-streak">Done on '+last7+' of the last 7 days.</p></div>';
}

    }
    var workingSets = sess.sets.filter(function(s){ return s.exId===exId&&(s.setType==='working'||s.setType==='drop'); });
    var allDone = workingSets.length>0&&workingSets.every(function(s){ return s.completed||s.skipped; });

  /* ── finish workout ── */
  function finishWorkout() {
    if(!canPersistUserChanges())return;
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var incompleteSets = sess.sets.filter(function(s){
      var ex = getExerciseDef(s.exId, sess);
      return s.setType==='working' && !s.completed && !s.skipped && !(ex && ex.optional);
    }).length;
    if (incompleteSets > 0) {
      if (!confirm(incompleteSets + ' planned set(s) are not yet logged. Finish anyway?')) return;
    }
    flushVisibleSetDrafts();
    var beforeFinish=JSON.stringify(db);
    applySessionTimerCap(sess);
    sess.endTime = Date.now();sess.actualFinishedAt=sess.endTime;
    var momentumBefore=getMomentumState(db,sess.endTime);
    sess.durationMs = getSessionElapsedMs(sess, sess.endTime);
    SessionClock.stop();
    sess.finished = true;
    sess.rushedActualCompleted=sess.rushedModeApplied?sess.sets.filter(function(set){return set.completed&&set.setType==='working';}).length:null;
    // Detect PRs
    db.completedSessions.push(sess);  // add first so detectPRs can compare
    sess.prs = detectPRs(db, sess);
    var momentumAfter=getMomentumState(db,sess.endTime);
    var momentumEvent=recordMomentumEvent(db,'lift:'+sess.id,momentumBefore,momentumAfter);
    sess.momentumSnapshot={streak:momentumAfter.streak,activeThisWeek:momentumAfter.activeThisWeek,bestStreak:momentumAfter.bestStreak,stage:momentumAfter.stage};
    // Banners crossed by this session are recorded once and available in History.
    var raised=[];try{raised=Milestones.collectNew(db,sess.endTime);}catch(e){console.warn('Milestones unavailable:',e.message);}
    if(raised.length)sess.milestonesEarned=raised.map(function(m){return {key:m.key,trackId:m.trackId,threshold:m.threshold,tier:m.tier,date:m.date};});
    db.lastCompletedDay = sess.dayN;
    if (sess.dayN === 1) db.nextCoreSession = 'B';
    else if (sess.dayN === 2) db.nextCoreSession = 'A';
    delete db._nextDayOverride;
    db.activeSession = null;
    Engagement.onSavedSession(db,sess);
    if(!dbSave(db)){db=JSON.parse(beforeFinish);alert('Could not save this workout. Your active session is retained; export a backup and check storage.');return;}
    // Saved first, original arcade summary second. No overlapping milestone overlay.
    applyMomentumTheme(db,true);
    Timer.skip();document.body.classList.remove('workout-view');
    showSummary(sess);
    Engagement.sound();
  }

    if(!('serviceWorker' in navigator)){report('Updates are unavailable in this browser.');return;}
    if(navigator.onLine===false){report('Connect to check for updates.');return;}
    report('Checking…');
    navigator.serviceWorker.getRegistration().then(function(registration){
      if(!registration){report('Update check is not available yet.');return;}
      return registration.update().then(function(){
        if(registration.waiting){report('Update ready; reload to apply it.');return;}
        var worker=registration.installing;
        if(worker){
          report('Checking for an update…');
          worker.addEventListener('statechange',function(){
            if(worker.state==='installed'&&navigator.serviceWorker.controller)report('Update ready; reload to apply it.');
            else if(worker.state==='activated')report('Update installed. Reload to finish.');

        } else report('App is up to date.');

    }).catch(function(){report('Could not check. Try again when online.');});

function compactPerformanceSequence(rows){if(!rows.length)return '';var f=rows[0];if(f.measurementMode!=='timed'&&rows.every(function(r){return r.weight===f.weight&&r.units===f.units&&r.measurementMode===f.measurementMode;})){var p=f.measurementMode==='bodyweight'?'BW':f.measurementMode==='weighted_bodyweight_addition'?'BW + '+f.weight+' '+f.units:f.measurementMode==='assisted'?f.weight+' '+f.units+' assistance':f.weight+' '+f.units;return p+' × '+rows.map(function(r){return r.reps;}).join(', ')+(f.loadConvention==='per-hand'?' / hand':'');}return rows.map(formatPerformanceLine).join(', ');}

function renderCoachingSources(entry) {

  var body = refs.length ? '<p>Practical paraphrases. The source scope is shown below.</p><ul>' + refs.map(function(ref) {
    var source = COACHING_SOURCES[ref.id];

    var link = source.url ? '<a href="' + esc(source.url) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : '<span>' + label + '</span>';
    return '<li>' + link + '<small>' + esc(ref.note || source.title) + '</small></li>';
  }).join('') + '</ul>' : '<p>General coaching cues. No exercise-specific tip from these three coaches was verified for this entry.</p>';
  return '<details class="coach-sources"><summary>Sources</summary>' + body + '</details>';
}
function renderCoachingTips(ex,session,slot) {
  var entry = getReviewedCoaching(ex);
  var tips = entry ? entry.tips : (ex.newTips || []).concat(ex.cues || []).filter(function(t,i,all) { return typeof t === 'string' && all.indexOf(t) === i; });
  tips = tips.slice(0,4);
  if (!tips.length && !(slot && slot.effortNote)) return '';

    return '<li' + (i === 0 && entry ? ' class="coach-tip-new"' : '') + '>' +
      (i === 0 && entry ? '<span class="new-tip-marker">KEY</span>' : '') + esc(t) + '</li>';
  }).join('');
  return '<details class="coach-tips"><summary>Tips &amp; setup</summary><ul class="coach-cue-list">' + html + '</ul>' +
    (slot && slot.effortNote ? '<p class="coach-effort">' + esc(slot.effortNote) + '</p>' : '') +

}

// PR events are created only by an explicit, successfully saved set-completion action.
function evaluateSetAchievement(data,session,set){
  // A same-load rep record and a qualifying load record are different achievements.
  // Only load/assistance records require the stable minimum-rep threshold.
  var ex=getExerciseDef(set.exId,session,data);
  if(set.prEvaluationDone||set.completed||set.skipped||set.setType!=='working'||ex.prEligible===false||ex.nonHypertrophy)return null;
  var c=normalizePerformanceRecord(Object.assign({},set,{completed:true,skipped:false,timestamp:Date.now()}),session,session.sets.indexOf(set),'active');
  if(!c||c.type!=='working')return null;
  var key=performanceGroupKey(c);
  var hist=getNormalizedExerciseHistory(data,set.exId,true).filter(function(r){
    return !(r.sessionId===c.sessionId&&r.setId===c.setId)&&r.type==='working'&&r.side===c.side&&performanceGroupKey(r)===key;
  });
  if(!hist.length)return {type:'baseline',exerciseId:set.exId};
  var qualified=hist.filter(function(r){return isQualifiedPerformance(r,set.exId);});
  var old=qualified.slice().sort(comparePerformanceRows)[0]||null;
  var same=hist.filter(function(r){return r.weight===c.weight;});
  var type=null,delta=null,detail='',previous=null;
  if(c.measurementMode==='timed'){
    previous=hist.slice().sort(comparePerformanceRows)[0];
    if(c.durationSeconds>previous.durationSeconds){type='time';delta=c.durationSeconds-previous.durationSeconds;detail='+'+delta+' seconds';}
  } else if(c.measurementMode==='bodyweight'){
    previous=hist.slice().sort(function(a,b){return b.reps-a.reps;})[0];
    if(c.reps>previous.reps){type='reps';delta=c.reps-previous.reps;detail='+'+delta+(delta===1?' rep':' reps')+' at bodyweight';}
  } else {
    if(isQualifiedPerformance(c,set.exId)&&old){
      if(c.measurementMode==='assisted'&&c.weight<old.weight){type='assistance';previous=old;detail='Less assistance: '+c.weight+' '+c.units;}
      else if(c.measurementMode!=='assisted'&&c.weight>old.weight){type='weight';previous=old;detail='Previous qualifying best: '+formatPerformanceLine(old);}
    }
    if(!type&&same.length){
      previous=same.slice().sort(function(a,b){return b.reps-a.reps;})[0];
      if(c.reps>previous.reps){type='reps';delta=c.reps-previous.reps;detail='+'+delta+(delta===1?' rep':' reps')+' at the same '+(c.measurementMode==='assisted'?'assistance':'weight');}
    }
  }
  if(!type)return null;
  var side=c.side==='L'?'LEFT-SIDE ':c.side==='R'?'RIGHT-SIDE ':'';
  return {eventSchema:2,type:type,exerciseId:set.exId,canonicalExerciseId:c.canonicalExerciseId,side:c.side,groupKey:key,
    headline:side+(type==='weight'?'NEW WEIGHT PR':type==='time'?'NEW TIME PR':type==='assistance'?'LESS ASSISTANCE PR':'NEW REP PR'),
    display:formatPerformanceLine(c),detail:detail,delta:delta,weight:c.weight,reps:c.reps,durationSeconds:c.durationSeconds,
    units:c.units,measurementMode:c.measurementMode,qualified:isQualifiedPerformance(c,set.exId),
    comparisonSetId:previous&&previous.setId||null,comparisonSessionId:previous&&previous.sessionId||null,
    previousWeight:previous&&previous.weight,previousReps:previous&&previous.reps,previousSeconds:previous&&previous.durationSeconds};
}
function recordSetAchievement(data,session,set,c){
  set.prEvaluationDone=true;if(!c)return null;
  if(c.type==='baseline')return Object.assign(c,{setId:set.id,sessionId:session.id});
  data.prCelebrationEvents=Array.isArray(data.prCelebrationEvents)?data.prCelebrationEvents:[];
  var id=session.id+':'+set.id;
  if(data.prCelebrationEvents.some(function(e){return e.eventId===id;}))return null;
  var e=Object.assign({},c,{eventId:id,setId:set.id,sessionId:session.id,achievedAt:set.timestamp});
  data.prCelebrationEvents.push(e);set.achievementEventId=id;return e;
}
function isCelebrationEventValid(data,e){
  if(!e||!e.exerciseId||e.type==='baseline')return false;
  return getNormalizedExerciseHistory(data,e.exerciseId,true).some(function(r){
    if(r.sessionId!==e.sessionId||r.setId!==e.setId||r.type!=='working'||r.weight!==e.weight||r.reps!==e.reps||r.durationSeconds!==e.durationSeconds||r.side!==e.side)return false;
    if(e.groupKey&&performanceGroupKey(r)!==e.groupKey)return false;
    return e.eventSchema===2&&(e.type==='reps'||e.type==='time')?true:isQualifiedPerformance(r,e.exerciseId);
  });
}
function liveExerciseAchievements(data,exerciseId){
  var sessionId=data.activeSession&&data.activeSession.id;
  if(!sessionId)return [];
  return (data.prCelebrationEvents||[]).filter(function(e){return e.sessionId===sessionId&&getHistoryExerciseId(e.exerciseId)===getHistoryExerciseId(exerciseId)&&isCelebrationEventValid(data,e);}).sort(function(a,b){return (Number(b.achievedAt)||0)-(Number(a.achievedAt)||0);});
}

function getPRCelebrationPreferences(){return Object.assign({visual:true,sound:false,haptics:false},db&&db.settings&&db.settings.prCelebration||{});}
function prHeadlineText(e){
  var side=e.side==='L'?'Left side: ':e.side==='R'?'Right side: ':'';
  var base=e.type==='weight'?'New weight PR':e.type==='time'?'New time PR':e.type==='assistance'?'Less assistance PR':e.type==='reps'?'New rep PR':'';
  if(!base){var h=String(e.headline||'New PR').toLowerCase().replace(/\bpr\b/g,'PR');return h.charAt(0).toUpperCase()+h.slice(1);}

  // One comparable main-lift challenge. No challenge on ambiguous/mismatched sessions.

    if(sess.rushedModeApplied||sess.reentryModeApplied||isReentryActive(data)||sess.legIntroSnapshot)return;
    var slot=sess.programmeSnapshot&&sess.programmeSnapshot.slots&&sess.programmeSnapshot.slots[0];
    if(!slot||slot.unilateral||slot.trackingUnit==='seconds')return;
    var id=slot.exerciseId,allHistory=getNormalizedExerciseHistory(data,id,false),seen={},old=null,prior=null,records=null;
    // Use the last fully comparable exposure, not a partial set entry or another position in a workout.
    allHistory.some(function(candidate){
      if(seen[candidate.sessionId])return false;seen[candidate.sessionId]=true;
      var candidateSession=candidate.session,ps=candidateSession.programmeSnapshot&&candidateSession.programmeSnapshot.slots||[];
      var p=ps.find(function(s){return getHistoryExerciseId(s.exerciseId)===getHistoryExerciseId(id);});
      if(!p||ps.indexOf(p)!==0||Number(p.sets)!==Number(slot.sets)||Number(p.min)!==Number(slot.min)||Number(p.max)!==Number(slot.max)||candidateSession.rushedModeApplied)return false;
      var rr=allHistory.filter(function(r){return r.sessionId===candidate.sessionId&&r.side===null&&r.type==='working'&&!r.set.isAdded;});
      if(rr.length!==slot.sets||rr.some(function(r){return r.measurementMode!=='repetition'||r.weight<=0||r.reps<slot.min||r.reps>slot.max;}))return false;
      var f=rr[0],key=performanceGroupKey(f);if(rr.some(function(r){return r.weight!==f.weight||performanceGroupKey(r)!==key;}))return false;
      old={session:candidateSession,records:rr};prior=p;records=rr;return true;
    });
    if(!old)return;
    var first=records[0],group=performanceGroupKey(first);if(records.some(function(r){return r.weight!==first.weight||performanceGroupKey(r)!==group;}))return;
    var total=records.reduce(function(n,r){return n+r.reps;},0);if(total>=slot.max*slot.sets)return;

function getWorkoutProgress(sess){
  if(!sess)return {done:0,expected:0,percent:0,reduced:false,label:'planned sets'};
  var slots=sess.programmeSnapshot&&sess.programmeSnapshot.slots||[],done=0,expected=0,original=0;
  if(slots.length){
    // Reuse the same planned-round definition as completion. Both sides must
    // be logged, extra sets do not inflate progress, and Rushed exclusions
    // change the plan without treating a manual skip as completed work.
    var coverage=Engagement.coverage(sess);
    done=coverage.done;expected=coverage.expected;
    original=sess.rushedModeApplied?Engagement.coverage(Object.assign({},sess,{rushedModeApplied:false})).expected:expected;
  }else{
    // Older drafts have no programme snapshot. Preserve their actual rows
    // without guessing a side for records whose side was never saved.
    var groups={};
    (sess.sets||[]).forEach(function(row,index){
      if(row.setType!=='working'||row.isAdded||!isRequiredSessionSet(row,sess))return;
      var num=Number(row.setNum),key=(row.slotId||row.exId)+'|'+(num>0?num:'row:'+index);
      (groups[key]=groups[key]||[]).push(row);
    });
    Object.keys(groups).forEach(function(key){
      var rows=groups[key],hasSides=rows.some(function(row){return normalizeSide(row.side)!==null;});
      original++;
      if(sess.rushedModeApplied&&rows.every(function(row){return row.skipped&&row.skipReason==='rushed_mode';}))return;
      expected++;
      if(hasSides){if(['L','R'].every(function(side){return rows.some(function(row){return normalizeSide(row.side)===side&&validCompletedNormal(row);});}))done++;}
      else if(rows.some(validCompletedNormal))done++;
    });
  }
  var reduced=!!sess.rushedModeApplied&&expected<original;
  return {done:done,expected:expected,percent:expected?Math.min(100,Math.round(done/expected*100)):0,reduced:reduced,label:reduced?'Rushed sets':'planned sets'};
}
function workoutStatsHtml(sess){
  var progress=getWorkoutProgress(sess);
  var reps=(sess.sets||[]).filter(function(s){return s.completed;}).reduce(function(a,s){return a+(s.measurementMode==='timed'?0:Number(s.reps)||0);},0);
  return '<span><b>'+progress.done+'</b>of '+progress.expected+' '+progress.label+'</span><span><b>'+reps+'</b>reps</span>';
}
