<style>
/* ============================================================
   Adil Aesthetic App — Complete CSS
   ============================================================ */
:root {
  --bg:         oklch(0.100 0.015 255);
  --bg-soft:    oklch(0.135 0.016 255);
  --card:       oklch(0.158 0.018 255);
  --card-hi:    oklch(0.192 0.022 255);
  --line:       oklch(0.280 0.025 255);
  --line-soft:  oklch(0.220 0.020 255);
  --text:       oklch(0.960 0.004 220);
  --muted:      oklch(0.680 0.014 230);
  --faint:      oklch(0.500 0.012 225);
  --accent:     oklch(0.720 0.180 240);
  --accent-dk:  oklch(0.620 0.165 240);
  --accent-bg:  oklch(0.720 0.180 240 / 0.12);
  --accent-ln:  oklch(0.720 0.180 240 / 0.30);
  --steel:      oklch(0.740 0.055 235);
  --steel-bg:   oklch(0.740 0.055 235 / 0.10);
  --danger:     oklch(0.720 0.148 30);
  --danger-bg:  oklch(0.720 0.148 30 / 0.10);
  --danger-ln:  oklch(0.720 0.148 30 / 0.30);
  --ok:         oklch(0.778 0.132 148);
  --ok-bg:      oklch(0.778 0.132 148 / 0.10);
  --warn:       oklch(0.798 0.128 90);
  --warn-bg:    oklch(0.798 0.128 90 / 0.10);
  --radius:     16px;
  --radius-sm:  11px;
  --nav-h:      60px;
  --mono: ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
input,button,textarea,select { font-family:inherit; font-size:inherit; }
ul,ol { list-style:none; }
a { color:inherit; text-decoration:none; }
p { margin:0; }

/* ============================================================
   SCREENS
   ============================================================ */
#app { min-height:100vh; }
.screen { display:none; min-height:100vh; padding:16px 16px 24px; max-width:600px; margin:0 auto; }
.screen.active { display:block; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
#bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  display:flex; align-items:stretch;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:oklch(0.112 0.016 255 / 0.94);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-top:1px solid var(--line-soft);
}
#bottom-nav.hidden { display:none; }
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--faint);
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  cursor:pointer; padding:8px 4px; min-height:44px; transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-tab svg { width:22px; height:22px; }
.nav-tab--on { color:var(--accent); }

/* ============================================================
   SHARED BUTTONS
   ============================================================ */
.btn-primary {
  display:block; width:100%; padding:14px; border-radius:var(--radius);
  background:var(--accent); color:oklch(0.98 0.004 220);

}

.btn-ghost {
  display:inline-flex; align-items:center; justify-content:center;

}

.btn-ghost.btn-sm { padding:7px 13px; font-size:13px; min-height:34px; }
.btn-ghost.btn-xs { padding:5px 10px; font-size:12px; min-height:30px; }
.btn-ghost.btn-danger { border-color:var(--danger-ln); color:var(--danger); }
.btn-nav {
  background:none; border:none; color:var(--accent); font-size:15px;
  font-weight:600; padding:8px 12px; cursor:pointer; min-height:44px;
}
.btn-nav:disabled { color:var(--faint); cursor:default; }
.btn-finish {
  background:var(--accent-bg); border:1px solid var(--accent-ln);

}
.btn-finish:active { background:var(--accent-bg); }

  display:block; width:100%; padding:15px; border-radius:var(--radius-sm);
  background:var(--accent); color:oklch(0.98 0.004 220);

  -webkit-tap-highlight-color:transparent;
}

.hidden { display:none !important; }

/* ============================================================
   TODAY SCREEN
   ============================================================ */
.today-wrap { padding-top:12px; }
.resume-banner {
  background:var(--accent-bg); border:1.5px solid var(--accent-ln);
  border-radius:var(--radius); padding:18px; margin-bottom:16px;
}
.rb-title { font-size:13px; font-family:var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px; }
.rb-sub { font-size:15px; color:var(--muted); margin-bottom:14px; }
.rb-actions { display:flex; flex-direction:column; gap:8px; }
.today-day-card {
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:22px; margin-bottom:14px;
}
.rec-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.rec-confidence { flex:none; padding:4px 8px; border:1px solid var(--accent-ln); border-radius:999px; background:var(--accent-bg); color:var(--accent); font-size:11px; font-weight:700; }
.rec-manual { color:var(--warn); border-color:oklch(0.80 0.13 90 / .3); background:var(--warn-bg); }
.rec-why-title { margin:18px 0 8px; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }

.rec-reason { position:relative; padding-left:14px; color:var(--muted); font-size:14px; line-height:1.4; }
.rec-reason::before { content:''; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
.rec-details { margin-bottom:14px; border:1px solid var(--line-soft); border-radius:var(--radius); background:var(--card); overflow:hidden; }

.rec-details summary::-webkit-details-marker { display:none; }
.rec-detail-body { padding:0 15px 14px; }
.rec-muscle-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:8px 0; border-top:1px solid var(--line-soft); }
.rec-muscle-name { font-size:13px; font-weight:700; }
.rec-muscle-meta { text-align:right; color:var(--muted); font-size:12px; }
.rec-note { margin-top:10px; color:var(--faint); font-size:12px; line-height:1.4; }
.session-preview { margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft); }
.session-preview summary { color:var(--muted); font-size:13px; font-weight:650; cursor:pointer; }
.session-preview ul { display:grid; gap:5px; margin-top:8px; }

.rec-use { display:block; margin:10px auto 0; background:none; border:none; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }
.tdc-kicker { font-family:var(--mono); font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
.tdc-day { font-family:var(--mono); font-size:42px; font-weight:800;

.tdc-title { font-size:22px; font-weight:750; letter-spacing:-.015em;
  line-height:1.1; margin-bottom:10px; text-wrap:balance; }
.tdc-muscles { font-size:14px; color:var(--muted); margin-bottom:14px; }
.tdc-meta { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.tdc-meta span { font-size:13.5px; color:var(--faint); font-family:var(--mono); }
.today-picker {
  border:1px solid var(--line-soft); border-radius:var(--radius); overflow:hidden;
  background:var(--card);
}
.tp-sum {
  list-style:none; cursor:pointer; padding:14px 16px; font-size:14.5px;
  font-weight:600; color:var(--muted); user-select:none;
}

.tp-body { padding:0 8px 8px; }
.day-pick-row {
  display:flex; align-items:center; gap:12px; padding:11px 10px;

  border:1px solid transparent;
}
.day-pick-row:hover { background:var(--bg-soft); }
.day-pick-row.is-next { border-color:var(--accent-ln); background:var(--accent-bg); }
.day-pick-row input[type="radio"] { width:18px; height:18px; accent-color:var(--accent); flex:none; }
.dp-no { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent); flex:none; width:44px; }
.dp-title { flex:1; font-size:14px; font-weight:550; }
.dp-dur { font-size:12px; color:var(--faint); font-family:var(--mono); }

/* ============================================================
   WORKOUT OVERLAY
   ============================================================ */
#workout-overlay {
  position:fixed; inset:0; z-index:100; overflow:hidden;
  background:var(--bg); display:flex; flex-direction:column;
}
#workout-overlay.hidden { display:none; }
.wo-header {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:oklch(0.100 0.015 255 / 0.96);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line-soft);
  flex:none;
}
.wo-back { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; min-width:36px; min-height:36px; padding:4px; }
.wo-hinfo { flex:1; min-width:0; }
.wo-htitle { font-size:13px; font-weight:650; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wo-hprog { font-size:12px; color:var(--muted); font-family:var(--mono); }
.wo-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 80px; }
.rushed-control { display:flex; justify-content:flex-end; padding:10px 0 0; }
.btn-rushed { border-color:var(--warn); color:var(--warn); background:var(--warn-bg); }
.rushed-banner { margin:10px 0 2px; padding:10px 12px; border:1px solid oklch(0.798 0.128 90 / .3); border-radius:var(--radius-sm); background:var(--warn-bg); color:var(--warn); font-size:13px; line-height:1.4; }
.rushed-tag { display:inline-flex; margin-top:7px; padding:3px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; }

/* prev bar */
.prev-bar {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:8px 0 10px; border-bottom:1px solid var(--line-soft);
}
.prev-date { font-size:11.5px; color:var(--faint); font-family:var(--mono); flex:none; }
.prev-item { font-size:12px; color:var(--muted); font-family:var(--mono); background:var(--bg-soft); padding:2px 7px; border-radius:6px; }
.prev-bar--none { font-size:12.5px; color:var(--faint); font-style:italic; padding:8px 0 10px; border-bottom:1px solid var(--line-soft); }

/* exercise card */
.ex-card {
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--card); margin:12px 0; overflow:hidden;
  transition:border-color .2s;
}
.ex-card--done { border-color:var(--accent-ln); }
.exc-head { padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
.exc-meta { margin-bottom:8px; }
.exc-name { display:block; font-size:18px; font-weight:750; letter-spacing:-.01em; line-height:1.2; margin-bottom:3px; }
.exc-target { font-size:13px; color:var(--accent); font-weight:600; }
.exc-badges { display:flex; flex-wrap:wrap; gap:6px; }
.xb { font-size:12px; font-family:var(--mono); font-weight:600; color:var(--faint);
  background:var(--bg-soft); border:1px solid var(--line-soft); border-radius:6px; padding:3px 8px; }

/* set rows */
.set-rows { padding:0 14px; }
.set-row { margin:10px 0; padding:12px; background:var(--bg-soft); border-radius:var(--radius-sm); border:1px solid var(--line-soft); }
.set-row--done { background:var(--ok-bg); border-color:oklch(0.78 0.13 150 / 0.3); }
.set-row--skipped { background:var(--bg); border-color:var(--line-soft); opacity:.6; }
.set-row--active {}
.sr-label { font-size:13.5px; font-weight:700; font-family:var(--mono); color:var(--text); }
.sr-check { color:var(--ok); margin-left:4px; }
.sr-skip-badge { font-size:11px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:2px 7px; color:var(--faint); margin-left:8px; }
.sr-label-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.sr-prev { font-size:12.5px; color:var(--muted); font-family:var(--mono); margin-bottom:10px; }
.sr-prev--none { color:var(--faint); font-style:italic; }
.sr-done-label { font-size:13.5px; font-weight:700; font-family:var(--mono); margin-bottom:4px; }
.sr-done-vals { font-size:16px; font-weight:650; color:var(--text); margin-bottom:8px; }
.sr-rir { font-size:13px; color:var(--muted); }
.sr-done-actions { display:flex; gap:8px; }
.sr-skip-btn { color:var(--faint); }

/* set inputs */
.sr-inputs { display:flex; flex-direction:column; gap:12px; }
.sri-group { display:flex; flex-direction:column; gap:6px; }
.sri-label { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:700; font-family:var(--mono); }
.sri-unit { font-size:10px; color:var(--faint); }
.sri-ctrl { display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.sri-adj {
  flex:none; width:54px; min-height:50px; background:var(--bg-soft);
  border:none; border-right:1px solid var(--line); color:var(--text);
  font-size:22px; font-weight:300; cursor:pointer; display:grid; place-items:center;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.sri-adj:last-child { border-right:none; border-left:1px solid var(--line); }
.sri-adj:active { background:var(--card-hi); }
.sri-inp {
  flex:1; min-height:50px; background:transparent; border:none;
  text-align:center; font-size:22px; font-weight:700; color:var(--text);
  outline:none; padding:0;
}
.sri-inp:focus { background:oklch(0.81 0.125 74 / 0.07); }

.rir-row { display:flex; gap:0; border:1.5px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
.rir-btn {
  flex:1; min-height:50px; background:var(--bg-soft); border:none;
  border-right:1px solid var(--line); color:var(--muted);
  font-size:16px; font-weight:700; cursor:pointer;
  transition:.1s; -webkit-tap-highlight-color:transparent;
}
.rir-btn:last-child { border-right:none; }
.rir-btn--on { background:var(--accent-bg); color:var(--accent); }
.rir-btn:active { background:var(--card-hi); }

/* set add row */
.set-add-row { display:flex; gap:8px; padding:8px 14px 10px; }
.workout-add-ex { display:flex; justify-content:center; padding:18px 0 4px; }
.btn-add-ex { width:100%; max-width:260px; }

/* exercise note */
.ex-note-input {
  display:block; width:100%; background:transparent; border:none;
  border-top:1px solid var(--line-soft); padding:10px 14px; resize:none;
  color:var(--muted); font-size:14px; outline:none;
  min-height:40px;
}
.ex-note-input::placeholder { color:var(--faint); }

/* collapsibles in workout */
.ex-coll-row { border-top:1px solid var(--line-soft); padding:0 14px 2px; }
.ex-coll { border-bottom:1px solid var(--line-soft); }
.ex-coll:last-child { border-bottom:none; }
.ec-sum { list-style:none; padding:11px 0; font-size:13.5px; font-weight:650; color:var(--muted); cursor:pointer; }
.ec-sum::-webkit-details-marker { display:none; }
.ec-body { padding:0 0 12px; }
.coll-list { display:grid; gap:7px; }
.coll-list li { font-size:14px; color:var(--text); position:relative; padding-left:16px; }
.coll-list li::before { content:'·'; position:absolute; left:2px; color:var(--accent); font-weight:700; }

.coll-hard { margin-top:8px; padding:10px 12px; background:var(--danger-bg); border-left:3px solid var(--danger); border-radius:0 8px 8px 0; font-size:13.5px; font-weight:600; }
.stall-box { margin-top:10px; padding:10px 12px; background:var(--warn-bg); border:1px solid oklch(0.80 0.13 90 / 0.28); border-radius:var(--radius-sm); color:var(--muted); font-size:13px; line-height:1.4; }
.stall-box b { display:block; color:var(--warn); font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }

/* finish section */
.wo-finish-section { padding:24px 0 40px; text-align:center; }
.wo-stats { font-size:13px; color:var(--faint); font-family:var(--mono); margin-bottom:14px; }

/* ============================================================
   TIMER PILL
   ============================================================ */
#timer-pill {
  position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:10px 16px; min-height:50px;
  background:oklch(0.135 0.016 255 / 0.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
}
#timer-pill.hidden { display:none !important; }
.tp-label { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
.tp-time { font-size:28px; font-weight:800; color:var(--text); letter-spacing:-.02em; min-width:70px; text-align:center; }
.tp-urgent { color:var(--accent); }
.tp-adj { background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:13px; font-weight:700; padding:6px 10px; min-height:36px; cursor:pointer; }
.tp-skip { background:none; border:none; color:var(--faint); font-size:13px; font-weight:650; cursor:pointer; padding:6px 8px; min-height:36px; }

/* ============================================================
   MODAL OVERLAY
   ============================================================ */
#modal-overlay {
  position:fixed; inset:0; z-index:150; display:flex; align-items:flex-end;
  background:oklch(0 0 0 / 0.6); backdrop-filter:blur(4px);
  padding:0 0 env(safe-area-inset-bottom,0px);

function applySessionTimerCap(session, now) {
  if (!session) return false;

  var current = toTimestamp(now) || Date.now();

      session.sessionTimerStoppedAt = capAt;
      session.timerStopReason = 'automatic_3_hour_cap';
      session.timerCapStatus = 'capped';
      changed = true;

    if (session.finished && session.durationMs !== THREE_HOURS_MS) { session.durationMs = THREE_HOURS_MS; changed = true; }
    return changed;
  }
  if (session.timerStopReason === 'automatic_3_hour_cap' || session.sessionTimerStoppedAt) {
    session.legacyTimerFields = session.legacyTimerFields || {timerStopReason:session.timerStopReason,sessionTimerStoppedAt:session.sessionTimerStoppedAt};
    session.timerCapStatus = 'uncertain';
    if (session.finished) {
      var actualDuration = Math.max(0, Math.min(THREE_HOURS_MS, Number(session.durationMs) || (toTimestamp(session.endTime) - start) || 0));

    }

  if (session.finished && session.durationMs != null) {
    var normalDuration = Math.max(0, Math.min(THREE_HOURS_MS, Number(session.durationMs) || 0));
    if (session.durationMs !== normalDuration) { session.durationMs = normalDuration; changed = true; }
  }
  return changed;
}
function getSessionElapsedMs(session, now) {
  if (!session || !toTimestamp(session.startTime)) return 0;

  copy.id = id;
  copy.name = name;
  copy.cues = (overrides && overrides.cues) || EX[baseId].cues.slice();
  copy.mistakes = (overrides && overrides.mistakes) || EX[baseId].mistakes.slice();
  copy.muscles = Object.assign({}, (overrides && overrides.muscles) || EX[baseId].muscles);
  return copy;
}

  ['special','setup','why','optional','dropMuscles'].forEach(function(key) {

  Object.assign(exercise, spec);
  exercise.cues = (spec.cues || exercise.cues || []).slice();
  exercise.mistakes = (spec.mistakes || exercise.mistakes || []).slice();
  exercise.muscles = Object.assign({}, spec.muscles || exercise.muscles || {});
  EX[id] = exercise;
}

function getSelectableExerciseIds(dbRef) {

  var ids = Object.keys(EX);

  if (custom) ids = ids.concat(Object.keys(custom));
  (dbRef && dbRef.completedSessions || []).forEach(function(session) {

    (session.sets || []).forEach(function(set) { var id=getSavedSetExerciseId(set);if(id&&ids.indexOf(id)===-1)ids.push(id); });
    [session.customExercises,session.exercisePrescriptions,session.archivedExercises,session.legacyExercises].forEach(function(defs){Object.keys(defs||{}).forEach(function(id){if(ids.indexOf(id)===-1)ids.push(id);});});
  });
  if (dbRef && dbRef.activeSession) {
    (dbRef.activeSession.exerciseOrder || []).forEach(function(id) { if (ids.indexOf(id) === -1) ids.push(id); });
    (dbRef.activeSession.sets || []).forEach(function(set) { var id=getSavedSetExerciseId(set);if(id&&ids.indexOf(id)===-1)ids.push(id); });

  }

  return ids.sort(function(a,b) {

// Returns array of PR descriptions for a completed session
function detectPRs(db, session) {
  var prs = [];
  var exIds = [];
  session.sets.forEach(function(s) { if (exIds.indexOf(s.exId) === -1) exIds.push(s.exId); });
  exIds.forEach(function(exId) {
    var ex = getExerciseDef(exId, session);
    if (!ex) return;
    var historySets = getNormalizedExerciseHistory(db, exId, false).filter(function(row){return isQualifiedPerformance(row,exId,db);});
    var prevSets = historySets.filter(function(row) { return row.sessionId !== session.id; });
    var curSets = historySets.filter(function(row) { return row.sessionId === session.id; });
    if (curSets.length === 0 || prevSets.length === 0) return;
    curSets.forEach(function(cur) {
      var comparable = ex.uni ? prevSets.filter(function(row){return row.set.side===cur.set.side;}) : prevSets;
      if (!comparable.length) return;
      var prevBest = comparable.slice().sort(function(a,b){return (b.set.weight||0)-(a.set.weight||0) || (b.set.reps||0)-(a.set.reps||0);})[0];
      if ((cur.set.weight||0) > (prevBest.set.weight||0) && (cur.set.weight||0) > 0) {
        prs.push({ exId: exId, side:cur.set.side, type:'weight', msg: ex.name + (cur.set.side ? ' ('+cur.set.side+')' : '') + ' — new weight record: ' + cur.set.weight + ' kg' });
        return;
      }
      var sameWeight = comparable.filter(function(h) { return h.set.weight === cur.set.weight; });
      if (sameWeight.length > 0) {
        var prevBestReps = Math.max.apply(null, sameWeight.map(function(h) { return h.set.reps; }));
        if (cur.set.reps > prevBestReps) {
          prs.push({ exId: exId, side:cur.set.side, type:'reps', msg: ex.name + (cur.set.side ? ' ('+cur.set.side+')' : '') + ' — ' + (cur.set.reps - prevBestReps) + ' more reps at ' + cur.set.weight + ' kg' });
        }
      }
    });
  });
  // Deduplicate by exId
  var seen = {};
  return prs.filter(function(pr) {
    var key=pr.exId+(pr.side||'')+pr.type;
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
}

function getExerciseExposureSummaries(dbRef,exId,limit,slotId) {

function importBackup(jsonText, currentDb) {

    var d = parsed.data;

    if(d.homeRoutineLogs!==undefined&&!Array.isArray(d.homeRoutineLogs))throw new Error('Backup homeRoutineLogs must be an array.');
    if(d.activeSession!==undefined&&d.activeSession!==null&&(typeof d.activeSession!=='object'||Array.isArray(d.activeSession)))throw new Error('Backup activeSession must be an object or null.');
    (d.completedSessions||[]).concat(d.activeSession?[d.activeSession]:[]).forEach(function(session,index){
      if(!session||typeof session!=='object'||Array.isArray(session))throw new Error('Backup session '+index+' is malformed.');
      if(session.sets!==undefined&&!Array.isArray(session.sets))throw new Error('Backup session '+index+' has malformed sets.');
    });
    d.schemaVersion=Math.max(3,Number(d.schemaVersion)||0);
    return migrateDb(d);
  } else if (parsed.version === 1 || parsed.checks !== undefined || parsed.logs !== undefined) {
    // v1 backup: preserve as legacy
    currentDb.legacyData = { source: 'v1_import', checks: parsed.checks||{}, logs: parsed.logs||{}, importedAt: Date.now() };
    return currentDb;
  }
  throw new Error('Unrecognised backup format.');
}

function fmtTime(ms) {

  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var sec = total % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  return m + ':' + String(sec).padStart(2,'0');
}
function fmtDate(ts) {

}

}

// ============================================================
// REST TIMER
// ============================================================
var Timer = (function() {
  var _running = false;
  var _start = 0;
  var _target = 90;
  var _elapsed = 0;
  var _interval = null;
  var _pill = null;

  function _save() {
    try {
      localStorage.setItem(TIMER_KEY, JSON.stringify({
        mode:'countup', running:_running, start:_start, target:_target
      }));
    } catch(e) {}
  }

  function formatSeconds(seconds) {
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function _render() {
    if (!_pill) _pill = document.getElementById('timer-pill');
    if (!_pill) return;
    _pill.classList.toggle('hidden', !_running);
    _pill.innerHTML =
      '<span class="tp-label">REST · target '+formatSeconds(_target)+'</span>' +
      '<span class="tp-time' + (_elapsed >= _target ? ' tp-urgent' : '') + '">' + formatSeconds(_elapsed) + '</span>' +
      '<button class="tp-skip" onclick="Timer.skip()">Done</button>';
  }

  function _tick() {
    if (!_running) return;
    _elapsed = Math.max(0, (Date.now() - _start) / 1000);
    _render();
  }

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && _running) _tick();
  });

  return {
    start: function(seconds) {
      if (_interval) clearInterval(_interval);
      _target = seconds || 90;
      _elapsed = 0;
      _start = Date.now();
      _running = true;
      _interval = setInterval(_tick, 500);
      _render(); _save();
    },
    restore: function() {
      try {
        var raw = localStorage.getItem(TIMER_KEY);
        if (!raw) return;
        var t = JSON.parse(raw);
        if (!t.running) return;
        _target = t.target || t.duration || 90;
        _start = t.start;
        _elapsed = Math.max(0, (Date.now() - _start) / 1000);
        _running = true;
        if (_interval) clearInterval(_interval);
        _interval = setInterval(_tick, 500);
        _render();
      } catch(e) {}
    },
    skip: function() {
      _running = false;
      _elapsed = 0;
      clearInterval(_interval); _interval = null;
      _save();
      _render();
    },
    isRunning: function() { return _running; },
  };
})();

function initWorkoutSets(dayN, db, session) {
  var sets = [];
  var slots=session.programmeSnapshot&&session.programmeSnapshot.slots||[];
  if (!slots.length) slots=(session.exerciseOrder||getDayExerciseIds(db,dayN,session.workoutLength)).map(function(exId,index){var ex=getExerciseDef(exId,session,db);return {slotId:'legacy_'+dayN+'_'+index,exerciseId:exId,sets:ex.sDef||1,min:ex.rMin||1,max:ex.rMax||20,rest:ex.rest||90,unilateral:!!ex.uni};});
  slots.forEach(function(slot) {
    var exId=slot.exerciseId;
    var ex = getExerciseDef(exId, session, db);
    sets = sets.concat(createExerciseSetsForSession(exId, ex, db, false, slot));
  });
  return sets;
}

function getActivitySet(session, exId) {
  var activity = (session && session.sets || []).find(function(set) {
    return set.exId === exId && set.setType === 'activity';
  });
  if (activity) return activity;
  // Older builds stored completion-only activities as ordinary sets. Keep
  // those records visible and editable without counting them as work.
  return (session && session.sets || []).find(function(set) { return set.exId === exId; }) || null;
}

function isExerciseComplete(session, exId) {
  var ex = getExerciseDef(exId, session);
  if (ex && ex.nonHypertrophy) {
    var activity = getActivitySet(session, exId);
    return !!(activity && (activity.completed || activity.skipped));
  }
  var workingSets = (session && session.sets || []).filter(function(set) {
    return set.exId === exId && isRequiredSessionSet(set,session) && !set.skipped;
  });
  return workingSets.length > 0 && workingSets.every(function(set) { return set.completed || set.skipped; });
}

  var exerciseIds = getSessionExerciseIds(sess);

  // Count completed working sets
  var totalWorking = sess.sets.filter(function(s){ return s.setType==='working'&&isEffectiveWorkingSet(s, sess); }).length;
  var doneWorking  = sess.sets.filter(function(s){ return s.setType==='working'&&isEffectiveWorkingSet(s, sess) && s.completed; }).length;
  var exDone = 0;
  exerciseIds.forEach(function(exId) {
    if (isExerciseComplete(sess, exId)) exDone++;
  });

  if (!sess.currentExId) {
    var _fx=null;
    for(var _fi=0;_fi<exerciseIds.length;_fi++){
      var _fws=sess.sets.filter(function(s){return isRequiredSessionSet(s,sess)&&s.exId===exerciseIds[_fi];});
      if(!_fws.every(function(s){return s.completed||s.skipped;})){_fx=exerciseIds[_fi];break;}
    }
    sess.currentExId=_fx||exerciseIds[0]; dbSave(db);
  }
  var timerCapBanner = sess.timerStopReason === 'automatic_3_hour_cap' && sess.timerCapStatus==='capped'
    ? '<div class="timer-cap-banner">Workout timer automatically stopped at 3:00:00. The session is still editable.</div>'
    : sess.timerCapStatus==='uncertain'?'<div class="timer-cap-banner">An older timer-stop marker is inconsistent with its saved timestamps; capped status is uncertain.</div>':'';
  var rushedControl = sess.rushedModeApplied
    ? '<div class="rushed-banner">'+esc(getRushedModeDescription(sess))+'</div>'
    : '<div class="rushed-control"><button class="btn-ghost btn-sm btn-rushed" onclick="App.applyRushedMode()">Rushed Mode</button></div>';
  var ov = document.getElementById('workout-overlay');
  ov.innerHTML =
    '<div class="wo-header">' +
      '<button class="wo-back" onclick="App.closeWorkout()">✕</button>' +
      '<div class="wo-hinfo">' +
        '<div class="wo-htitle">' + getSessionLabel(sess) + ' · ' + day.title + '</div>' +
        '<div class="wo-hprog">' + exDone + ' / ' + exerciseIds.length + ' exercises</div>' +
        '<div class="wo-session-clock" id="wo-session-clock">' + fmtTime(getSessionElapsedMs(sess)) + '</div>' +
      '</div>' +
      '<button class="btn-finish" onclick="App.finishWorkout()">Finish</button>' +
    '</div>' +
    '<div class="wo-body" id="wo-body">' +
      timerCapBanner + rushedControl +
      exerciseIds.map(function(exId) {
        var _dn=isExerciseComplete(sess, exId);
        var _st=_dn?'done':(exId===sess.currentExId?'current':'future');
        return renderExCard(exId, sess, db, _st);
      }).join('') +
      '<div class="wo-finish-section">' +
        '<div class="workout-add-ex"><button class="btn-ghost btn-add-ex" onclick="App.openAddExercise()">+ Add exercise</button></div>' +
        '<div class="wo-stats">' + doneWorking + ' completed working rows · ' + getCompletedProgrammeRounds(sess) + ' programmed rounds · ' + sess.sets.filter(function(s){return s.completed;}).reduce(function(a,s){return a+s.reps;},0) + ' total reps</div>' +
        '<button class="btn-primary btn-xl" onclick="App.finishWorkout()">Finish Workout</button>' +
      '</div>' +
    '</div>';
  ov.classList.remove('hidden');
  SessionClock.start();

  // Auto-scroll to first incomplete exercise
  setTimeout(function() {
    var first = ov.querySelector('.ex-card:not(.ex-card--done)');
    scrollExIntoView(first, false);
  }, 200);
}

function renderExCard(exId, sess, db, exState) {
  var ex = getExerciseDef(exId, sess);
  if (!ex) return '';
  var exerciseIds = getSessionExerciseIds(sess);
  var exOrder = exerciseIds.indexOf(exId) + 1;
  var substitutedForId = sess.substitutions && sess.substitutions[exId];
  var slotForExercise=(sess.programmeSnapshot&&sess.programmeSnapshot.slots||[]).find(function(slot){return slot.exerciseId===exId||substitutedForId===slot.exerciseId;});
  var substitutedFor = substitutedForId ? getExerciseDef(substitutedForId, sess) : null;
  var substitutionLabel = substitutedFor ? '<span class="sub-label">Substituted for '+esc(substitutedFor.name)+'</span>' : '';
  var unknownLabel = ex.unknown ? '<span class="sub-label">Saved ID: '+esc(ex.rawId)+'</span>' : '';
  var rushedLabel = sess.rushedReductions && slotForExercise&&sess.rushedReductions[slotForExercise.slotId]
    ? '<span class="rushed-tag">Reduced by Rushed Mode</span>' : '';
  var optionalLabel = ex.optional ? '<span class="optional-day-tag">OPTIONAL</span>' : '';
  var exSets = sess.sets.filter(function(s){ return s.exId === exId; });
  if (ex.nonHypertrophy) return renderNonHypertrophyCard(exId, sess, ex, exState);
  var workingSets = exSets.filter(function(s){ return isRequiredSessionSet(s, sess); });
  var allDone = workingSets.length>0 && workingSets.every(function(s){ return s.completed||s.skipped; });
  if (!exState) exState = allDone ? 'done' : 'current';

  if (exState === 'done') {
    var dSets = workingSets.filter(function(s){ return s.completed; });
    var bW = dSets.length ? Math.max.apply(null, dSets.map(function(s){ return s.weight; })) : 0;
    var bR = dSets.length ? dSets.filter(function(s){ return s.weight===bW; }).reduce(function(m,s){ return Math.max(m,s.reps); },0) : 0;
    var summ = dSets.length ? bW+' kg × '+bR : workingSets.length+' sets skipped';
    return '<div class="ex-card ex-card--done" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--done" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-check">✓</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' + substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
        '<span class="exc-compact-sub">'+dSets.length+' sets · '+esc(summ)+'</span></div>' +
        '<span class="exc-expand-hint">edit ›</span>' +
      '</div><div class="ex-compact-perf">'+renderExercisePerformance(db,exId,true)+'</div></div>';
  }

  if (exState === 'future') {
    return '<div class="ex-card ex-card--future" id="exc-'+exId+'">' +
      '<div class="exc-compact exc-compact--future" onclick="App.expandExCard(\'' + exId + '\')">' +
        '<span class="exc-compact-num">'+String(exOrder).padStart(2,'0')+'</span>' +
        '<div class="exc-compact-info"><span class="exc-compact-name">'+esc(ex.name)+'</span>' + substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
        '<span class="exc-compact-sub">'+esc(ex.target)+' · '+ex.sDef+' sets · '+ex.rMin+'–'+ex.rMax+' reps</span></div>' +
        '<span class="exc-expand-hint">›</span>' +
      '</div><div class="ex-compact-perf">'+renderExercisePerformance(db,exId,true)+'</div></div>';
  }

  var slotIdForExercise=slotForExercise&&slotForExercise.slotId;
  var lastSess=getLastExSessionForSlot(db,exId,slotIdForExercise,sess);
  var stallInfo = getStallInfo(db, exId, slotIdForExercise);
  var stallBox = renderStallWatch(stallInfo);
  var performanceBox = renderExercisePerformance(db, exId, true);
  var setRows = exSets.map(function(s) {
    var prevSet = lastSess ? (lastSess.sets.find(function(ps){
      return ps.setNum===s.setNum && ps.side===s.side && ps.setType===s.setType;
    })||null) : null;
    return renderSetRow(s, prevSet, ex);
  }).join('');
  var slotAdvice=getProgressionAdvice(db,exId,slotForExercise,sess);
  var guidanceNotes=(ex.tempo?'<div class="coll-tnf"><b>Tempo</b> '+esc(ex.tempo)+'</div>':'')+
    (ex.loadGuidance?'<div class="coll-cbum"><b>Load guidance</b> '+esc(ex.loadGuidance)+'</div>':'')+
    (slotForExercise&&slotForExercise.effortNote?'<div class="coll-tnf"><b>Effort</b> '+esc(slotForExercise.effortNote)+'</div>':'')+
    '<div class="coll-tnf">Rep ranges guide progression; a completed set outside the range remains valid recorded work.</div>'+
    (slotAdvice?'<div class="coll-tnf"><b>Progression</b> '+esc(slotAdvice)+'</div>':'');
  var rangeWarning = ex.rangeWarning ? '<div class="range-warning"><strong>'+esc(ex.warningLabel || 'IMPORTANT')+':</strong> '+esc(ex.rangeWarning)+'</div>' : '';
  var collapsibles =
    '<div class="ex-coll-row">' +
    mkColl('cue-'+exId,'Cues','<ul class="coll-list">'+ex.cues.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>') +
    mkColl('note-'+exId,'Notes',guidanceNotes) +
    mkColl('err-'+exId,'Mistakes',rangeWarning+'<ul class="coll-list coll-mist">'+ex.mistakes.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul><div class="coll-hard">'+esc(ex.hard)+'</div>') +
    '</div>';
  var noteVal = (sess.exNotes && sess.exNotes[exId]) || '';
  return '<div class="ex-card ex-card--current" id="exc-'+exId+'">' +
    '<div class="exc-head">' +
      '<div class="exc-meta">' +
        '<span class="exc-name">'+esc(ex.name)+'</span>' +
        '<span class="exc-target">'+esc(ex.target)+'</span>' +
        substitutionLabel + unknownLabel + rushedLabel + optionalLabel +
      '</div>' +
      '<div class="exc-badges">' +
        '<span class="xb">'+ex.sDef+(ex.sMin!==ex.sMax?'–'+ex.sMax:'')+' sets</span>' +
        '<span class="xb">'+ex.rMin+'–'+ex.rMax+' reps</span>' +
        '<span class="xb">'+(slotForExercise?fmtRestRange(slotForExercise.restMin,slotForExercise.restMax):fmtRestLabel(ex.rest))+' rest</span>' +
      '</div>' +
      '<div id="stall-'+exId+'">'+stallBox+'</div><div id="performance-'+exId+'">'+performanceBox+'</div>' +
    '</div>' +
    '<div class="set-rows" id="sets-'+exId+'">'+setRows+'</div>' +
    '<div class="set-add-row">' +
      '<button class="btn-ghost btn-sm" onclick="App.addWorkingSet(\'' + exId + '\')">+ Set</button>' +
    '</div>' +
    (SUBSTITUTIONS[exId] ? '<div class="sub-action"><button class="btn-ghost btn-sm" onclick="App.openSubstitution(\''+exId+'\')">Substitute exercise</button></div>' : '') +
    '<textarea class="ex-note-input" placeholder="Exercise note..." rows="1" oninput="App.saveExNote(\'' + exId + '\',this.value)">'+esc(noteVal)+'</textarea>' +
    collapsibles + '</div>';
}



function isFirstWarmupCandidate(set, ex) {
  if (!db || !db.activeSession || !set || set.setType !== 'working') return false;
  var sets = db.activeSession.sets.filter(function(s){ return s.exId === set.exId; });
  if (sets.some(function(s){ return s.isWarmupMarked; })) return false;
  var working = sets.filter(function(s){ return s.setType === 'working'&&!s.isAdded; }).sort(function(a,b){ return (a.setNum||0)-(b.setNum||0); });
  if (!working.length) return false;
  var firstNum = working[0].setNum;
  var firstRound=working.filter(function(item){return item.setNum===firstNum;});
  return set.setNum === firstNum && firstRound.every(function(item){return !setHasStarted(item);}) && (!ex.uni || set.side === 'L');
}

function renderSetRow(s, prevSet, ex) {
  var label = s.setType==='warmup' ? 'WU'+(s.side?' '+s.side:'') : s.setType==='drop' ? 'Drop'+(s.side?' '+s.side:'') : 'Set '+s.setNum+(s.side?' '+s.side:'');
  var units=s.units||'kg';
  var delBtn = s.isAdded ? '<button class="sr-del" onclick="App.deleteSet(\'' + s.id + '\')" title="Remove">×</button>' : '';
  if (s.completed) {
    return '<div class="set-row set-row--done" id="sr-'+s.id+'" onclick="App.editSet(\'' + s.id + '\')">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-done-vals">'+s.weight+' '+esc(units)+' × '+s.reps+'</span>' +
      '<span class="sr-check">✓</span>'+delBtn+'</div>';
  }
  if (s.skipped) {
    return '<div class="set-row set-row--skipped" id="sr-'+s.id+'">' +
      '<span class="sr-done-label">'+esc(label)+'</span>' +
      '<span class="sr-skip-badge">'+(s.rushedMode ? 'Rushed Mode' : 'Skipped')+'</span>' +
      '<button class="btn-ghost btn-xs" onclick="App.undoSkip(\'' + s.id + '\')">Undo</button>'+delBtn+'</div>';
  }
  var w = s.weight !== undefined && s.weight !== null ? s.weight : s.suggestedWeight || 0;
  var r = s.reps !== undefined && s.reps !== null ? s.reps : s.suggestedReps !== undefined && s.suggestedReps !== null ? s.suggestedReps : ex.rMin;
  var prevLine = prevSet ? ('Prev: '+prevSet.weight+' '+(prevSet.units||'kg')+' × '+prevSet.reps) : 'First time';
  var warmupBtn = isFirstWarmupCandidate(s, ex) ? '<button class="btn-ghost btn-xs warmup-toggle" onclick="App.markFirstSetWarmup(\''+s.exId+'\')">Warm-up</button>' : '';
  return '<div class="set-row set-row--active" id="sr-'+s.id+'">' +
    '<div class="sr-top">' +
      '<span class="sr-label">'+esc(label)+'</span>' +
      '<span class="sr-prev-line">'+esc(prevLine)+'</span>' +
      warmupBtn + '<button class="sr-skip-lnk" onclick="App.skipSet(\'' + s.id + '\')">Skip</button>'+delBtn+
    '</div>' +
    '<div class="sr-compact-row">' +
      '<div class="sri-ctrl sri-w">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',-2.5)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="decimal" step="0.5" min="0" value="'+w+'" ' +
          'onchange="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)" ' +
          'oninput="App.setWeight(\'' + s.id + '\',parseFloat(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjWeight(\'' + s.id + '\',2.5)">+</button>' +
        '<span class="sri-kg">'+esc(units)+'</span>' +
      '</div>' +
      '<div class="sri-ctrl sri-r">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',-1)">−</button>' +
        '<input class="sri-inp" type="number" inputmode="numeric" step="1" min="0" value="'+r+'" ' +
          'onchange="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)" ' +
          'oninput="App.setReps(\'' + s.id + '\',parseInt(this.value)||0)">' +
        '<button class="sri-adj" onclick="App.adjReps(\'' + s.id + '\',1)">+</button>' +
      '</div>' +
      '<button class="sr-tick" onclick="App.completeSet(\'' + s.id + '\')" aria-label="Complete">✓</button>' +
    '</div></div>';
}

function mkColl(id, label, body) {
  return '<details class="ex-coll" open><summary class="ec-sum">' + label + '</summary><div class="ec-body">' + body + '</div></details>';
}

function fmtRestLabel(sec) {
  if (sec >= 60) return Math.floor(sec/60) + (sec%60 ? ':'+('0'+(sec%60)).slice(-2) : '') + ' min';
  return sec + 's';
}
function fmtRestRange(min,max) { return fmtRestLabel(min)+(min===max?'':'–'+fmtRestLabel(max)); }

function scrollExIntoView(el, center) {
  var body = document.getElementById('wo-body');
  if (!body || !el) return;
  var elTop = el.offsetTop;
  var target = center
    ? Math.max(0, elTop - (body.offsetHeight - el.offsetHeight) / 2)
    : Math.max(0, elTop - 70);
  body.scrollTo({ top: target, behavior: 'smooth' });
}

function renderSummary(session, db) {
  var day = Object.assign({}, DAYS[session.dayN], {title:getSessionDayTitle(session)});
  var dur = session.durationMs ? fmtTime(session.durationMs) : '—';
  var workingSets = session.sets.filter(function(s){ return s.completed && s.setType==='working' && isEffectiveWorkingSet(s, session); });
  var totalReps = workingSets.reduce(function(a,s){ return a+s.reps; }, 0);
  var draftRows=session.sets.filter(function(s){return s.setType==='working'&&!s.completed&&!s.skipped&&setHasStarted(s);}).length;
  var plannedRounds=(session.programmeSnapshot&&session.programmeSnapshot.slots||[]).reduce(function(total,slot){return total+(slot.optional?0:slot.sets||0);},0);
  var completedRounds=getCompletedProgrammeRounds(session);
  var prs = session.prs || [];

  // Volume by muscle
  var vol = calcVolume([session], null);
  var volRows = Object.keys(vol).sort().filter(function(m){ return vol[m]>0; }).map(function(m) {
    var mdef = MUSCLES[m];
    return '<div class="sum-vol-row"><span class="sum-vol-m">' + (mdef?mdef.label:m) + '</span><span class="sum-vol-v">' + round1(vol[m]) + ' sets</span></div>';
  }).join('');

  var prRows = prs.length ? '<div class="sum-prs">' + prs.map(function(pr){ return '<div class="sum-pr-item">✦ ' + esc(pr.msg) + '</div>'; }).join('') + '</div>' : '';

  return '<div class="sum-wrap">' +
    '<div class="sum-header">' +
      '<div class="sum-tag">Workout Complete</div>' +
      '<div class="sum-title">' + getSessionLabel(session) + ' · ' + day.title + '</div>' +
    '</div>' +
    '<div class="sum-stats">' +
      '<div class="sum-stat"><div class="ss-val">' + dur + '</div><div class="ss-lbl">Duration</div></div>' +
      '<div class="sum-stat"><div class="ss-val">' + workingSets.length + '</div><div class="ss-lbl">Completed working rows</div></div>' +
      '<div class="sum-stat"><div class="ss-val">' + totalReps + '</div><div class="ss-lbl">Total reps</div></div>' +
    '</div>' +
    (session.rushedModeApplied?'<div class="rushed-banner">'+esc(getRushedModeDescription(session))+'<br>Actual work is shown here; this is not completion of the unreduced prescription.</div>':'<div class="rec-note">Rushed Mode applied: No</div>') +
    (plannedRounds?'<div class="rec-note">Completed programmed rounds: '+completedRounds+' / '+plannedRounds+'. The rows count records individual sides; an L/R pair is one round.</div>':'')+
    (draftRows?'<div class="rec-note">'+draftRows+' in-progress working row(s) retained in the saved session.</div>':'') +
    prRows +
    '<div class="sum-section"><div class="sum-sec-title">Volume</div>' + (volRows||'<div class="sum-none">No sets logged</div>') + '</div>' +
    '<button class="btn-primary btn-xl sum-done-btn" onclick="App.closeSummary()">Done</button>' +
    '</div>';
}

function renderVolume(db) {
  var ws = weekStart();
  var weekOffset = (db._volumeWeekOffset || 0);
  var viewWs = addLocalCalendarDays(ws,weekOffset*7);
  var prevWs  = addLocalCalendarDays(viewWs,-7);

  var thisSess = sessionsInWeek(db, viewWs);
  var prevSess = sessionsInWeek(db, prevWs);
  var thisVol  = calcVolume(thisSess, null), directVol=calcDirectVolume(thisSess,null);
  var prevVol  = calcVolume(prevSess, null);
  var isThisWeek = weekOffset === 0;
  var isLastWeek = weekOffset === -1;
  var viewedAvailability = getWeeklyAvailability(db, viewWs);

  // Planned volume follows this week's availability instead of judging a
  // short week against the full three-session programme.
  var plannedMin = {}, plannedMax = {},plannedDirect={};
  var plannedDays = getProgrammeWeekDays(viewedAvailability,db,viewWs);
  plannedDays.forEach(function(dayN) {
    getProgrammeSlots(dayN,viewedAvailability,getWeeklyWorkoutLength(db,viewWs),db,viewWs,false,true).forEach(function(slot) {
      var ex = getExerciseDef(slot.exerciseId,null,db);
      if (ex.optional || ex.nonHypertrophy) return;
      Object.keys(ex.muscles || {}).forEach(function(m) {
        var contrib = ex.muscles[m];
        plannedMin[m] = (plannedMin[m]||0) + slot.sets * contrib;
        plannedMax[m] = (plannedMax[m]||0) + slot.sets * contrib;
        if(Number(contrib)>=1)plannedDirect[m]=(plannedDirect[m]||0)+slot.sets;
      });
    });
  });

  var weekLabel = isThisWeek ? 'This week' : isLastWeek ? 'Last week' : fmtShortDate(viewWs) + ' – ' + fmtShortDate(weekEnd(viewWs));

  var muscleRows = Object.keys(MUSCLES).map(function(mId) {
    var mdef = MUSCLES[mId];
    var done  = round1(thisVol[mId] || 0);
    var prev  = round1(prevVol[mId] || 0);
    var adaptiveTarget = isThisWeek ? getRecommendationTarget(db, mId) : {min:mdef.min,max:mdef.max};
    var tMin  = adaptiveTarget.min, tMax = adaptiveTarget.max;
    var pMin  = round1(plannedMin[mId] || 0);
    var pMax  = round1(plannedMax[mId] || 0);
    var pct   = tMax > 0 ? Math.min(100, done / tMax * 100) : 0;
    var status, statusCls;
    if      (done === 0)       { status='—';            statusCls='vs-none';  }
    else if (done < tMin)      { status='Below target'; statusCls='vs-low';   }
    else if (done <= tMax)     { status='On track';     statusCls='vs-ok';    }
    else if (done <= tMax*1.2) { status='Target reached'; statusCls='vs-hit'; }
    else                       { status='Above target'; statusCls='vs-over';  }

    var diff = done - prev;
    var diffTxt = diff > 0 ? '+' + round1(diff) : round1(diff);
    var diffCls = diff > 0 ? 'vd-up' : diff < 0 ? 'vd-dn' : 'vd-flat';

    return '<div class="vol-row" onclick="App.showMuscleDetail(\'' + mId + '\')">' +
      '<div class="vr-top">' +
        '<span class="vr-name">' + mdef.label + '</span>' +
        '<span class="vr-done">' + done + '</span>' +
        '<span class="vr-status ' + statusCls + '">' + status + '</span>' +
      '</div>' +
      '<div class="vr-bar"><div class="vr-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="vr-meta">' +
        '<span class="vr-target">Target ' + tMin + '–' + tMax + ' · Planned estimate ' + pMin + (pMin!==pMax?'–'+pMax:'') + '</span>' +
        '<span class="vr-target">Direct completed ' + round1(directVol[mId]||0) + ' · Indirect estimate ' + round1(Math.max(0,done-(directVol[mId]||0))) + ' · Direct planned ' + round1(plannedDirect[mId]||0) + '</span>' +
        '<span class="vr-prev ' + diffCls + '">vs last: ' + diffTxt + '</span>' +
      '</div>' +
      '</div>';
  }).join('');

  return '<div class="vol-wrap"><div class="screen-title">Volume</div>' +
    '<div class="vol-header">' +
      '<button class="btn-nav" onclick="App.volNavWeek(-1)">‹ Prev</button>' +
      '<span class="vol-wlabel">' + weekLabel + '</span>' +
      '<button class="btn-nav" onclick="App.volNavWeek(1)"' + (isThisWeek ? ' disabled' : '') + '>Next ›</button>' +
    '</div>' +
    '<div class="vol-sessions">' + thisSess.length + ' session' + (thisSess.length!==1?'s':'') + ' this week</div>' +
    '<div class="rec-note">Completed direct working sets are shown separately from estimated indirect set-equivalents. Drops stay in the exercise record and are not converted into fractional working sets.</div>' +
    '<div class="vol-rows">' + (muscleRows || '<div class="vol-empty">No data yet. Complete workouts to see volume.</div>') + '</div>' +
    '</div>';
}

// ---- Muscle detail modal ----
function renderMuscleDetail(mId, db) {
  var mdef = MUSCLES[mId];
  var ws = addLocalCalendarDays(weekStart(),(db._volumeWeekOffset||0)*7);
  // last 8 weeks
  var weeks = [];
  for (var i = 7; i >= 0; i--) {
    var wStart = addLocalCalendarDays(ws,-i*7);
    var wSess  = sessionsInWeek(db, wStart);
    var wVol   = calcVolume(wSess, null);
    weeks.push({ wStart: wStart, vol: round1(wVol[mId]||0) });
  }

  // Contributing exercises (this week)
  var thisSess = sessionsInWeek(db, ws);
  var exContribs = {};
  thisSess.forEach(function(sess) {
    sess.sets.forEach(function(s) {
      if (!s.completed || s.skipped || s.setType==='warmup') return;
      var ex = getExerciseDef(s.exId, sess);
      if (!ex || !ex.muscles[mId]) return;
      var mult = (ex.uni && s.side) ? 0.5 : 1;
      exContribs[s.exId] = (exContribs[s.exId]||0) + ex.muscles[mId]*mult;
    });
  });

  var maxVol = Math.max.apply(null, weeks.map(function(w){ return w.vol; }).concat([1]));
  var chartBars = weeks.map(function(w) {
    var h = maxVol > 0 ? Math.round(w.vol / maxVol * 60) : 0;
    var lbl = new Date(w.wStart).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return '<div class="chart-col"><div class="chart-bar" style="height:' + h + 'px"></div><div class="chart-lbl">' + lbl.replace(' ','<br>') + '</div><div class="chart-val">' + w.vol + '</div></div>';
  }).join('');

  var exRows = Object.keys(exContribs).map(function(exId) {
    var exName = null;
    thisSess.some(function(sess) {
      var ex = getExerciseDef(exId, sess);
      if (ex) { exName = ex.name; return true; }
      return false;
    });
    return '<div class="md-ex-row"><span class="md-ex-name">' + esc(exName || exId) + '</span><span class="md-ex-v">' + round1(exContribs[exId]) + ' sets</span></div>';
  }).join('') || '<div class="md-none">No exercises logged this week.</div>';

  var fourWkAvg = round1(weeks.slice(4).reduce(function(a,w){ return a+w.vol; },0)/4);

  return '<div class="md-wrap">' +
    '<div class="md-header">' +
      '<h2 class="md-title">' + mdef.label + '</h2>' +
      '<button class="md-close" onclick="App.closeMuscleDetail()">✕</button>' +
    '</div>' +
    '<div class="md-stats">' +
      '<div class="md-stat"><div class="mds-val">' + round1(calcVolume(thisSess,null)[mId]||0) + '</div><div class="mds-lbl">This week</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + fourWkAvg + '</div><div class="mds-lbl">4wk avg</div></div>' +
      '<div class="md-stat"><div class="mds-val">' + mdef.min + '–' + mdef.max + '</div><div class="mds-lbl">Target</div></div>' +
    '</div>' +
    '<div class="md-chart"><div class="chart-bars">' + chartBars + '</div></div>' +
    '<div class="md-section"><div class="md-sec-title">Exercises this week</div>' + exRows + '</div>' +
    '</div>';
}

function renderSessionDetail(sess) {
  var day = DAYS[sess.dayN];

  var detailOrder = getSessionExerciseIds(sess);
  Object.keys(byEx).forEach(function(exId) {
    if (detailOrder.indexOf(exId) === -1) detailOrder.push(exId);
  });

  var exBlocks = detailOrder.map(function(exId) {
    var sets = byEx[exId] || [];

    if (ex.nonHypertrophy) {

      var activityStatus = activity.completed ? 'Completed' : activity.skipped ? 'Skipped' : 'Not completed';
      var activityNote = sess.exNotes && sess.exNotes[exId] ? '<div class="addex-muted">Note: '+esc(sess.exNotes[exId])+'</div>' : '';
      return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div><div class="sd-set"><span class="sd-sl">Activity</span><span class="sd-sv">'+activityStatus+'</span></div>'+activityNote+'</div>';
    }
    var setLines = sets.map(function(s) {
      var label = s.setType==='warmup' ? 'WU' : s.setType==='drop' ? 'Drop' : 'S' + s.setNum + (s.side?' '+s.side:'');
      var status = s.skipped ? 'skipped ('+esc(s.skipReason||'manual')+')' : s.completed ? s.weight+' '+esc(s.units||'kg')+' × '+s.reps : setHasStarted(s)?'Draft '+s.weight+' '+esc(s.units||'kg')+' × '+s.reps:'—';
      return '<div class="sd-set"><span class="sd-sl">' + label + '</span><span class="sd-sv">' + status + '</span></div>';
    }).join('');
    var historyMeta = ex.unknown ? '<div class="addex-muted">Saved ID: '+esc(ex.rawId)+'</div>' : '';
    var originalId = sess.substitutions && sess.substitutions[exId];
    if (originalId) historyMeta += '<div class="addex-muted">Substituted for '+esc(getExerciseDef(originalId, sess).name)+'</div>';
    return '<div class="sd-ex"><div class="sd-ex-name">' + esc(ex.name) + '</div>' + historyMeta + setLines + '</div>';
  }).join('');

  var prs = (sess.prs||[]).map(function(pr){ return '<div class="sd-pr">✦ ' + esc(pr.msg) + '</div>'; }).join('');

  return '<div class="sess-detail">' +
    (sess.rushedModeApplied ? '<div class="rushed-banner">'+esc(getRushedModeDescription(sess))+'<br>Actual work shown below; this is not completion of the unreduced prescription.</div>' : '') +
    (sess.timerStopReason === 'automatic_3_hour_cap' && sess.timerCapStatus==='capped' ? '<div class="timer-cap-banner">Timer auto-stopped at 3:00:00</div>' : sess.timerCapStatus==='uncertain'?'<div class="timer-cap-banner">Older timer-cap marker is uncertain.</div>':'') +
    (prs?'<div class="sd-prs">'+prs+'</div>':'') + exBlocks + '</div>';
}

function localDateKey(ts) {
  var d = ts ? new Date(ts) : new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getHomeLog(dbRef, dateKey, create) {
  var key = dateKey || localDateKey();
  var log = (dbRef.homeRoutineLogs || []).find(function(item){ return item.date === key; });
  if (!log && create) {
    log = {date:key,items:{},completed:false,completedAt:null};
    dbRef.homeRoutineLogs.push(log);
  }
  return log;
}
function getHomeMobilityForDate(dateKey) {
  var parts=String(dateKey||localDateKey()).split('-').map(Number);
  var dayNumber=Math.floor(Date.UTC(parts[0],parts[1]-1,parts[2])/86400000);
  return dayNumber%2===0?'adductor':'thoracic';
}
function getHomeTimerElapsed(log,now) {
  if(!log||!log.guidedTimer)return 0;
  var state=log.guidedTimer,baseElapsed=Math.max(0,Number(state.elapsedMs)||0),elapsed=baseElapsed,startedAt=toTimestamp(state.startedAt),current=toTimestamp(now)||Date.now();
  if(state.running&&startedAt)elapsed+=Math.max(0,current-startedAt);
  var limit=HOME_TIMER_LIMIT_SECONDS*1000;
  if(elapsed>=limit){
    elapsed=limit;
    if(state.running){var capAt=startedAt+(limit-baseElapsed);state.running=false;state.startedAt=null;state.stoppedAt=capAt;state.cappedAt=capAt;state.elapsedMs=limit;state.actualDurationSeconds=HOME_TIMER_LIMIT_SECONDS;}
    else if(baseElapsed>limit){state.elapsedMs=limit;state.actualDurationSeconds=HOME_TIMER_LIMIT_SECONDS;}
  }
  return elapsed;
}
function getHomeTimerPhase(elapsedMs,dateKey) {
  var remaining=Math.min(HOME_TIMER_LIMIT_SECONDS,Math.floor(elapsedMs/1000)),mobility=getHomeMobilityForDate(dateKey);
  var names=['90/90 Breathing','Wall Slides with Reach','High Plank','Dead Bug with Full Exhale','Glute Bridge Endurance','Half-Kneeling Hip-Flexor Stretch',mobility==='adductor'?'Adductor Rock-Back':'Thoracic Extension'];
  var transitions=['Transition to wall slides','Transition to plank','Transition to dead bug','Transition to glute bridges','Transition to hip-flexor stretch','Transition to mobility'];
  for(var i=0;i<HOME_TIMER_PHASES.length;i++){
    if(remaining<HOME_TIMER_PHASES[i])return {name:names[i],remaining:HOME_TIMER_PHASES[i]-remaining,index:i};
    remaining-=HOME_TIMER_PHASES[i];
    if(i<HOME_TIMER_PHASES.length-1){if(remaining<5)return {name:transitions[i],remaining:5-remaining,index:i};remaining-=5;}
  }
  return {name:'Seven-minute timer complete',remaining:0,index:HOME_TIMER_PHASES.length};
}
function syncHomeTimer(dbRef,log,now) {
  if(!log||!log.guidedTimer)return 0;
  var before=!!log.guidedTimer.running,previous=Number(log.guidedTimer.elapsedMs)||0,elapsed=getHomeTimerElapsed(log,now);
  if((before&&!log.guidedTimer.running)||previous!==Number(log.guidedTimer.elapsedMs||0))dbSave(dbRef);
  return elapsed;
}
function updateHomeTimerUi() {
  if(!db||window._currentScreen!=='home')return;
  var log=getHomeLog(db,localDateKey(),false),clock=document.getElementById('home-timer-clock');
  if(!clock)return;
  var elapsed=syncHomeTimer(db,log),state=log&&log.guidedTimer||{},phase=getHomeTimerPhase(elapsed,localDateKey());
  clock.textContent=fmtTime(elapsed);
  var phaseEl=document.getElementById('home-timer-phase');if(phaseEl)phaseEl.textContent=phase.name;
  var progress=document.getElementById('home-timer-progress');if(progress)progress.value=elapsed/(HOME_TIMER_LIMIT_SECONDS*1000)*100;
  var action=document.getElementById('home-timer-action');if(action)action.textContent=state.running?'Pause':'Start';
  var note=document.getElementById('home-timer-note');if(note)note.textContent=elapsed>=HOME_TIMER_LIMIT_SECONDS*1000?'Timer complete. Routine items remain individually tracked.':(state.running?'Timer continues from saved timestamps.':'Elapsed time is saved; the timer can be resumed.');
}
function renderHome(dbRef) {

    return '<button class="home-item'+(checked?' is-done':'')+'" onclick="App.toggleHomeItem(\''+item.id+'\')">'+

  return '<div class="home-wrap"><div class="home-hero"><div class="home-kicker">Daily posture + performance</div>'+
    '<h1 class="home-title">Maximum 7-Minute Home Routine</h1><div class="home-sub">One controlled round of breathing, wall slides, plank, dead bug, glute bridge, hip-flexor stretch and today’s alternating mobility movement.</div></div>'+

    '<div class="home-routine-list">'+items+'</div><div class="home-actions">'+

  function applyRushedMode() {
    if (!db.activeSession || db.activeSession.rushedModeApplied) return;

    flushVisibleSetDrafts();

    applyRushedModeToSession(db.activeSession);

  function flushVisibleSetDrafts() {
    if(!db.activeSession)return;
    document.querySelectorAll('#wo-body .set-row--active[id^="sr-"]').forEach(function(row){
      var id=row.id.slice(3),set=db.activeSession.sets.find(function(item){return item.id===id;});

      var inputs=row.querySelectorAll('.sri-inp');
      if(inputs[0]){var weight=parseFiniteNumber(inputs[0].value);if(weight!==null&&weight!==Number(set.weight)){set.weight=Math.max(0,weight);set.weightEdited=true;set.draftTouched=true;set.startedAt=set.startedAt||Date.now();}}
      if(inputs[1]){var reps=parseFiniteNumber(inputs[1].value);if(reps!==null&&reps!==Number(set.reps)){set.reps=Math.max(0,Math.floor(reps));set.repsEdited=true;set.draftTouched=true;set.startedAt=set.startedAt||Date.now();}}
    });

  }

  /* ── set mutations (live workout) ── */
  function getSet(setId) {
    if (!db.activeSession) return null;
    return db.activeSession.sets.find(function(s){ return s.id === setId; }) || null;
  }

  function setWeight(setId, val) {
    if(!canPersistUserChanges())return;
    var s = getSet(setId); if (!s) return;
    s.weight=Math.max(0,Number(val)||0);s.weightEdited=true;s.draftTouched=true;s.startedAt=s.startedAt||Date.now();invalidatePerformanceCaches(db);dbSave(db);
    // update displayed input without re-render
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp');

  }
  function adjWeight(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.weight = Math.max(0, Math.round((s.weight + delta) * 10) / 10);
    s.weightEdited=true;s.draftTouched=true;s.startedAt=s.startedAt||Date.now();invalidatePerformanceCaches(db);dbSave(db);
    var inp = document.querySelector('#sr-' + setId + ' .sri-inp[type="number"]');
    if (inp) {
      var row = document.getElementById('sr-' + setId);
      if (row) { var allInps = row.querySelectorAll('.sri-inp'); if (allInps[0]) allInps[0].value = s.weight; }
    }

    var row = document.getElementById('sr-' + setId);

  }
  function setReps(setId, val) {
    if(!canPersistUserChanges())return;
    var s = getSet(setId); if (!s) return;
    s.reps=Math.max(0,parseInt(val,10)||0);s.repsEdited=true;s.draftTouched=true;s.startedAt=s.startedAt||Date.now();invalidatePerformanceCaches(db);dbSave(db);
  }
  function adjReps(setId, delta) {
    var s = getSet(setId); if (!s) return;
    s.reps=Math.max(0,s.reps+delta);s.repsEdited=true;s.draftTouched=true;s.startedAt=s.startedAt||Date.now();invalidatePerformanceCaches(db);dbSave(db);
    var row = document.getElementById('sr-' + setId);
    if (row) { var ri = row.querySelectorAll('.sri-inp')[1]; if (ri) ri.value = s.reps; }
  }
  function setRir(setId, val) {
    var s = getSet(setId); if (!s) return;
    s.rir = parseInt(val,10)||0; dbSave(db);
    rerenderSetRow(setId);
  }
  function saveExNote(exId, val) {
    if (!db.activeSession) return;
    if (!db.activeSession.exNotes) db.activeSession.exNotes = {};
    db.activeSession.exNotes[exId] = val;
    dbSave(db);
  }

  function toggleOptionalActivity(exId) {
    if (!db.activeSession) return;
    var sess = db.activeSession;
    var activity = getActivitySet(sess, exId);
    if (!activity) {
      activity = createSet(exId, 1, 'activity', null);
      sess.sets.push(activity);
    }
    activity.completed = !activity.completed;
    activity.skipped = false;
    activity.timestamp = activity.completed ? Date.now() : null;
    sess.activityLogs = sess.activityLogs || {};
    sess.activityLogs[exId] = {
      completed:activity.completed,
      completedAt:activity.timestamp,
      durationSeconds:Math.max(0,Number(activity.durationSeconds)||0),
      notes:(sess.exNotes && sess.exNotes[exId]) || ''
    };
    dbSave(db);
    updateExCardDoneState(exId);
  }
  function setActivityDuration(exId,value) {
    if(!db.activeSession)return;
    var sess=db.activeSession,activity=getActivitySet(sess,exId);
    if(!activity){activity=createSet(exId,1,'activity',null);sess.sets.push(activity);}
    var seconds=parseFiniteNumber(value);if(seconds===null||seconds<0)return;
    activity.durationSeconds=Math.floor(seconds);sess.activityLogs=sess.activityLogs||{};
    sess.activityLogs[exId]=Object.assign({},sess.activityLogs[exId]||{},{completed:!!activity.completed,completedAt:activity.timestamp||null,durationSeconds:activity.durationSeconds,notes:(sess.exNotes&&sess.exNotes[exId])||''});
    dbSave(db);
  }

  function completeSet(setId) {
    if(!canPersistUserChanges())return;
    var s = getSet(setId); if (!s) return;
    if (s.reps <= 0) { alert('Enter reps before logging.'); return; }
    s.completed=true;s.draftTouched=true;s.startedAt=s.startedAt||Date.now();s.rir=null;s.timestamp=Date.now();invalidatePerformanceCaches(db);
    dbSave(db);
    refreshExercisePerformance(s.exId,s.slotId);
    try { navigator.vibrate(80); } catch(e){}
    rerenderSetRow(setId);
    var ex=getExerciseDef(s.exId,db.activeSession),sess=db.activeSession,exId=s.exId;
    if (ex && s.setType !== 'warmup') {
      var restSeconds=ex.rest;
      if (ex.sideTransitionRest && s.side==='L' && sess.sets.some(function(pair){return pair.exId===s.exId&&pair.setNum===s.setNum&&pair.side==='R'&&!pair.completed&&!pair.skipped;})) restSeconds=ex.sideTransitionRest;
      Timer.start(restSeconds);
    }
    var exerciseIds=getSessionExerciseIds(sess);
    setTimeout(function() {
      var prescSets = sess.sets.filter(function(ss){
        return ss.exId===exId&&isRequiredSessionSet(ss,sess)&&!ss.isAdded;
      });
      var allPrescDone = prescSets.length>0&&prescSets.every(function(ss){return ss.completed||ss.skipped;});
      if (allPrescDone) {
        var thisCard = document.getElementById('exc-'+exId);
        if (thisCard) thisCard.outerHTML = renderExCard(exId, sess, db, 'done');
        var exIdx = exerciseIds.indexOf(exId), nextExId = null;
        for (var _i=exIdx+1;_i<exerciseIds.length;_i++) {
          var _nws=sess.sets.filter(function(ss){return ss.exId===exerciseIds[_i]&&isRequiredSessionSet(ss,sess);});
          if(_nws.length===0||!_nws.every(function(ss){return ss.completed||ss.skipped;})){nextExId=exerciseIds[_i];break;}
        }
        if (nextExId) {
          sess.currentExId = nextExId; dbSave(db);
          var nc = document.getElementById('exc-'+nextExId);
          if (nc) nc.outerHTML = renderExCard(nextExId, sess, db, 'current');
          setTimeout(function(){ var el=document.getElementById('exc-'+nextExId); if(el) scrollExIntoView(el, false); },100);
        }
        var exDone=0;
        exerciseIds.forEach(function(eid){ if (isExerciseComplete(sess, eid)) exDone++; });
        var hp=document.querySelector('.wo-hprog'); if(hp) hp.textContent=exDone+' / '+exerciseIds.length+' exercises';
      } else {
        var na=document.querySelector('#exc-'+exId+' .set-row--active');
        if(na) scrollExIntoView(na, true);
        updateExCardDoneState(exId);
      }
    }, 150);
  }

  function undoSet(setId) {

  function skipSet(setId) {
