  --seam:rgba(158,173,210,.13); --seam-strong:rgba(158,173,210,.24);
  --ink:#EEF1F8; --ink-2:#A1AABD; --ink-3:#6D7689;
  --light:#5E8BFF; --light-rgb:94 139 255; --light-ink:#071027;
  --light-fill:var(--light);
  --glow:radial-gradient(110% 60% at 8% -8%,rgb(var(--light-rgb)/.20),transparent 62%);
  --gold:#F4C452; --gold-rgb:244 196 82;
  --go:#4ED593; --go-rgb:78 213 147;
  --amber:#F2AE4E; --amber-rgb:242 174 78;
  --red:#FF7474; --red-rgb:255 116 116;
  --st1:#5E8BFF; --st2:#3ED0EE; --st3:#9B7EFF; --st4:#EE68C9;
  --elysium:linear-gradient(105deg,#7FE2F0,#A9B5FF 30%,#CCA9FF 55%,#F4A6D3 78%,#ECD48E);
  --display:'Big Shoulders','DIN Condensed','Avenir Next Condensed','Arial Narrow',sans-serif;
  --text:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,Roboto,Helvetica,Arial,sans-serif;
  --nav-h:62px;
  /* Legacy names kept for any older inline markup. */
  --accent:var(--light); --accent-bg:rgb(var(--light-rgb)/.14); --accent-ln:rgb(var(--light-rgb)/.38);
  --bg:var(--arena); --bg-soft:var(--rail); --card:var(--stand); --card-hi:var(--rail-2); --line:var(--seam-strong); --line-soft:var(--seam);
  --text-c:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3); --ok:var(--go); --warn:var(--amber); --danger:var(--red);
}
body.momentum-theme-2{--light:#3ED0EE;--light-rgb:62 208 238;--light-ink:#04202A}
body.momentum-theme-3{--light:#A388FF;--light-rgb:163 136 255;--light-ink:#140B33}
body.momentum-theme-4{--light:#F06FCC;--light-rgb:240 111 204;--light-ink:#2A0820}
body.momentum-theme-5{--light:#C9B2FF;--light-rgb:201 178 255;--light-ink:#16122B;--light-fill:var(--elysium);
  --glow:radial-gradient(80% 50% at 0% -6%,rgba(110,220,236,.22),transparent 60%),radial-gradient(70% 45% at 100% 4%,rgba(240,150,206,.20),transparent 62%),radial-gradient(60% 40% at 50% -10%,rgba(176,150,255,.20),transparent 60%)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--arena)}
body{color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));font-optical-sizing:auto}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:70vh;background:var(--glow);pointer-events:none;z-index:0;transition:opacity .4s}
input,button,textarea,select{font:inherit;color:inherit}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
:is(.coach-tips,.coach-sources,.workout-record-details,.volume-program-summary,.cd-card,.performance-raw,.eng-week-inline)>summary{display:flex;align-items:center;justify-content:space-between;gap:10px}
:is(.coach-tips,.coach-sources,.workout-record-details,.volume-program-summary,.cd-card,.performance-raw,.eng-week-inline)>summary::after{content:'';flex:none;width:7px;height:7px;margin:0 5px 3px 0;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s}
:is(.coach-tips,.coach-sources,.workout-record-details,.volume-program-summary,.cd-card,.performance-raw,.eng-week-inline)[open]>summary::after{transform:rotate(225deg);margin-bottom:-3px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0}
ul,ol{list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--light);outline-offset:3px}
.hidden{display:none!important}
.tn{display:inline-block;width:.56em;text-align:center}
.num{font-family:var(--display);font-weight:800;line-height:.9}
.muted{color:var(--ink-2)}

/* ---------- Screens ---------- */
#app{position:relative;z-index:1;min-height:100vh}
.screen{display:none;min-height:100vh;max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 32px}
.screen.active{display:block}
.screen-title{font-family:var(--display);font-weight:800;font-size:44px;line-height:.92;letter-spacing:.004em;margin:10px 0 6px}
.screen-sub{font-size:15px;color:var(--ink-2);margin:0 0 18px;max-width:46ch}
.section-label{font-size:13px;font-weight:650;color:var(--ink-2);margin:0 0 10px;letter-spacing:.005em}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.section-head h2{font-size:13px;font-weight:650;color:var(--ink-2)}
.section-head span,.section-head button{font-size:13px;color:var(--ink-3)}
.section-head button{color:var(--light);font-weight:600;min-height:32px}

/* ---------- Bottom nav ---------- */
#bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 6px env(safe-area-inset-bottom,0px);background:rgba(9,12,21,.90);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-top:1px solid var(--seam)}
#bottom-nav.hidden{display:none}
.nav-tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;color:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.nav-tab svg{width:24px;height:24px}
.nav-tab--on{color:var(--ink)}
.nav-tab--on svg{color:var(--light)}
.nav-tab--on::before{content:'';position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--light-fill)}
.nav-dot{position:absolute;top:9px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--light-fill);box-shadow:0 0 0 2px #0a0d17}

/* ---------- Buttons ---------- */
.btn-primary,.btn-complete{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 18px;border:0;border-radius:14px;background:var(--light-fill);color:var(--light-ink);font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.01em;line-height:1;box-shadow:0 8px 24px -10px rgb(var(--light-rgb)/.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,filter .12s}
.btn-primary:active,.btn-complete:active{transform:scale(.985);filter:brightness(.95)}
.btn-primary:disabled{opacity:.4;box-shadow:none}
.btn-primary.btn-xl{min-height:58px;font-size:24px;border-radius:16px}
.btn-primary.btn-lg{min-height:52px}
.btn-primary.btn-sm{width:auto;min-height:42px;font-size:18px;padding:8px 18px;border-radius:12px;box-shadow:none}
.btn-complete{margin-top:12px}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--seam-strong);background:rgba(255,255,255,.02);color:var(--ink);font-size:15px;font-weight:600;line-height:1.15;text-align:center}
.btn-ghost:active{background:var(--rail-2)}
.btn-ghost.btn-sm{min-height:40px;padding:7px 12px;font-size:14px}
.btn-ghost.btn-xs{min-height:32px;padding:4px 10px;font-size:13px;border-radius:10px}
.btn-ghost.btn-danger{color:var(--red);border-color:rgb(var(--red-rgb)/.35)}
.btn-ghost.btn-rushed{color:var(--amber);border-color:rgb(var(--amber-rgb)/.35)}
.btn-nav{min-height:44px;padding:8px 10px;color:var(--light);font-weight:650;font-size:15px}
.btn-nav:disabled{color:var(--ink-3)}
.btn-finish{min-height:40px;padding:8px 16px;border-radius:999px;background:var(--light-fill);color:var(--light-ink);font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.link-btn{color:var(--light);font-weight:650;font-size:14px;min-height:36px;padding:4px 0}

/* ---------- Toggle switches ---------- */
.switch{position:relative;flex:none;width:50px;height:30px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--rail-2);border:1px solid var(--seam-strong);cursor:pointer;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#C9D0DD;transition:transform .2s,background .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch:checked{background:var(--light);border-color:transparent}
.switch:checked::after{transform:translateX(20px);background:#fff}

/* ---------- Storage warning ---------- */
.storage-warning{margin:4px 0 16px;padding:14px;border:1px solid rgb(var(--amber-rgb)/.4);border-radius:16px;background:rgb(var(--amber-rgb)/.10);color:#F7E4BF;font-size:14px;line-height:1.45}
.storage-warning strong{display:block;font-size:15px;color:var(--amber)}
.storage-warning p{margin:4px 0 10px}
.storage-warning>div{display:flex;gap:8px;flex-wrap:wrap}
.storage-warning button{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid rgb(var(--amber-rgb)/.5);background:rgb(var(--amber-rgb)/.14);color:#FFE6B8;font-weight:700}

/* ============================================================
   TODAY
   ============================================================ */
.today{padding-top:2px}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px;min-height:36px}
.today-date{font-size:15px;font-weight:600;color:var(--ink-2)}
.today-date b{color:var(--ink);font-weight:700}

/* Momentum stage panel */
.mo-panel{position:relative;margin:0 0 26px;padding:16px 16px 14px;border-radius:24px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 95% at 0% 0%,rgb(var(--light-rgb)/.24),transparent 58%),linear-gradient(180deg,rgb(var(--light-rgb)/.05),transparent 60%),var(--stand);
  border:1px solid rgb(var(--light-rgb)/.32)}
.mo-panel.is-elysium{border-color:transparent;background:
  radial-gradient(90% 80% at 0% 0%,rgba(110,220,236,.20),transparent 60%),radial-gradient(80% 80% at 100% 0%,rgba(240,150,206,.18),transparent 60%),radial-gradient(70% 70% at 50% 0%,rgba(176,150,255,.16),transparent 65%),linear-gradient(var(--stand),var(--stand)) padding-box,
  var(--elysium) border-box}
.mo-hit{position:absolute;inset:0;z-index:3;border-radius:inherit}
.mo-hit:focus-visible{outline-offset:-3px}
.mo-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mo-label{display:block;font-size:13px;font-weight:650;color:var(--ink-2)}
.mo-name{display:block;margin-top:6px;font-family:var(--display);font-weight:850;font-size:44px;line-height:.86;letter-spacing:.006em;text-transform:uppercase;color:var(--light)}
.mo-panel.is-elysium .mo-name{background:var(--elysium);-webkit-background-clip:text;background-clip:text;color:transparent}
.mo-panel.stage-0 .mo-name{color:var(--ink)}
.mo-week{flex:none;text-align:right}
.mo-count{display:block;font-family:var(--display);font-weight:850;font-size:44px;line-height:.86;color:var(--ink)}
.mo-count small{font-size:26px;color:var(--ink-3);font-weight:800}
.mo-week .mo-label{margin-top:6px}
.mo-ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:16px 0 14px}
.mo-ladder i{height:5px;border-radius:3px;background:rgba(255,255,255,.08)}
.mo-ladder i.on:nth-child(1){background:var(--st1)}.mo-ladder i.on:nth-child(2){background:var(--st2)}.mo-ladder i.on:nth-child(3){background:var(--st3)}.mo-ladder i.on:nth-child(4){background:var(--st4)}.mo-ladder i.on:nth-child(5){background:var(--elysium)}
.mo-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mo-day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink-3)}
.mo-day.is-today>span{color:var(--ink)}
.mo-mark{position:relative;display:grid;place-items:center;width:26px;height:26px;border-radius:50%}
.mo-mark::before{content:'';width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16)}
.mo-day.is-visit .mo-mark{background:var(--light-fill);box-shadow:0 0 14px -2px rgb(var(--light-rgb)/.7)}
.mo-day.is-visit .mo-mark::before{display:none}
.mo-day.is-visit svg{width:15px;height:15px;color:var(--light-ink)}
.mo-day.is-rest .mo-mark::before{width:9px;height:9px;border-radius:2px;background:transparent;border:1.5px solid #7D8BA6;transform:rotate(45deg)}
.mo-day.is-today:not(.is-visit) .mo-mark{box-shadow:inset 0 0 0 2px rgb(var(--light-rgb)/.85)}
.mo-day.is-missed .mo-mark::before{width:8px;height:2px;border-radius:1px;background:rgba(255,255,255,.18)}
.mo-day.is-future .mo-mark::before{background:rgba(255,255,255,.10)}
.mo-next{margin-top:14px;padding-top:12px;border-top:1px solid var(--seam);font-size:14.5px;line-height:1.4;color:var(--ink-2)}
.mo-next b{color:var(--ink);font-weight:650}

/* Today's workout */
.plan{margin:0 0 26px}
.plan-title{font-family:var(--display);font-weight:800;font-size:40px;line-height:.92;letter-spacing:.004em;margin:0 0 10px;text-wrap:balance}
.plan-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.plan-tags li{font-size:13px;font-weight:600;color:var(--ink-2);padding:4px 10px;border-radius:999px;background:var(--rail);border:1px solid var(--seam)}
.plan-stats{display:flex;gap:22px;margin:0 0 12px}
.plan-stats div{display:flex;flex-direction:column}
.plan-stats b{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95}
.plan-stats div>span{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.plan-reason{font-size:15px;color:var(--ink-2);margin:0 0 16px;max-width:42ch}
.plan-other{margin-top:10px;border-radius:14px}
.plan-other>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer;border-radius:12px}
.plan-other>summary::-webkit-details-marker{display:none}
.plan-other>summary svg{width:16px;height:16px;transition:transform .2s}
.plan-other[open]>summary svg{transform:rotate(180deg)}
.plan-other-list{margin-top:4px;border-top:1px solid var(--seam)}
.today-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--seam)}
.today-choice strong{display:block;font-size:16px;font-weight:650}
.today-choice span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.today-choice .tag-optional{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--ink-3);vertical-align:1px}

/* Next banner on Today */
.next-banner{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 26px;padding:14px 14px 14px 16px;border-radius:18px;background:var(--stand);border:1px solid var(--seam)}
.next-banner .banner{--bw:46px}
.next-banner-body{flex:1;min-width:0}
.next-banner-kicker{font-size:13px;font-weight:650;color:var(--ink-2)}
.next-banner-title{font-size:16.5px;font-weight:700;margin-top:2px;line-height:1.25}
.next-banner-meta{display:flex;align-items:center;gap:10px;margin-top:8px}
.meter{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--light-fill)}
.next-banner-meta>span:not(.meter){flex:none;font-size:13px;font-weight:650;color:var(--ink-2)}
.chev{flex:none;width:18px;height:18px;color:var(--ink-3)}

/* Quick links */
.link-rows{margin:0 0 22px;border-top:1px solid var(--seam)}
.link-row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 2px;text-align:left;border-bottom:1px solid var(--seam)}
.link-row-icon{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--rail);color:var(--light)}
.link-row-icon svg{width:21px;height:21px}
.link-row-body{flex:1;min-width:0}
.link-row-title{display:block;font-size:16px;font-weight:650}
.link-row-meta{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.link-row.is-done .link-row-icon{background:rgb(var(--go-rgb)/.14);color:var(--go)}
.block-note{font-size:14px;color:var(--ink-2);margin:0 0 18px}
.app-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;padding:8px 0 4px;font-size:12.5px;color:var(--ink-3)}
.app-foot button{min-height:36px;padding:0 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.today-update-status{flex-basis:100%;text-align:center;min-height:16px}

/* ============================================================
   BANNERS (lifetime milestones)
   ============================================================ */
.banner{--bw:76px;--tier:#5E8BFF;--cloth:linear-gradient(180deg,#6A92FA,#2E54C6);--cloth-ink:#fff;position:relative;flex:none;width:var(--bw);padding-top:5px;container-type:inline-size}
.banner::before{content:'';position:absolute;z-index:2;top:0;left:-7%;right:-7%;height:4px;border-radius:2px;background:linear-gradient(90deg,#727D96,#D9DFEA 50%,#727D96)}
.banner-cloth{position:relative;display:flex;flex-direction:column;align-items:center;aspect-ratio:3/4.3;padding:17cqw 5cqw 0;color:var(--cloth-ink);background:var(--cloth);clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);text-align:center;overflow:hidden}
.banner-cloth::before{content:'';position:absolute;left:0;right:0;top:7cqw;height:2.6cqw;background:currentColor;opacity:.32}
.banner-cloth::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.16) 28%,rgba(255,255,255,0) 52%,rgba(0,0,0,.14));pointer-events:none}
.banner-num{position:relative;z-index:1;font-family:var(--display);font-weight:850;font-size:38cqw;line-height:.86;letter-spacing:-.005em}
.banner-num.is-long{font-size:30cqw}
.banner-unit{position:relative;z-index:1;margin-top:5cqw;font-family:var(--display);font-weight:750;font-size:12.5cqw;line-height:1.02;text-transform:uppercase;letter-spacing:.03em;max-width:96%}
.banner-year{position:relative;z-index:1;margin-top:auto;margin-bottom:21cqw;font-family:var(--display);font-weight:650;font-size:11cqw;opacity:.78}
.banner.tier-1{--tier:#5E8BFF;--cloth:linear-gradient(180deg,#6A92FA,#2E54C6)}
.banner.tier-2{--tier:#3ED0EE;--cloth:linear-gradient(180deg,#5AD8F0,#1B91B3);--cloth-ink:#03212B}
.banner.tier-3{--tier:#9B7EFF;--cloth:linear-gradient(180deg,#9A7FFF,#4F38BA)}
.banner.tier-4{--tier:#EE68C9;--cloth:linear-gradient(180deg,#F074CE,#A42C83)}
.banner.tier-5{--tier:#C9B2FF;--cloth:linear-gradient(165deg,#7FE2F0,#A9B5FF 30%,#CCA9FF 55%,#F4A6D3 78%,#ECD48E);--cloth-ink:#191431}
.banner.tier-6{--tier:#E8ECF4;--cloth:linear-gradient(180deg,#F6F8FC,#C3CBDA);--cloth-ink:#0B1020}
.banner.tier-6 .banner-cloth::before{opacity:.55;background:linear-gradient(90deg,#B98F2E,#F4D27A,#B98F2E)}
.banner.is-locked .banner-cloth,.banner.is-next .banner-cloth{background:var(--seam-strong);color:var(--ink-3)}
.banner.is-next .banner-cloth{background:var(--tier);color:var(--ink)}
.banner.is-locked .banner-cloth::after,.banner.is-next .banner-cloth::after{inset:1.5px;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);background:var(--stand);z-index:0}
.banner.is-next .banner-cloth::after{background:linear-gradient(to top,color-mix(in srgb,var(--tier) 32%,var(--stand)) var(--p,0%),var(--stand) var(--p,0%))}
.banner.is-locked .banner-cloth::before,.banner.is-next .banner-cloth::before{z-index:1;opacity:.25}
.banner.is-locked::before{opacity:.45}

/* ============================================================
   PROGRESS (Milestones / Volume / Records)
   ============================================================ */
.segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;margin:14px 0 22px;border-radius:14px;background:var(--stand);border:1px solid var(--seam)}
.segmented button{min-height:40px;border-radius:10px;font-size:15px;font-weight:650;color:var(--ink-2)}
.segmented button[aria-selected="true"]{background:var(--rail-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--seam-strong)}

.rafters{margin:0 0 8px}
.rafters-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.rafters-count{display:flex;align-items:baseline;gap:8px}
.rafters-count b{font-family:var(--display);font-weight:850;font-size:56px;line-height:.85;color:var(--ink)}
.rafters-count span{font-size:15px;font-weight:600;color:var(--ink-2)}
.rafters-total{font-size:13px;color:var(--ink-3);font-weight:600}
.rafters-rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:14px 16px 10px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none;background:linear-gradient(rgba(158,173,210,.20),rgba(158,173,210,.20)) 0 15px/100% 2px no-repeat}
.rafters-rail::-webkit-scrollbar{display:none}
.rafters-rail .banner{--bw:84px;scroll-snap-align:start}
.rafters-empty{padding:18px 0 4px;font-size:15px;color:var(--ink-2)}
.rafters-rail button{flex:none;text-align:inherit;border-radius:6px}

.next-list{display:grid;gap:10px}
.next-item{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:16px;background:var(--stand);border:1px solid var(--seam);text-align:left}
.next-item .banner{--bw:40px}
.next-item-body{flex:1;min-width:0}
.next-item-title{font-size:15.5px;font-weight:650;line-height:1.25}
.next-item-meta{display:flex;align-items:center;gap:10px;margin-top:7px}
.next-item-meta>span:not(.meter){flex:none;font-size:13px;color:var(--ink-2);font-weight:600}

.track-group{margin-top:26px}
.track-group h2{font-size:13px;font-weight:650;color:var(--ink-2);margin:0 0 4px}
.track-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 0;text-align:left;border-bottom:1px solid var(--seam)}
.track-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--rail);color:var(--ink-2)}
.track-icon svg{width:20px;height:20px}
.track-main{min-width:0}
.track-name{display:block;font-size:16px;font-weight:650}
.track-next{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.track-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.track-value{font-family:var(--display);font-weight:850;font-size:30px;line-height:.85}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:12px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);background:rgba(255,255,255,.12)}
.pips i.t1{background:#5E8BFF}.pips i.t2{background:#3ED0EE}.pips i.t3{background:#9B7EFF}.pips i.t4{background:#EE68C9}.pips i.t5{background:var(--elysium)}.pips i.t6{background:#E8ECF4}

.track-sheet-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.track-sheet-value{font-family:var(--display);font-weight:850;font-size:64px;line-height:.82}
.track-sheet-unit{font-size:15px;color:var(--ink-2);font-weight:600}
.track-sheet-desc{font-size:14.5px;color:var(--ink-2);margin:10px 0 18px;line-height:1.5}
.track-ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px;justify-items:center;padding:6px 4px 4px}
.track-ladder .banner{--bw:min(100%,104px)}
.track-ladder figure{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.track-ladder figcaption{font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.3;min-height:2.6em}
.track-ladder figcaption b{display:block;color:var(--ink);font-weight:650}

.timeline{margin-top:4px}
.timeline li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--seam)}
.timeline .banner{--bw:28px;padding-top:3px}
.timeline .banner::before{height:3px}
.timeline .banner .banner-num,.timeline .banner .banner-unit,.timeline .banner .banner-year{display:none}
.timeline strong{display:block;font-size:15px;font-weight:650}
.timeline span{display:block;font-size:12.5px;color:var(--ink-2)}
.timeline time{font-size:12.5px;color:var(--ink-3);font-weight:600}
.note{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:16px 0 0}

/* Volume */
.vol-wrap{}
.vol-header{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.vol-wlabel{font-family:var(--display);font-weight:800;font-size:24px}
.vol-sessions{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.vol-rows{display:grid;gap:8px}
.vol-row{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:16px;background:var(--stand);border:1px solid var(--seam);cursor:pointer}
.vol-row:active{background:var(--rail)}
.vr-top{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.vr-name{flex:1;font-size:16px;font-weight:650}
.vr-done{font-family:var(--display);font-weight:850;font-size:26px;line-height:.8}
.vr-status{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.vs-none{background:var(--rail);color:var(--ink-3)}
.vs-low{background:rgb(var(--amber-rgb)/.14);color:var(--amber)}
.vs-ok{background:rgb(var(--go-rgb)/.13);color:var(--go)}
.vs-hit{background:rgb(var(--light-rgb)/.16);color:var(--light)}
.vs-over{background:rgb(var(--red-rgb)/.13);color:#FF9C9C}
.vr-bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:8px}
.vr-fill{height:100%;border-radius:3px;background:var(--light-fill);max-width:100%;transition:width .3s}
.vr-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:12.5px;color:var(--ink-3)}
.vd-up{color:var(--go)}.vd-dn{color:#FF9C9C}.vd-flat{color:var(--ink-3)}
.vol-empty{padding:40px 0;text-align:center;color:var(--ink-2)}
.volume-program-summary{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--stand);border:1px solid var(--seam)}
.volume-program-summary summary{cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:650}
.volume-program-row{display:grid;gap:3px;padding:9px 0;border-bottom:1px solid var(--seam)}
.volume-program-row:last-child{border-bottom:0}
.volume-program-row strong{font-size:14px}
.volume-program-row span{font-size:13px;color:var(--ink-2)}
.rec-note{font-size:13px;color:var(--ink-3);line-height:1.45;margin:8px 0 12px}

/* Records */
.record-list{border-top:1px solid var(--seam)}
.record-row{border-bottom:1px solid var(--seam)}
.record-row>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 0;cursor:pointer}
.record-row>summary::-webkit-details-marker{display:none}
.record-name{font-size:15.5px;font-weight:650;line-height:1.25}
.record-best{grid-column:1/2;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--gold)}
.record-best.is-empty,.record-result.is-empty{color:var(--ink-3);font-family:var(--text);font-size:13.5px;font-weight:500}
.record-setup{display:block;margin-top:6px;overflow-wrap:anywhere}
.record-setup:first-child{margin-top:0}
.record-setup-label{display:block;font-family:var(--text);font-size:12px;font-weight:500;line-height:1.4;color:var(--ink-2);margin-bottom:3px}
.record-result{display:block;line-height:1.2}
.record-side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.record-date{font-size:12.5px;color:var(--ink-3);font-weight:600}
.record-count{font-size:12px;font-weight:700;color:var(--gold);background:rgb(var(--gold-rgb)/.12);border-radius:999px;padding:2px 8px}
.record-detail{padding:0 0 14px}

/* Muscle detail */
.md-wrap{}
.md-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.md-title{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.md-close,.addex-close{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--rail);border:1px solid var(--seam);color:var(--ink-2);font-size:18px}
.md-stats,.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.md-stat,.sum-stat{padding:12px;border-radius:14px;background:var(--rail)}
.mds-val,.ss-val{font-family:var(--display);font-weight:850;font-size:28px;line-height:.9;color:var(--ink)}
.mds-lbl,.ss-lbl{font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:600}
.md-chart{margin-bottom:18px;padding:12px 8px 0;border-radius:14px;background:var(--rail)}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding-bottom:28px}
.chart-col{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart-bar{width:100%;min-height:2px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--light),rgb(var(--light-rgb)/.35))}
.chart-lbl{position:absolute;bottom:-26px;font-size:10px;line-height:1.1;color:var(--ink-3);text-align:center;white-space:nowrap}
.chart-val{position:absolute;bottom:4px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--light-ink)}
.md-section{margin-top:6px}
.md-sec-title,.sum-sec-title{font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.md-ex-row,.sum-vol-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--seam);font-size:15px}
.md-ex-name,.sum-vol-m{color:var(--ink-2)}
.md-ex-v,.sum-vol-v{font-family:var(--display);font-weight:800;font-size:18px}
.md-none,.sum-none{color:var(--ink-3);font-size:14px;padding:8px 0}

/* ============================================================
   HISTORY
   ============================================================ */
.hist-week{margin-top:22px}
.hist-week-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--seam)}
.hist-week-head h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.hist-week-head span{font-size:13px;color:var(--ink-2);font-weight:600}
.hist-week-head .is-won{color:var(--light)}
.hist-item{border-bottom:1px solid var(--seam)}
.hi-summary{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 0;text-align:left}
.hi-day{display:flex;flex-direction:column;align-items:center;line-height:1}
.hi-day b{font-family:var(--display);font-weight:850;font-size:26px}
.hi-day span{font-size:11.5px;font-weight:650;color:var(--ink-3);margin-top:3px}
.hi-title{display:block;font-size:15.5px;font-weight:650;line-height:1.25}
.hi-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:13px;color:var(--ink-2)}
.hi-right{display:flex;align-items:center;gap:8px}
.hi-pr{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--gold);background:rgb(var(--gold-rgb)/.13)}
.hi-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--amber);background:rgb(var(--amber-rgb)/.12)}
.hi-chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
.hist-item.is-open .hi-chev{transform:rotate(90deg)}
.hi-detail{padding:4px 0 16px}
.hi-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hist-empty{padding:56px 8px;text-align:center}
.he-text{font-size:16px;color:var(--ink-2)}
.sess-detail{}
.sd-prs{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:rgb(var(--gold-rgb)/.08);border:1px solid rgb(var(--gold-rgb)/.22)}
.sd-pr{font-size:13.5px;color:#F7DC93;padding:2px 0}
.sd-ex{margin:12px 0}
.sd-ex-name{font-size:14.5px;font-weight:700;margin-bottom:4px}
.sd-set{display:flex;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--seam)}
.sd-sl{flex:none;width:52px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink-3)}
.sd-sv{color:var(--ink-2)}
.timer-cap-banner{margin-bottom:10px;padding:10px 12px;border-radius:12px;background:rgb(var(--amber-rgb)/.1);border:1px solid rgb(var(--amber-rgb)/.3);color:#F7D9A6;font-size:13px}

/* Settings */
.settings{margin-top:34px}
.settings>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 14px;border-radius:14px;background:var(--stand);border:1px solid var(--seam);font-size:15.5px;font-weight:650;cursor:pointer}
.settings>summary::-webkit-details-marker{display:none}
.settings>summary svg{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
.settings[open]>summary svg{transform:rotate(90deg)}
.settings-body{padding:6px 0 0}
.set-group{margin-top:22px}
.set-group h3{font-size:13px;font-weight:650;color:var(--ink-2);margin:0 0 8px 2px}
.set-list{border-radius:16px;background:var(--stand);border:1px solid var(--seam);overflow:hidden}
.set-item{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border-bottom:1px solid var(--seam)}
.set-item:last-child{border-bottom:0}
.set-item>span{flex:1;font-size:15.5px}
.set-item small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.set-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.app-version{font-size:12.5px;color:var(--ink-3);margin:18px 2px 4px}

/* ============================================================
   PROGRAM
   ============================================================ */
.prog-wrap{padding-bottom:20px}
.prog-guide{display:flex;gap:8px;margin:0 0 6px}
.prog-guide .btn-ghost{flex:1}
.prog-card{margin-top:14px;padding:16px;border-radius:20px;background:var(--stand);border:1px solid var(--seam)}
.prog-kind{font-size:13px;font-weight:650;color:var(--ink-2)}
.prog-kind.is-optional{color:var(--ink-3)}
.prog-name{font-family:var(--display);font-weight:800;font-size:32px;line-height:.95;margin:6px 0 8px}
.prog-desc{font-size:14.5px;color:var(--ink-2);margin-bottom:12px}
.prog-card .plan-stats{margin-bottom:14px}
.prog-card .plan-stats b{font-size:26px}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row .btn-primary{width:auto;flex:none}
.fifth-note{font-size:13.5px;color:var(--ink-2);margin:0 0 12px}
.prog-list{margin-top:12px;border-top:1px solid var(--seam)}
.prog-list>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:46px;color:var(--ink-2);font-size:14.5px;font-weight:650;cursor:pointer}
.prog-list>summary::-webkit-details-marker{display:none}
.prog-list>summary svg{width:16px;height:16px;transition:transform .2s}
.prog-list[open]>summary svg{transform:rotate(180deg)}
.prog-mini-list{counter-reset:ex;margin:2px 0 0}
.prog-mini-list>li{position:relative;padding:10px 0 10px 34px;border-top:1px solid var(--seam);font-size:15px;font-weight:600}
.prog-mini-list>li::before{counter-increment:ex;content:counter(ex);position:absolute;left:0;top:9px;width:24px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--light)}
.prog-mini-list>li>span{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-top:2px}
.prog-mini-list .coach-tips{margin:6px 0 0}
.prog-extra{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--stand);border:1px solid var(--seam)}
.prog-extra summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:650;font-size:15px;min-height:28px}
.prog-extra summary::-webkit-details-marker{display:none}
.prog-extra summary svg{width:16px;height:16px;color:var(--ink-3);transition:transform .2s}
.prog-extra[open] summary svg{transform:rotate(180deg)}
.prog-extra p{font-size:14px;color:var(--ink-2);margin-top:10px;line-height:1.5}

/* Training guide sheet */
.eng-week-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1px solid var(--seam);border-radius:14px;overflow:hidden}
.eng-week-table caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eng-week-table th{font-size:12px;font-weight:650;color:var(--ink-3);text-align:left;background:var(--rail);padding:9px 10px}
.eng-week-table th:first-child{width:62px}
.eng-week-table td{padding:11px 10px;border-top:1px solid var(--seam);vertical-align:top;font-size:13.5px;line-height:1.4}
.eng-day{font-weight:700;color:var(--ink-2)}
.eng-workout-name{display:block;font-weight:650;color:var(--ink)}
.eng-week-table small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.eng-cardio-text{color:var(--ink-2)}
.eng-footnote{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:12px}

/* ============================================================
   HOME ROUTINE
   ============================================================ */
.home-wrap{max-width:600px;margin:0 auto}
.home-lede{font-size:15px;color:var(--ink-2);margin:0 0 18px;max-width:44ch}
.home-board{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;border-radius:22px;margin-bottom:20px;background:radial-gradient(120% 100% at 0% 0%,rgb(var(--light-rgb)/.16),transparent 60%),var(--stand);border:1px solid var(--seam)}
.home-done{display:flex;flex-direction:column}
.home-done b{font-family:var(--display);font-weight:850;font-size:52px;line-height:.82}
.home-done b small{font-size:28px;color:var(--ink-3)}
.home-done span{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:5px}
.home-timer{min-width:0;padding-left:16px;border-left:1px solid var(--seam)}
.home-timer-phase{font-size:14px;font-weight:650;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-timer-clock{display:block;font-family:var(--display);font-weight:850;font-size:40px;line-height:.95;margin:2px 0 8px}
.home-timer progress{display:block;width:100%;height:6px;margin:0 0 10px;border:0;border-radius:3px;overflow:hidden;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.08)}
.home-timer progress::-webkit-progress-bar{background:rgba(255,255,255,.08);border-radius:3px}
.home-timer progress::-webkit-progress-value{background:var(--light);border-radius:3px}
.home-timer progress::-moz-progress-bar{background:var(--light)}
.home-timer-actions{display:flex;gap:8px;flex-wrap:wrap}
.home-timer-note{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.home-routine-list{display:grid;gap:8px}
.home-item{display:flex;align-items:flex-start;gap:14px;width:100%;padding:14px;text-align:left;border-radius:16px;background:var(--stand);border:1px solid var(--seam);color:var(--ink)}
.home-item.is-done{background:rgb(var(--go-rgb)/.07);border-color:rgb(var(--go-rgb)/.25)}
.home-check{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--seam-strong);margin-top:1px}
.home-check svg{width:16px;height:16px}
.home-item.is-done .home-check{background:var(--go);border-color:var(--go);color:#062414}
.home-item-main{flex:1;min-width:0}
.home-item-name{display:block;font-size:16px;font-weight:650;line-height:1.3}
.home-item-dose{display:block;font-size:13.5px;font-weight:650;color:var(--light);margin-top:2px}
.home-item-cue{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:5px}
.home-item.is-done .home-item-name{color:var(--ink-2)}
.home-actions{display:flex;gap:8px;margin-top:16px}
.home-actions .btn-primary{flex:1}
.home-streak{font-size:13.5px;color:var(--ink-2);margin-top:14px}

/* ============================================================
   WORKOUT
   ============================================================ */
#workout-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow:hidden;background:var(--glow),var(--arena)}
#workout-overlay.hidden{display:none}
#workout-overlay>.wo-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wo-header{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;max-width:640px;margin:0 auto}
#workout-overlay:has(>#timer-pill.workout-rest:not(.hidden)) .wo-header{padding-top:10px}
.wo-back{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--stand);border:1px solid var(--seam);color:var(--ink-2)}
.wo-back svg{width:20px;height:20px}
.wo-hinfo{min-width:0}
.wo-htitle{font-family:var(--display);font-weight:800;font-size:25px;line-height:.98;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.wo-session-meta{grid-column:2/-1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:-2px}
.wo-hprog{font-size:13px;font-weight:600;color:var(--ink-2)}
.wo-session-clock{font-family:var(--display);font-weight:800;font-size:17px;line-height:1;color:var(--light)}
.wo-theme-label{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:rgb(var(--light-rgb)/.14);color:var(--light);font-size:11.5px;font-weight:700}
.wo-theme-label:empty,.wo-theme-label[hidden]{display:none}
body.momentum-theme-5 .wo-theme-label{background:var(--elysium);color:#191431}
.wo-progress{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.wo-progress i{display:block;height:100%;width:0;border-radius:2px;background:var(--light-fill);transition:width .35s ease}
.wo-content{max-width:640px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px))}
.workout-tools{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:4px 0 6px}
.workout-tools button{min-width:0;padding-left:8px;padding-right:8px}
.rushed-control{display:contents}
.rushed-banner{margin:8px 0;padding:10px 12px;border-radius:12px;background:rgb(var(--amber-rgb)/.10);border:1px solid rgb(var(--amber-rgb)/.3);color:#F7D9A6;font-size:13.5px;line-height:1.45}
.rushed-tag{display:inline-flex;margin-top:6px;padding:2px 8px;border-radius:999px;background:rgb(var(--amber-rgb)/.12);color:var(--amber);font-size:11.5px;font-weight:700}

/* Challenge */
.challenge{display:flex;gap:12px;align-items:center;margin:10px 0 6px;padding:12px 14px;border-radius:16px;background:linear-gradient(100deg,rgb(var(--light-rgb)/.12),transparent 70%),var(--stand);border:1px solid rgb(var(--light-rgb)/.28)}
.challenge-mark{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgb(var(--light-rgb)/.16);color:var(--light)}
.challenge-mark svg{width:20px;height:20px}
.challenge-body{flex:1;min-width:0}
.challenge b{display:block;font-size:14.5px;font-weight:700}
.challenge p{font-size:13.5px;color:var(--ink-2);line-height:1.4;margin-top:1px}
.challenge small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.challenge.is-achieved{background:rgb(var(--go-rgb)/.08);border-color:rgb(var(--go-rgb)/.3)}
.challenge.is-achieved .challenge-mark{background:rgb(var(--go-rgb)/.16);color:var(--go)}
.challenge.is-paused{background:var(--stand);border-color:var(--seam)}
.challenge.is-paused .challenge-mark{background:var(--rail);color:var(--ink-3)}

/* Exercise cards */
.ex-card{margin:10px 0;border-radius:18px;background:var(--stand);border:1px solid var(--seam);overflow:hidden;transition:border-color .2s}
.ex-card--current{border-color:rgb(var(--light-rgb)/.42);background:linear-gradient(180deg,rgb(var(--light-rgb)/.09),transparent 150px),var(--stand)}
.ex-card--done{background:transparent}
.exc-head{padding:15px 14px 10px}
.exc-meta{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:baseline}
.exc-order{grid-row:1/3;font-family:var(--display);font-weight:850;font-size:30px;line-height:.9;color:var(--light)}
.exc-name{display:block;font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.005em}
.exc-target{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:2px}
.exc-meta .sub-label,.exc-meta .rushed-tag,.exc-meta .optional-day-tag{grid-column:2;justify-self:start}
.exc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.xb{font-size:13px;font-weight:600;color:var(--ink-2);padding:4px 10px;border-radius:999px;background:var(--rail)}
.xb b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink);margin-right:2px}
.exc-compact{display:flex;align-items:center;gap:12px;min-height:58px;padding:11px 14px;cursor:pointer}
.exc-compact-check{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgb(var(--go-rgb)/.15);color:var(--go)}
.exc-compact-check svg{width:16px;height:16px}
.exc-compact-num{flex:none;width:30px;text-align:center;font-family:var(--display);font-weight:850;font-size:24px;line-height:1;color:var(--ink-3)}
.exc-compact-info{flex:1;min-width:0}
.exc-compact-name{display:block;font-size:15.5px;font-weight:650;line-height:1.25}
.ex-card--done .exc-compact-name{color:var(--ink-2)}
.exc-compact-sub{display:block;font-size:13px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc-expand-hint{flex:none;font-size:13px;font-weight:600;color:var(--ink-3)}
.ex-compact-perf{padding:0 14px 12px 56px}
.ex-card--done .ex-compact-perf{display:none}
.ex-compact-perf .workout-record-details{display:none}

/* Records inside cards */
.workout-record-compact{display:grid;gap:4px;margin-top:12px;font-size:13.5px;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere}
.workout-record-compact b{font-weight:650;color:var(--ink-3);margin-right:4px}
.ex-compact-perf .workout-record-compact{margin-top:0;font-size:12.5px}
.workout-pr-badge{color:#F3D58C}
.workout-pr-badge b{color:var(--gold)}
.workout-pr-badge.is-live{width:fit-content;padding:3px 8px;border-radius:8px;background:rgb(var(--gold-rgb)/.12);animation:live-pr .9s ease-out 1}
@keyframes live-pr{0%{box-shadow:0 0 0 0 rgb(var(--gold-rgb)/.55)}100%{box-shadow:0 0 0 10px rgb(var(--gold-rgb)/0)}}
.workout-stall-hint{margin-top:6px;font-size:12.5px;color:var(--amber)}
.workout-record-details{margin-top:6px}
.workout-record-details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);min-height:32px;display:flex;align-items:center}
.record-current-note{font-size:13px;color:#F3D58C;margin:6px 0}
.performance-mini{display:grid;gap:10px;margin-top:8px;padding:12px;border-radius:12px;background:var(--rail);font-size:13px;line-height:1.5;color:var(--ink-2)}
.performance-mini b{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.performance-mini span{color:var(--ink-3)}
.performance-mini button{justify-self:start}
.performance-raw summary{cursor:pointer;font-size:12.5px;color:var(--ink-3)}
.stall-box{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgb(var(--amber-rgb)/.08);border:1px solid rgb(var(--amber-rgb)/.25);font-size:13px;color:var(--ink-2);line-height:1.45}
.stall-box>b{display:block;color:var(--amber);font-size:13px;margin-bottom:3px}
.stall-side{margin-top:8px}
.stall-exposures{margin:6px 0 0 16px;list-style:disc}
.stall-exposures li{padding:2px 0}
.range-warning{margin-top:10px;padding:10px 12px;border-left:3px solid var(--amber);border-radius:0 10px 10px 0;background:rgb(var(--amber-rgb)/.08);font-size:13.5px;line-height:1.45}
.range-warning strong{color:var(--amber)}

/* Set rows */
.set-rows{padding:0 10px}
.set-row{margin:8px 0;border-radius:14px}
.set-row--active{padding:10px;background:var(--rail);border:1px solid var(--seam-strong)}
.sr-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:9px}
.sr-label{flex:none;font-family:var(--display);font-weight:850;font-size:19px;line-height:1}
.sr-prev-line{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-skip-lnk{flex:none;min-height:32px;padding:0 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.sr-del{flex:none;min-height:32px;min-width:32px;font-size:20px;line-height:1;color:var(--red)}
.warmup-toggle{color:#CDB9FF!important;border-color:rgba(179,140,255,.45)!important;background:rgba(179,140,255,.08)!important}
.sr-compact-row{display:flex;align-items:stretch;gap:6px}
.sri-ctrl{position:relative;display:flex;align-items:stretch;min-width:0;border-radius:12px;background:var(--arena);border:1px solid var(--seam-strong);overflow:hidden}
.sri-ctrl:focus-within{border-color:var(--light);box-shadow:0 0 0 2px rgb(var(--light-rgb)/.22)}
.sri-w{flex:1.2}
.sri-r{flex:1}
.sri-adj{flex:none;display:grid;place-items:center;width:40px;min-height:58px;color:var(--light);font-size:26px;font-weight:300;line-height:1}
.sri-adj:active{background:rgb(var(--light-rgb)/.12)}
.sri-inp{flex:1;min-width:0;width:100%;padding:0 0 13px;border:0;outline:none;background:transparent;text-align:center;font-family:var(--display);font-weight:850;font-size:30px;line-height:1;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.sri-inp::-webkit-outer-spin-button,.sri-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sri-inp::placeholder{color:var(--ink-3)}
.sri-kg,.sri-r::after{position:absolute;left:40px;right:40px;bottom:6px;text-align:center;font-size:11px;font-weight:650;color:var(--ink-3);pointer-events:none;line-height:1}
.sri-r::after{content:'reps'}
.sr-tick{flex:none;display:grid;place-items:center;width:60px;min-height:60px;border-radius:14px;background:var(--light-fill);color:var(--light-ink);box-shadow:0 6px 18px -8px rgb(var(--light-rgb)/.8)}
.sr-tick svg{width:26px;height:26px}
.sr-tick:active{transform:scale(.96)}
.set-row--done{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;background:rgb(var(--go-rgb)/.08);border:1px solid rgb(var(--go-rgb)/.22);cursor:pointer}
.set-row--done .sr-done-label,.set-row--done>span:first-child{flex:none;min-width:58px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink-2)}
.set-row--done .sr-done-vals,.set-row--done>strong{flex:1;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.sr-check{flex:none;color:var(--go);font-weight:800}
.set-row--skipped{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border:1px dashed var(--seam-strong);opacity:.75}
.set-row--skipped .sr-done-label,.set-row--skipped>span:first-child{flex:none;min-width:58px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink-3)}
.sr-skip-badge,.set-row--skipped>span:nth-child(2){flex:1;font-size:13.5px;color:var(--ink-3)}
.timed-set-input{display:flex;align-items:flex-end;gap:10px}
.timed-set-input label{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.timed-set-input input{width:100%;min-height:58px;padding:0 12px;border-radius:12px;border:1px solid var(--seam-strong);background:var(--arena);font-family:var(--display);font-weight:850;font-size:30px;color:var(--ink);outline:none}
.timed-set-input input:focus{border-color:var(--light)}
.set-add-row{display:inline-flex;gap:8px;padding:2px 0 10px 10px}
.sub-action{display:inline-flex;padding:2px 10px 10px 8px}
.ex-note-input{display:block;width:100%;min-height:44px;padding:12px 14px;border:0;border-top:1px solid var(--seam);background:transparent;color:var(--ink-2);font-size:14.5px;resize:none;outline:none}
.ex-note-input:focus{background:rgb(var(--light-rgb)/.06)}
.ex-note-input::placeholder{color:var(--ink-3)}
.sub-label{display:inline-flex;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--rail);color:var(--ink-2);font-size:11.5px;font-weight:700}
.optional-day-tag{display:inline-flex;align-items:center;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--rail);color:var(--ink-2);font-size:11.5px;font-weight:700;vertical-align:2px}
.warmup-badge{display:inline-flex;margin-left:6px;padding:2px 7px;border-radius:999px;border:1px solid rgba(179,140,255,.45);color:#CDB9FF;font-size:11px;font-weight:700}

/* Activity (non-hypertrophy) */
.ex-card--activity{padding:14px}
.activity-head{display:flex;justify-content:space-between;gap:10px}
.activity-meta{display:block;font-size:13.5px;color:var(--ink-2);margin-top:8px}
.activity-meta input{margin-top:6px}
.activity-actions{display:flex;align-items:center;gap:10px;margin-top:12px}
.ex-card--activity .coach-tips{margin:8px 0 0}
.ex-card--activity .ex-note-input{margin:10px -14px -14px;width:calc(100% + 28px)}

/* Coaching tips */
.coach-tips{margin:0 14px 4px;border-top:1px solid var(--seam);font-size:14px;line-height:1.5}
.coach-tips>summary{display:flex;align-items:center;min-height:46px;cursor:pointer;color:var(--ink-2);font-weight:650;font-size:14px}
.coach-tips .coach-cue-list{margin:0 0 8px;padding-left:18px;list-style:disc}
.coach-tips .coach-cue-list>li{padding:4px 0;color:var(--ink);overflow-wrap:anywhere}
.coach-tip-new::marker{color:var(--light)}
.new-tip-marker{display:inline-block;margin-right:8px;padding:1px 6px;border-radius:6px;background:rgb(var(--light-rgb)/.15);color:var(--light);font-size:11px;font-weight:800;vertical-align:1px}
.coach-effort{color:var(--ink-2);font-size:13px;padding:6px 0}
.coach-tips .coach-sources{margin:2px 0 10px;font-size:12.5px;color:var(--ink-3)}
.coach-tips .coach-sources>summary{cursor:pointer;padding:6px 0;font-weight:600}
.coach-tips .coach-sources p{margin:2px 0 8px;line-height:1.45}
.coach-tips .coach-sources ul{margin:0;padding-left:16px;list-style:disc}
.coach-tips .coach-sources li{padding:4px 0}
.coach-tips .coach-sources a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.coach-tips .coach-sources small{display:block;font-size:11.5px;margin-top:2px}

/* Finish */
.wo-finish-section{padding:20px 0 24px}
.workout-add-ex{display:flex;justify-content:center;margin-bottom:18px}
.btn-add-ex{width:100%}
.wo-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-bottom:14px;font-size:13.5px;color:var(--ink-2)}
.wo-stats b{font-family:var(--display);font-weight:850;font-size:20px;color:var(--ink);margin-right:3px}

/* Rest timer */
#timer-pill{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:14px;min-height:60px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;background:rgba(14,19,32,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgb(var(--light-rgb)/.32)}
#timer-pill.hidden{display:none!important}
#workout-overlay>#timer-pill.workout-rest{position:relative;inset:auto;z-index:20;flex:0 0 auto}
#workout-overlay>#timer-pill.workout-rest:not(.hidden){display:flex!important}
.tp-label{font-size:14px;font-weight:700;line-height:1.2;color:var(--light)}
.tp-label small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tp-time{margin-left:auto;font-family:var(--display);font-weight:850;font-size:40px;line-height:.9;color:var(--ink)}
.tp-time.tp-urgent{color:var(--light)}
.tp-skip{flex:none;min-width:64px;min-height:44px;padding:0 16px;border-radius:12px;background:rgb(var(--light-rgb)/.16);border:1px solid rgb(var(--light-rgb)/.4);color:var(--light);font-weight:700;font-size:15px}
#timer-pill.is-ready .tp-skip{background:var(--light-fill);color:var(--light-ink);border-color:transparent}
.tp-bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--light-fill);transition:width .5s linear;border-radius:0 2px 2px 0}

/* ============================================================
   SHEETS AND MODALS
   ============================================================ */
#modal-overlay{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,10,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal-overlay.hidden{display:none!important}
#modal-overlay>div{width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--stand);border:1px solid var(--seam);border-bottom:0;animation:sheet-up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet-up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#modal-overlay:has(.arcade-summary){align-items:center;padding:16px 12px;overflow-y:auto}
.addex-wrap{display:grid;gap:14px}
.addex-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addex-title{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.addex-section{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--rail);border:1px solid var(--seam)}
.addex-label{display:block;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.addex-input,.addex-select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--seam-strong);background:var(--arena);color:var(--ink);font-size:16px;outline:none}
.addex-input:focus,.addex-select:focus{border-color:var(--light)}
.addex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addex-check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2)}
.addex-check input{width:20px;height:20px;accent-color:var(--light)}
.addex-muted{font-size:13px;color:var(--ink-3);line-height:1.45}
.performance-preview{margin-top:8px}
.sub-option{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--rail);border:1px solid var(--seam)}
.sub-name{font-size:16px;font-weight:700}
.sub-reason,.sub-warning{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.sub-warning{color:var(--amber)}
.dayedit-list{display:grid;gap:8px}
.dayedit-row{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;align-items:center;gap:8px}
.dayedit-no{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink-3);text-align:center}
.dayedit-remove{min-height:46px;border-radius:12px;border:1px solid rgb(var(--red-rgb)/.35);color:var(--red)}
.dayedit-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* Engagement sheet (momentum, banners, guide) */
.eng-sheet-layer{position:fixed;inset:0;z-index:11000;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overscroll-behavior:contain}
.eng-sheet{position:relative;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--glow),var(--stand);border:1px solid var(--seam);border-bottom:0;animation:sheet-up .26s cubic-bezier(.2,.8,.2,1)}
.eng-sheet::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--seam-strong);margin:-8px auto 14px}
.eng-sheet-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.eng-eyebrow{display:none}
.eng-sheet h2{font-family:var(--display);font-weight:800;font-size:36px;line-height:.95;letter-spacing:.004em}
.eng-sheet-sub{font-size:14.5px;color:var(--ink-2);line-height:1.45;margin-top:6px}
.eng-close{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--rail);border:1px solid var(--seam);color:var(--ink-2);font-size:20px;line-height:1}
@media(min-width:640px){.eng-sheet-layer{align-items:center}.eng-sheet{border-radius:24px;border-bottom:1px solid var(--seam)}#modal-overlay{align-items:center}#modal-overlay>div{border-radius:24px;border-bottom:1px solid var(--seam)}}

/* Momentum sheet */
.ms-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 22px}
.ms-stat{padding:12px;border-radius:14px;background:var(--rail)}
.ms-stat b{display:block;font-family:var(--display);font-weight:850;font-size:30px;line-height:.9}
.ms-stat span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:4px}
.stage-list li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:stretch;padding:12px 0;border-bottom:1px solid var(--seam)}
.stage-swatch{border-radius:5px;min-height:44px}
.stage-list li:nth-child(1) .stage-swatch{background:var(--st1)}
.stage-list li:nth-child(2) .stage-swatch{background:var(--st2)}
.stage-list li:nth-child(3) .stage-swatch{background:var(--st3)}

  background:radial-gradient(ellipse at 86% 6%,rgb(var(--light-rgb)/.30),transparent 65%),linear-gradient(145deg,#10151e,#0c1119 55%,#101927);
  box-shadow:0 14px 50px -24px #000,inset 0 1px 0 rgba(255,255,255,.09);isolation:isolate;
}
.mo-panel.is-elysium{background:radial-gradient(ellipse at 90% 5%,rgba(237,163,211,.22),transparent 60%),radial-gradient(ellipse at 42% 115%,rgba(113,212,237,.23),transparent 70%),linear-gradient(145deg,#141721,#11121b)}
.gym-atmosphere{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none;z-index:-2;opacity:.93}
.mo-panel::before,.victory::before{content:'';position:absolute;inset:0;background-image:var(--fine-grain);opacity:.065;pointer-events:none;z-index:-1;border-radius:inherit}
.mo-panel::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(100deg,rgba(3,7,13,.36),rgba(3,7,13,.08) 72%),linear-gradient(0deg,rgba(5,9,15,.64),transparent 65%)}
.mo-top{gap:10px;align-items:flex-end}
.mo-label{font-size:10px;line-height:1.4;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:#bac6d4}
.mo-name,.mo-panel.stage-0 .mo-name,.mo-panel.is-elysium .mo-name{
  margin-top:10px;font-family:var(--heading);font-size:36px;font-weight:650;letter-spacing:-.052em;line-height:.99;text-transform:none;
  color:#f5f8fc;background:none;-webkit-text-fill-color:currentColor;text-shadow:0 1px 20px rgba(0,0,0,.2);
}
.mo-panel.is-elysium .mo-name{color:#f1edf8;background:var(--foil);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mo-count{font-family:var(--heading);font-size:44px;font-weight:550;letter-spacing:-.065em;line-height:.95;font-variant-numeric:tabular-nums}
.mo-count small{font-family:var(--heading);font-size:22px;font-weight:450;color:#a2adbb;letter-spacing:-.04em}
.mo-week .mo-label{font-size:9px;letter-spacing:.09em;margin-top:9px}
.mo-ladder{gap:5px;margin:20px 0 15px}
.mo-ladder i{height:3px;border-radius:3px;background:rgba(222,234,255,.15)}
.mo-ladder i.on{box-shadow:0 0 9px rgb(var(--light-rgb)/.13)}
.mo-days{position:relative}
.mo-next{border-color:rgba(220,232,255,.15);font-size:13px;line-height:1.45;padding-top:13px;margin-top:13px;color:#bec7d2}
.mo-next b,.mo-next strong{color:#edf3fa}
.plan{margin-bottom:18px}
.plan-title{font-family:var(--heading);font-size:34px;font-weight:650;letter-spacing:-.045em;line-height:1.07;margin-bottom:10px;text-wrap:balance}
.plan-reason{font-size:14px;line-height:1.5;margin-bottom:18px;color:var(--ink-2)}
.plan-other{margin-top:8px}
.plan-other>summary{font-size:13px;font-weight:550;min-height:40px}
.plan-other-list{padding:2px 0;border-color:var(--seam)}
.today-choice strong{font-size:14px}
.today-choice span{font-size:12px}

/* Aurora glass actions. The middle stays dark enough for a clear label. */
.btn-primary,.btn-complete,.victory-btn{
  position:relative;isolation:isolate;overflow:hidden;border:1px solid rgb(var(--light-rgb)/.58);border-radius:16px;
  background:linear-gradient(115deg,rgb(var(--light-rgb)/.20),rgba(14,20,31,.96) 48%,rgb(var(--light-rgb)/.24));
  color:#f8fbff;font-family:var(--text);font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.2;
  box-shadow:0 6px 24px -13px rgb(var(--light-rgb)/.65),inset 0 1px 0 rgba(235,246,255,.17),inset 0 -1px 0 rgba(235,246,255,.04);
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.btn-primary::before,.btn-complete::before,.victory-btn::before{
  content:'';position:absolute;inset:-1px;pointer-events:none;z-index:-1;border-radius:inherit;
  background:radial-gradient(ellipse at 6% 0%,rgb(var(--light-rgb)/.64),transparent 40%),radial-gradient(ellipse at 96% 115%,rgb(var(--light-rgb)/.44),transparent 44%);
  opacity:.85;transition:opacity .18s ease;
}
.btn-primary::after,.btn-complete::after,.victory-btn::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:var(--fine-grain);opacity:.05;border-radius:inherit}
.btn-primary.btn-xl{min-height:56px;font-size:17px;border-radius:17px}
.btn-primary.btn-lg{font-size:16px}
.btn-primary.btn-sm{font-size:14px;min-height:42px;border-radius:12px}
.btn-primary:active,.btn-complete:active,.victory-btn:active{transform:scale(.985);filter:none;box-shadow:inset 0 1px 0 rgba(235,246,255,.12)}
.btn-primary:disabled{opacity:.45}
body.momentum-theme-5 .btn-primary,body.momentum-theme-5 .btn-complete,body.momentum-theme-5 .victory-btn{border-color:rgba(198,189,231,.65);background:linear-gradient(115deg,rgba(93,170,195,.30),#171927 46%,rgba(213,139,189,.28))}
body.momentum-theme-5 .btn-primary::before,body.momentum-theme-5 .btn-complete::before,body.momentum-theme-5 .victory-btn::before{background:radial-gradient(ellipse at 8% 0%,rgba(113,226,241,.65),transparent 41%),radial-gradient(ellipse at 97% 115%,rgba(243,173,218,.55),transparent 43%)}
.btn-ghost{background:linear-gradient(150deg,rgba(235,243,255,.05),rgba(235,243,255,.015));border-color:var(--seam-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);font-weight:550}
.btn-finish{font-family:var(--text);font-size:14px;font-weight:700;min-height:40px;padding:9px 15px;background:var(--light-fill)}
@media(hover:hover) and (pointer:fine){
  .btn-primary:not(:disabled):hover,.btn-complete:hover,.victory-btn:hover{border-color:var(--light);box-shadow:0 0 25px -10px rgb(var(--light-rgb)/.7),inset 0 1px 0 rgba(235,246,255,.23)}
  .btn-primary:hover::before,.btn-complete:hover::before,.victory-btn:hover::before{opacity:1}
  .link-row:hover,.next-item:hover,.vol-row:hover{border-color:rgb(var(--light-rgb)/.35)}
}

.eng-sheet,#modal-overlay>div,.workout-switch-card{background:linear-gradient(145deg,#1b222c,#11161e 65%);border-color:rgba(212,226,250,.18);box-shadow:0 24px 90px rgba(0,0,0,.55)}

.cd-card h2,.cd-history-heading,.home-title{font-family:var(--heading);font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.035em}

/* Calm, opaque logging surfaces retain the original input geometry. */
#workout-overlay{background:radial-gradient(ellipse at 50% 0%,rgb(var(--light-rgb)/.09),transparent 440px),var(--arena)}
.wo-htitle{font-family:var(--heading);font-size:21px;line-height:1.13;letter-spacing:-.035em;font-weight:650}
.wo-hprog{font-size:12px;font-weight:500}

.wo-progress{height:3px}
.ex-card{background:var(--surface);border-radius:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.ex-card--current{background:linear-gradient(155deg,rgb(var(--light-rgb)/.08),transparent 45%),#11161d;border-color:rgb(var(--light-rgb)/.32);box-shadow:0 8px 24px -17px #000,inset 0 1px 0 rgb(var(--light-rgb)/.07)}
.ex-card--done{background:#0e1319;box-shadow:none}
.exc-name{font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.25}

.exc-target{font-size:12px;line-height:1.5;font-weight:500}
.xb{border:1px solid var(--seam);background:#1b222c;font-size:12px;font-weight:500}
.set-row--active{background:#1a212b;border-color:rgba(214,230,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);border-radius:15px}
.sri-ctrl{background:#0b1119;border-color:rgba(208,228,255,.20)}
.sri-kg,.sri-r::after{color:#a5b0bd}
.sr-tick{border:1px solid rgb(var(--light-rgb)/.70);background:linear-gradient(135deg,rgb(var(--light-rgb)/.84),var(--light));color:var(--light-ink);box-shadow:0 5px 18px -10px rgb(var(--light-rgb)/.65),inset 0 1px 0 rgba(255,255,255,.30)}
body.momentum-theme-5 .sr-tick{background:var(--elysium)}
.set-row--done{background:rgba(41,109,80,.15);border-color:rgba(94,198,150,.25)}
.challenge{background:linear-gradient(110deg,rgb(var(--light-rgb)/.10),rgba(18,23,31,.97) 75%);border-color:rgb(var(--light-rgb)/.23)}
.challenge.is-achieved{background:rgba(36,99,73,.18);border-color:rgb(var(--go-rgb)/.3)}

#timer-pill{background:rgba(15,22,31,.98);border-bottom-color:rgb(var(--light-rgb)/.27);box-shadow:0 5px 24px rgba(0,0,0,.18)}
.tp-label{font-size:12px;letter-spacing:.01em}
.tp-skip{background:rgb(var(--light-rgb)/.10);border-color:rgb(var(--light-rgb)/.26);font-size:14px}

/* A quiet, luminous finish with the same four pieces of information. */
.victory{isolation:isolate;border-radius:27px;border-color:rgba(210,229,255,.27);background:radial-gradient(ellipse at 82% 0%,rgb(var(--light-rgb)/.28),transparent 65%),#101620;box-shadow:0 25px 100px #000,inset 0 1px 0 rgba(255,255,255,.12)}
.victory-stage,body.momentum-theme-5 .victory-stage{background:linear-gradient(180deg,rgba(4,8,14,.05),rgba(4,8,14,.28));isolation:auto}
.victory-stage::before{display:none}
.victory--simple .victory-stage{padding:47px 20px 28px}
.victory .victory-title,.victory.is-partial .victory-title{font-family:var(--heading);font-size:clamp(49px,15.5vw,68px);font-weight:600;line-height:1.03;letter-spacing:-.055em;text-transform:none;transform:none;text-shadow:0 2px 22px rgba(0,0,0,.2);color:#f2f6ff;background:linear-gradient(160deg,#fff 18%,#d5e4f6 52%,#9eadc3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 13px}

.victory-workout{font-size:15px;font-weight:500;line-height:1.45;color:#d5deea}

.victory-pr{width:fit-content;max-width:100%;margin:0 auto 19px;padding:9px 13px;border-radius:12px;border-color:rgba(240,200,106,.30);background:rgba(52,44,28,.55);color:#ffe8b1;gap:8px}
.victory-pr svg{width:16px;height:16px}
.victory-pr b{font-size:10px;letter-spacing:.08em;font-weight:650}
.victory-pr strong{font-size:13px;font-weight:600}
.victory-btn{min-height:53px;font-size:16px;border-radius:15px}

@media(max-width:360px){
  .screen-title{font-size:35px}
  .mo-panel{padding:19px 16px 14px}
  .mo-name,.mo-panel.stage-0 .mo-name,.mo-panel.is-elysium .mo-name{font-size:31px}

}

}

<script>
'use strict';
const APP_VERSION = '3.10.1';
const PROGRAM_NAME = 'Chest Priority, Four Days + Optional Fifth';
const PROGRAM_VERSION = 'chest-priority-december-2026-v1';
const PRIOR_ACTIVE_VERSION = 'focused-chest-back-split-2026-11-30-v2';
const PROGRAMME_END_DATE = '2026-11-30';
const PREVIOUS_FOCUSED_BLOCK_VERSION = 'chest-back-priority-2026-11-30-v1';
const PREVIOUS_LOCAL_PROGRAM_VERSION = 'focused-chest-back-split-2026-11-30-v1';
const PREVIOUS_PROGRAM_VERSION = 'september-november-2026-weekend-first-3';
const LEGACY_ADAPTIVE_PROGRAM_VERSION = 'september-november-2026-adaptive-2';
const THREE_HOURS_MS = 3 * 60 * 60 * 1000;
const CORE_DAY_NUMBERS = [4,5,1,2];
const ALL_DAY_NUMBERS = [4,5,1,2,3];
var DB_LOAD_ERROR = null;
var DB_STORAGE_BLOCKED = false;
var DB_SAFE_TO_EXPORT = true;
var DB_WRITE_ALERTED = false;
var DB_MIGRATION_BACKUP_KEY = 'adil_v2_backup_before_' + PROGRAM_VERSION;
const HOME_ROUTINE = [
  {id:'breathing_9090',name:'90/90 Breathing',dose:'45 seconds · about 5 slow breaths',cue:'Feet on a wall, ribs down, long 6–8 second exhale.'},
  {id:'wall_slides',name:'Wall Slides with Reach',dose:'8 slow reps · about 45 seconds',cue:'Slide comfortably with natural shoulder-blade movement; avoid forcing your lower back to arch.'},
  {id:'high_plank',name:'High Plank',dose:'45–60 seconds',cue:'Push the floor away, ribs down, glutes lightly on, keep breathing.'},
  {id:'dead_bug',name:'Dead Bug with Full Exhale',dose:'5 reps each side · about 60 seconds',cue:'Move slowly and stop before the lower back arches.'},
  {id:'glute_bridge',name:'Glute Bridge Endurance',dose:'Comfortable bridges within the timer; optional brief hold',cue:'Posterior pelvic tilt, squeeze glutes, no lower-back hyperextension.'},
  {id:'hip_flexor',name:'Half-Kneeling Hip-Flexor Stretch',dose:'30 seconds each side',cue:'Tuck pelvis slightly and squeeze the kneeling-side glute.'},
  {id:'adductor_rockback',name:'Alternate: Adductor Rock-Back / Thoracic Extension',dose:'5 slow reps each side, alternate with thoracic extension',cue:'Use the adductor rock-back one day and a controlled thoracic extension over a stable chair or sofa edge the next.'}
];
const HOME_TIMER_LIMIT_SECONDS=420;
const HOME_TIMER_PHASES=[45,40,55,55,65,70,60];

function applySessionTimerCap(session, now) {
  if (!session) return false;
  var start = toTimestamp(session.startTime);
  if (!start) return false;
  var current = toTimestamp(now) || Date.now();
  var capAt = start + THREE_HOURS_MS;

function cloneExercise(baseId, id, name, overrides) {
  var copy = Object.assign({}, EX[baseId], overrides || {});
  copy.id = id;
  copy.name = name;
  copy.cues = (overrides && overrides.cues) || EX[baseId].cues.slice();
  copy.mistakes = (overrides && overrides.mistakes) || EX[baseId].mistakes.slice();
  copy.muscles = Object.assign({}, (overrides && overrides.muscles) || EX[baseId].muscles);
  return copy;
}

function defineProgramExercise(id, baseId, name, spec) {
  var exercise = cloneExercise(baseId, id, name, spec);
  ['special','setup','why','optional','dropMuscles'].forEach(function(key) {
    if (!Object.prototype.hasOwnProperty.call(spec, key)) delete exercise[key];
  });
  Object.assign(exercise, spec);
  exercise.cues = (spec.cues || exercise.cues || []).slice();
  exercise.mistakes = (spec.mistakes || exercise.mistakes || []).slice();
  exercise.muscles = Object.assign({}, spec.muscles || exercise.muscles || {});
  EX[id] = exercise;
}

}

// Returns array of PR descriptions for a completed session
function detectPRs(db, session) {
  if(session.programVersion===PROGRAM_VERSION)return (db.prCelebrationEvents||[]).filter(function(e){return e.sessionId===session.id&&isCelebrationEventValid(db,e);}).map(function(e){return {exId:e.exerciseId,side:e.side,type:e.type,msg:getExerciseDef(e.exerciseId,session,db).name+' '+e.headline+': '+e.display};});

  session.sets.forEach(function(s) { if (exIds.indexOf(s.exId) === -1) exIds.push(s.exId); });
  exIds.forEach(function(exId) {
    var ex = getExerciseDef(exId, session);
    if (!ex) return;
    var historySets = getNormalizedExerciseHistory(db, exId, false).filter(function(row){return isQualifiedPerformance(row,exId,db);});
    var prevSets = historySets.filter(function(row) { return row.sessionId !== session.id; });
    var curSets = historySets.filter(function(row) { return row.sessionId === session.id; });
    if (curSets.length === 0 || prevSets.length === 0) return;
    curSets.forEach(function(cur) {
      var comparable = ex.uni ? prevSets.filter(function(row){return row.set.side===cur.set.side;}) : prevSets;
      if (!comparable.length) return;
      var prevBest = comparable.slice().sort(function(a,b){return (b.set.weight||0)-(a.set.weight||0) || (b.set.reps||0)-(a.set.reps||0);})[0];
      if ((cur.set.weight||0) > (prevBest.set.weight||0) && (cur.set.weight||0) > 0) {

        }

  });
}

    var d = parsed.data;

    if(d.homeRoutineLogs!==undefined&&!Array.isArray(d.homeRoutineLogs))throw new Error('Backup homeRoutineLogs must be an array.');
    if(d.activeSession!==undefined&&d.activeSession!==null&&(typeof d.activeSession!=='object'||Array.isArray(d.activeSession)))throw new Error('Backup activeSession must be an object or null.');
    (d.completedSessions||[]).concat(d.activeSession?[d.activeSession]:[]).forEach(function(session,index){
      if(!session||typeof session!=='object'||Array.isArray(session))throw new Error('Backup session '+index+' is malformed.');

    });
    d.schemaVersion=Math.max(3,Number(d.schemaVersion)||0);

  var m = Math.floor((total % 3600) / 60);
  var sec = total % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  return m + ':' + String(sec).padStart(2,'0');
}

}

function initWorkoutSets(dayN, db, session) {
  var sets = [];
  var slots=session.programmeSnapshot&&session.programmeSnapshot.slots||[];
  if (!slots.length) slots=(session.exerciseOrder||getDayExerciseIds(db,dayN,session.workoutLength)).map(function(exId,index){var ex=getExerciseDef(exId,session,db);return {slotId:'legacy_'+dayN+'_'+index,exerciseId:exId,sets:ex.sDef||1,min:ex.rMin||1,max:ex.rMax||20,rest:ex.rest||90,unilateral:!!ex.uni};});
  slots.forEach(function(slot) {
    var exId=slot.exerciseId;
    var ex = getExerciseDef(exId, session, db);
    sets = sets.concat(createExerciseSetsForSession(exId, ex, db, true, slot));
  });
  return sets;
}

function getActivitySet(session, exId) {
  var activity = (session && session.sets || []).find(function(set) {
    return set.exId === exId && set.setType === 'activity';
  });
  if (activity) return activity;
  // Older builds stored completion-only activities as ordinary sets. Keep
  // those records visible and editable without counting them as work.
  return (session && session.sets || []).find(function(set) { return set.exId === exId; }) || null;
}

function isExerciseComplete(session, exId) {
  var ex = getExerciseDef(exId, session);
  if (ex && ex.nonHypertrophy) {
    var activity = getActivitySet(session, exId);
    return !!(activity && (activity.completed || activity.skipped));
  }
  var workingSets = (session && session.sets || []).filter(function(set) {
    return set.exId === exId && isRequiredSessionSet(set,session) && !set.skipped;
  });
  return workingSets.length > 0 && workingSets.every(function(set) { return set.completed || set.skipped; });
}

function renderNonHypertrophyCard(exId, sess, ex, exState) {
  var activity = getActivitySet(sess, exId) || {completed:false,skipped:false};
  var done = !!(activity.completed || activity.skipped);
  var noteVal = (sess.exNotes && sess.exNotes[exId]) || '';
  var reviewed = getReviewedCoaching(ex);
  var activityNote = reviewed ? reviewed.activityNote : ex.hard;
  var cues = renderCoachingTips(ex, sess, null);
  var action = activity.completed
    ? '<button class="btn-ghost btn-sm" onclick="App.toggleOptionalActivity(\''+exId+'\')">Mark incomplete</button>'
    : '<button class="btn-primary btn-sm" onclick="App.toggleOptionalActivity(\''+exId+'\')">Mark complete</button>';
  var durationInput=ex.posing?'<label class="activity-meta">Actual duration (seconds)<input class="addex-input" type="number" inputmode="numeric" min="0" step="1" value="'+Math.max(0,Number(activity.durationSeconds)||0)+'" onchange="App.setActivityDuration(\''+exId+'\',this.value)"></label>':'';
  return '<div class="ex-card ex-card--activity'+(done?' ex-card--done':'')+'" id="exc-'+exId+'">' +
    '<div class="activity-head"><div><span class="exc-name">'+esc(ex.name)+'</span><span class="exc-target">'+esc(ex.target)+'</span></div>' +
      '<span class="optional-day-tag">OPTIONAL</span></div>' +
    '<div class="activity-meta">'+esc(activityNote || 'Track completion only. This does not count as a working set.')+'</div>' +
    durationInput+
    cues +
    '<div class="activity-actions">'+action+(activity.skipped?' <span class="addex-muted">Skipped</span>':'')+'</div>' +
    '<textarea class="ex-note-input" placeholder="Optional note..." rows="1" oninput="App.saveExNote(\''+exId+'\',this.value)">'+esc(noteVal)+'</textarea>' +
    '</div>';
}
